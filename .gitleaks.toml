# Gitleaks config for Quantalyze — Task 7.6
#
# We extend the default ruleset rather than redefining it. `useDefault =
# true` pulls in the full upstream rules (AWS, GCP, Stripe, GitHub,
# JWT, private keys, generic high-entropy strings, etc.), and we layer
# a narrow allowlist on top for known test fixtures that look like
# secrets but are not.
#
# Keep this file minimal. Every allowlist entry must be justified with a
# comment pointing at the fixture it protects. If a new intentional
# fixture starts tripping gitleaks, add a line here with its path, not a
# broad pattern.

title = "Quantalyze gitleaks config"

[extend]
useDefault = true

# NOTE (158-REVIEW CR-03): this is `[[allowlists]]` (array form), not the
# singular `[allowlist]` it used to be. gitleaks >= 8.30 REFUSES to load a
# config that mixes the two ("[allowlist] is deprecated, it cannot be used
# alongside [[allowlists]]"), and the rule-scoped blocks at the bottom of this
# file require the array form. Behaviour of this block is unchanged: with no
# `targetRules`, it still applies to every rule.
[[allowlists]]
description = "Known test fixtures and placeholder env samples"

# File-path allowlist — fixtures and sample files that contain
# intentionally key-shaped strings:
#
# - .env.example: documented placeholder values only (your-anon-key,
#   your-service-role-key, etc.). Contributors need this file.
# - src/app/api/verify-strategy/route.seam.test.ts: the seam breaker suite's
#   RAW_API_KEY fixture ("AK_LIVE_..."), a synthetic exchange key used to
#   assert that scrubSeamError REDACTS per-request secrets from undici error
#   messages. 146.1 / B2 promoted it from carried-in-fixture to ASSERTED when
#   the live user JWT stopped being forwarded, so it must stay key-SHAPED to
#   be falsifiable. The identical fixture in route.test.ts is already covered.
# - src/lib/admin/pii-scrub.test.ts: unit test for the PII scrubber;
#   contains a canonical JWT fixture
#   (eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NSJ9.SflKxwRJSMe...) used to
#   verify the scrubber redacts JWT-shaped strings. Not a real token.
# - tests/lib/admin/pii-scrub-python-parity.test.ts: Phase 18 / FIX-04
#   TS<->Python redaction parity test. Reuses the same canonical jwt.io
#   tutorial JWT fixture to assert TS-side scrubFreeformString redacts an
#   embedded JWT (regression for CR-01 + WR-01 four-pass parity with
#   redact.py). Not a real token.
# - src/components/error/ErrorEnvelope.test.tsx: Phase 17 component test
#   exercising the same PII scrubber from the ErrorEnvelope copy-diagnostics
#   path. Reuses the canonical jwt.io tutorial JWT fixture to assert
#   redaction (plain JWT and Authorization: Bearer <jwt>, CR-01 regression).
#   Not a real token.
# - package-lock.json: integrity hashes trip gitleaks generic
#   high-entropy detection; this is well-known noise to ignore.
# - .planning/: MOVED OUT of this blanket path list — see the scoped
#   [[allowlists]] block at the bottom of this file (158-REVIEW CR-03).
#   Summary: it is now allowlisted for the ENTROPY rule only, not for
#   every rule, because a whole-path exemption made the secret-scan gate
#   structurally incapable of ever flagging a real credential in the
#   largest cluster of tracked files in the repo.
# - src/app/api/webhooks/resend/route.test.ts: Phase 16 OBSERV-03 webhook
#   verification test. Defines a synthetic Svix secret prefixed `whsec_`
#   (base64("test-secret-phase-16-observ-03")) used by the test signing helper
#   to verify Svix.verify() rejects bad signatures and accepts good ones.
#   Production secret is read from RESEND_WEBHOOK_SECRET env at request time;
#   the test value is overridden via vi.stubEnv and never reaches a wire.
# - analytics-service/tests/cassettes/: VCR-recorded HTTP fixtures. PII
#   already scrubbed at record time via conftest_vcr.py three-layer filter;
#   any high-entropy value remaining is a public response payload.
# - analytics-service/tests/test_c19_portfolio_fixes.py: Cluster-19 regression
#   suite for routers/portfolio.py. The test-only line
#   `slowapi.Limiter = _NoopLimiter  # type: ignore[...]` (a no-op rate-limiter
#   shim, mirroring test_routers_audit_2026_05_17) trips the generic-api-key
#   entropy detector on the assignment RHS in the historical PR-range scan.
#   Not a real secret — no credential material in this file. Audit-2026-05-07
#   cluster review batch a4.
# - src/__tests__/gitleaks-allowlist.test.ts: the H-0017 meta-test for THIS
#   allowlist config. Embeds the canonical jwt.io tutorial JWT fixture
#   (JWT_FIXTURE) to drive a real gitleaks scan asserting the allowlist
#   suppresses an allowlisted path and detects a non-allowlisted one. The
#   literal in the test source trips the default `jwt` rule. Not a real token.
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)src/lib/admin/pii-scrub\.test\.ts$''',
  '''(^|/)tests/lib/admin/pii-scrub-python-parity\.test\.ts$''',
  '''(^|/)src/components/error/ErrorEnvelope\.test\.tsx$''',
  '''(^|/)analytics-service/tests/test_encryption\.py$''',
  '''(^|/)analytics-service/tests/test_c19_portfolio_fixes\.py$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)src/app/api/webhooks/resend/route\.test\.ts$''',
  '''(^|/)src/app/api/verify-strategy/route\.seam\.test\.ts$''',
  '''(^|/)analytics-service/tests/cassettes/''',
  # fix-list.md was historically copied to the repo root by audit-fix
  # automation. It contains audit prose describing high-entropy
  # identifiers (RPC names, on_conflict columns) that trip the generic
  # high-entropy detector. The canonical copy lives in
  # .planning/audit-2026-05-07/ (already allowlisted via the
  # .planning/ rule above). The root-level file is now gitignored;
  # this allowlist line also suppresses leftover historical commits.
  '''(^|/)fix-list\.md$''',
  '''(^|/)src/__tests__/gitleaks-allowlist\.test\.ts$''',
  # Phase 68 (DRB-02) Deribit scope-validation tests: mock the public/auth
  # response with deliberately key-shaped Client ID / Secret fixtures to
  # assert detect_deribit_permissions rejects write scopes and validates
  # read-only keys. Not real credentials — generic-api-key flags the fixture
  # on the push-to-main full scan (the PR-diff scan did not).
  '''(^|/)analytics-service/tests/test_deribit_scope_validation\.py$''',
  # v1.12 (SFOX-04..09) sFOX key-flow tests: mock the read-only SfoxClient, the
  # key-save/validate route, and the balance-history reconstruction with
  # deliberately key-shaped Bearer-token fixtures (e.g. `api_key="..."`). Not real
  # credentials — generic-api-key flags the fixtures on the full-history scan (the
  # PR-diff scan did not). v1.12 sFOX Verified Integration.
  '''(^|/)analytics-service/tests/test_sfox_client\.py$''',
  '''(^|/)analytics-service/tests/test_sfox_read\.py$''',
  '''(^|/)analytics-service/tests/test_sfox_reconstruct\.py$''',
  '''(^|/)src/app/api/keys/validate-and-encrypt/route\.test\.ts$''',
  # H-0305 regression test (route.audit.test.ts): line 118 defines a
  # deliberately key-shaped fixture `secretContents` that the test injects into
  # a thrown upstream error to assert the create-with-key route STRIPS it from
  # the response body. Not a real secret — gitleaks generic-api-key flags the
  # fixture on the push-to-main full scan (the PR-diff scan did not). Audit H-0305.
  '''(^|/)src/app/api/strategies/create-with-key/route\.audit\.test\.ts$''',
  # H-0535 SecretStr redaction regression tests (audit-2026-05-07 batch 5).
  # Both files define deliberately key-shaped fixtures (AWS-style `AKIDLIVE…`
  # api_key / `SECRETLIVE…` api_secret) that the tests feed into
  # _redact_credentials to assert exchange credentials are scrubbed from logs
  # under SecretStr (the isinstance(str) re-leak trap). Not real secrets — the
  # whole point of the test is that these values get [REDACTED]. The
  # generic-api-key entropy detector flags the literals on the full scan.
  '''(^|/)analytics-service/tests/test_verify_strategy_redaction\.py$''',
  '''(^|/)analytics-service/tests/test_portfolio_router_audit_2026_05_07\.py$''',
  # Phase 140.1 (PYAPI-06 / PYAPI-10b) no-echo canary fixtures. Both files
  # define deliberately WORDLESS, high-entropy literals whose entire purpose is
  # to be searched for and proven ABSENT from a response body, a Sentry capture,
  # stdout/stderr and the stdlib log stream:
  #   - test_secret_misconfig_signal.py:46,47,51 — `_SERVICE_KEY_CANARY`,
  #     `_INTERNAL_TOKEN_CANARY` and `_WRONG_SERVICE_KEY`. The oracle scans every
  #     contiguous 6-gram of all four values across four output streams, so the
  #     literals MUST be wordless (a dictionary word would make the 6-gram scan
  #     match unrelated prose and the test vacuous). That property is exactly
  #     what trips the generic-api-key entropy detector.
  #   - test_process_key_200_discriminator.py:501 — `_CANARY_SECRET`, asserted
  #     absent from the PYAPI-10b 403 rejection envelope.
  # Not real credentials, and none is ever read from or written to an env var:
  # the whole point of both suites is that these values get suppressed.
  '''(^|/)analytics-service/tests/test_secret_misconfig_signal\.py$''',
  '''(^|/)analytics-service/tests/test_process_key_200_discriminator\.py$''',
  # v1.17 Phase 151 (AUM) E1 money-basis oracle. The suite names its api_key
  # fixtures after the ROLE each key plays in the notional-vs-equity proof —
  # `E1_KEY_DERIV = "e1-key-deriv"`, `E1_KEY_SPOT`, `E1_KEY_DORMANT` — so
  # generic-api-key matches the `KEY` in the identifier and scores the hyphenated
  # literal at entropy ~3.52. The values are plain lowercase slugs used as map
  # keys in an in-memory fixture; no credential material exists in this file.
  # Same push-to-main-only asymmetry as the entries above (the PR-diff scan
  # passed; the squash-commit scan on main flagged it).
  '''(^|/)src/app/\(dashboard\)/allocations/components/ScenarioComposer\.test\.tsx$''',
]

# ---------------------------------------------------------------------------
# Rule-SCOPED allowlists (158-REVIEW CR-03)
# ---------------------------------------------------------------------------
#
# The `[allowlist].paths` list above is a BLANKET exemption: a file listed
# there is invisible to every rule in the ruleset. That is correct for a
# handful of small fixture files whose entire content is synthetic. It was NOT
# correct for `.planning/`, which is the largest cluster of tracked files in
# the repo (~56 MB of plan markdowns, review reports and summaries, all
# world-readable — this repository is PUBLIC). Exempting that whole tree from
# every rule meant the secret-scan gate was STRUCTURALLY incapable of flagging
# a real credential pasted into a plan document. It is a blocking CI gate that
# could not fail over most of its own repository.
#
# The actual problem the exemption solved is narrow: planning prose is full of
# migration filenames, RPC names and hyphenated identifiers that the
# generic-api-key ENTROPY detector scores as secrets. So the exemption is now
# scoped to that one rule. Measured on the working tree at the time of the
# change: 12 findings under `.planning/` with no exemption at all — 11
# generic-api-key (entropy noise, suppressed below) and 1 `jwt`.
[[allowlists]]
description = "planning artifacts: entropy false-positives only, NOT a blanket exemption"
targetRules = ["generic-api-key"]
paths = ['''(^|/)\.planning/''']

# The single non-entropy hit in `.planning/` is the canonical jwt.io tutorial
# JWT — the same fixture already allowlisted by path for four test files near
# the top of this file. Suppressed by VALUE rather than by path, so it stays
# suppressed wherever it is quoted while ANY OTHER JWT appearing in a planning
# document still trips the gate. That is the distinction a path exemption
# cannot make, and the reason this block exists rather than a broader one.
#
# ⚠️ `condition = "AND"` is load-bearing. gitleaks defaults an allowlist to OR,
# which would suppress the `jwt` rule for this literal EVERYWHERE it appears —
# and that breaks the H-0017 meta-test (`src/__tests__/gitleaks-allowlist.test.ts`),
# which deliberately plants this exact fixture at a NON-allowlisted path and
# asserts the `jwt` rule fires on it. Observed while making this change: with
# the default OR, that test failed with `expected 'generic-api-key' to be
# 'jwt'` — i.e. a broad allowlist had silently degraded a falsifiability guard.
# AND means "this literal, and only inside .planning/".
[[allowlists]]
description = "canonical jwt.io tutorial JWT fixture (HS256, sub=12345) — not a real token"
targetRules = ["jwt"]
condition = "AND"
paths = ['''(^|/)\.planning/''']
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NSJ9\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''']
