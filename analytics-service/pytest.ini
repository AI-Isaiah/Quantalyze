[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# Diagnostic only (Phase 164.9.8.1 review R4 WR-01): dump every thread's stack to
# stderr if one test runs past 900 s, naming the stuck test. It never fails,
# skips or retries anything, so no verdict depends on it. 900 s is well above the
# ~130 s worst case observed for the slowest (child-pytest) tests.
faulthandler_timeout = 900
markers =
    xdist_group: pin tests sharing a group name to the same xdist worker (serializes shared-test-DB tests under `-n auto --dist loadgroup`)
