# MW02 RED FIXTURE (second member) — a per-job tolerance arm the `if`/`elif`
# PARSER cannot see, and the EXECUTION oracle can. Phase 164.3.1 review WR-03.
#
# THE GAP THIS REPRODUCES. Plan 08 replaced the single-spelling regex with a
# structural parser (`extractResultLoopConditions` in
# `src/__tests__/lint-sql-gates.test.ts`) that walks `if`/`elif` lines and
# classifies a tolerance when a condition inside a job arm tests
# `$result = skipped`. That is ONE spelling family. The `sql-mutation` arm below
# is a real, effective per-job skip tolerance written as a `case` statement —
# no `if` line mentions `$result`, so the parser reports NO tolerance for it
# and the old "hermetic job has not grown a tolerance arm" assertion would stay
# GREEN on a workflow that had grown one. GRAMMAR § 3's own lesson: any rule
# stated over a spelling can be re-spelled around.
#
# WHAT IT PINS, permanently, in `src/__tests__/lint-sql-gates.test.ts`:
#   1. the PARSER sees no tolerance here — the recorded blindness, kept as a
#      contrast pin so the reason for the execution oracle cannot be lost;
#   2. RUNNING the loop with `needs.sql-mutation.result` = skipped and the
#      fork-PR guard true yields fail=0 — the execution oracle classifies
#      `sql-mutation` as tolerance-bearing. If that oracle is ever replaced by
#      a spelling rule, (2) reds.
#
# Pair members: MW02-current-spelling.green.yml (the real loop as spelled) and
# MW02-alternate-spelling.red.yml (the `[[`/`==` spelling the parser DOES see).
# House contract (`scripts/lint-sql-gates.mjs:33-40`): a rule without a firing
# fixture does not merge.
#
# ⛔ THIS FIXTURE IS NOT A PROPOSAL. It is the shape the gate must reject.

      - name: Verify all frontend-* jobs succeeded
        run: |
          fail=0
          for r in \
            "sql-gate-lint=${{ needs.sql-gate-lint.result }}" \
            "sql-mutation=${{ needs.sql-mutation.result }}" \
            "plan-anchor-verify=${{ needs.plan-anchor-verify.result }}"; do
            name="${r%=*}"; result="${r#*=}"
            echo "$name: $result"
            if [ "$name" = "sql-mutation" ]; then
              is_fork_pr='${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}'
              case "$result:$is_fork_pr" in
                success:*) : ;;
                skipped:true) echo "sql-mutation skipped; tolerated for this row only." ;;
                *) fail=1 ;;
              esac
            elif [ "$name" = "plan-anchor-verify" ]; then
              is_pr='${{ github.event_name == 'pull_request' }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$is_pr" != "true" ]; then
                echo "plan-anchor-verify skipped (event is not pull_request); tolerated for this row only."
              else
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              fail=1
            fi
          done
