# MW02 RED FIXTURE — a per-job tolerance arm the OLD single-spelling pin CANNOT
# SEE. Phase 164.3.1 plan 08, [MUT-W02].
#
# THE DEFECT THIS REPRODUCES. Before plan 08, `src/__tests__/lint-sql-gates.test.ts`
# asserted each job's tolerance posture with a regex over ONE literal spelling:
#
#     const arm = new RegExp(`\\[ "\\$name" = "${job}" \\]`);
#
# and, for a job whose row says `tolerance: null`, asserted `not.toMatch(arm)` —
# "this hermetic job has NOT grown a tolerance arm". That is an assertion about
# BYTES, not about the aggregator's behaviour. The `sql-mutation` arm below is a
# real, effective per-job skip tolerance written with `[[ ]]`, `==` and single
# quotes instead of `[ ]`, `=` and double quotes. It widens what branch
# protection tolerates — a `skipped` sql-mutation now passes the aggregate — and
# the old regex does not match a byte of it, so the old pin stays GREEN.
#
# `sql-mutation` is exactly the job that must never carry one: it hosts its own
# throwaway PostgreSQL clusters, consumes no secret and no repo variable, and
# carries no `if:`, so a `skipped` there is always a real fault. It is also the
# job whose whole purpose is catching controls that cannot fail.
#
# WHAT IT PINS. Two assertions, permanently, in
# `src/__tests__/lint-sql-gates.test.ts`:
#   1. the OLD regex finds NOTHING here — the recorded blindness, kept as a
#      contrast pin so the reason for the re-expression cannot be lost;
#   2. the structural parser DOES classify `sql-mutation` as tolerance-bearing —
#      the new visibility.
# If the parser is ever narrowed back toward a spelling, (2) reds.
#
# Pair member: MW02-current-spelling.green.yml
# House contract (`scripts/lint-sql-gates.mjs:33-40`): a rule without a firing
# fixture does not merge.
#
# ⛔ THIS FIXTURE IS NOT A PROPOSAL. It is the shape the gate must reject.

      - name: Verify all frontend-* jobs succeeded
        run: |
          fail=0
          for r in \
            "sql-gate-lint=${{ needs.sql-gate-lint.result }}" \
            "sql-mutation=${{ needs.sql-mutation.result }}" \
            "plan-anchor-verify=${{ needs.plan-anchor-verify.result }}"; do
            name="${r%=*}"; result="${r#*=}"
            echo "$name: $result"
            if [[ $name == 'sql-mutation' ]]; then
              is_fork_pr='${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}'
              if [[ "$result" == "success" ]]; then
                :
              elif [[ "$result" == 'skipped' && "$is_fork_pr" == 'true' ]]; then
                echo "sql-mutation skipped; tolerated for this row only."
              else
                fail=1
              fi
            elif [ "$name" = "plan-anchor-verify" ]; then
              is_pr='${{ github.event_name == 'pull_request' }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$is_pr" != "true" ]; then
                echo "plan-anchor-verify skipped (event is not pull_request); tolerated for this row only."
              else
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              fail=1
            fi
          done
