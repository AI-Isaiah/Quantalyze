name: Secret scan - full history of main (scheduled)

# Phase 242 SECRETSHYGIENE, SECR-03 (decisions SCAN-SUPPRESS, SCAN-SCOPE,
# SCAN-RED, AUTO-INSTALL, AUTO-CADENCE, AUTO-PIN).
#
# WHAT THIS IS. A daily scan of the full history of main with the repo's
# .gitleaks.toml and the commit-scoped .gitleaksignore at the repo root. Every
# historical finding is suppressed there by a four-part commit fingerprint, so
# the scan reads zero today and any NEW credential committed to main turns it red.
#
# WHY IT FAILS RED AND FILES AN ISSUE. A red full-history scan means a credential
# may be public, and a human must look before anything else moves. The `scan`
# job's own failure keeps the workflow red, and the `report` job files (or
# comments on) one deduplicated issue. A red run attaches a failing check to
# main's head SHA, and Railway gates on every workflow's check runs for a commit,
# so it can block a later Railway redeploy of that SHA until it is fixed or
# re-run green. That is the coupling the founder accepted for the nightly SQL
# mutation run in Phase 164.9.6 D-11 and for this scan in Phase 242. The next
# merge carries a new SHA, so the block is narrow.
#
# WHY THE ISSUE CARRIES A COUNT ONLY. The repo is public and a red scan may be a
# real credential. The issue holds the run URL, the job result and the number of
# findings. No file, line, commit, fingerprint or value reaches the issue, the
# log or an artifact: the scan runs with --redact, never -v, and its report stays
# in RUNNER_TEMP. A maintainer gets the locations by running the reproduction
# command from the issue locally, which takes about a minute.
#
# WHY NO pull_request TRIGGER. It would join the merge-path workflow set pinned
# in src/__tests__/critical-regressions.test.ts. PR ranges are already scanned by
# CI's own `secret-scan` job. This workflow is schedule plus dispatch only.
#
# WHAT "FULL HISTORY" COVERS. Ordinary commits and the diff each merge commit
# introduces (--remerge-diff, which shows only what a merge's resolution changed).
# The scan step fails red when gitleaks logs an error or scans a different number of
# commits than git reports, because gitleaks exits 0 with "0 commits scanned" when
# its own `git log` fails.
#
# PINNED BY src/__tests__/secret-scan-full-history.test.ts: the triggers, the
# main-only checkout and log-opts, --redact, the binary pin, the fail-red wiring and
# coverage check of the scan step, the pre-scan self-test step, that the report is
# never uploaded or committed, and where `issues: write` may appear.

on:
  schedule:
    # 03:00 is sql-mutation-nightly, 04:00 is the cassette refresh and 08:00 is
    # nightly.yml, so 05:30 UTC is free.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-full-history
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      findings: ${{ steps.count.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch from another ref still scans main's ancestry and uses
          # main's ignore file.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # D-26: the release tarball is verified against the sha256 hard-coded
      # below before anything is extracted from it. The release's checksums file
      # is NEVER fetched at runtime: a hash downloaded beside the binary it
      # vouches for proves nothing. The version must equal ci.yml's secret-scan
      # `GITLEAKS_VERSION` and the script's exported `GITLEAKS_VERSION`.
      - name: Install gitleaks (sha256-pinned release binary)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      # WR-04 / SFH-M2: the real-binary scoping arm in the vitest file skips on
      # CI (no gitleaks on PATH), so THIS step is where the pinned binary's
      # semantics are re-measured every day. It plants fixture values built at
      # runtime in a throwaway repo under RUNNER_TEMP: two at the SAME path and line
      # in two commits, and one only in a merge commit. It fails the job unless all
      # three are detected with exit 2, (a) a four-part fingerprint suppresses only
      # its own commit's finding, (b) a three-part line suppresses both same-site
      # findings and (c) a four-part line with an inline comment suppresses nothing.
      # Nothing here prints a value: --redact, no -v.
      - name: Self-test the pinned binary (planted findings, four-part suppression, merge-only content)
        run: |
          set -euo pipefail
          t="${RUNNER_TEMP}/gitleaks-selftest"
          cfg="${GITHUB_WORKSPACE}/.gitleaks.toml"
          rm -rf "${t}"
          mkdir -p "${t}/repo"
          cd "${t}/repo"
          g() { git -c user.name=selftest -c user.email=selftest@example.invalid "$@"; }
          # A private-key block is detected by shape alone, so a fixture never slips past on
          # entropy or a stopword the way a random api_key assignment does about 3 runs in 100.
          fixture() { printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$1" "$(head -c 96 /dev/urandom | base64 | tr -d '\n')" "$1"; }
          scan() {
            rc=0
            gitleaks git . --config "${cfg}" --log-opts="--remerge-diff HEAD" --redact --no-banner --no-color \
              --exit-code 2 --report-format json --report-path "$1" >/dev/null 2>&1 || rc=$?
          }
          # count <report> [commit]: findings in the report, not counting those at <commit>
          count() {
            node -e 'const f=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(f.filter(x=>!process.argv[2]||!x.Fingerprint.startsWith(process.argv[2]+":")).length)' "$@"
          }
          fail() { echo "::error::MEASURE_FAIL: gitleaks self-test: $1"; exit 1; }
          g init -q -b main
          mkdir -p src
          fixture "PRIVATE KEY" > src/planted.pem
          g add src/planted.pem
          g commit -q -m "plant in an ordinary commit"
          first="$(g rev-parse HEAD)"
          g checkout -q -b side
          echo side > side.txt
          g add side.txt
          g commit -q -m side
          g checkout -q main
          fixture "RSA PRIVATE KEY" > src/planted.pem
          g add src/planted.pem
          g commit -q -m "plant at the same path and line in a later commit"
          g merge -q --no-ff --no-commit side
          fixture "OPENSSH PRIVATE KEY" > src/planted-in-merge.pem
          g add src/planted-in-merge.pem
          g commit -q -m "plant only in the merge commit"
          scan "${t}/plain.json"
          [ "${rc}" -eq 2 ] || fail "a planted fixture exited ${rc}, expected 2."
          [ "$(count "${t}/plain.json")" -eq 3 ] || fail "expected 3 findings (two at one site, one merge-only), got $(count "${t}/plain.json")."
          fp="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).find(x=>x.Fingerprint.startsWith(process.argv[2]+":")).Fingerprint)' "${t}/plain.json" "${first}")"
          printf '# self-test\n%s\n' "${fp}" > .gitleaksignore
          scan "${t}/four-part.json"
          [ "${rc}" -eq 2 ] || fail "after suppressing one commit the scan exited ${rc}, expected 2."
          [ "$(count "${t}/four-part.json")" -eq 2 ] && [ "$(count "${t}/four-part.json" "${first}")" -eq 2 ] || fail "a four-part line did not suppress exactly its own commit's finding."
          printf '# self-test\nsrc/planted.pem:private-key:1\n' > .gitleaksignore
          scan "${t}/three-part.json"
          [ "$(count "${t}/three-part.json")" -eq 1 ] || fail "a three-part line did not suppress both same-site findings."
          printf '# self-test\n%s  # inline\n' "${fp}" > .gitleaksignore
          scan "${t}/inline.json"
          [ "$(count "${t}/inline.json")" -eq 3 ] || fail "an inline comment did not void the line."
          echo "gitleaks self-test passed"
      - name: Scan the full history of main
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          log="${RUNNER_TEMP}/gitleaks.log"
          # --remerge-diff: a plain `git log -p` prints no patch for a merge commit, so
          # content that exists only in a merge's resolution would never be scanned.
          gitleaks git . --config .gitleaks.toml --log-opts="--remerge-diff HEAD" --redact --no-banner --no-color \
            --exit-code 2 --report-format json --report-path "${report}" 2> "${log}"
          rc=$?
          cat "${log}" >&2
          echo "gitleaks exit code: ${rc}"
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then
            echo "::error::MEASURE_FAIL: gitleaks exited ${rc}, neither 0 (clean) nor 2 (findings); the scan did not complete."
          fi
          # WR-01: gitleaks exits 0 with "0 commits scanned" when its own `git log` fails,
          # so clean needs proof of coverage. It scans a commit only when that commit's
          # patch holds a non-binary, non-deleted file with at least one changed line (a
          # rename, a mode change or an empty file has no hunk); count the same set.
          want=$(git log --remerge-diff --diff-filter=d --numstat --format='commit %H' HEAD |
            awk '/^commit /{if(h&&n)c++; h=1; n=0; next} NF>=3 && $1!="-" && ($1+$2)>0{n=1} END{if(n)c++; print c+0}')
          got=$(grep -aoE '[0-9]+ commits scanned' "${log}" | grep -aoE '^[0-9]+' || echo 0)
          if ! [ "${want}" -gt 0 ] || grep -aq ' ERR ' "${log}" || [ "${got}" != "${want}" ]; then
            echo "::error::MEASURE_FAIL: gitleaks scanned ${got} of ${want} commits or logged an error; the scan did not cover main's history."
            exit 1
          fi
          exit "${rc}"
      - name: Count findings (count only, never a location or a value)
        id: count
        if: always()
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          if [ -s "${report}" ]; then
            n=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).length)' "${report}" || echo unknown)
          else
            n=unknown
          fi
          echo "findings=${n}" >> "${GITHUB_OUTPUT}"

  # Files, or comments on, ONE deduplicated issue whenever the scan job did not
  # succeed. `!= 'success'` covers findings, an incomplete scan, timeout and cancel.
  # This job never masks the red: the workflow is already red because `scan`
  # failed; this job fails only if filing the issue fails. It is the ONLY job
  # holding a write scope, it checks out no repo code, and it reads nothing the
  # scan produced beyond the findings count passed as a job output.
  report:
    needs: [scan]
    if: always() && needs.scan.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the full-history secret scan issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}
          JOB_RESULT: ${{ needs.scan.result }}
          FINDINGS: ${{ needs.scan.outputs.findings }}
        with:
          script: |
            const { RUN_ID, REPO_NAME, JOB_RESULT, FINDINGS } = process.env;
            const today = new Date().toISOString().slice(0, 10);
            const dedupLabel = "nightly-canary-failure:secret-scan-full-history";
            const runUrl = `https://github.com/${REPO_NAME}/actions/runs/${RUN_ID}`;
            const coupling =
              "A red full-history scan attaches a failing check to main's head SHA; Railway gates on every workflow's check runs for a commit, so it can block a later Railway redeploy of that same SHA until this is fixed or re-run green. The founder accepted this coupling (Phase 164.9.6 D-11, Phase 242).";
            const body = [
              `The scheduled full-history secret scan of main did not succeed (job result: ${JOB_RESULT}).`,
              "",
              `Workflow run: ${runUrl}`,
              `Findings: ${FINDINGS}`,
              "",
              "Reproduce locally (about a minute; it prints no values):",
              "```",
              "gitleaks git . --config .gitleaks.toml --log-opts=\"--remerge-diff origin/main\" --redact --no-banner",
              "```",
              "",
              "If any finding could be a live credential, rotate it before anything else. Suppress only test fixtures, by adding one four-part line to .gitleaksignore under a reason comment.",
              "",
              coupling,
              "",
              "Auto-filed by .github/workflows/secret-scan-full-history.yml. This issue is deduplicated by the `" + dedupLabel + "` label; later failures comment here until it is closed. It carries a count and a run link only, because the repo is public.",
            ].join("\n");
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: dedupLabel,
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Failed again on ${today}.\n\n${body}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Full-history secret scan of main failed on ${today}`,
              body,
              labels: ["nightly-probe", "security", dedupLabel],
            });
