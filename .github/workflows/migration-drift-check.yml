name: Migration Drift Check

# PR-time enforcement of repo-vs-prod migration-timestamp consistency.
# Catches the MCP-vs-CLI timestamp-mismatch failure class that triggered
# PR-Y1 era drift (5+ rows accumulated April-May 2026).
#
# Security: no github.event.* interpolation into shell. All secrets via
# env: blocks (mirrors migration-policy.yml + supabase-migrate.yml). The
# only PR-derived data is file paths, regex-validated by the `paths:`
# filter and re-validated via the 14-digit-prefix grep in the script.
#
# Phase 164.3 / VAC-04 — this workflow now ALSO hosts the repo-vs-PROD
# function-body drift gate (scripts/prod-body-drift-check.sh). D-12: it rides
# THIS job and THIS credential rather than minting a second copy of production
# access. The secret is already in this job's blast radius on every migrations
# PR, so adding a step widens nothing.
#
# ⛔ D-13 — THIS MUST NEVER BECOME A MAIN-PUSH WORKFLOW. Two independent
# reasons, and the second is the expensive one:
#   (a) The requirement is "no whole-body CREATE OR REPLACE MERGES without a
#       diff", which is inherently pre-merge. `pull_request` is the correct
#       trigger on its own terms.
#   (b) Railway WAITS on main CI and SKIPS the analytics-service deploy when it
#       is red. Moving this gate onto main-push would couple a body-drift
#       finding to a DEPLOY FREEZE. A red PR board was accepted; halted deploys
#       were not. Do not "improve" this into a push trigger.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-drift-check.yml'
      # VAC-04's own implementation: edits to the gate must re-run the gate.
      # ⚠️ These entries are the subject of an OPEN founder decision recorded in
      # TODOS.md: a PR touching only them runs with SUPABASE_DB_PASSWORD in env,
      # executing script content from the PR head. Fork PRs are excluded by the
      # same-repo `if:` below, so the blast radius is push-access collaborators
      # and the mitigation is required reviewers on the `Production`
      # environment. Adding a name to this list does NOT widen that radius — a
      # collaborator who can edit any one of them can already trigger the run —
      # but it must not be extended to non-VAC-04 paths.
      - 'scripts/prod-body-drift-check.sh'
      - 'scripts/sql-body-normalize.mjs'
      - 'scripts/sql-function-names-naive.mjs'

concurrency:
  group: migration-drift-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # D-17b — FORK CARVE-OUT, and it is load-bearing for the hard failure below.
    # GitHub withholds secrets and environment secrets from fork-PR
    # `pull_request` runs, so with the skip converted to `exit 1` an
    # unconditional job would redden every fork PR for a reason no contributor
    # could fix. Gating the JOB instead makes a fork PR show a visibly SKIPPED
    # job — an honest state, and a categorically different one from
    # green-having-checked-nothing. A fork PR cannot merge a migration without a
    # maintainer branch anyway. Same-repo precedent: ci.yml's `sql-tests` job.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0  # need merge-base for the PR-additions diff below
      # Phase 164.3 / D-17 — THIS STEP USED TO BE A SKIP THAT READ AS A PASS.
      #
      # It emitted `configured=false` plus a `::notice:: ... skipped`, and every
      # later step carried `if: steps.check.outputs.configured == 'true'`. An
      # unconfigured run therefore reported GREEN having checked nothing — on
      # the workflow that guards PRODUCTION migrations. That is SKIP-01's exact
      # shape, and SKIP-01 is on this phase's own defect list.
      #
      # Classified honestly when found: LATENT, not live. Measured 2026-08-29 on
      # run 33167385035, the job reaches its real conclusion ("Pending
      # migrations match this PR's additions - no drift"), so the secrets ARE
      # configured and the skip branch was dormant. It was a hole that opens the
      # day a secret is rotated away, not one that was open then.
      #
      # It is now a HARD FAILURE. The `configured` output and the three `if:`
      # conditions that consumed it are DELETED rather than left in place: an
      # `if:` that can no longer be false is dead code shaped exactly like the
      # skip mechanism this phase exists to remove, and the next reader would
      # have to re-derive that it cannot fire.
      - name: Assert secrets are configured (D-17 — a skip is not a pass)
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SUPABASE_PROJECT_REF:-}" ] || missing="${missing} vars.SUPABASE_PROJECT_REF"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing="${missing} secrets.SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || missing="${missing} secrets.SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Migration Drift Check cannot run - not configured:${missing}"
            echo "::error::This is a HARD FAILURE, not a skip (Phase 164.3 / D-17). This job"
            echo "::error::guards production migrations; reporting success while unable to reach"
            echo "::error::production would be green-having-checked-nothing. Fork PRs never get"
            echo "::error::here - the job-level same-repo condition skips them visibly instead."
            exit 1
          fi
          echo "::notice::Drift-check credentials present."
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf  # v2.1.1
        with:
          version: 2.98.2
      - name: Drift check (db push dry-run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          set +e
          OUTPUT=$(supabase db push --include-all --dry-run 2>&1)
          EXIT=$?
          set -e
          echo "::group::Dry-run output"
          echo "$OUTPUT"
          echo "::endgroup::"
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::Migration drift detected - supabase db push --dry-run failed (exit $EXIT)."
            echo "::error::Likely cause: a migration was applied to prod via MCP apply_migration"
            echo "::error::with a different timestamp than the repo file. To reconcile, rename the"
            echo "::error::local file to match the remote schema_migrations.version. See PR-Y2 pattern."
            exit 1
          fi
          if echo "$OUTPUT" | grep -qF "Remote database is up to date"; then
            echo "::notice::No drift - Remote database is up to date."
            exit 0
          fi
          PENDING_TS=$(echo "$OUTPUT" | grep -oE '[0-9]{14}_' | sed 's/_$//' | sort -u || true)
          if [ -z "$PENDING_TS" ]; then
            echo "::notice::No 'up to date' or pending-migration signal in dry-run output. Treating as pass."
            exit 0
          fi
          MERGE_BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          if [ -z "$MERGE_BASE" ]; then
            echo "::warning::Could not resolve merge base; failing closed."
            exit 1
          fi
          PR_ADDED_TS=$(git diff --diff-filter=A --name-only "$MERGE_BASE"...HEAD -- 'supabase/migrations/*.sql' \
            | grep -oE '[0-9]{14}_' | sed 's/_$//' | sort -u || true)
          PRE_EXISTING_DRIFT=$(comm -23 <(echo "$PENDING_TS") <(echo "$PR_ADDED_TS"))
          if [ -n "$PRE_EXISTING_DRIFT" ]; then
            echo "::error::Pre-existing drift (pending files not introduced by this PR):"
            echo "$PRE_EXISTING_DRIFT" | sed 's/^/::error::  /'
            exit 1
          fi
          echo "::notice::Pending migrations match this PR's additions - no drift."

      # ── Phase 164.3 / VAC-04 — repo-snapshot-vs-PROD FUNCTION BODY drift ────
      #
      # The step above answers "is the repo's migration SET the applied set?".
      # It cannot see a body that was patched directly into PROD out of band,
      # which is exactly DRIFT-02's shape — a near-GDPR-regression caught by a
      # human reading a diff, not by any machine. This step is that machine.
      #
      # ⛔ It deliberately carries NO `if:` of its own (D-17a). Its FIRST act is
      # its own credential assertion, and an absent credential is `exit 1`. It
      # must never inherit a condition that could make it silently not run.
      #
      # Redaction (T-164.3-04, public repo): the dump is written to a workspace
      # file and never echoed; the gate prints function names, argument counts,
      # sha256 hashes and differing-line counts only.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: VAC-04 - repo-vs-PROD function body drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # FETCHER MECHANISM: one schema-only dump through the CLI's linked
          # connection, then a text extract per function. Chosen over a
          # hand-built psql DSN because this job ALREADY proves connectivity
          # with these exact secrets via `supabase link` above, and because a
          # constructed DSN is one more string that must never be echoed in a
          # public log. Never `cat` this file.
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          DUMP="${RUNNER_TEMP}/prod-schema.sql"
          supabase db dump --linked --schema public -f "$DUMP"
          # A dump we cannot read functions out of is NOT a pass. Fail loud
          # rather than let the gate sail through comparing nothing.
          if ! grep -acE '^\s*CREATE (OR REPLACE )?FUNCTION' "$DUMP" >/dev/null 2>&1; then
            echo "::error::VAC-04: the PROD schema dump contains no function definitions."
            echo "::error::Either the dump failed or its shape changed. This gate refuses to"
            echo "::error::report a pass for a comparison it could not perform."
            exit 1
          fi
          export BODY_FETCH_CMD="node scripts/sql-body-normalize.mjs --extract-fn ${DUMP}"
          # The fetcher exits 0 with EMPTY stdout for a name it cannot find, and
          # the gate used to read that as "new function — pass". The index makes
          # absence a measurement instead: a name that IS in this list but
          # yields no body is an extractor failure and the gate exits 1 (WR-01).
          export BODY_NAME_INDEX_CMD="node scripts/sql-body-normalize.mjs --function-names ${DUMP}"
          # ⛔ SP-C05 — the index above and the fetcher above it are the SAME
          # function (`extractFunctionDefs`) over the SAME dump, and it silently
          # skips a definition it cannot parse. So a dropped definition was
          # missing from BOTH, they agreed by construction, and the gate printed
          # "measured absent — Treated as a NEW function (pass)". MEASURED
          # 2026-08-29 on `CREATE OR REPLACE FUNCTION public.sanitize_user$v2(p
          # uuid)`: the whole gate exited 0 having compared nothing. This second
          # index is a different derivation — a line-anchored regex, no lexer,
          # `$` in the identifier charset, importing nothing from the normalizer.
          # The gate unions them, so absence needs BOTH readings to agree.
          export BODY_NAME_INDEX_XCHECK_CMD="node scripts/sql-function-names-naive.mjs ${DUMP}"
          # Must stay in step with the --schema flag on the dump above. The gate
          # refuses any migration that defines a function outside these schemas,
          # because such a function is absent from this dump for a reason that
          # has nothing to do with it being new.
          export PROD_DUMP_SCHEMAS="public"
          # Mode identity (Pitfall 2): this is the exact command a developer runs.
          bash scripts/prod-body-drift-check.sh
