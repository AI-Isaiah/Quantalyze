name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual one-shot trigger for re-baking the e2e SVG chart goldens. Inert for
  # normal CI (push/PR) — the input defaults false and only changes the
  # e2e-seeded job's behaviour when explicitly checked on a dispatch. Must live
  # on the default branch for `gh workflow run` / the UI to see it.
  workflow_dispatch:
    inputs:
      bake_svg_goldens:
        description: >-
          Bake e2e/svg-chart-parity.spec.ts goldens: the seeded e2e job runs
          ONLY that spec with --update-snapshots and uploads the generated PNGs
          as an artifact for per-chart human review. Never auto-commits them.
        type: boolean
        default: false
        required: false

# Cancel in-flight CI on PR force-pushes only. On `push` to `main`, every
# commit must produce its own recorded green CI run (deploy automation +
# branch protection key on per-SHA status); cancelling intermediate runs
# would leave `main` commits without a green check. `head_ref` is set on
# pull_request events and empty on push events — falling back to `run_id`
# (unique per run) ensures push events never share a group key, so they
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# C-0293(a) fix: minimal default GITHUB_TOKEN scope. Without this block,
# GITHUB_TOKEN inherits the repo default (which is `contents: write` plus
# write on issues/packages/PRs/statuses), so a compromised third-party
# action would have a write-all credential to pivot from. We default to
# `contents: read` (enough for actions/checkout to fetch the tree) and
# uplift specific jobs that genuinely need more (secret-scan grants
# pull-requests: write so gitleaks can post finding comments). The
# release/migration paths live in other workflows that gate on the
# `production` GitHub environment + manual approval.
permissions:
  contents: read

jobs:
  # CI speed audit F1: populate the shared node_modules cache ONCE per lockfile
  # so the frontend jobs (which restore it read-only) skip their installs on
  # subsequent runs. The cache/save is an explicit step AFTER npm ci, so a
  # failed install never saves a partial (poisoned) tree. No downstream job
  # `needs:` this — they restore opportunistically and fall back to their own
  # npm ci on a miss, so this never serializes the graph (and is not a gate).
  deps-cache:
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    # No downstream job `needs:` this one (see the header), so its skip skips
    # nothing else and it is not an aggregator row — the saving is pure runner time.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Save ONLY on a miss + AFTER a successful npm ci — this step does not run
      # if the install above failed (steps halt on first failure), so the cached
      # tree is always complete.
      - name: Save node_modules
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

  changed-paths:
    # Rationale: docs/ci-yml-notes.md#changed-paths-1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      sql_gate_mode: ${{ steps.sql_gate_subset.outputs.sql_gate_mode }}
      sql_gate_files: ${{ steps.sql_gate_subset.outputs.sql_gate_files }}
      sql_gate_reason: ${{ steps.sql_gate_subset.outputs.sql_gate_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the classifier diffs against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      # The red path first: a gate whose failure modes have never been observed
      # is the defect Phase 164.3 exists to remove. Here it is stronger than
      # convention — this classifier is the filter's single point of trust, and
      # a wrong `true` skips sixteen gates at once.
      - run: node scripts/classify-changed-paths.mjs --self-test
      # Phase 164.9.4 (founder routing 2026-09-27, review WR-01): on a push the
      # classifier diffs the PUSHED range `before..HEAD` and fails SAFE to code
      # when that range cannot be determined (zero before-SHA, a forced push, a
      # before-SHA missing from this clone or not an ancestor). The two event
      # fields reach it through `env:`, never interpolated into `run:`. Both are
      # empty on a pull_request and a workflow_dispatch, which never read them.
      # (2026-10-02, review round 2 SFH-04; rounds 3 and 4) A docs-only push
      # range takes the short path ONLY when CI provably ran and finished green
      # on `before`: (a) a completed `frontend` check run concluded success,
      # (b) every GitHub Actions check run (all workflows and events, read with
      # `filter=all`, deduped by check suite and name to the latest attempt
      # inside one suite, never across suites) completed as success, skipped or
      # neutral, and (c) every GitHub Actions check suite on it is completed and
      # not red, so a workflow run still queued with no jobs blocks it too.
      # Red, cancelled, timed out, pending, absent, a truncated or malformed
      # response, or an API error runs the full corpus with the reason printed.
      # `GH_TOKEN` is this job's `checks: read` token, scoped to this step
      # and the `sql_gate_subset` step below (review 164.9.6 WR-03), and to no
      # other. `GITHUB_REPOSITORY` is a runner default.
      - id: classify
        run: node scripts/classify-changed-paths.mjs
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
          GH_TOKEN: ${{ github.token }}
      # Same red-path-first shape for the SQL gate subset derivation: its
      # self-test drives every verdict (including an unreadable base, which is
      # a MEASURE_FAIL and never an empty change set) before the real run. A
      # wrong `subset` would leave gate files unmutated on a pull request.
      - run: node scripts/sql-gate-subset.mjs --self-test
      # Phase 164.9.6 D-01: on a push to main the derivation judges the pushed
      # range, so it needs the same two event fields the `classify` step reads,
      # through `env:` and never interpolated into `run:`.
      # (Review 164.9.6 WR-03) A push that would narrow to a subset or to
      # `none` first proves `before` green with the classifier's own
      # `predecessorVerdict`, the same proof the docs-only short path uses, so
      # it needs this job's `checks: read` token, through `env:` only. A push
      # already owed FULL makes no API call; an unproven predecessor (red,
      # pending, absent, an API error, a truncated response) runs FULL with the
      # reason printed. A pull_request never reads the token.
      - id: sql_gate_subset
        run: node scripts/sql-gate-subset.mjs
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
          GH_TOKEN: ${{ github.token }}

  # CI speedup PR-B (v0.22.1.2+): the prior monolithic `frontend` job ran
  # typecheck → lint → test → policy-checks → audit → build serially
  # (~5min wall clock). Split into 5 parallel jobs so wall-clock collapses
  # to max-of-jobs (~build, ~3min). Each parallel job pays the cold
  # `npm ci` cost (~30-60s), but `actions/setup-node@v4 cache: npm`
  # restores `~/.npm` so subsequent `npm ci`s are tarball-extract-only.
  # Branch protection still gates on a single check (the aggregator
  # `frontend` job below `needs:` all parallel jobs).
  frontend-typecheck:
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # PR-C: cache TypeScript's incremental build info (tsconfig.json has
      # `incremental: true`, so tsc emits tsconfig.tsbuildinfo in the project
      # root). On unchanged code, tsc skips fully re-checking files whose
      # imports haven't changed since the last successful run — typecheck
      # drops 30-60% on small diffs.
      - name: Cache tsconfig.tsbuildinfo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - run: npm run typecheck

  frontend-lint:
    # ⛔ Phase 164.6.3 / CI-DOCSPATH-01 — THIS JOB IS DELIBERATELY NOT FILTERED, and
    # it carries NEITHER `needs: [changed-paths]` NOR the docs-only conjunct. It is one
    # of the five always-on gates, beside `plan-anchor-verify`, `secret-scan`,
    # `version-gate` and `docs-link-check`.
    # WHY, and it is not obvious from the job name: `npm run lint` is a CHAIN, and its
    # last link is `tsx scripts/check-planning-hygiene.ts` — the gate whose stated
    # subject is GSD tooling writing absolute worktree and scratchpad paths into NEW
    # planning artifacts, on a repo that is PUBLIC with `.planning/` TRACKED, and which
    # carries `⛔ NO PATH ALLOWLIST — BY CONSTRUCTION`. A `.planning/`-only PR is
    # precisely the PR class that gate exists to catch, so filtering this job would
    # have silently regressed the one gate aimed squarely at this phase's own subject.
    # MEASURED COST OF KEEPING IT: ~70 s on every docs-only PR. Stated so the trade is
    # legible rather than assumed.
    # ⚠️ It is ALSO a member of the aggregator's `ALWAYS_ON` shell list below. That is
    # DEFENCE IN DEPTH and is unreachable today (no `if:`, no `needs:` here means it
    # can never report `skipped`); it is the only shell-level barrier if a future edit
    # ever gives this job a skip route. ⛔ Do not delete either half as dead weight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # PR-C: cache ESLint's per-file result cache. The `lint` script in
      # package.json now passes `--cache --cache-location
      # node_modules/.cache/.eslintcache`. ESLint skips re-linting files
      # whose mtime + content hash haven't changed since the last run —
      # repeat lint on unchanged files drops to milliseconds.
      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules/.cache/.eslintcache
          key: ${{ runner.os }}-eslintcache-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-eslintcache-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*') }}-
      - run: npm run lint

  frontend-test:
    # PR-C extension: shard vitest. Wall clock collapses to the slowest shard.
    # CI speed audit F6: reduced 3→2 shards — with F1's shared node_modules
    # cache the per-shard install overhead is gone, and the measured per-shard
    # execution (minus install) is well under the critical path, so 2 balanced
    # shards halve the runner fan-out without lengthening wall-clock. Also
    # cache vitest's transform graph at node_modules/.vite — on a warm
    # cache the TS/JSX transform step is largely a no-op.
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    #
    # ⚠️ THE ACCEPTED CONSEQUENCE, RECORDED HERE RATHER THAN DISCOVERED LATER.
    # Two assertions hosted by this job take REAL `.planning/**` content as their
    # subject: `src/__tests__/lint-sql-gates.test.ts` reads `.planning/milestones/v1.20-REQUIREMENTS.md`
    # and `.planning/ROADMAP.md` and reddens on a planning sentence that still claims
    # five vacuity shapes, and `src/__tests__/verify-plan-anchors.test.ts` reads Phase
    # 159's real `159-VERIFICATION.md` and reddens on a falsified closing recipe. On a
    # `.planning/`-only PR those two no longer run — which is exactly the PR class that
    # can move their subject. Their detection is therefore DEFERRED, not LOST: the
    # merge push to main is UNFILTERED (see the `changed-paths` header) and runs them,
    # and so does the next code PR.
    # ⛔ The answer is NOT to move `frontend-test` into the always-on set. This job is
    # most of the saving the filter exists to produce, and buying two deferred
    # assertions back at that price is the trade this phase declines.
    # Booked as `[164.6.3-PLANNING-SUBJECT-DEFERRED-DETECTION]`, owner Phase 164.6
    # GATE-HYGIENE — so the ledger and this comment say the same thing.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth: 0 — the phase-29/30 frozen-spine guards
          # (src/__tests__/phase-{29,30}-frozen-spine-guards.test.ts) resolve
          # their diff baseline via `git merge-base origin/main HEAD` or a
          # fallback branch-point sha. A shallow (depth-1) clone has neither, so
          # the fail-loud guard (CLAUDE.md Rule 12) throws at module load and
          # crashes the whole shard. Full history makes the baseline resolvable
          # (same pattern as the analytics-deploy-verify checkout below).
          fetch-depth: 0
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Cache vitest's transform graph. Vite persists per-file TS/JSX
      # transforms here; on a warm cache the transform step is largely a
      # no-op. Key on lockfile + vitest config + the src/tests trees.
      # vitest.node-env.ts is part of the key because it decides which files
      # run under `environment: "node"` — moving a file between projects
      # changes how it is transformed, so a stale entry would be wrong.
      - name: Cache vitest transform (node_modules/.vite)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'vitest.node-env.ts') }}-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-vitest-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'vitest.node-env.ts') }}-
      # CI speed (2026-07-02): the shards now ALSO emit v8 coverage + a blob
      # report, and the frontend-coverage job merges the blobs and enforces
      # the vitest.config.ts thresholds — deleting the duplicate full-suite
      # coverage run (~8m). Threshold flags are ZEROED here because a lone
      # shard sees only half the files and would spuriously fail the ratchet;
      # the merge job is where the real gate fires (locally proven: shard
      # alone FAILS thresholds, merged run passes at the full-suite numbers).
      # --test-timeout=20000 adopts the old coverage job's contention
      # rationale: v8 coverage adds per-worker load, and the documented
      # worker-contention flake (vitest.config.ts:6-16) turns that into
      # spurious 5s timeouts on a busy runner.
      #
      # DO NOT add NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY env to
      # this job: that would un-skip ~284 live-DB tests (src/lib/test-helpers/
      # live-db.ts), shifting the coverage denominator and invalidating the
      # ratchet baseline (which was measured with those tests skipped).
      - name: Run vitest shard ${{ matrix.shard }}/2 (blob + coverage, thresholds deferred to merge)
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/2
          --reporter=dot --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}-2.json
          --coverage --test-timeout=20000
          --coverage.thresholds.lines=0
          --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
      - name: Upload blob report for coverage merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          # The blob path is named on BOTH sides (`--outputFile.blob` above,
          # `--merge-reports=.vitest-reports` in frontend-coverage) rather than
          # left to vitest's default: vitest 5 moved that default from
          # `.vitest-reports/` to `.vitest/blob/`, and this step found nothing.
          path: .vitest-reports/
          # .vitest-reports is a dot-directory; upload-artifact excludes
          # hidden paths by default (a v4.4+ security change), so without
          # this the step uploads nothing and if-no-files-found fails it.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    # tech-debt #11: coverage is a CI GATE (the vitest.config.ts thresholds,
    # ratcheted a few points under measured actual, fail this job on a real
    # regression).
    #
    # CI speed (2026-07-02): this job no longer RE-RUNS the full suite — the
    # frontend-test shards above emit v8 coverage into blob reports, and this
    # job downloads both blobs and replays them with `--merge-reports
    # --coverage`, which merges coverage across shards and enforces the
    # config thresholds on the FULL-suite numbers. Locally proven equivalent:
    # merged coverage matches the old single-run numbers, a lone shard fails
    # the ratchet (so the gate genuinely fires), and the merged run passes.
    # Same job NAME kept so the `frontend` aggregator's needs/result-check
    # wiring is untouched. No tests execute here → shallow checkout is fine
    # (the frozen-spine guards run in the shards, not in a report replay).
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    # ⭐ The conjunct is EXPLICIT even though this job would inherit the skip through
    # `needs: frontend-test`. An inherited skip is indistinguishable in the run log
    # from the other skip causes the aggregator's `test-db-drift` arm already warns it
    # cannot tell apart; CONTEXT.md requires each job's own classification to be
    # readable, so each filtered job states it for itself.
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    needs:
      - frontend-test
      - changed-paths
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Download shard blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge shard reports + enforce coverage thresholds
        run: npx vitest run --merge-reports=.vitest-reports --coverage

  frontend-seam-redis:
    # Phase 140.2 / SEAMCORE-09 — the seam breaker against a REAL Redis.
    #
    # WHY THIS JOB EXISTS. `src/test/helpers/upstash-breaker.ts` is a
    # FIXED-window double anchored at its first call, with no previous bucket,
    # no weighted carry-over, and it INCREMENTS ON DENIAL. The deployed
    # `@upstash/ratelimit` sliding window is epoch-aligned, carries a weighted
    # count over from the previous bucket, and does NOT increment on denial.
    # `recordSeamFailure()` reads BOTH `success` and `remaining`, so four of the
    # seven properties this phase depends on are unobservable through the
    # double. SRH (serverless-redis-http) speaks Upstash's REST protocol in
    # front of a real Redis, so the UNMODIFIED client executes the REAL Lua.
    #
    # WHY IT IS A SEPARATE JOB AND NOT `services:` BOLTED ONTO frontend-test.
    # See the inverted warning below — this is the same hazard frontend-test
    # documents for the Supabase vars, in the opposite direction.
    #
    # NO SECRETS AND NO REPO VARIABLE are referenced anywhere in this job, on
    # purpose. That is what lets it run identically on a fork PR, which in turn
    # is what lets the aggregator treat ANY non-success (including `skipped`) as
    # a failure with no tolerance arm — see the `frontend:` result loop.
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    # ⚠️ The paragraph above says a `skipped` here is judged with NO tolerance arm.
    # That still holds: a skip caused by this `if:` is judged by the aggregator's ONE
    # uniform docs-only arm, not by an arm of this row's own. What changed is when the
    # job is invoked, which is a different claim from what a `skipped` means when it is.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    services:
      # BOTH images pinned by sha256 DIGEST, never by tag (threats
      # T-140.2-01-01 / -02): a mutable tag on a third-party image is an
      # unreviewed input to a required gate. These are the multi-arch INDEX
      # digests and MUST stay identical to docker-compose.redis-test.yml.
      redis:
        # redis:7-alpine (Docker Official Image)
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      srh:
        # hiett/serverless-redis-http:latest — a SINGLE-MAINTAINER community
        # image, so the digest pin is the control that matters here.
        image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-seam-breaker-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
        ports:
          - 8079:80
    env:
      # Deliberately set JOB-WIDE, which is the exact INVERSE of the
      # frontend-test warning ("DO NOT add NEXT_PUBLIC_SUPABASE_URL /
      # SUPABASE_SERVICE_ROLE_KEY env to this job"). It is safe HERE and only
      # here because this job runs `tests/redis/**` and nothing else:
      # `resilient-fetch.ts` builds its Upstash client at MODULE SCOPE from
      # these two vars, and ~20 files in the MAIN suite DELETE them to exercise
      # the core's unconfigured path. Setting them on the shards would silently
      # rewrite those tests' meaning. Never widen this job's test selection.
      #
      # SRH_TOKEN/UPSTASH_REDIS_REST_TOKEN is a FIXED NON-SECRET literal for an
      # ephemeral job-local container holding only test keys (threat
      # T-140.2-01-03, accepted). Making it a repository secret would make the
      # job skip on fork PRs — the precise silent-green this lane exists to end.
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-seam-breaker-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No fetch-depth: 0 — the phase-29/30 frozen-spine guards resolve a
          # merge-base and run in the SHARDS, not here.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Preflight - the lane must have a non-empty test corpus
        # A green job that ran nothing is the exact silent-green this whole
        # phase exists to eliminate, so an empty glob is an ERROR, never a quiet
        # pass. (F11: this comment used to say it was "copied in shape from
        # sql-tests" — that was FALSE at the time it was written. sql-tests' own
        # empty-corpus check printed a ::warning:: and `exit 0`, i.e. the
        # opposite shape, so this comment described a check that did not exist
        # in the file it named. F11 made that one fatal too; the two agree now.)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/redis/*.test.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No tests/redis/*.test.ts files found — the seam real-Redis lane has no corpus. This job must never pass vacuously."
            exit 1
          fi
          echo "Lane corpus: ${#files[@]} file(s)"
          printf '  - %s\n' "${files[@]}"
      - name: Preflight - the Upstash-compatible store must be reachable
        # SRH boots alongside redis with no dependency ordering available to
        # `services:`, so poll it. Fail LOUD rather than letting vitest report
        # a confusing module-load error.
        run: |
          set -euo pipefail
          n=0
          until curl -fsS -X POST "$UPSTASH_REDIS_REST_URL" \
              -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
              -H "Content-Type: application/json" \
              -d '["PING"]' | grep -q PONG; do
            n=$((n+1))
            if [ "$n" -ge 30 ]; then
              echo "::error::SRH did not become reachable at $UPSTASH_REDIS_REST_URL after $n attempts."
              exit 1
            fi
            sleep 2
          done
          echo "Store reachable after $n retry/retries."
      - name: Run the seam breaker real-Redis lane
        # NO --coverage, deliberately. `frontend-coverage` merges the two
        # frontend-test shards' blob reports and enforces the ratchet on the
        # merged numbers; a third blob from this lane would shift the
        # denominator and invalidate the baseline.
        run: npx vitest run --config vitest.redis.config.ts --reporter=dot

  frontend-local-stack:
    # Rationale: docs/ci-yml-notes.md#frontend-local-stack-1
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `packages: read` is for the ghcr.io login step (164.4.2-08). A job-level
    # block REPLACES the workflow-level one, so the workflow's scopes are
    # restated here unchanged - nothing but `packages: read` is added.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # 📜 LINEAGE (Phase 164.4.2 plan 03): this checkout used to fetch FULL
          # HISTORY (`fetch-depth: 0`), because the lane's currency guard then
          # compared `git log -1 --format=%ct` for the dump and the migrations
          # directory, and on a shallow clone both report the one fetched commit's
          # time, compare equal, and the guard measures nothing.
          # ⛔ CORRECTED 2026-09-23 (Phase 164.4.2 plan 08, D-F): the lane no longer
          # runs that comparison. Its gate (`check-baseline-currency.mjs
          # --replay-set`) reads the committed carried-migrations marker, the dump's
          # sha256 and the migrations directory ON DISK. MEASURED per job: no step
          # here runs `git`, and none of the scripts or lane spec files it runs
          # spawns one. So the default shallow clone is enough, and full history was
          # dropped. `local-stack-lane-wiring.test.ts` pins that the lane's gate reads
          # no git history, which is what keeps a shallow clone safe here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Baseline currency - name the migrations the lane replays on top of the dump
        # The same `check_baseline_currency` call `run.sh up` makes inside
        # `load_baseline()`, run on its own through the lane's `--check-currency`
        # seam. Since DECISION F (Phase 164.4.2 plan 06) the lane does not reject a
        # dump that predates the newest migration: it determines the REPLAY SET from
        # the committed marker `supabase/schema/baseline-carried-migrations.txt`
        # (bound to the dump's sha256), prints it on a `baseline-replay:` line, and
        # `run.sh up` replays exactly those migrations after the dump. It FAILS LOUD
        # when the set cannot be determined (marker absent, unreadable or bound to
        # another dump; a dump carrying a migration this checkout lacks), and `up`
        # fails loud when a replayed migration errors.
        # Two reasons it is a separate step rather than left implicit in `up`: the
        # replay set gets its own named line in this job's log BEFORE any container
        # starts, and an edit that drops the call out of `load_baseline()` fails
        # HERE instead of booting quietly. Needs node only — no stack, no
        # node_modules, no git history — so it runs before either is paid for.
        run: bash scripts/local-stack/run.sh --check-currency
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        with:
          # ⚠️ SKEW, STATED RATHER THAN HIDDEN. This is the SAME pin every other
          # workflow here uses (migration-drift-check, supabase-migrate and
          # migration-policy among them), so the repo keeps ONE answer to "which
          # CLI". ⛔ A FOURTH workflow carries the same pin and is deliberately NOT
          # NAMED HERE — not even in prose, and neither is the spec that forbids it.
          # Phase 164.1 / D-18 requires that THIS FILE hold no reference to that
          # workflow, so that a red production probe can never block a deploy, and the
          # spec enforcing it is a plain SUBSTRING match over ci.yml: a mention inside
          # a YAML comment reddens it exactly as a real `needs:` edge would. MEASURED
          # 2026-09-07 — an earlier draft of this very comment listed it among the
          # workflows sharing the pin and turned that spec RED.
          # The developer-box boot the timeout above is derived from used
          # 2.84.2; whether 2.98.2 starts this stack and loads this dump is
          # UNMEASURED, and an unmeasured thing is not a passing thing. If this job's
          # first run dies inside `supabase start`, that is the live hypothesis.
          version: 2.98.2
      - name: Log in to ghcr.io before the CLI pulls its images
        # 164.4.2-08 checkpoint RED -> fix (2026-09-23). `supabase/setup-cli` exports
        # SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io, so every image `run.sh up`'s
        # `supabase start` pulls comes from ghcr.io, and anonymous GHCR pulls from
        # shared runners are throttled: run 35911761613 lost this job, `sql-tests` and
        # `frontend-live-db-lane` to `toomanyrequests` at the boot step. The CLI reads
        # its registry credentials from the docker config file (`GetRegistryAuth`,
        # CLI 2.98.2), so this plain `docker login` is what authenticates the pull.
        # WHY `docker login` AND NOT `docker/login-action`: no third-party action is
        # handed the token (the C-0293 concern at the top of this file), and there is
        # no new pin to keep current. The token goes in over stdin and is never printed.
        # A FAILED LOGIN FAILS THE JOB. It is never `continue-on-error` and never
        # swallowed: a swallowed failure degrades into the anonymous pull this step
        # exists to prevent, and trades a named red here for an intermittent
        # throttle-shaped red at the boot step. On a fork PR the token is read-only,
        # which still reads public packages, so a fork has no reason to fail here; if
        # one ever does, the red names the cause.
        # `src/__tests__/contracts/ghcr-login-before-image-pull.contract.test.ts` pins
        # this step's presence, position and shape, and the job's `packages: read`.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # `scripts/local-stack/run.sh` loads the committed baseline through `psql`,
      # and `resolve_psql`'s ONLY fallback is /opt/homebrew/opt/postgresql@16 — a
      # macOS keg that does not exist on this runner. A miss is not a skip: it is
      # `FATAL: psql not found ...` and exit 1, on a job that is aggregator-BLOCKING
      # from its first ever run. `sql-tests` in this same file installs the client
      # explicitly for the same reason (see its "Install psql client" step).
      # ⚠️ HONEST BOUND: this is insurance, not a measured absence — no ubuntu run
      # of this job exists yet, so whether the image already ships `psql` is
      # UNVERIFIED. ~10s to remove one of the two unmeasured terms in the job's own
      # timeout note; if the first green run proves the image ships it, drop this
      # step on that evidence rather than on assumption.
      - name: Install psql client (the lane loads the baseline through it)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          bash scripts/ci-apt.sh install --provides psql postgresql-client
          psql --version
      - name: Preflight - the lane must have a non-empty test corpus
        # A green job that ran nothing is the silent-green this lane exists to
        # eliminate. `passWithNoTests: false` in the config is the second control;
        # this one fails EARLIER and prints what would have run. It only COLLECTS —
        # no stack is needed, and none is running yet at this point.
        run: |
          set -euo pipefail
          npx vitest list --config vitest.local-stack.config.ts | tee /tmp/lane-corpus.txt
          if [ ! -s /tmp/lane-corpus.txt ]; then
            echo "::error::vitest collected NO tests from vitest.local-stack.config.ts — the local-stack lane has no corpus. This job must never pass vacuously."
            exit 1
          fi
      - name: Boot the local-stack lane (Supabase CLI stack + committed baseline)
        # ⭐ FIRST AND ONLY CONSUMER of `scripts/local-stack/.stack-env` — the mode-600
        # env handoff `run.sh up` writes (API_URL / ANON_KEY / SERVICE_ROLE_KEY / …).
        # Nothing else in the tree reads it; the lane spec is what made it a seam
        # rather than a promise. (⚠️ No longer true as written: `frontend-live-db-lane`,
        # the capability probe below and `sql-tests`'s corpus step read it too. The
        # "first" stands; the "only" is lineage.) `up` asserts the stack reported a 127.0.0.1/localhost
        # API URL and refuses otherwise, and the spec re-asserts it independently.
        run: bash scripts/local-stack/run.sh up
      - name: Capability probe - does the lane supply what the SQL self-test corpus demands
        # Rationale: docs/ci-yml-notes.md#frontend-local-stack-2
        env:
          PROBE_LOG: ${{ runner.temp }}/capability-probe.log
        run: |
          set -euo pipefail
          set +e
          node scripts/local-stack/capability-probe.mjs > "$PROBE_LOG" 2>&1
          status=$?
          set -e
          cat "$PROBE_LOG"
          # `|| true` is LOAD-BEARING under `set -euo pipefail`, not tidiness. grep
          # exits 1 on an absent line, which would abort the step with no ::error::
          # and leave the named MEASURE_FAIL below unreachable.
          probe_line=$(grep -a -m1 -E '^stack-probe: ' "$PROBE_LOG" || true)
          if [ -z "$probe_line" ]; then
            echo "::error::MEASURE_FAIL: the capability probe printed NO 'stack-probe:' line (exit ${status}), so what this lane supplies against what the SQL self-test corpus demands is unknown. An absent line is never a zero and never a pass."
            exit 1
          fi
          verdict=$(echo "$probe_line" | sed -n -E 's/^stack-probe: .* verdict ([A-Z_]+)$/\1/p')
          case "$verdict" in
            SUFFICIENT) expected_status=0 ;;
            INSUFFICIENT) expected_status=2 ;;
            MEASURE_FAIL)
              echo "::error::MEASURE_FAIL: the capability probe could not measure the lane or the corpus (exit ${status}). Its ::error:: lines above name the cause. Unknown is not absent and it is not present."
              exit 1 ;;
            *)
              echo "::error::MEASURE_FAIL: could not read a verdict out of '${probe_line}'."
              exit 1 ;;
          esac
          if [ "$status" -ne "$expected_status" ]; then
            echo "::error::MEASURE_FAIL: the probe printed 'verdict ${verdict}' but exited ${status} (expected ${expected_status}). The line and the status come from one run and cannot disagree; a claim its own exit status contradicts is not a measurement."
            exit 1
          fi
          # Every token must read, or the line is not a measurement. The class list
          # is NOT restated here: the probe owns it, so a class added there needs
          # no edit here.
          read -r -a probe_tokens <<< "${probe_line#stack-probe: }"
          classes=0
          for tok in "${probe_tokens[@]}"; do
            case "$tok" in
              verdict|SUFFICIENT|INSUFFICIENT) ;;
              corpus=*|lane-only-excluded=*)
                case "${tok#*=}" in ''|*[!0-9]*)
                  echo "::error::MEASURE_FAIL: unreadable count '${tok}' on '${probe_line}'."; exit 1 ;; esac ;;
              *=*/*)
                classes=$((classes + 1))
                demand="${tok#*=}"; demand="${demand%%/*}"; state="${tok##*/}"
                case "$demand" in ''|*[!0-9]*)
                  echo "::error::MEASURE_FAIL: unreadable demand in '${tok}' on '${probe_line}'."; exit 1 ;; esac
                case "$state" in present|absent) ;; *)
                  echo "::error::MEASURE_FAIL: unreadable supply state in '${tok}' on '${probe_line}'."; exit 1 ;; esac ;;
              *)
                echo "::error::MEASURE_FAIL: unrecognised token '${tok}' on '${probe_line}'."; exit 1 ;;
            esac
          done
          if [ "$classes" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the 'stack-probe:' line names NO capability class, so nothing was compared."
            exit 1
          fi
          if [ "$verdict" = "INSUFFICIENT" ]; then
            echo "::warning::stack-probe verdict INSUFFICIENT: this lane lacks a capability the SQL self-test corpus demands (named on the 'unsatisfied:' lines above). Not fatal in THIS job, whose own specs do not consume these capabilities; the sql-tests job runs the same probe FATAL before its corpus and will fail on the same verdict."
          fi
          echo "stack-probe measured: ${classes} class(es), verdict ${verdict}"
      - name: Run the local-stack lane
        # NO --coverage, deliberately. `frontend-coverage` merges the two
        # frontend-test shards' blob reports and enforces the ratchet on the merged
        # numbers; a third blob from this lane would shift the denominator and
        # invalidate the baseline. (Same rule as `frontend-seam-redis`.)
        run: npm run test:local-stack
      - name: Tear down the lane (and PROVE nothing survived)
        # `if: always()`: `run.sh up` leaves the stack running on success by design, so
        # a failed spec would otherwise orphan 13 containers. `--assert-teardown` is
        # the control that MEASURE_FAILs rather than passing when `docker ps` cannot
        # answer — "could not count" is not "counted zero".
        if: always()
        run: |
          set -euo pipefail
          bash scripts/local-stack/run.sh down
          bash scripts/local-stack/run.sh --assert-teardown

  frontend-live-db-lane:
    # Rationale: docs/ci-yml-notes.md#frontend-live-db-lane-1
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `packages: read` is for the ghcr.io login step (164.4.2-08). A job-level
    # block REPLACES the workflow-level one, so the workflow's scopes are
    # restated here unchanged - nothing but `packages: read` is added.
    permissions:
      contents: read
      packages: read
