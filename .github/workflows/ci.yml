          # for the same reason as `frontend-local-stack`'s checkout:
          # `run.sh up` now runs the baseline currency guard inside `load_baseline()`,
          # and on a shallow clone `git log -1 --format=%ct` reports the one fetched
          # commit's time for BOTH paths, so the guard compares two identical
          # timestamps and passes having measured nothing. The explicit
          # `--check-currency` step lives in `frontend-local-stack` only — one owner
          # for that assertion, not two copies to keep identical.
          # ⛔ CORRECTED 2026-09-23 (Phase 164.4.2 plan 08, D-F) — BOTH halves of that
          # comment are superseded. (1) The guard no longer reads git: its
          # `--replay-set` mode reads the committed marker, the dump's sha256 and the
          # migrations directory on disk, and no step or script this job runs spawns
          # `git` (measured), so full history was dropped. (2) This job now runs its
          # OWN `--check-currency` step, below. "One owner" argued from a REFUSAL — a
          # single verdict that one job could own. Under D-F the step NAMES the
          # migrations THIS job's lane is about to replay on top of the dump, which is
          # a per-job printout: a reader of this job's log should not have to open
          # another job to learn what schema its 49 specs ran against.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Baseline currency - name the migrations the lane replays on top of the dump
        # Phase 164.4.2 plan 08 (D-F). The SAME `--check-currency` seam
        # `frontend-local-stack` runs, and the same function `load_baseline()` calls
        # inside `run.sh up`. It determines the replay set from the committed marker
        # `supabase/schema/baseline-carried-migrations.txt` (bound to the dump's
        # sha256) and prints it on a `baseline-replay:` line, so this job's own log
        # names the migrations its lane replays after the dump, before any container
        # starts. It FAILS LOUD when the set cannot be determined; a replayed
        # migration that errors fails the boot step below. Placed after node_modules
        # only by order of the job's preamble — the seam itself runs `node` with
        # built-ins and needs neither node_modules nor git history.
        run: bash scripts/local-stack/run.sh --check-currency
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        with:
          # The SAME pin `frontend-local-stack` uses, so this file keeps ONE answer to
          # "which CLI". ⛔ The fourth workflow that shares this pin is deliberately
          # NOT named here, not even in prose: Phase 164.1 / D-18 requires this file to
          # hold no reference to it so that a red production probe can never block a
          # deploy, and the spec enforcing that is a plain SUBSTRING match over this
          # file — a mention inside a YAML comment reddens it exactly as a real
          # `needs:` edge would.
          version: 2.98.2
      - name: Log in to ghcr.io before the CLI pulls its images
        # 164.4.2-08 checkpoint RED -> fix (2026-09-23). `run.sh up` below runs
        # `supabase start`, which pulls the stack images.
        # Same step and same reasons as ci.yml's `frontend-local-stack` login: the CLI
        # pulls from ghcr.io (setup-cli sets SUPABASE_INTERNAL_IMAGE_REGISTRY), anonymous
        # GHCR pulls from shared runners are throttled, and the CLI reads credentials
        # from the docker config this writes. A failed login FAILS THE JOB - it never
        # degrades into the anonymous pull. Pinned by
        # `src/__tests__/contracts/ghcr-login-before-image-pull.contract.test.ts`.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Install psql client (the lane loads the baseline through it)
        timeout-minutes: 8
        # Same reason as `frontend-local-stack`: `run.sh` loads the committed baseline
        # through `psql`, and `resolve_psql`'s only fallback is a macOS keg that does
        # not exist on this runner. A miss is `FATAL: psql not found` and exit 1, not
        # a skip.
        run: |
          set -euo pipefail
          bash scripts/ci-apt.sh install --provides psql postgresql-client
          psql --version
      - name: Preflight - the lane must have a non-empty derived corpus
        # A green job that ran nothing is the silent-green this lane exists to
        # eliminate, so this fails EARLIER than vitest would and prints what would
        # have run. It needs no stack: the corpus tool only walks the source tree.
        # The tool ALSO exits non-zero on an empty corpus by itself, and
        # `passWithNoTests: false` in the lane config is the third control — three
        # independent places, because this is the failure mode that reads as success.
        run: |
          set -euo pipefail
          node scripts/live-db-lane-corpus.mjs | tee /tmp/live-db-lane-corpus.txt
          # ⛔ `grep -c` EXITS 1 ON A ZERO COUNT, so the count needs `|| true` to
          # survive the legitimate zero — but `|| true` ALSO swallows the case
          # where grep printed NOTHING at all (file absent or unreadable). That
          # leaves `files` EMPTY, and `[ "" -eq 0 ]` is a bash syntax error
          # (`integer expression expected`, status 2) which, inside an `if`
          # CONDITION, does not trip `set -e` — control falls through to the
          # success path and "could not count" passes as "counted zero". That is
          # the [164.8.2-VAC08-FATAL-ON-TRANSIENT] shape, in the very step whose
          # comment above says a green job that ran nothing must be impossible.
          # So: capture the status, and REFUSE a non-numeric answer by name
          # rather than restoring a fallback.
          rc=0
          files=$(grep -c '\.test\.tsx\?$' /tmp/live-db-lane-corpus.txt) || rc=$?
          case "${files}" in
            ''|*[!0-9]*)
              echo "::error::could not COUNT the derived live-DB corpus (grep exited ${rc}, answer '${files}'). Unmeasured is not zero, and it is not a pass either."
              exit 1
              ;;
          esac
          if [ "$files" -eq 0 ]; then
            echo "::error::The derived live-DB corpus is EMPTY — this job must never pass vacuously."
            exit 1
          fi
          echo "Lane corpus: ${files} file(s)"
      - name: Boot the local-stack lane (Supabase CLI stack + committed baseline)
        # `up` loads the committed dump, then replays the migrations the currency
        # step above named (printing the set again in this step's log, and a
        # `replay complete:` line once every one applied), and fails loud on the
        # first replayed migration that errors.
        # ⛔ Through `run.sh` ONLY — never a bare CLI invocation. `up` asserts the
        # stack reported a 127.0.0.1/localhost API URL and refuses otherwise, the lane
        # re-asserts it independently in `vitest.livedb.globalsetup.ts`, and that same
        # setup refuses outright if the runner's resolved workdir is this repository's
        # own Supabase context.
        run: bash scripts/local-stack/run.sh up
      - name: The execution-ledger gate must be able to FAIL (self-test first)
        # Same discipline as `sql-gate-lint`: the gate proves it can go red before
        # anyone is asked to trust it going green. Ten cases, a red and a green for
        # each direction of the comparison plus the anti-vacuity guards. Needs no
        # stack — it drives the comparison over fixtures.
        run: node scripts/live-db-execution-ledger.mjs --self-test
      - name: Run the live-DB lane under its EXECUTION LEDGER
        # Phase 164.9, the ledger round arising from plan 08 and its fix round.
        #
        # ⭐ THE INNER RUN IS STILL `npm run test:live-db`, BYTE-IDENTICAL TO WHAT A
        # DEVELOPER RUNS — `scripts/live-db-execution-ledger.mjs` spawns exactly that
        # command with no added flag and no altered selection, streams its output,
        # and then reads the artifact the lane's own reporter wrote. Every test in the
        # 49-file corpus still EXECUTES; the gate prints the executed count and
        # REFUSES a run that executed nothing.
        #
        # WHAT THE GATE DECIDES. GREEN iff the failing set is EXACTLY
        # `scripts/live-db-execution-ledger.txt`. RED in BOTH directions: an arm that
        # fails and is not listed, or a listed arm that has stopped failing. The
        # ledger is DATED and SHRINK-ONLY; its header states the founder decision
        # that seeded it and the rule for ever adding to it.
        #
        # ⛔ THIS IS NOT A TOLERANCE ARM AND NOT A `|| true`. There is no path through
        # that script that exits 0 on an unexpected failure, the row stays BLOCKING in
        # the `frontend` aggregator's STRICT default arm, and the aggregator wiring was
        # not touched. The alternative — making this row advisory — is a forbidden
        # closure, which is why it was refused.
        #
        # ⛔ No reporting flag of the merged-ratchet kind, unchanged: `frontend-coverage`
        # merges the two `frontend-test` shards' blob reports and enforces the ratchet
        # on the merged numbers, and a third COVERAGE blob from this lane would shift
        # the denominator and invalidate the baseline. The lane's reporter emits no
        # coverage of any kind. (Same rule as `frontend-seam-redis` and
        # `frontend-local-stack`.)
        run: npm run test:live-db:ledger
      - name: Tear down the lane (and PROVE nothing survived)
        # `if: always()`: `run.sh up` leaves the stack running on success by design, so
        # a failed spec would otherwise orphan its containers. `--assert-teardown` is
        # the control that MEASURE_FAILs rather than passing when `docker ps` cannot
        # answer — "could not count" is not "counted zero".
        if: always()
        run: |
          set -euo pipefail
          bash scripts/local-stack/run.sh down
          bash scripts/local-stack/run.sh --assert-teardown

  frontend-policy:
    # Banned-package check + GDPR export coverage. PR-C moved npm audit
    # to the nightly workflow because (a) it's a security signal, not a
    # per-PR functional gate, (b) Dependabot/Snyk already cover the
    # critical-severity surface continuously, and (c) keeping it on the
    # per-PR critical path adds 15-30s with no behavior signal.
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Check for banned packages (supply-chain)
        run: node scripts/check-banned-packages.mjs
      # Phase 20 / T16 — the recording MT5 EA is READ-ONLY by CI invariant.
      # An EA with account access is a Tampering/Elevation risk, so we FAIL the
      # build on ANY trade-mutation token in tools/mt5 source. This is the M4
      # red-team HARDENING of the original denylist, which scanned only top-level
      # *.mq5 and missed the two most common ways an MQL5 EA actually places a
      # trade. The check now covers, scanning BOTH *.mq5 AND included *.mqh
      # headers RECURSIVELY (grep -r descends subdirs):
      #   - the low-level / declaration surface:
      #       OrderSend, OrderSendAsync, OrderModify, OrderDelete,
      #       PositionClose, PositionModify, the CTrade class, and `trade.`
      #   - the CTrade METHOD-CALL surface (a CTrade instance named ANYTHING,
      #     not just `trade`, calling): .Buy( .Sell( .BuyStop( .SellStop(
      #       .BuyLimit( .SellLimit( .PositionOpen( .PositionClose(
      #       .PositionClosePartial( .PositionReverse( .OrderOpen(
      # Pure grep, like the banned-packages step — NO new dependency.
      #
      # KNOWN RESIDUAL LIMIT (documented, not defeated): grep is line-literal, so
      # a token inside a COMMENT (e.g. `// OrderSend disabled`) trips a SAFE-SIDE
      # false positive, and deliberate in-comment whitespace/identifier evasion is
      # not caught by a static grep. That residual is accepted: the manual T14
      # demo-reconcile is the runtime backstop, and a false positive merely forces
      # a human to confirm the EA is read-only (fail-safe direction).
      - name: MT5 EA read-only static check
        run: |
          # Low-level / declaration surface + CTrade method-call surface.
          DENY_LOWLEVEL='OrderSend|OrderSendAsync|OrderModify|OrderDelete|CTrade|PositionClose|PositionModify|trade\.'
          DENY_METHODS='\.(Buy|Sell|BuyStop|SellStop|BuyLimit|SellLimit|PositionOpen|PositionClose|PositionClosePartial|PositionReverse|OrderOpen)[[:space:]]*\('

          if [ ! -d tools/mt5 ]; then
            echo "MT5 EA static check: tools/mt5 absent — nothing to scan."
            exit 0
          fi

          # grep -r exits 1 on no-match; under the runner's `set -e` that would
          # abort the step at the assignment, so we neutralize it with `|| true`
          # and derive the verdict from whether any line was captured — NOT from
          # grep's own exit code (a no-match must be a PASS, only a positive
          # denylist match is a FAIL). `grep -rnE` reports file:line for the log.
          MATCHES=$(grep -rnE --include='*.mq5' --include='*.mqh' \
            -e "$DENY_LOWLEVEL" -e "$DENY_METHODS" tools/mt5 || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::MT5 EA must be read-only (no order/trade mutation API). Forbidden token(s) found in tools/mt5:"
            echo "$MATCHES"
            exit 1
          fi
          echo "MT5 EA static check: clean (0 trade-mutation tokens in tools/mt5/**/*.{mq5,mqh})."
      - name: Check GDPR export coverage (Task 7.3)
        run: npx tsx scripts/check-gdpr-export-coverage.ts

  knip:
    # tech-debt #13: non-blocking dead-code report. knip.json declares the
    # real entry points (supabase edge functions, manually-run scripts) so
    # the signal is genuine, not framework false-positives. Scoped to
    # files+dependencies — the actionable, low-false-positive issue types
    # (unused exports/types are noisier and deferred). NON-BLOCKING by design:
    # this job is intentionally NOT in the `frontend` aggregator's `needs:`, so
    # it never gates a merge; it surfaces NEW unused files/deps in the run
    # summary so the dead-code drift this finding cleaned up cannot silently
    # re-accumulate. Promote to a gate once the exports/types baseline is zero.
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    # `knip` is deliberately NOT an aggregator row (see the header), so nothing judges
    # its skip either way; the saving here is pure runner time.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: knip dead-code report (non-blocking)
        run: |
          # `|| true` keeps this step (and the job) green regardless of
          # findings — this is a REPORT, not a gate (tech-debt #13, the
          # user-chosen non-blocking posture). knip exits non-zero when it
          # finds issues and the runner shell has pipefail on, so we capture
          # to a file and derive the summary from its contents, not the code.
          npx knip --include files,dependencies --reporter compact > knip.out 2>&1 || true
          if [ -s knip.out ]; then
            {
              echo "## knip — unused files / dependencies (non-blocking)"
              echo ""
              echo '```'
              cat knip.out
              echo '```'
              echo ""
              echo "tech-debt #13: declare the real entry point in knip.json, or delete the dead code."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::knip found unused files/dependencies — see the job summary (non-blocking)."
          else
            echo "## knip ✅ no unused files or dependencies" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend-build:
    # The build is the longest single step. It runs in parallel with the
    # other frontend-* jobs (above) and uploads the .next + public output
    # as an artifact so the e2e job can download instead of rebuilding —
    # eliminating the duplicate ~60-120s build that used to live in e2e.
    #
    # C-0293(c) artifact-leak fix: this job builds with PLACEHOLDER
    # NEXT_PUBLIC_SUPABASE_* env values UNCONDITIONALLY (no longer the
    # seed-aware ternary). The previous behavior baked the real
    # TEST_SUPABASE_URL + TEST_SUPABASE_ANON_KEY into the client bundles
    # in `.next/**` whenever vars.E2E_TEST_DB_CONFIGURED was true, then
    # uploaded that artifact (where any third-party action in the same
    # workflow run has `actions: read` and could grep for inlined creds).
    # The seed-gated e2e specs now rebuild locally inside the e2e job
    # with the real env, and that rebuilt `.next/` stays on the runner
    # FS — it is never uploaded as an artifact.
    # Phase 164.6.3 / CI-DOCSPATH-01 — docs-only path filter: this changes WHEN
    # this job is invoked (not on a `.planning/`-only PR), never WHAT it asserts.
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Cache .next/cache (Next.js incremental webpack/Turbopack output) keyed
      # on every input that changes how the bundle compiles: lockfile,
      # next.config, tailwind/postcss config, tsconfig, and the full src
      # tree (any extension). The wide src glob catches CSS, MDX, JSON,
      # locale files etc. that a `.ts/.tsx` glob would silently miss —
      # missing them means a config change ships against a stale cache.
      # restore-keys ladder is intentionally short: only fall back to a
      # lockfile-matched cache, never to a "different lockfile" prefix
      # (cross-Next-version cache restore is a known hazard).
      - name: Cache .next/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}-
      # C-0293(c): build with PLACEHOLDERS unconditionally. The previous
      # seed-aware ternary leaked test-DB credentials into the uploaded
      # artifact (see the security comment on this job header above).
      # The seed-gated e2e specs rebuild locally with the real env in
      # the e2e job, and that rebuilt `.next/` is never uploaded.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role
          ADMIN_EMAIL: test@example.com
          PLATFORM_NAME: Quantalyze
          PLATFORM_EMAIL: test@example.com
          # Phase 164 / D-02: `src/lib/strategy-share-token.ts` validates this
          # at MODULE SCOPE and throws when absent — deliberately, so a
          # misconfigured deploy fails loudly instead of at the founder's first
          # Copy Link. Any build-time evaluation of a share surface therefore
          # needs a value here. Obviously fake and >= the 32-char floor.
          SHARE_TOKEN_SECRET: placeholder_share_token_secret_not_a_real_secret
      # Upload the build output for the e2e job to download. Exclude
      # .next/cache (the actions/cache above already persists it across
      # runs; including it here would inflate every per-run artifact by
      # 100MB+ for no e2e benefit). upload-artifact@v4 negative globs
      # only exclude entries that actually match the negative pattern,
      # so the directory match must use `/**` to recurse — `!.next/cache`
      # alone only excludes the directory entry, not its contents.
      - name: Upload .next + public artifact for e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nextjs-build
          path: |
            .next/**
            !.next/cache/**
            public/**
          retention-days: 1
          if-no-files-found: error
          # Critical: upload-artifact@v4 defaults `include-hidden-files: false`,
          # which excludes any path starting with `.` — `.next` is dotfile-
          # prefixed so the action silently uploaded only `public/**` (6 files,
          # 60KB total) when this was missing. The e2e job's `next start` then
          # crashed with "Could not find a production build in the '.next'
          # directory" because the artifact carried no .next at all.
          include-hidden-files: true

  sql-gate-lint:
    # Rationale: docs/ci-yml-notes.md#sql-gate-lint-1
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Rule self-test - every rule fires on its red fixture
        # Runs BEFORE the corpus scan on purpose. A corpus scan that reports
        # "0 findings" tells you nothing unless the rules can still fire; this
        # step is what distinguishes a clean corpus from a defanged linter.
        # No node_modules needed — the script has zero dependencies.
        run: node scripts/lint-sql-gates.mjs --self-test
      - name: Lint SQL gate files for the measured vacuity shapes
        # Mode identity (164.3-RESEARCH Pitfall 2): this is the EXACT command a
        # developer runs locally, pasted verbatim from the script's header. No
        # wrapper, no flags, no npm alias — wrapping a run changes its result,
        # and a CI-only invocation mode is a different program.
        run: node scripts/lint-sql-gates.mjs
      # ── Phase 164.7, criterion 1: the app-GUC reader gate ──────────────────
      # A SIBLING script, not an eighth rule of lint-sql-gates: that linter runs
      # every rule on maskSql() output, which blanks comments AND string-literal
      # contents — after masking an app-GUC read is invisible, and decision D-05
      # requires this gate to COUNT comments. Same hermetic contract, same mode
      # identity (these two lines are the EXACT commands a developer runs).
      # ⚠️ DATED 2026-09-07, and CLOSED the same day. The corpus step below was
      # EXPECTED RED between plan 164.7-01's commit and plan 164.7-05's
      # annotation commit — 12 findings across 5 files, per-file 1/5/4/1/1, the
      # measured interim census. That interval is OVER: plan 05 annotated all
      # five files and filled LINEAGE_ALLOWLIST in the same commit, and the step
      # now prints `app-guc: findings 0` with the five files named.
      # ⛔ From here a RED corpus step is a REGRESSION, not the interim. It is
      # never to be cleared by widening LINEAGE_ALLOWLIST or relaxing DETECT_RE:
      # the exemption takes a dated header AND an agreeing, count-pinned
      # allowlist entry, and `src/__tests__/lint-app-guc.test.ts` re-measures
      # every one of those counts against the real files' bytes.
      - name: App-GUC gate self-test - every finding kind fires on its red fixture
        run: node scripts/lint-app-guc.mjs --self-test
      - name: App-GUC gate - zero unannotated app-GUC reads in supabase/migrations
        run: node scripts/lint-app-guc.mjs
      # Rationale: docs/ci-yml-notes.md#sql-gate-lint-2
      - name: Baseline content-drift gate self-test - every finding kind fires on a synthetic corpus
        # Runs BEFORE the corpus scan, for the same reason the two self-tests
        # above do: a corpus scan reporting "findings 0" tells you nothing
        # unless the rules can still fire.
        run: node scripts/baseline-content-drift-check.mjs --self-test
      - name: Baseline content-drift gate - committed baseline.sql agrees with the migration chain
        run: node scripts/baseline-content-drift-check.mjs

      # [CR-02] `prod-body-drift-check.sh --self-test` was invoked by NOTHING —
      # eight hermetic arms, the only control that can tell a working DRIFT-05
      # gate (b) from a defanged one, while the script's own header at :144 says
      # "CI pastes these lines VERBATIM". Every sibling self-test in this repo is
      # wired (lint-sql-gates, lint-app-guc, baseline-content-drift, mutation
      # runner, verify-plan-anchors, check-baseline-staleness, dump-sql-functions,
      # and the production prober); this one was the exception. ⛔ THE PROBER IS
      # DELIBERATELY NOT NAMED HERE, not even in prose, and neither is its spec's
      # path. `src/__tests__/` carries a D-18 invariant asserting this file holds
      # NO reference to that tool, so a red prober can never block a deploy — and
      # it is a raw substring check, so a COMMENT trips it exactly like a step
      # would. MEASURED 2026-09-08: naming it once, in this very comment, cost a
      # full-suite red that no file-scoped run could surface.
      # ⚠️ THIS IS A RECURRENCE: the
      # comment at ~:1443 in this same file records the identical defect being
      # found and fixed for another gate.
      #
      # It belongs HERE rather than in migration-drift-check.yml, where gate (b)'s
      # real `--baseline-live` leg runs, because the self-test is HERMETIC — it
      # drives the arms with stub commands and needs no credential — so it must
      # run on every PR, not only on the migration PRs that trigger that workflow.
      # A gate whose control only runs when the gate itself runs cannot catch a
      # commit that defangs it.
      - name: DRIFT-05 gate (b) self-test - all eight arms fire with stub commands, no credential
        run: bash scripts/prod-body-drift-check.sh --self-test

      # [164.8.4] WR-01 - A RECURRENCE OF THE [CR-02] DEFECT DIRECTLY ABOVE.
      # `derive-restore-channels.sh --self-check` was invoked by NOTHING. It is
      # the only control proving the channel derivation stays default-DENY: that
      # a diagnostic target is derived AND that a non-diagnostic extension is
      # excluded. The restore workflow stages what this script derives, so a
      # derivation that silently widened would publish a file nobody reviewed.
      # Hermetic - synthetic targets only, no credential - so like its sibling
      # above it runs on every PR rather than only when the restore runs.
      # Calibrated 2026-09-19 before wiring: widening the extension restriction
      # to admit .sql reds it with the offending synthetic name; restored and
      # confirmed byte-identical with cmp.
      - name: Restore channel derivation self-check - default-DENY holds, non-diagnostic extensions excluded
        run: bash scripts/derive-restore-channels.sh --self-check

      # [164.9] ⛔ A THIRD RECURRENCE OF THE [CR-02] DEFECT ABOVE, and the worst
      # of the three by count. `wait-for-test-schema-apply.sh --self-test` was
      # invoked by NOTHING. Every reference to it in this repo was PROSE — three
      # comments in this file claiming its "--self-test proves all three
      # reachable", one in mutex-probe.yml, one in a runbook, one in a phase
      # summary. Six written claims, zero executions.
      #
      # WHY IT MATTERS MORE HERE THAN FOR THE TWO SIBLINGS. This script is the
      # ORDERING control for three DB-touching jobs on a merge push, and its
      # only signal that sees test-restore-from-baseline.yml is an advisory
      # flag — that workflow produces no Actions run on the commit, so the
      # Actions-API read cannot see it at all. A defanged reader here does not
      # fail loudly: an unreadable probe answers a token that matches no case
      # arm, burns the full 900s budget, and then reddens three jobs with a
      # message blaming congestion rather than itself.
      # (2026-09-26, Phase 164.9.4: python and e2e-seeded no longer run the wait; in ci.yml it orders test-db-drift only, and this self-test still guards it.)
      # ⚠️ Phase 164.9's review round grew it 12 checks → 46 precisely because
      # the original 12 injected BOTH probe seams and so certified the
      # dispatcher while executing NEITHER read. Those 34 new arms proved
      # nothing at all while this step did not exist.
      #
      # Hermetic - fixture bytes and stub commands only, no database, no
      # credential, ~2s - so like both siblings above it runs on every PR
      # rather than only when the ordering wait itself runs. A gate whose
      # control only runs when the gate runs cannot catch a commit that
      # defangs it.
      - name: Schema-apply ordering wait self-test - the dispatcher AND the two reads
        run: bash scripts/wait-for-test-schema-apply.sh --self-test

      # ── Phase 164.8.1: the reference-data allowlist audit ─────────────────
      # A FOURTH SIBLING in this job, and — like the app-GUC gate and the
      # baseline content-drift gate before it — NOT an eighth rule of
      # lint-sql-gates. Different corpus (supabase/migrations, not
      # supabase/tests), different question: does the TEST restore's
      # reference-data allowlist still cover every reference statement the
      # migrations carry? Same hermetic contract — no database, no Docker, no
      # secrets, no network — which is what earns it a place in the job the
      # `frontend` aggregator gates with NO tolerance.
      #
      # WHAT IT CATCHES that nothing else does. `supabase/schema/baseline.sql`
      # is schema-only, and the restore SEEDS the migration ledger from the repo
      # file list — so after a restore every migration reads as applied while
      # every row it INSERTed is gone. `scripts/restore-test-refdata-allowlist.txt`
      # names the statements that have to come back. A static list cannot see
      # its own drift: this step reddens when a new migration adds a top-level
      # literal INSERT into an allowlisted table with no allowlist line, and
      # when a pinned count stops matching the file it pins.
      #
      # ⛔ A RED AUDIT IS CLEARED BY ADDING THE ALLOWLIST LINE WITH ITS
      # CONSUMER, or by understanding the migration edit that moved a pinned
      # count — NEVER by relaxing the classifier and never by hand-seeding
      # shared TEST. Mode identity: these two lines are the EXACT commands a
      # developer runs locally, pasted verbatim from the script's own header.
      - name: Reference-data extractor self-test - every refusal fires on its red fixture
        # Self-test FIRST, corpus second, for the same reason the rule self-test
        # above runs first: an audit that reports "no drift" tells you nothing
        # unless its refusals can still fire.
        run: node scripts/extract-reference-inserts.mjs --self-test
      # Rationale: docs/ci-yml-notes.md#sql-gate-lint-3
      - name: Assert the extractor self-test PRINTED its kind census and cleared the floor
        env:
          REFDATA_SELFTEST_LOG: ${{ runner.temp }}/extract-reference-inserts-selftest.log
        run: |
          set -uo pipefail
          status=0
          node scripts/extract-reference-inserts.mjs --self-test > "$REFDATA_SELFTEST_LOG" 2>&1 || status=$?
          cat "$REFDATA_SELFTEST_LOG"
          if [ "$status" -ne 0 ]; then
            echo "::error::the reference-data extractor self-test failed (exit $status)."
            exit "$status"
          fi
          # `grep` exits 1 on NO MATCH and >1 on a real fault. Only the first is this
          # step's MEASURE_FAIL; the second means the line was never looked for.
          ok_rc=0
          ok_line=$(grep -a -m1 -E '^extract-reference-inserts self-test OK: [0-9]+ kinds, red\+green each\.$' "$REFDATA_SELFTEST_LOG") || ok_rc=$?
          if [ "$ok_rc" -gt 1 ]; then
            echo "::error::MEASURE_FAIL: grep exited $ok_rc reading $REFDATA_SELFTEST_LOG, so the census line was NOT looked for. That is an unanswered question, not an absent line."
            exit 1
          fi
          if [ -z "$ok_line" ]; then
            echo "::error::MEASURE_FAIL: the self-test exited 0 but printed NO 'extract-reference-inserts self-test OK: N kinds, red+green each.' line. A zero status with no output is what a main guard that never fired looks like; it is not a passing self-test."
            exit 1
          fi
          kinds=$(echo "$ok_line" | sed -E 's|^extract-reference-inserts self-test OK: ([0-9]+) kinds.*|\1|')
          case "$kinds" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the kind count out of '$ok_line'."; exit 1;; esac
          # The floor is READ FROM THE SCRIPT BY SYMBOL, never restated here.
          # `node -e` leaves `process.argv[1]` undefined, so importing the module
          # does not trip its CLI entry point.
          floor_rc=0
          floor=$(node -e 'import("./scripts/extract-reference-inserts.mjs").then(m => console.log(m.SELF_TEST_KINDS_FLOOR))') || floor_rc=$?
          if [ "$floor_rc" -ne 0 ]; then
            echo "::error::MEASURE_FAIL: reading SELF_TEST_KINDS_FLOOR out of scripts/extract-reference-inserts.mjs exited $floor_rc, so the floor is UNKNOWN. An unread floor is not a cleared one."
            exit 1
          fi
          case "$floor" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read SELF_TEST_KINDS_FLOOR from scripts/extract-reference-inserts.mjs (got '$floor')."; exit 1;; esac
          if [ "$kinds" -lt "$floor" ]; then
            echo "::error::SELF_TEST_KINDS_FLOOR regression: the self-test ran $kinds kind(s), below the floor of $floor. A refusal kind was deleted — restore it, do not lower the floor to clear this."
            exit 1
          fi
          echo "self-test census: $kinds kind(s) against floor $floor."
      - name: Reference-data allowlist audit - no unlisted top-level reference INSERT in supabase/migrations
        run: node scripts/extract-reference-inserts.mjs --audit
      # Same reasoning as the self-test assertion above: an audit that measured
      # NOTHING and an audit that found nothing wrong are both exit 0, and this
      # step is the only thing that tells them apart.
      - name: Assert the allowlist audit PRINTED its census over a non-empty corpus
        env:
          REFDATA_AUDIT_LOG: ${{ runner.temp }}/extract-reference-inserts-audit.log
        run: |
          set -uo pipefail
          # Bounded like the self-test step above (see its dated 2026-09-25
          # correction): under `bash -e` an unbounded capture aborts the step
          # BEFORE its own MEASURE_FAIL can print.
          status=0
          node scripts/extract-reference-inserts.mjs --audit > "$REFDATA_AUDIT_LOG" 2>&1 || status=$?
          cat "$REFDATA_AUDIT_LOG"
          if [ "$status" -ne 0 ]; then
            echo "::error::the reference-data allowlist audit failed (exit $status)."
            exit "$status"
          fi
          census_rc=0
          census=$(grep -a -m1 -E '^extract-reference-inserts audit OK: [0-9]+ entr\(ies\), [0-9]+ file\(s\), [0-9]+ table\(s\), [0-9]+ statement\(s\);' "$REFDATA_AUDIT_LOG") || census_rc=$?
          if [ "$census_rc" -gt 1 ]; then
            echo "::error::MEASURE_FAIL: grep exited $census_rc reading $REFDATA_AUDIT_LOG, so the census line was NOT looked for. That is an unanswered question, not an absent line."
            exit 1
          fi
          if [ -z "$census" ]; then
            echo "::error::MEASURE_FAIL: the audit exited 0 but printed NO 'extract-reference-inserts audit OK: …' census line. An audit that measured nothing is not an audit that found nothing."
            exit 1
          fi
          scanned_rc=0
          scanned_line=$(grep -a -m1 -E '^ +migrations scanned: +[0-9]+$' "$REFDATA_AUDIT_LOG") || scanned_rc=$?
          if [ "$scanned_rc" -gt 1 ]; then
            echo "::error::MEASURE_FAIL: grep exited $scanned_rc looking for the 'migrations scanned: N' line, so it was NOT looked for. That is an unanswered question, not an absent line."
            exit 1
          fi
          if [ -z "$scanned_line" ]; then
            echo "::error::MEASURE_FAIL: the audit printed no 'migrations scanned: N' line, so how much of supabase/migrations it read is unknown."
            exit 1
          fi
          scanned=$(echo "$scanned_line" | sed -E 's|^ +migrations scanned: +([0-9]+)$|\1|')
          case "$scanned" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the scanned-migration count out of '$scanned_line'."; exit 1;; esac
          if [ "$scanned" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the audit scanned 0 migrations. An empty corpus audits clean BY CONSTRUCTION — a wrong --migrations path reads exactly like a repository with no drift."
            exit 1
          fi
          entries=$(echo "$census" | sed -E 's|^extract-reference-inserts audit OK: ([0-9]+) entr\(ies\).*|\1|')
          case "$entries" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the entry count out of '$census'."; exit 1;; esac
          if [ "$entries" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the audit reports 0 allowlist entr(ies), so the restore would replay nothing while every migration still reads as applied."
            exit 1
          fi
          # Phase 164.9.2 (D-03): the audit prints a SECOND census line for the C5
          # class (top-level literal UPDATEs the replay re-runs). It is read here the
          # same way as the first, bounded for the same `bash -e` reason, and its
          # absence is a MEASURE_FAIL. The regex pins `0 unaccounted`.
          # 164.9.2 review IN-01 / SFH-04: that count is COMPUTED by the extractor (a
          # tally of its C5 refusals, printed non-zero on its `audit C5 FAILED:` line and
          # measured so by its self-test), not a template constant. On an exit-0 run it
          # is 0 by construction, so this term is a consistency check against an
          # extractor that prints a non-zero count and still exits 0; the exit status
          # above stays the gate. What the count covers is the audit's `C5 scope:` line.
          c5_rc=0
          c5_line=$(grep -a -m1 -E '^extract-reference-inserts audit C5 OK: [0-9]+ update statement\(s\) over [0-9]+ file\(s\) and [0-9]+ table\(s\) replayed; [0-9]+ declined over [0-9]+ file\(s\); 0 unaccounted\.$' "$REFDATA_AUDIT_LOG") || c5_rc=$?
          if [ "$c5_rc" -gt 1 ]; then
            echo "::error::MEASURE_FAIL: grep exited $c5_rc reading $REFDATA_AUDIT_LOG, so the C5 census line was NOT looked for. That is an unanswered question, not an absent line."
            exit 1
          fi
          if [ -z "$c5_line" ]; then
            echo "::error::MEASURE_FAIL: the audit exited 0 but printed NO 'extract-reference-inserts audit C5 OK: …' census line. A C5 class whose census nobody reads can vanish with every run green (Phase 164.9.2, D-03)."
            exit 1
          fi
          echo "$scanned_line"
          echo "$census"
          echo "$c5_line"

      # Rationale: docs/ci-yml-notes.md#sql-gate-lint-4
      - name: Data-dependence gate self-test - every refusal fires on its red fixture
        # Self-test FIRST, corpus second, for the same reason every other
        # sibling's self-test runs first: a corpus scan reporting "0 NEW" tells
        # you nothing unless its refusals can still fire.
        run: node scripts/lint-migration-data-dependence.mjs --self-test
      - name: Data-dependence gate - no unledgered data-conditioned guard in supabase/migrations
        run: node scripts/lint-migration-data-dependence.mjs
      # Rationale: docs/ci-yml-notes.md#sql-gate-lint-5
      - name: Assert the data-dependence scan PRINTED its corpus census
        env:
          MIGDEP_SCAN_LOG: ${{ runner.temp }}/lint-migration-data-dependence.log
        run: |
          set -uo pipefail
          status=0
          node scripts/lint-migration-data-dependence.mjs > "$MIGDEP_SCAN_LOG" 2>&1 || status=$?
          cat "$MIGDEP_SCAN_LOG"
          if [ "$status" -ne 0 ]; then
            echo "::error::the data-dependence corpus scan failed (exit $status). Make the migration's self-verification CATALOGUE-ONLY, or make the read tolerant of an empty table. Do NOT widen scripts/lint-migration-data-dependence-baseline.txt and do NOT relax the classifier."
            exit "$status"
          fi
          # `grep` exits 1 on NO MATCH and >1 on a real fault. Only the first is this
          # step's MEASURE_FAIL; the second means the line was never looked for.
          census_rc=0
          census=$(grep -a -m1 -E '^lint-migration-data-dependence: corpus [0-9]+ migration\(s\), [0-9]+ anonymous block\(s\); [0-9]+ refusal\(s\), [0-9]+ allowlisted, [0-9]+ NEW\.$' "$MIGDEP_SCAN_LOG") || census_rc=$?
          if [ "$census_rc" -gt 1 ]; then
            echo "::error::MEASURE_FAIL: grep exited $census_rc reading $MIGDEP_SCAN_LOG, so the census line was NOT looked for. That is an unanswered question, not an absent line."
            exit 1
          fi
          if [ -z "$census" ]; then
            echo "::error::MEASURE_FAIL: the scan exited 0 but printed NO 'lint-migration-data-dependence: corpus ... NEW.' census line. A zero status with no output is what a main guard that never fired looks like; it is not a clean corpus."
            exit 1
          fi
          scanned=$(echo "$census" | sed -E 's|^lint-migration-data-dependence: corpus ([0-9]+) migration.*|\1|')
          case "$scanned" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the migration count out of '$census'."; exit 1;; esac
          if [ "$scanned" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the scan read 0 migrations. An empty corpus refuses nothing BY CONSTRUCTION — a wrong path reads exactly like a repository with no data-dependent guard."
            exit 1
          fi
          blocks=$(echo "$census" | sed -E 's|^.*, ([0-9]+) anonymous block\(s\);.*|\1|')
          case "$blocks" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the anonymous-block count out of '$census'."; exit 1;; esac
          if [ "$blocks" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the scan found 0 anonymous blocks across $scanned migrations. The refusal only ever looks inside a DO block, so a corpus with none is scanned vacuously — that is a broken block scanner, not a clean repository."
            exit 1
          fi
          echo "$census"

  sql-mutation:
    # Rationale: docs/ci-yml-notes.md#sql-mutation-1
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    # Pinned 2026-11-05: ubuntu-latest moved to 26.04, whose PostgreSQL major is 18; the lane
    # asserts major 16 (164.4.1 A5, the authoring box runs 16), so the image is pinned rather
    # than the assertion relaxed. Moving the lane to a new major is its own measured change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # No `cache: npm` on purpose — see the job header above: this job runs
          # no `npm ci` and no `npx`, so a restored `~/.npm` is a cache nothing
          # reads, saved on every miss, inside the wall-clock budget this gate
          # is measured against.
          node-version: 22

      # ── D-09 SCOPE STEP (2026-10-03, Phase 164.9.6) ──────────────────────────
      # FOUNDER OVERRIDE, push-to-main only. When `changed-paths` derives
      # `sql_gate_mode=none` on a push to refs/heads/main (a single-PR range that
      # changed no gate file, no migration and no mutation machinery), the lane
      # is not booted: this step prints `scope: NONE` and its reason and the job
      # ends green. FULL coverage of that tree is the nightly run's. Pull
      # requests keep the vacuity fence unchanged: a `none` on any other event or
      # ref is refused here with a warning, the lane boots, and the mutate step's
      # own guard runs the full corpus with a refusal-prefixed reason.
      # ⛔ FAIL-SAFE DIRECTION. Every later step carries
      # `if: steps.scope.outputs.skip_lane != 'true'`, never `== 'false'`: an
      # absent, empty or garbled output therefore BOOTS the lane. Only the one
      # literal value `true`, written on the one verified path, skips it.
      # ⛔ WHY STEP-LEVEL AND NOT A JOB-LEVEL `if:`. A skipped JOB reads as
      # `skipped` to the strict `frontend` aggregator row this job takes, and a
      # skipped job prints nothing, while D-12 requires every run to say what it
      # covered and why. A step-level skip keeps the job `success` and keeps the
      # two printed lines in its log.
      # A `none` that cannot say why (blank reason) or that names files is not
      # the D-09 verdict, and is a MEASURE_FAIL rather than a skip.
      - name: Scope - print what this run covers and why; a push to main that changed no mutation input skips the lane (D-09)
        id: scope
        env:
          SQL_GATE_MODE: ${{ needs.changed-paths.outputs.sql_gate_mode }}
          SQL_GATE_REASON: ${{ needs.changed-paths.outputs.sql_gate_reason }}
          SQL_GATE_FILES: ${{ needs.changed-paths.outputs.sql_gate_files }}
        run: |
          set -euo pipefail
          mode="${SQL_GATE_MODE:-}"
          event="${GITHUB_EVENT_NAME:-}"
          ref="${GITHUB_REF:-}"
          reason="${SQL_GATE_REASON:-}"
          reason_stripped="$(printf '%s' "$reason" | tr -d '[:space:]')"
          files_stripped="$(printf '%s' "${SQL_GATE_FILES:-}" | tr -d '[:space:]')"
          if [ "$mode" = "none" ]; then
            if [ "$event" = "push" ] && [ "$ref" = "refs/heads/main" ]; then
              if [ -z "$reason_stripped" ]; then
                echo "::error::MEASURE_FAIL: changed-paths said sql_gate_mode=none on a push to main with a BLANK sql_gate_reason. A verdict that cannot say why is not the D-09 verdict, so the lane is neither skipped nor booted on it."
                echo "skip_lane=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              if [ -n "$files_stripped" ]; then
                echo "::error::MEASURE_FAIL: changed-paths said sql_gate_mode=none on a push to main but sql_gate_files is NOT empty (${SQL_GATE_FILES:-}). A none verdict that names gate files is self-contradictory, so the lane is neither skipped nor booted on it."
                echo "skip_lane=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              echo "scope: NONE 0 gate files — no mutation input changed"
              echo "scope-reason: ${reason}"
              echo "skip_lane=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::changed-paths said sql_gate_mode=none on a '${event}' event (${ref}). D-09 honours it only on a push to refs/heads/main, so the lane boots and the full corpus runs."
          fi
          echo "scope verdict from changed-paths: sql_gate_mode=${mode}; the lane boots."
          echo "skip_lane=false" >> "$GITHUB_OUTPUT"

      - name: Provision pg_cron for the lane's PostgreSQL (Phase 164.4.1)
        timeout-minutes: 7
        if: steps.scope.outputs.skip_lane != 'true'
        # Rationale: docs/ci-yml-notes.md#sql-mutation-2
        run: |
          set -euo pipefail
          # ⭐ ASK THE LANE, do not re-derive. This step used to pick the major
          # with `ls -d /usr/lib/postgresql/*/bin | sort -n | tail -1` — the
          # HIGHEST — while scripts/pg-lane/run.sh's resolve_pgbin prefers
          # `pg_ctl` on PATH and otherwise takes the FIRST glob match (lexical,
          # the LOWEST). On an image carrying both 16 and 17 the two disagree:
          # this step would install postgresql-17-cron and then MEASURE_FAIL on
          # `!= 16`, while the lane would have booted 16 and found no extension.
          # `--print-pgbin` runs the lane's OWN chain, so whatever it names is
          # the server the arms actually run against — one selector, not two.
          # `|| true` is load-bearing, not defensive noise: an empty answer must
          # reach the MEASURE_FAIL below and NAME itself, rather than dying here
          # with no `::error::` line — "could not measure" wearing the costume
          # of a build failure.
          # stderr goes to a FILE, not to /dev/null. `--print-pgbin` writes the
          # resolved dir on stdout and its refusal on stderr, so discarding
          # stderr threw away the only diagnosis this step has. MEASURED
          # 2026-09-05 with PGBIN=/tmp: run.sh prints `ERROR: PGBIN=/tmp has no
          # executable pg_ctl` and CI showed none of it, while the MEASURE_FAIL
          # told the reader to "run it directly" — not an instruction anyone can
          # follow on a hosted runner that no longer exists.
          pgbin_err="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/pgbin.err"
          pgbin=$(bash scripts/pg-lane/run.sh --print-pgbin 2>"$pgbin_err" || true)
          echo "PGBIN the lane will boot: ${pgbin:-(unresolved)}"
          if [ -z "$pgbin" ]; then
            echo "--- scripts/pg-lane/run.sh --print-pgbin said (stderr) ---" >&2
            cat "$pgbin_err" >&2 || true
            echo "--- end of the lane's own diagnosis ---" >&2
            echo "::error::MEASURE_FAIL: scripts/pg-lane/run.sh --print-pgbin could not resolve any PostgreSQL server binaries on this runner, so this step cannot know which major to provision pg_cron for. The lane's own four-step diagnosis is printed on stderr immediately above this line."
            exit 1
          fi
          # Keyed off the resolved binaries' OWN pg_config, not off the path
          # spelling, so the major and the artifact paths below cannot come from
          # two different servers.
          #
          # ⭐ AN ABSENT pg_config IS ITS OWN DIAGNOSIS, not a wrong major.
          # scripts/pg-lane/run.sh treats pg_config as OPTIONAL: its pre-start
          # pg_cron check is `if [ -x "$PGBIN/pg_config" ]` ("layer 1 … runs
          # only where pg_config can name the two directories; layer 2 covers
          # the hosts where it cannot"), and `--print-pgbin` requires only
          # pg_ctl. So a bindir carrying pg_ctl and no pg_config is a host the
          # LANE runs on and this step cannot — and folding it into the `!= 16`
          # refusal below MISATTRIBUTED it: measured against exactly such a
          # bindir, the step emitted `the runner's PostgreSQL major is 'none',
          # not 16 … A5 … no longer holds`, sending the reader to re-take a
          # macOS/ubuntu major comparison over a missing PACKAGE. Two causes,
          # two messages.
          if [ ! -x "$pgbin/pg_config" ]; then
            echo "::error::MEASURE_FAIL: $pgbin has an executable pg_ctl but no executable pg_config, so the PostgreSQL major cannot be read off the binaries the lane boots. This is NOT the assumption-A5 major mismatch below and needs no macOS/ubuntu re-measurement: scripts/pg-lane/run.sh treats pg_config as OPTIONAL (its layer-1 pre-start check is skipped and layer 2 covers the host), so the LANE would run here and this step cannot. Provision postgresql-client-<major> so pg_config sits beside pg_ctl, or key this step off the path spelling again."
            exit 1
          fi
          major=$("$pgbin/pg_config" --version | awk '{print $2}' | cut -d. -f1 || true)
          echo "PostgreSQL major reported by $pgbin/pg_config: ${major:-(none found)}"
          if [ "${major:-}" != "16" ]; then
            echo "::error::MEASURE_FAIL: the runner's PostgreSQL major is '${major:-none}', not 16. 164.4.1-RESEARCH assumption A5 (ubuntu-latest => 24.04 => PostgreSQL 16.15) no longer holds, and criterion 1 (CI and the authoring box, which is 16.13, must measure the SAME corpus) is at risk: an extension .so built for another major will not load, and the five pg_cron gate files would be proven on a server the author never ran. Re-take the macOS/ubuntu major comparison before changing this line."
            exit 1
          fi
          echo "--- apt-cache policy postgresql-${major}-cron (read BEFORE the install: Installed shows whether the image already ships it) ---"
          apt-cache policy "postgresql-${major}-cron"
          bash scripts/ci-apt.sh install --budget 360 "postgresql-${major}-cron"
          echo "--- apt-cache policy postgresql-${major}-cron (read AFTER the install: Installed shows the version and the source that won) ---"
          apt-cache policy "postgresql-${major}-cron"
          echo "--- installed version ---"
          dpkg -s "postgresql-${major}-cron" | grep -a '^Version'
          echo "--- the two artifacts the lane needs ---"
          # `ls` exiting non-zero under `set -e` IS the loud failure: the .so is
          # what `shared_preload_libraries=pg_cron` loads at postmaster start,
          # and the .control is what `CREATE EXTENSION pg_cron` reads (PG16 has
          # no extension_control_path, so it must be in the server's sharedir).
          # Both paths come from the SAME pg_config the major came from, so this
          # cannot check a debian-layout path while the lane boots another tree.
          ls -l "$("$pgbin/pg_config" --pkglibdir)/pg_cron.so"
          ls -l "$("$pgbin/pg_config" --sharedir)/extension/pg_cron.control"

      - name: Probe - dblink contrib is present for the lane's PostgreSQL (Phase 164.5.2)
        if: steps.scope.outputs.skip_lane != 'true'
        # ⚠️ THIS STEP'S FIRST PR RUN IS THE MEASUREMENT. 164.5.2-RESEARCH
        # assumption A1 ("ubuntu's PostgreSQL server package carries contrib,
        # so dblink is loadable on this runner") was INSPECTED, never executed:
        # dblink on the lane was only ever exercised on the authoring box. The LANE-ONLY gate
        # supabase/tests/test_mark_rpc_bridge_advisory_lock.sql opens a second
        # backend through dblink, so without it that gate's baseline dies at
        # `CREATE EXTENSION IF NOT EXISTS dblink` and the runner reports an
        # anonymous `baseline` defect that names the wrong layer. This probe
        # names the missing contrib instead, before the long mutation run.
        #
        # ⛔ NOTHING IS INSTALLED PRE-EMPTIVELY, mirroring the pg_cron step's own
        # "measure first" stance. Install a contrib package ONLY if this probe
        # goes red on a real run. It reads the SAME `--print-pgbin` answer and
        # the SAME pg_config the lane boots, so it cannot pass on one tree
        # while the lane runs another. `.so` is the Linux module suffix, as in
        # the pg_cron step's own `ls`: a macOS PostgreSQL 16 names the same
        # module `dblink.dylib`, so this body is written for this runner only
        # and is not a local check. The pg_cron step above is deliberately
        # not edited: its script is exercised by the calibration harness in
        # src/__tests__/test-restore-workflow-wiring.test.ts.
        run: |
          set -euo pipefail
          pgbin_err="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/pgbin-dblink.err"
          pgbin=$(bash scripts/pg-lane/run.sh --print-pgbin 2>"$pgbin_err" || true)
          echo "PGBIN the lane will boot: ${pgbin:-(unresolved)}"
          if [ -z "$pgbin" ]; then
            echo "--- scripts/pg-lane/run.sh --print-pgbin said (stderr) ---" >&2
            cat "$pgbin_err" >&2 || true
            echo "--- end of the lane's own diagnosis ---" >&2
            echo "::error::MEASURE_FAIL: scripts/pg-lane/run.sh --print-pgbin could not resolve any PostgreSQL server binaries on this runner, so this probe cannot say whether dblink is present for the lane's PostgreSQL. The lane's own diagnosis is printed on stderr immediately above this line."
            exit 1
          fi
          dblink_so="$("$pgbin/pg_config" --pkglibdir)/dblink.so"
          dblink_control="$("$pgbin/pg_config" --sharedir)/extension/dblink.control"
          echo "--- the two dblink artifacts the lane needs ---"
          missing=0
          ls -l "$dblink_so" || missing=1
          ls -l "$dblink_control" || missing=1
          if [ "$missing" -ne 0 ]; then
            major=$("$pgbin/pg_config" --version | awk '{print $2}' | cut -d. -f1 || true)
            echo "::error::dblink is NOT present for the lane's PostgreSQL (major ${major:-unknown}, bindir $pgbin): expected dblink.so under pg_config --pkglibdir and extension/dblink.control under pg_config --sharedir. The Phase 164.5.2 LANE-ONLY gate supabase/tests/test_mark_rpc_bridge_advisory_lock.sql cannot run without it. Remedy: install the PostgreSQL contrib package for major ${major:-unknown} in this job (assumption A1 did not hold on this runner image)."
            exit 1
          fi

      - name: Probe - the runner image's PostgreSQL server binaries resolve
        if: steps.scope.outputs.skip_lane != 'true'
        # 164.3-RESEARCH assumption A1 ("ubuntu-latest ships PostgreSQL server
        # binaries under /usr/lib/postgresql/<major>/bin") has NEVER been
        # executed — the lane and the runner were built and measured on macOS
        # only. This step converts the assumption into a MEASUREMENT printed in
        # the job log, on the first CI run, before anything depends on it.
        #
        # It is deliberately NON-FATAL on its own: `scripts/pg-lane/run.sh`
        # carries a four-step resolution chain (`pg_ctl` on PATH -> `pg_config
        # --bindir` -> /usr/lib/postgresql/*/bin -> homebrew) and fails loud by
        # itself if every step misses. Duplicating that judgement here would
        # create a second, divergent opinion about which layout is acceptable.
        # What this step buys is a NAMED diagnosis in the log when the lane does
        # fail, instead of an opaque initdb error.
        run: |
          set -uo pipefail
          echo "PATH pg_ctl:      $(command -v pg_ctl || echo '(not on PATH)')"
          echo "pg_config bindir: $(pg_config --bindir 2>/dev/null || echo '(pg_config absent)')"
          echo "--- /usr/lib/postgresql glob ---"
          ls -d /usr/lib/postgresql/*/bin 2>/dev/null || echo "(no /usr/lib/postgresql/*/bin)"
          echo "--- initdb/pg_ctl under that glob ---"
          ls -l /usr/lib/postgresql/*/bin/initdb /usr/lib/postgresql/*/bin/pg_ctl 2>/dev/null \
            || echo "(no initdb/pg_ctl under the glob)"

      # [164.9 R2/CR-01] ⛔ A FOURTH RECURRENCE OF THE SAME DEFECT, and this one
      # was CREATED by the round that fixed the third. The dead-holder drill was
      # rewritten to stop being a paraphrase - it now EXTRACTS and executes the
      # release step's own `run:` body out of this file and derives both the
      # pidfile and the marker path from it - and was then left with ZERO call
      # sites. `grep -ra "mutex-dead-holder-lane" .github package.json` returned
      # nothing. Its header claims "a ci.yml that stops writing a marker makes
      # this drill FAIL LOUD"; that was true only for someone running it by hand.
      #
      # WHAT IT PROVES that the static gate cannot. `mutex-dead-holder-verdict.test.ts`
      # pins the WIRING - step pairing, `if: always()`, the marker path agreeing
      # across the two files. This drill kills a REAL holder on a throwaway
      # cluster and requires the verdict to go RED and then GREEN, which is the
      # only thing that can show the detection still fires end to end.
      #
      # It belongs in THIS job because the job already provisions PostgreSQL
      # server binaries and is in the `frontend` aggregator's needs, and it sits
      # before the long mutation run so a broken drill reds in seconds rather
      # than after ten minutes of arms.
      - name: Dead-holder drill - kill a real holder and require the verdict to bite
        if: steps.scope.outputs.skip_lane != 'true'
        run: bash scripts/pg-lane/mutex-dead-holder-lane.sh

      - name: Preflight - reject psql meta-commands in every file the runner executes
        if: steps.scope.outputs.skip_lane != 'true'
        # SAME REFUSAL AS `sql-tests`' Finding 6 preflight, WIDENED TO THE FILE
        # SET THIS JOB ACTUALLY EXECUTES. That job scans only
        # `supabase/tests/test_*.sql`; this one applies fixtures and MIGRATIONS
        # to a live cluster too, and psql meta-commands are CLIENT-side — the
        # server cannot refuse them, so they must be refused at the file level
        # before psql ever opens the file (T-164.3-19).
        #
        # The scanned set is a deliberate SUPERSET of the RED-UNDER-SETUP apply
        # lists (all tests + all lane fixtures + all migrations) rather than a
        # list derived from the annotations. A derived list is a second place
        # for the corpus to drift; a superset can only ever over-refuse, and an
        # over-refusal here would itself be a finding worth stopping for.
        # MEASURED 2026-08-29: 335 files scanned, 0 hits.
        #
        # ⚠️ `grep -a`, NOT bare `grep`. This repo has a MEASURED NUL-blind file
        # (`src/lib/wizardErrors.test.ts` carries a deliberate NUL): ugrep skips
        # such a file entirely and its exit 1 reads as "clean". A scanner that
        # silently declines to read a file is the vacuity shape this phase is
        # about, so the binary-safe flag is not optional here.
        #
        # Patterns, one grep each so the error names the exact meta-command:
        #   \!       shell escape (reads env vars, curls them out)
        #   \copy    client-side file IO
        #   \COPY    upper-case form
        #   \o ...   redirect query output into a file an artifact could carry
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/tests/test_*.sql scripts/pg-lane/fixtures/*.sql supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the preflight matched ZERO files. The runner executes SQL, so an empty scan set means the glob is wrong, not that the corpus is clean."
            exit 1
          fi
          bad=0
          # ⛔ SP-L02. Each of these greps used to end `>/dev/null 2>&1`, and
          # that second redirect discards the ERROR channel: grep exits 0 on a
          # hit, 1 on none, and >= 2 when it could not read the file at all —
          # so an unreadable or unstattable file read as CLEAN. The step's own
          # MEASURE_FAIL covered only a zero-length glob. "Silently declines to
          # read a file" is the exact shape the NUL note above names, one line
          # up from where it was happening.
          #
          # stdout still goes to /dev/null (the match itself is not wanted);
          # stderr is NOT suppressed, and any exit >= 2 is a hard failure.
          scan() {
            local f="$1" pattern="$2" label="$3" rc
            set +e
            grep -anE "$pattern" "$f" >/dev/null
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error file=$f::contains '$label' — refused by the mutation-lane preflight"
              bad=1
            elif [ "$rc" -gt 1 ]; then
              echo "::error file=$f::MEASURE_FAIL: grep exited $rc scanning for '$label'. The file could not be read, so this preflight has NOT cleared it — that is not the same as clean."
              bad=1
            fi
          }
          for f in "${files[@]}"; do
            # IN-06: this read '^\\\!|^\\!| \\\!| \\!'. In ERE both `\\\!` and
            # `\\!` denote a literal backslash followed by a literal `!`, so
            # alternatives 1/2 and 3/4 were duplicates — redundancy that reads
            # as a deliberate distinction which does not exist. Verified
            # behaviour-identical against a `\!`-at-line-start file, a
            # `\!`-after-a-space file and a clean file (exit 0/0/1 both ways).
            #
            #   \!       shell escape (reads env vars, curls them out)
            #   \copy    client-side file IO
            #   \COPY    upper-case form
            #   \o ...   redirect query output into a file
            scan "$f" '(^| )\\!'            '\!'
            scan "$f" '\\copy\b'             '\copy'
            scan "$f" '\\COPY\b'             '\COPY'
            scan "$f" '^\\o |^\\o$| \\o '     '\o'
          done
          if [ "$bad" = 1 ]; then
            echo "::error::One or more files the mutation runner executes contain a refused psql meta-command."
            exit 1
          fi
          echo "Preflight clean: ${#files[@]} file(s) free of refused meta-commands."

      - name: Runner self-test - every defect kind still fires
        if: steps.scope.outputs.skip_lane != 'true'
        # Rationale: docs/ci-yml-notes.md#sql-mutation-3
        run: node scripts/mutation-runner/run.mjs --self-test

      - name: Mutate every annotated RED-UNDER arm and require it to bite
        if: steps.scope.outputs.skip_lane != 'true'
        # Rationale: docs/ci-yml-notes.md#sql-mutation-4
        env:
          RUNNER_LOG: ${{ runner.temp }}/mutation-runner.log
          SQL_GATE_MODE: ${{ needs.changed-paths.outputs.sql_gate_mode }}
          SQL_GATE_FILES: ${{ needs.changed-paths.outputs.sql_gate_files }}
          SQL_GATE_REASON: ${{ needs.changed-paths.outputs.sql_gate_reason }}
        run: |
          set -uo pipefail
          if [ "${SQL_GATE_MODE:-}" = "subset" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] || { [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; }; then
              subset_list="$RUNNER_TEMP/sql-gate-subset.txt"
              read -r -a subset_names <<< "${SQL_GATE_FILES:-}"
              if [ "${#subset_names[@]}" -gt 0 ]; then
                printf '%s\n' "${subset_names[@]}" > "$subset_list"
              else
                : > "$subset_list"
              fi
              echo "SUBSET requested by changed-paths on a '${GITHUB_EVENT_NAME:-unset}' event (${GITHUB_REF:-unset ref}): ${#subset_names[@]} gate file(s) -> $subset_list"
              node scripts/mutation-runner/run.mjs --subset-from "$subset_list" > "$RUNNER_LOG" 2>&1
              status=$?
              cat "$RUNNER_LOG"
              exit $status
            fi
          fi
          # Phase 164.9.6 D-04: reaching this line with a non-`full` mode means
          # this step did NOT honour it (the honoured SUBSET branch exits above).
          if [ -n "${SQL_GATE_MODE:-}" ] && [ "${SQL_GATE_MODE:-}" != "full" ]; then
            echo "::warning::changed-paths said sql_gate_mode=${SQL_GATE_MODE:-} on a '${GITHUB_EVENT_NAME:-unset}' event (${GITHUB_REF:-unset ref}). A SUBSET is taken only on a pull_request or a push to refs/heads/main, so this step REFUSES that mode and runs the full corpus."
            SQL_GATE_REASON="the mutate step refused sql_gate_mode=${SQL_GATE_MODE:-} on a ${GITHUB_EVENT_NAME:-unset} event (${GITHUB_REF:-unset ref}); the full corpus runs. Derivation said: ${SQL_GATE_REASON:-none supplied}"
            export SQL_GATE_REASON
          fi
          node scripts/mutation-runner/run.mjs > "$RUNNER_LOG" 2>&1
          status=$?
          cat "$RUNNER_LOG"
          exit $status

      - name: Assert the run PRINTED its coverage and cleared both floors
        if: steps.scope.outputs.skip_lane != 'true'
        # D-01's print, made LOAD-BEARING. The runner prints coverage and arm
        # counts on every run; without this step a build of the runner that
        # silently stopped printing them would pass unnoticed, and the coverage
        # ratchet would become a number nobody compares to anything — which is
        # this phase's entire subject, committed inside this phase's own gate.
        #
        # It also closes the invocation-swap hole: `--parse-only` is a legitimate
        # mode that checks the whole corpus statically and exits 0, but it runs
        # ZERO arms. If anyone ever swaps it into the step above to make a red
        # board green, the executed-arm assertion below fails. That mechanism —
        # not the comment in run.mjs — is what keeps the static mode out of here.
        #
        # ⛔ EVERY ASSERTION DISTINGUISHES "could not measure" FROM "measured, no
        # problem". An absent line is a MEASURE_FAIL with its own message, never
        # a silent pass: an empty shell variable satisfies a numeric `-eq 0`
        # test, so the extraction is checked BEFORE any comparison.
        #
        # The floors are read FROM run.mjs, never restated here — a second copy
        # in ci.yml is a second thing to drift. `node -e` leaves
        # `process.argv[1]` undefined, so importing the module does not trip its
        # CLI entry point.
        env:
          RUNNER_LOG: ${{ runner.temp }}/mutation-runner.log
          # Review 164.4.2 WR-07: the list the SUBSET run must have mutated, as
          # changed-paths derived it. Compared as a SET with the scope line's
          # names below; read only on a SUBSET run.
          SQL_GATE_FILES: ${{ needs.changed-paths.outputs.sql_gate_files }}
        run: |
          set -euo pipefail

          if [ ! -s "$RUNNER_LOG" ]; then
            echo "::error::MEASURE_FAIL: $RUNNER_LOG is missing or empty. The runner produced no output to check, which is not the same as a clean run."
            exit 1
          fi

          # 164.4.2 / DECISION D — WHAT DID THIS RUN COVER? Read FIRST, because a
          # SUBSET run changes which of the numbers below are comparable. The
          # runner prints exactly one `scope:` line per corpus run (plan 07):
          #   scope: FULL <N>/<N> annotated files
          #   scope: FULL <N>/<N> annotated files (subset fallback: <reason>)
          #   scope: SUBSET <k>/<N> annotated files: <basename> …
          #   scope: DIAGNOSTIC <file-or-arm>
          # Arms, in this step's own discipline:
          #   (1) the line is ABSENT -> MEASURE_FAIL. A run that did not say what
          #       it covered is NEVER assumed to have covered everything — this is
          #       the most load-bearing arm here, because an absent line read as
          #       FULL is exactly how a narrowed run passes for full coverage.
          #   (1b) more than one `scope:` line -> MEASURE_FAIL: one run prints one,
          #       so two means a log spliced from two runs.
          #   (1c) any form other than FULL/SUBSET (DIAGNOSTIC included, which
          #       never exits 0 anyway) -> MEASURE_FAIL: it is not this gate.
          #   (2) SUBSET on an event that is not a pull_request -> MEASURE_FAIL.
          #       A merge is the moment the full picture is owed; a narrowed run
          #       on a push is a job failure, not a quiet optimisation.
          #       (⚠️ CORRECTED 2026-10-03, Phase 164.9.6 D-04: a SUBSET is now
          #       permitted on a pull_request AND on a push to refs/heads/main,
          #       whose derivation judges the pushed range. Every other event —
          #       a push to another ref, a workflow_dispatch, a schedule, an
          #       unset event — still MEASURE_FAILs, and the message names the
          #       event AND the ref. The full picture is owed by the nightly
          #       full-corpus run and by every FULL fallback. Every SUBSET-only
          #       check below applies unchanged on a push. The sentence above is
          #       kept as lineage.)
          # Arms (3) and (4) — the SUBSET claim-versus-names check, the narrowed
          # row count, and the ARMS_FLOOR that is NOT compared — sit beside the
          # assertions they change, below. (5) FULL, fallback form included, is
          # judged by every existing arm unchanged, ARMS_FLOOR included.
          set +e
          scope_count=$(grep -a -c -E '^scope: ' "$RUNNER_LOG")
          rc=$?
          set -e
          [ "$rc" -le 1 ] || { echo "::error::MEASURE_FAIL: grep exited $rc counting 'scope:' lines in $RUNNER_LOG — the log could not be read, which is not the same as a log with no scope line."; exit 1; }
          case "$scope_count" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not count the 'scope:' lines in $RUNNER_LOG (got '$scope_count')."; exit 1;; esac
          if [ "$scope_count" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'scope:' line, so what it covered is unknown. A run that did not say what it covered is never assumed to have covered everything: an absent scope line is not a FULL run."
            exit 1
          fi
          if [ "$scope_count" -ne 1 ]; then
            echo "::error::MEASURE_FAIL: the run printed $scope_count 'scope:' lines. One run of the gate prints exactly one; more than one means this log was not produced by one run."
            exit 1
          fi
          scope_line=$(grep -a -m1 -E '^scope: ' "$RUNNER_LOG" || true)
          echo "$scope_line"
          event_name="${GITHUB_EVENT_NAME:-}"
          ref_name="${GITHUB_REF:-}"
          if echo "$scope_line" | grep -a -q -E '^scope: FULL [0-9]+/[0-9]+ annotated files( \(subset fallback: .+\))?$'; then
            scope_mode=full
          elif echo "$scope_line" | grep -a -q -E '^scope: SUBSET [0-9]+/[0-9]+ annotated files: '; then
            scope_mode=subset
          else
            echo "::error::MEASURE_FAIL: the scope line '$scope_line' is neither the FULL nor the SUBSET form. A DIAGNOSTIC (--file/--arm) run, or a form this step does not know, is not this gate."
            exit 1
          fi
          subset_allowed=false
          if [ "$event_name" = "pull_request" ]; then
            subset_allowed=true
          elif [ "$event_name" = "push" ] && [ "$ref_name" = "refs/heads/main" ]; then
            subset_allowed=true
          fi
          if [ "$scope_mode" = "subset" ] && [ "$subset_allowed" != "true" ]; then
            echo "::error::MEASURE_FAIL: the run narrowed to a SUBSET ('$scope_line') on a '${event_name:-unset}' event (ref '${ref_name:-unset}'). A SUBSET is permitted only on a pull_request or a push to refs/heads/main; every other event owes the FULL corpus and every floor, so a narrowed run here is a job failure, not an optimisation."
            exit 1
          fi

          # Phase 164.9.6 / D-12 (founder, OPEN-4) — WHY DID THIS RUN TAKE ITS
          # SCOPE? The runner prints exactly one `scope-reason: <why>` line
          # directly after its `scope:` line on every corpus run. Same arms as
          # the `scope:` count above: an unreadable log, an absent line, more
          # than one line, or a blank reason is a MEASURE_FAIL. ⛔ This line is
          # NEVER parsed for names: the SUBSET name count and the WR-07 set
          # below read the `scope:` line alone, so a reason that quotes a
          # migration `.sql` path cannot move either.
          set +e
          reason_count=$(grep -a -c -E '^scope-reason: ' "$RUNNER_LOG")
          rc=$?
          set -e
          [ "$rc" -le 1 ] || { echo "::error::MEASURE_FAIL: grep exited $rc counting 'scope-reason:' lines in $RUNNER_LOG — the log could not be read, which is not the same as a log with no scope-reason line."; exit 1; }
          case "$reason_count" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not count the 'scope-reason:' lines in $RUNNER_LOG (got '$reason_count')."; exit 1;; esac
          if [ "$reason_count" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'scope-reason:' line — D-12 requires every run to say why it took its scope."
            exit 1
          fi
          if [ "$reason_count" -ne 1 ]; then
            echo "::error::MEASURE_FAIL: the run printed $reason_count 'scope-reason:' lines. One run of the gate prints exactly one; more than one means this log was not produced by one run."
            exit 1
          fi
          reason_line=$(grep -a -m1 -E '^scope-reason: ' "$RUNNER_LOG" || true)
          reason_text=$(printf '%s' "${reason_line#scope-reason: }" | tr -d '[:space:]')
          if [ -z "$reason_text" ]; then
            echo "::error::MEASURE_FAIL: the run's 'scope-reason:' line carries an EMPTY reason. D-12 requires every run to say why it took its scope; a blank reason says nothing."
            exit 1
          fi
          echo "$reason_line"

          # Phase 164.9.6.1 / D-01 (founder, "In-job concurrency") — HOW MANY
          # GATE FILES DID THIS RUN DRIVE AT ONCE? The runner prints exactly one
          # `lane-concurrency: <N>   (…)` line directly after `scope-reason:`,
          # before any lane. Without it, this run's wall time cannot be read
          # against the serial baseline, and whether its lanes ran side by side
          # is unknown. Same arms as the two counts above: an unreadable log,
          # an absent line, more than one line, or an N below 1 is a
          # MEASURE_FAIL. ⛔ N is NOT compared against a cap: D-03 adds no
          # guard, and a runner with a different core count is legal.
          set +e
          concurrency_count=$(grep -a -c -E '^lane-concurrency: [0-9]+ ' "$RUNNER_LOG")
          rc=$?
          set -e
          [ "$rc" -le 1 ] || { echo "::error::MEASURE_FAIL: grep exited $rc counting 'lane-concurrency:' lines in $RUNNER_LOG — the log could not be read, which is not the same as a log with no lane-concurrency line."; exit 1; }
          case "$concurrency_count" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not count the 'lane-concurrency:' lines in $RUNNER_LOG (got '$concurrency_count')."; exit 1;; esac
          if [ "$concurrency_count" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'lane-concurrency: <N>' line, so how many gate files it ran at once is unknown. Its wall time cannot be read against the serial baseline and its lane isolation cannot be judged (D-01)."
            exit 1
          fi
          if [ "$concurrency_count" -ne 1 ]; then
            echo "::error::MEASURE_FAIL: the run printed $concurrency_count 'lane-concurrency:' lines. One run of the gate prints exactly one; more than one means this log was not produced by one run."
            exit 1
          fi
          concurrency_line=$(grep -a -m1 -E '^lane-concurrency: [0-9]+ ' "$RUNNER_LOG" || true)
          concurrency_n=$(echo "$concurrency_line" | sed -E 's|^lane-concurrency: ([0-9]+) .*$|\1|')
          case "$concurrency_n" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the concurrency out of '$concurrency_line'."; exit 1;; esac
          if [ "$concurrency_n" -lt 1 ]; then
            echo "::error::MEASURE_FAIL: the run's 'lane-concurrency:' line says $concurrency_n gate file(s) at once. A run that executed anything ran at least one; a value below 1 is not a real reading of this run (D-01)."
            exit 1
          fi
          echo "$concurrency_line"

          floors=$(node -e 'import("./scripts/mutation-floors.mjs").then(m => console.log(m.FILES_FLOOR, m.ARMS_FLOOR, m.WAIVED_CEILING))')
          files_floor=$(echo "$floors" | cut -d" " -f1)
          arms_floor=$(echo "$floors" | cut -d" " -f2)
          waived_ceiling=$(echo "$floors" | cut -d" " -f3)
          case "$files_floor" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read FILES_FLOOR from scripts/mutation-floors.mjs (got '$files_floor')."; exit 1;; esac
          case "$arms_floor" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read ARMS_FLOOR from scripts/mutation-floors.mjs (got '$arms_floor')."; exit 1;; esac
          case "$waived_ceiling" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read WAIVED_CEILING from scripts/mutation-floors.mjs (got '$waived_ceiling')."; exit 1;; esac
          echo "floors from mutation-floors.mjs: FILES_FLOOR=$files_floor ARMS_FLOOR=$arms_floor WAIVED_CEILING=$waived_ceiling"

          coverage_line=$(grep -a -m1 -E '^coverage: files [0-9]+/[0-9]+$' "$RUNNER_LOG" || true)
          if [ -z "$coverage_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'coverage: files N/M' line. D-01 requires coverage on every run; a runner that stopped printing it has silently retired its own ratchet."
            exit 1
          fi
          echo "$coverage_line"
          files_annotated=$(echo "$coverage_line" | sed -E 's|^coverage: files ([0-9]+)/[0-9]+$|\1|')
          case "$files_annotated" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the annotated-file count out of '$coverage_line'."; exit 1;; esac
          if [ "$files_annotated" -lt "$files_floor" ]; then
            echo "::error::FILES_FLOOR regression: $files_annotated annotated file(s) < floor $files_floor."
            exit 1
          fi

          # 164.4-01 — THE EXCLUSION MUST BE NAMED (criterion 1 as amended by the
          # founder, 2026-09-02). `coverage: files N/71` is a ratio over every
          # `.sql` in the scope dir, and this phase's end state deliberately
          # leaves a subset uncovered: files that raise outside the runner's
          # identity idiom, which it can never attribute an arm in. A reader of
          # the ratio alone cannot tell that subset from work nobody has done
          # yet. So the runner derives and PRINTS the excluded set by name, and
          # a silent exclusion fails HERE exactly as a missing annotation does.
          #
          # Two arms, in the discipline every assertion above uses:
          #   (1) the line is ABSENT -> MEASURE_FAIL with its own message. A
          #       runner that stopped classifying its corpus has retired the
          #       amendment, and an absent line is never a zero.
          #   (2) the count it CLAIMS must equal the number of `*.sql` names it
          #       PRINTS. Evidence before verdict (SC-7): a count with no names
          #       is a number nobody can check, and names with a wrong count is
          #       the shape a hand-maintained list decays into.
          # No literal count is restated here — the successor phase shrinks this
          # set and the runner derives it. Both sides come from the run output.
          unreachable_line=$(grep -a -m1 -E '^unreachable: [0-9]+ file\(s\) ' "$RUNNER_LOG" || true)
          if [ -z "$unreachable_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'unreachable: N file(s) …' line, so which gate files this run deliberately did NOT cover is unknown. Criterion 1 (as amended 2026-09-02) requires the exclusion to be named on every run: a silent exclusion fails this gate exactly as a missing annotation does."
            exit 1
          fi
          echo "$unreachable_line"
          unreachable_claimed=$(echo "$unreachable_line" | sed -E 's|^unreachable: ([0-9]+) file\(s\) .*|\1|')
          case "$unreachable_claimed" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the excluded-file count out of '$unreachable_line'."; exit 1;; esac
          # `|| true` matches the `file_rows` line below and is LOAD-BEARING, not
          # tidiness: the step runs under `set -euo pipefail`, and the empty
          # excluded set — `unreachable: 0 file(s) … — `, this phase's successor's
          # stated end state — is exactly the case where `grep -o` matches
          # nothing and exits 1. Without it, pipefail aborts the step here with
          # no `::error::` at all and the numeric guard below is dead code that
          # can never observe the empty value. With it, `wc -l` still prints 0,
          # the guard stays LIVE, and the `-ne` comparison does the work.
          unreachable_named=$(echo "$unreachable_line" | grep -a -o -E '[A-Za-z0-9_]+\.sql' | wc -l | tr -d '[:space:]' || true)
          case "$unreachable_named" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not count the file names on '$unreachable_line'."; exit 1;; esac
          if [ "$unreachable_claimed" -ne "$unreachable_named" ]; then
            echo "::error::MEASURE_FAIL: the run CLAIMS $unreachable_claimed excluded file(s) but NAMES $unreachable_named. The count and the names come from the same derivation in one run and cannot disagree; a claim the log's own evidence contradicts is not a measurement."
            exit 1
          fi

          # 164.4-03 — THE DEFERRAL MUST BE NAMED TOO (criterion 4; SCOPE
          # AMENDMENT #2, founder 2026-09-03). Four idiom gate files probe
          # `pg_extension` for pg_cron, which the pg-lane has none of and
          # deliberately will not get. Two of them RAISE on its absence (their
          # baseline can never be GREEN, so no arm of theirs is ever judged) and
          # two baseline GREEN but withhold whole Parts behind a
          # pg_cron-conditional NOTICE (those arms are un-falsifiable on the
          # lane). Criterion 4: an arm that cannot be given a falsifying
          # mutation is RECORDED with its reason, never silently skipped — and
          # sitting inside `  pending:` is exactly a silent skip, since at the
          # phase's end that line reads as unfinished work rather than a
          # reasoned exclusion.
          #
          # Same three arms as the `unreachable_line` block above, for the same
          # reasons: absent is a MEASURE_FAIL and never a zero; an unreadable
          # count is a MEASURE_FAIL; and the count CLAIMED must equal the
          # `*.sql` names PRINTED beside it, because a count with no names is a
          # number nobody can check. No literal count is restated here — the
          # runner derives the set and both sides come from the run output, so
          # the day the four are annotated this block needs no edit.
          lane_blocked_line=$(grep -a -m1 -E '^lane-blocked: [0-9]+ file\(s\) ' "$RUNNER_LOG" || true)
          if [ -z "$lane_blocked_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'lane-blocked: N file(s) …' line, so which gate files this run DEFERRED, and why, is unknown. Criterion 4 requires an arm that cannot be given a falsifying mutation to be RECORDED with its reason: a deferral absorbed silently into the pending set fails this gate exactly as a missing annotation does."
            exit 1
          fi
          echo "$lane_blocked_line"
          lane_blocked_claimed=$(echo "$lane_blocked_line" | sed -E 's|^lane-blocked: ([0-9]+) file\(s\) .*|\1|')
          case "$lane_blocked_claimed" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the deferred-file count out of '$lane_blocked_line'."; exit 1;; esac
          # `|| true` for the reason spelled out on the `unreachable_named`
          # pipeline above: under `set -euo pipefail` an EMPTY deferred set —
          # `lane-blocked: 0 file(s) … — `, the state this phase's successor
          # reaches by fixing [REDUNDER-PGCRON] — makes `grep -o` match nothing
          # and exit 1, which would abort the step with no `::error::` at all
          # and leave the numeric guard below unreachable.
          lane_blocked_named=$(echo "$lane_blocked_line" | grep -a -o -E '[A-Za-z0-9_]+\.sql' | wc -l | tr -d '[:space:]' || true)
          case "$lane_blocked_named" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not count the file names on '$lane_blocked_line'."; exit 1;; esac
          if [ "$lane_blocked_claimed" -ne "$lane_blocked_named" ]; then
            echo "::error::MEASURE_FAIL: the run CLAIMS $lane_blocked_claimed deferred file(s) but NAMES $lane_blocked_named. The count and the names come from the same derivation in one run and cannot disagree; a claim the log's own evidence contradicts is not a measurement."
            exit 1
          fi

          # 164.4-03 — AND THE REASON MUST HAVE BEEN MEASURED (threat
          # T-164.4-11). "which the pg-lane cannot host" is a claim about the
          # LANE, and the classification above never touches a lane. So the
          # runner drives one extra lane leg per run asking
          # `pg_available_extensions` for pg_cron and prints what it got. A
          # reason that cannot expire is the control-that-cannot-fail this phase
          # exists to remove: install pg_cron tomorrow and, without this, four
          # files stay parked behind a line that still reads true.
          #
          # ONE arm here, deliberately. An AVAILABLE line is NOT asserted in
          # this step — the runner already exits 1 on it through the
          # `lane-blocked-stale` defect and the job fails on the runner's own
          # exit status, so re-deciding it here would be a second judge of one
          # question. CI's job is to notice the probe went MISSING, which is the
          # one failure the runner cannot report about itself. The
          # `(absent|AVAILABLE)` alternation is what makes the runner's third
          # form — `lane-probe: UNREADABLE …`, printed when the probe lane
          # returned no marker — fail here as well as in-process.
          lane_probe_line=$(grep -a -m1 -E '^lane-probe: pg_cron (absent|AVAILABLE)' "$RUNNER_LOG" || true)
          if [ -z "$lane_probe_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'lane-probe:' line — the lane was not measured for pg_cron, so the lane-blocked class is unverified. The deferral's stated reason is a fact about the LANE; a run that did not ask it is asserting the reason rather than measuring it."
            exit 1
          fi
          echo "$lane_probe_line"

          arms_line=$(grep -a -m1 -E '^arms: [0-9]+/[0-9]+/[0-9]+ ' "$RUNNER_LOG" || true)
          if [ -z "$arms_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'arms: E/A/W' line, so the number of arms actually EXECUTED is unknown. Unknown is not zero and it is not fine."
            exit 1
          fi
          echo "$arms_line"
          arms_executed=$(echo "$arms_line" | sed -E 's|^arms: ([0-9]+)/[0-9]+/[0-9]+ .*|\1|')
          if [ "$arms_executed" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: ZERO arms executed. The gate cannot observe a non-biting annotation without running one. If the step above was changed to --parse-only, that is a static check, not this gate."
            exit 1
          fi
          # WAIVED_CEILING (2026-09-02 red team): a waiver is a counted twin that
          # never runs a lane, so NEW prose markers with waiver twins raise the
          # annotated counts and lower nothing — every floor stays green while
          # coverage is inflated with zero new arms. The W field is bounded from
          # ABOVE, against the constant read out of run.mjs beside the floors.
          arms_waived=$(echo "$arms_line" | sed -E 's|^arms: [0-9]+/[0-9]+/([0-9]+) .*|\1|')
          case "$arms_waived" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the waived count out of '$arms_line'."; exit 1;; esac
          if [ "$arms_waived" -gt "$waived_ceiling" ]; then
            echo "::error::WAIVED_CEILING exceeded: $arms_waived waived arm(s) > ceiling $waived_ceiling. A waiver is an arm this gate will never prove can fail; adding one is a reviewed edit to WAIVED_CEILING in scripts/mutation-floors.mjs, never a side effect of annotating."
            exit 1
          fi
          # IN-05: ARMS_FLOOR bounds BITING arms — executed minus those that did
          # not redden or reddened on the wrong arm — not raw executed. This
          # step used to compare `arms_executed` to the same constant and print
          # "ARMS_FLOOR regression: N arm(s) executed < floor", naming a
          # quantity the constant was never measured against. The runner now
          # prints the real one under its own name and this reads THAT.
          #
          # A missing `biting:` line is a MEASURE_FAIL and not a zero: it is
          # also what a `--parse-only` swap produces, since that mode executes
          # nothing and deliberately does not print it.
          biting_line=$(grep -a -m1 -E '^biting: [0-9]+ ' "$RUNNER_LOG" || true)
          if [ -z "$biting_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'biting: N' line, so the quantity ARMS_FLOOR actually bounds is unknown. Either the runner stopped reporting it, or the step above was not the gate (--parse-only executes zero arms and does not print it)."
            exit 1
          fi
          echo "$biting_line"
          biting=$(echo "$biting_line" | sed -E 's|^biting: ([0-9]+) .*|\1|')
          case "$biting" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the biting count out of '$biting_line'."; exit 1;; esac
          # ⚠️ R2-I01, STATED SO IT IS NOT MISREAD AS A LIVE CHECK: this arm is
          # UNREACHABLE for any log the runner produces. `bitingArms` is
          # `armsExecuted` minus a subset of the defects, so `biting <=
          # executed` holds by construction (run.mjs, the ARMS_FLOOR block).
          # It is kept deliberately, and only for what it DOES cover: a log
          # that was hand-edited, spliced from two runs, or assembled by a
          # wrapper. This step's whole job is to read numbers out of a text
          # file it did not produce, so "these two cannot disagree" is worth
          # asserting about the FILE even though it is trivially true of the
          # program. It is not evidence that the runner is consistent. (Since
          # 164.3.1-10 the runner asserts this same relation IN-PROCESS as
          # part of its absurdity floor — `absurdityViolations` in run.mjs —
          # so a violation here means the file, not the arithmetic.)
          if [ "$biting" -gt "$arms_executed" ]; then
            echo "::error::MEASURE_FAIL: biting ($biting) exceeds executed ($arms_executed). Those two numbers come from the same run and cannot disagree this way, so this log was not produced by one run of the gate."
            exit 1
          fi
          # 164.3.1-10 — THE RUNNER'S ABSURDITY FLOOR, RE-ASSERTED OUT OF PROCESS.
          # The runner now counts its arm lanes TWICE, independently: once in
          # its verdict loop (the `arms: E/…` line above) and once INSIDE the
          # lane runner at the spawn (`lane-invocations: N`). It fails itself
          # when they disagree. This step re-reads both numbers out of the log
          # and asserts the same relation, for the same reason every other arm
          # here exists: a build of the runner that silently stopped printing
          # the second tally — or a log assembled from something other than one
          # honest run — must fail HERE rather than pass quietly. A missing line
          # is a MEASURE_FAIL and never a zero (an empty variable satisfies a
          # numeric test), checked BEFORE any comparison, like every line above.
          # The relation is EXACT: the printed count IS the arm-leg count; the
          # baseline and restore legs are printed in the same line's parenthesis
          # as evidence and are not compared. No literal is restated here — both
          # sides come from the run output, and the measured values behind the
          # rule (30/30/30 at plan 164.3.1-09's re-derivation) live beside the
          # rule in run.mjs, once.
          lane_line=$(grep -a -m1 -E '^lane-invocations: [0-9]+ ' "$RUNNER_LOG" || true)
          if [ -z "$lane_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'lane-invocations: N' line, so the runner's second, independent count of arm lanes is unknown and its own cross-check cannot be re-asserted. Either the runner stopped reporting it (164.3.1-10), or the step above was not the gate (--parse-only executes zero arms and prints no lane tally)."
            exit 1
          fi
          echo "$lane_line"
          lane_invocations=$(echo "$lane_line" | sed -E 's|^lane-invocations: ([0-9]+) .*|\1|')
          case "$lane_invocations" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the lane-invocation count out of '$lane_line'."; exit 1;; esac
          if [ "$lane_invocations" -ne "$arms_executed" ]; then
            echo "::error::MEASURE_FAIL — this is the GATE failing, not the corpus: the verdict loop reported $arms_executed executed arm(s) but the lane runner counted $lane_invocations arm lane(s) (executed=$arms_executed lane-invocations=$lane_invocations biting=$biting). Arms were claimed that no lane ran, or lanes ran that no verdict describes. The runner's own in-process floor exits 1 on this; a log reaching this step with these numbers was not produced by one honest run of the gate."
            exit 1
          fi
          # 164.4-01 — THE PER-FILE BREAKDOWN, CROSS-SUMMED (threat T-164.4-05).
          # `coverage: files N/71` counts a file whose baseline went RED exactly
          # like one whose 39 arms all bit: the arm loop is `continue`d and the
          # file still reads as coverage. The runner now prints one row per
          # annotated file — sections / judged / annotated / waived / biting —
          # so a half-annotated or never-judged file is visible in the log.
          #
          # WHAT THESE ROWS ACTUALLY DEFEND AGAINST, stated precisely so a later
          # reader does not weaken the arms on a bigger hole than the one that
          # existed: a RED baseline is ALREADY fatal in-process — run.mjs calls
          # `addDefect("baseline", …)` and the run exits 1 — so that case was
          # never "averaged into a green aggregate". The rows are
          # defense-in-depth over the LOG: this step's whole job is reading
          # numbers out of a text file it did not produce, and a log that was
          # spliced from two runs, hand-edited, or assembled by a wrapper can
          # carry an aggregate its own breakdown does not account for.
          #
          # Three arms, same discipline as every assertion above:
          #   (1) NO rows at all -> MEASURE_FAIL. The runner stopped reporting.
          #   (2) one row per annotated file, cross-checked against the
          #       `coverage:` numerator already read. Rows and coverage are two
          #       readings of the same loop and cannot disagree.
          #   (3) the rows' `biting` column must SUM to the aggregate `biting:`
          #       already read. The runner asserts this in-process too
          #       (`absurdityViolations`); asserting it here is the same
          #       out-of-process re-read as the lane-invocations arm, for a step
          #       whose whole job is reading numbers out of a file it did not
          #       produce. No literal integer is restated — both sides come from
          #       the run output.
          file_rows=$(grep -a -E '^  file .+: sections [0-9]+ / judged [0-9]+ / annotated [0-9]+ / waived [0-9]+ / biting [0-9]+$' "$RUNNER_LOG" || true)
          if [ -z "$file_rows" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO '  file <name>: sections … / judged … / biting …' row, so which annotated files actually reached a verdict is unknown. A file whose baseline went red counts toward coverage while judging nothing; without the per-file rows that gap is invisible."
            exit 1
          fi
          printf '%s\n' "$file_rows"
          file_rows_count=$(printf '%s\n' "$file_rows" | wc -l | tr -d '[:space:]')
          # 164.4.2 / DECISION D, arm (3). On a SUBSET run the coverage numerator
          # still comes from the FULL scan (FILES_FLOOR above compares it), but
          # only the listed files were mutated, so the rows describe k files,
          # not N. The scope line's own claim is checked against its own names
          # first — the claim-versus-names discipline the `unreachable:` and
          # `lane-blocked:` arms use — and its denominator against the coverage
          # numerator, before k replaces N in the row-count comparison.
          expected_rows="$files_annotated"
          if [ "$scope_mode" = "subset" ]; then
            subset_claimed=$(echo "$scope_line" | sed -E 's|^scope: SUBSET ([0-9]+)/[0-9]+ annotated files: .*|\1|')
            case "$subset_claimed" in ''|*[!0-9]*)
              echo "::error::MEASURE_FAIL: could not read the subset file count out of '$scope_line'."; exit 1;; esac
            subset_total=$(echo "$scope_line" | sed -E 's|^scope: SUBSET [0-9]+/([0-9]+) annotated files: .*|\1|')
            case "$subset_total" in ''|*[!0-9]*)
              echo "::error::MEASURE_FAIL: could not read the annotated-file total out of '$scope_line'."; exit 1;; esac
            # `|| true` for the reason spelled out on `unreachable_named` above.
            subset_named=$(echo "$scope_line" | grep -a -o -E '[A-Za-z0-9_]+\.sql' | wc -l | tr -d '[:space:]' || true)
            case "$subset_named" in ''|*[!0-9]*)
              echo "::error::MEASURE_FAIL: could not count the file names on '$scope_line'."; exit 1;; esac
            if [ "$subset_claimed" -eq 0 ]; then
              echo "::error::MEASURE_FAIL: the run claims a SUBSET of ZERO files ('$scope_line'). An empty narrowed scope mutates nothing and is never a pass."
              exit 1
            fi
            if [ "$subset_claimed" -ne "$subset_named" ]; then
              echo "::error::MEASURE_FAIL: the SUBSET scope line CLAIMS $subset_claimed file(s) but NAMES $subset_named. The count and the names come from the same run and cannot disagree; a claim the log's own evidence contradicts is not a measurement."
              exit 1
            fi
            if [ "$subset_total" -ne "$files_annotated" ]; then
              echo "::error::MEASURE_FAIL: the SUBSET scope line narrows from $subset_total annotated file(s) but the coverage line reports $files_annotated. Both come from the one full scan of the corpus; a disagreement means this log was not produced by one run."
              exit 1
            fi
            if [ "$subset_claimed" -gt "$subset_total" ]; then
              echo "::error::MEASURE_FAIL: the SUBSET claims $subset_claimed of $subset_total annotated file(s) — more than exist."
              exit 1
            fi
            # Review 164.4.2 WR-07 — the names the run printed must be the SET
            # changed-paths derived. The count-versus-names arm above cannot see
            # a same-sized swap; this compares basenames, sorted and de-duplicated
            # on both sides. The derived list is split with `read -r -a` (no
            # globbing, no eval), as the runner step splits it.
            # ⚠️ SQL_GATE_FILES is the SAME list the runner step was handed, so
            # this proves the runner mutated its INPUT, not that the input is
            # the right subset (silent-failure-hunter round 2, WR-05). The
            # derivation is proven where it runs: changed-paths runs
            # `sql-gate-subset.mjs --self-test` before `sql-gate-subset.mjs`.
            # It is deliberately not re-derived here — one diff implementation,
            # never two that can drift apart.
            if [ -z "${SQL_GATE_FILES:-}" ]; then
              echo "::error::MEASURE_FAIL: the run says SUBSET but SQL_GATE_FILES (needs.changed-paths.outputs.sql_gate_files) is empty, so what the run SHOULD have mutated is unknown. An unreadable expectation is never a match."
              exit 1
            fi
            read -r -a derived_paths <<< "$SQL_GATE_FILES"
            derived_set=$(for p in "${derived_paths[@]}"; do printf '%s\n' "${p##*/}"; done | sort -u | tr '\n' ' ')
            printed_set=$(echo "${scope_line#*annotated files: }" | tr ' ' '\n' | grep -a -v '^$' | sort -u | tr '\n' ' ' || true)
            if [ "$derived_set" != "$printed_set" ]; then
              echo "::error::MEASURE_FAIL: the SUBSET the run printed is not the SUBSET changed-paths derived. printed: [ ${printed_set}] derived: [ ${derived_set}]. The runner mutated a different set of files than the list changed-paths handed it."
              exit 1
            fi
            expected_rows="$subset_claimed"
          fi
          if [ "$file_rows_count" -ne "$expected_rows" ]; then
            if [ "$scope_mode" = "subset" ]; then
              echo "::error::MEASURE_FAIL: the run printed $file_rows_count per-file row(s) but its SUBSET scope line names $expected_rows file(s). A SUBSET run describes exactly the files it mutated; a disagreement means a file was mutated without being described, or described without being mutated."
            else
              echo "::error::MEASURE_FAIL: the run printed $file_rows_count per-file row(s) but reported $files_annotated annotated file(s) on its coverage line. Those are two readings of the same loop; a disagreement means a file was counted as coverage without being described, or described without being counted."
            fi
            exit 1
          fi
          per_file_biting=$(printf '%s\n' "$file_rows" | awk '{ for (i = 1; i <= NF; i++) if ($i == "biting") s += $(i + 1) } END { print s + 0 }')
          case "$per_file_biting" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not sum the per-file biting column."; exit 1;; esac
          if [ "$per_file_biting" -ne "$biting" ]; then
            echo "::error::MEASURE_FAIL: the per-file rows sum to $per_file_biting biting arm(s) but the aggregate 'biting:' line reports $biting. ARMS_FLOOR is compared against the aggregate, so a breakdown that does not add up to it means the floor is bounding a number the report cannot account for."
            exit 1
          fi

          # 164.4.2 / DECISION D, arm (4). ARMS_FLOOR bounds the FULL corpus's
          # biting count. A SUBSET's biting count is over fewer files, so it is
          # NOT compared — comparing it would always fail, and renormalising the
          # floor to the narrowed denominator is the floor-laundering the
          # vacuity fence forbids. The runner states this on its own line; this
          # step requires that line (the runner knew it ran narrowed) and its
          # closing sentence says so rather than claiming both floors held.
          if [ "$scope_mode" = "subset" ]; then
            arms_floor_note=$(grep -a -m1 -E '^ARMS_FLOOR: NOT compared — this SUBSET run ' "$RUNNER_LOG" || true)
            if [ -z "$arms_floor_note" ]; then
              echo "::error::MEASURE_FAIL: the scope line says SUBSET but the run printed NO 'ARMS_FLOOR: NOT compared — this SUBSET run …' line. The runner states the floor it skipped on every SUBSET run; its absence means the scope line and the run that produced the numbers disagree about what ran."
              exit 1
            fi
            echo "$arms_floor_note"
            # Review 164.4.2 WR-03 — what a SUBSET CAN compare. The full
            # corpus's annotated-minus-waived arm total is a static UPPER BOUND
            # on the full run's biting count; the runner prints it on every
            # SUBSET run and exits 1 when it is under the floor. Re-read here out
            # of process, against the floor read from run.mjs above, so a PR that
            # deletes arms below the floor fails before merge, not on main.
            bound_line=$(grep -a -m1 -E '^ARMS_FLOOR \(static upper bound\): [0-9]+ annotated-unwaived (>=|<) floor [0-9]+$' "$RUNNER_LOG" || true)
            if [ -z "$bound_line" ]; then
              echo "::error::MEASURE_FAIL: the scope line says SUBSET but the run printed NO 'ARMS_FLOOR (static upper bound): N annotated-unwaived … floor F' line. The runner compares that bound on every SUBSET run; its absence means the check never ran."
              exit 1
            fi
            echo "$bound_line"
            static_bound=$(echo "$bound_line" | sed -E 's|^ARMS_FLOOR \(static upper bound\): ([0-9]+) .*|\1|')
            case "$static_bound" in ''|*[!0-9]*)
              echo "::error::MEASURE_FAIL: could not read the static bound out of '$bound_line'."; exit 1;; esac
            if [ "$static_bound" -lt "$arms_floor" ]; then
              echo "::error::ARMS_FLOOR regression (static upper bound): $static_bound annotated-unwaived arm(s) < floor $arms_floor. A full-corpus run cannot reach the floor: an annotation was deleted or converted to a waiver without lowering the floor in scripts/mutation-floors.mjs."
              exit 1
            fi
            echo "SUBSET run on a '$event_name' event (${ref_name:-unset ref}): FILES_FLOOR and the waiver ceiling hold and the runner's two tallies agree over the $subset_claimed of $subset_total annotated file(s) this $event_name selected: files $files_annotated >= $files_floor, biting arms $biting (of $arms_executed executed, $lane_invocations arm lane(s) spawned), waived $arms_waived <= $waived_ceiling. ARMS_FLOOR ($arms_floor) was NOT compared against the subset's biting count — it is compared by the nightly full-corpus run and by every FULL run — but its static upper bound holds: $static_bound annotated-unwaived >= $arms_floor. This is NOT full-corpus coverage."
            exit 0
          fi

          if [ "$biting" -lt "$arms_floor" ]; then
            echo "::error::ARMS_FLOOR regression: $biting biting arm(s) < floor $arms_floor. An annotation stopped biting, was deleted, or was converted to a waiver without lowering the floor in scripts/mutation-floors.mjs."
            exit 1
          fi

          echo "Coverage print is present, both floors and the waiver ceiling hold and the runner's two tallies agree: files $files_annotated >= $files_floor, biting arms $biting >= $arms_floor (of $arms_executed executed, $lane_invocations arm lane(s) spawned), waived $arms_waived <= $waived_ceiling."

  plan-anchor-verify:
    # Rationale: docs/ci-yml-notes.md#plan-anchor-verify-1
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Self-test - both measured failure shapes still fire
        # Runs BEFORE the corpus scan, for a reason MEASURED on this repo on
        # 2026-08-29: the pending-plan corpus contained ZERO `path:line` anchors
        # that day. A corpus scan reporting "no stale claims" over a corpus with
        # no range claims in it says nothing at all about whether the range and
        # quote rules still work — so this step proves they do, against the two
        # historical failures as fixtures, before the scan's verdict is allowed
        # to mean anything. Same reasoning as `sql-gate-lint`'s rule self-test.
        run: node scripts/verify-plan-anchors.mjs --self-test

      - name: Re-resolve every pending plan's claims against the tree
        # ⛔ MODE IDENTITY (164.3-RESEARCH Pitfall 2,
        # `reference_gstack_evidence_wrapper_reddens_suite`). The command below
        # is byte-identical to the one in the script's own header and to what a
        # developer runs locally. No wrapper, no flags, no npm alias.
        #
        # stdout goes to a FILE and is `cat` back, not through `| tee`: a PIPE
        # makes `$?` the LAST command's status, a hazard this phase already hit
        # once (a `--self-test` reported FAIL while the shell reported 0). The
        # log also has to survive into the assertion step below, and it lives in
        # RUNNER_TEMP rather than the workspace so it cannot dirty the checkout.
        env:
          ANCHOR_LOG: ${{ runner.temp }}/plan-anchor-verify.log
        run: |
          set -uo pipefail
          node scripts/verify-plan-anchors.mjs --pending > "$ANCHOR_LOG" 2>&1
          status=$?
          cat "$ANCHOR_LOG"
          exit $status

      - name: Assert the scan PRINTED its counts and ran in the mode it claims
        # The counts, made LOAD-BEARING. Without this step, a build of the
        # verifier that silently stopped printing them would pass unnoticed, and
        # a reviewer would have no way to tell a scan of five plans from a scan
        # of none.
        #
        # It also closes the invocation-swap hole: `--self-test` exits 0 having
        # scanned NO plan at all. Its output carries no `scanned: … pending plan
        # file(s) of …` line, so swapping it into the step above to green a red
        # board fails here. That mechanism — not a comment asking nicely — is
        # what keeps the two modes distinct.
        #
        # ⛔ EVERY ASSERTION DISTINGUISHES "could not measure" FROM "measured, no
        # problem": an absent line is a MEASURE_FAIL with its own message, never
        # a silent pass, because an empty shell variable satisfies a numeric
        # `-eq 0` test.
        #
        # ⚠️ WHAT IS DELIBERATELY *NOT* ASSERTED: a floor on the claim count.
        # Zero claims is a LEGITIMATE measurement — it is what a tree whose
        # plans have all been executed reports, and MEASURED on 2026-08-29 the
        # five pending plans carried 16 claims, none of them range anchors. A
        # floor would redden CI for an honest state. The burden of "the rules
        # can still fire" is carried by the self-test step above, which is the
        # only place it can be carried without inventing a number.
        env:
          ANCHOR_LOG: ${{ runner.temp }}/plan-anchor-verify.log
        run: |
          set -euo pipefail

          if [ ! -s "$ANCHOR_LOG" ]; then
            echo "::error::MEASURE_FAIL: $ANCHOR_LOG is missing or empty. The verifier produced no output to check, which is not the same as a clean scan."
            exit 1
          fi

          scanned_line=$(grep -a -m1 -E '^scanned: [0-9]+ pending plan file\(s\) of [0-9]+$' "$ANCHOR_LOG" || true)
          if [ -z "$scanned_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'scanned: N pending plan file(s) of M' line. Either the verifier stopped reporting what it looked at, or the step above was not run in --pending mode (--self-test scans no plan at all)."
            exit 1
          fi
          echo "$scanned_line"

          total_plans=$(echo "$scanned_line" | sed -E 's|^scanned: [0-9]+ pending plan file\(s\) of ([0-9]+)$|\1|')
          case "$total_plans" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the total plan count out of '$scanned_line'."; exit 1;; esac
          # CR-02: zero plan files is TWO different states and they must not
          # share this exit. `/gsd-complete-milestone` moves every phase dir
          # into .planning/milestones/v{X.Y}-phases/, leaving .planning/phases
          # legitimately empty — this repo has already produced that state once
          # (e9a57671). Failing on it reddens the required `frontend` check on
          # EVERY PR until someone creates a phase directory, and the only
          # remedy available is to switch this job off.
          #
          # The verifier now distinguishes them itself: a corpus it cannot
          # locate or READ is a MEASURE_FAIL and never reaches here, and a
          # corpus it opened and enumerated and found empty prints an explicit
          # `measured-zero:` line. So this step demands that line rather than
          # trusting the count — a zero with no measurement behind it is still
          # a MEASURE_FAIL.
          if [ "$total_plans" -eq 0 ]; then
            if grep -a -q -m1 '^measured-zero: ' "$ANCHOR_LOG"; then
              grep -a -m1 '^measured-zero: ' "$ANCHOR_LOG"
              echo "Zero plan files, and the verifier proved it READ the corpus to establish that. Archived corpus accepted."
            else
              echo "::error::MEASURE_FAIL: ZERO plan files found under .planning/phases AND no 'measured-zero:' line was printed. An unmeasured zero is a broken glob, not a clean corpus."
              exit 1
            fi
          fi

          # The deferral exemptions (WR-06) must be REPORTED on every run. A
          # plan can leave the pending set by carrying an explicit deferral
          # marker; if that count ever stopped being printed, plans could be
          # exempted without anyone seeing it.
          deferred_line=$(grep -a -m1 -E '^deferred: [0-9]+ plan file\(s\) exempted by an explicit deferral marker$' "$ANCHOR_LOG" || true)
          if [ -z "$deferred_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'deferred: N plan file(s) …' line. Plans can leave the pending set by carrying a deferral marker, so a run that does not report how many did is hiding its own exemptions."
            exit 1
          fi
          echo "$deferred_line"

          # ⛔ R2-W05: "the line is printed" IS NOT A CONTROL, because nothing
          # compared the print to anything. Both deferral routes — a sibling
          # `<n>-DEFERRED.md`, and `status: deferred` in the plan's own
          # frontmatter — are writable by the SAME PR that adds the plan, so a
          # PR could empty the pending set entirely and this step would still
          # pass, having asserted only that a number appeared.
          #
          # So the VALUE is asserted, against a ratchet pinned by measurement —
          # the same discipline the mutation runner's ARMS_FLOOR uses, and for
          # the same reason: waiver creep is how the thing being waived hides.
          #
          # DEFERRED_CEILING MEASURED 2026-08-29:
          #   node scripts/verify-plan-anchors.mjs --pending
          #   -> scanned: 2 pending plan file(s) of 70
          #      deferred: 1 plan file(s) exempted …   (164.3-07, VAC-07)
          # A SECOND deferral therefore reddens this job until someone raises
          # this number in a reviewed edit to this file — which is exactly the
          # cost an exemption should carry. It never demands fewer.
          #
          # RAISED 1 -> 2 on 2026-10-15 (NAVBREACH records, v0.131.11.2):
          #   -> scanned: 4 pending plan file(s) of 732
          #      deferred: 2 plan file(s) exempted …   (164.3-07, and
          #      166.3.1-03, ABSORBED into DERIBITWEDGE under 166.3.1 D-07)
          DEFERRED_CEILING=2
          deferred_n=$(echo "$deferred_line" | sed -E 's|^deferred: ([0-9]+) plan file\(s\) exempted by an explicit deferral marker$|\1|')
          case "$deferred_n" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the deferral count out of '$deferred_line'."; exit 1;; esac
          if [ "$deferred_n" -gt "$DEFERRED_CEILING" ]; then
            echo "::error::DEFERRAL_CEILING regression: ${deferred_n} plan file(s) are exempted from anchor verification, ceiling is ${DEFERRED_CEILING}. A deferral marker switches this gate off for a plan and is writable by the PR that adds the plan, so growing the exempt set is a deliberate, reviewed edit to DEFERRED_CEILING in ci.yml — not something a PR does to itself."
            exit 1
          fi

          # And the count must not be able to LIE about itself: the verifier
          # prints one `  deferred: <path>  [<marker>]` line per exemption, so
          # the two numbers are produced independently and must agree. A count
          # printed without its detail lines would otherwise satisfy the ceiling
          # above while hiding what it exempted.
          deferred_detail=$(grep -a -c -E '^  deferred: .+  \[.+\]$' "$ANCHOR_LOG" || true)
          deferred_detail=${deferred_detail:-0}
          if [ "$deferred_detail" -ne "$deferred_n" ]; then
            echo "::error::MEASURE_FAIL: the run reports ${deferred_n} exempted plan file(s) but printed ${deferred_detail} exemption detail line(s). The count and the list disagree, so what was exempted is unknown."
            exit 1
          fi
          if [ "$deferred_n" -gt 0 ]; then
            grep -a -E '^  deferred: .+  \[.+\]$' "$ANCHOR_LOG"
          fi

          claims_line=$(grep -a -m1 -E '^claims: [0-9]+ checked$' "$ANCHOR_LOG" || true)
          if [ -z "$claims_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'claims: N checked' line, so the number of claims actually re-resolved is unknown. Unknown is not zero and it is not fine."
            exit 1
          fi
          echo "$claims_line"

          echo "Scan counts are present and the mode is the one this gate requires: $total_plans plan file(s) discovered."

  frontend:
    # Aggregator. Branch protection gates on this single required check;
    # `needs:` enforces that every parallel frontend-* job above passed.
    # `if: always()` + the explicit result-check below is critical: a bare
    # `needs:` chain marks the aggregator as `skipped` (not `failed`) when
    # any upstream fails, and `skipped` checks can satisfy classic GitHub
    # branch protection rules — silently letting broken code merge. The
    # explicit `exit 1` on any non-success forces a definite `failure`
    # status that all branch-protection configurations honor.
    #
    # CI speed (2026-07-02, user decision): `lighthouse-mobile` was REMOVED
    # from this gate (Phase 48-05 / A11Y-03 had wired it into BOTH `needs`
    # and the result-check loop). After coverage folded into the test shards,
    # the perf-budget job was the aggregator's slowest dependency (~+2m on
    # every merge) and its noisiest signal. It is now ADVISORY like e2e: it
    # still runs on every PR and reports its own check — it just no longer
    # blocks this aggregator.
    #
    # Phase 126 / FACTSHEET-02 (2026-07-19): the seed-gated `e2e-seeded` job
    # is now BLOCKING here -- the sfox-badge legs are the go-live gate and
    # were advisory before. It self-skips when `E2E_TEST_DB_CONFIGURED` is
    # unset (fork PRs / repos without test-DB setup), so `skipped` is
    # tolerated FOR THE e2e-seeded ROW ONLY in the loop below; on the main
    # repo the variable is set, the job runs, and a real `failure` reddens
    # this required check. All other rows stay strict (any non-success fails).
    #
    # Phase 140.2 / SEAMCORE-09 (2026-07-26): `frontend-seam-redis` is wired in
    # BOTH places below — `needs:` AND the result loop — because either one
    # alone leaves it advisory. It takes the loop's STRICT default arm and must
    # NEVER be given an `e2e-seeded`-style fork-only-skip tolerance: it consumes
    # no secret and no repo variable, so it runs identically on a fork PR and a
    # `skipped` result there is always a real fault, never a legitimate gate.
    #
    # Phase 158 / OPS-02 (2026-08-20): `sql-tests` is now BLOCKING here, wired
    # into BOTH places below. It was present-and-failing with NOTHING gating on
    # it — and it is the only gate that EXECUTEs the real deployed cron bodies
    # (it caught D-19). Its tolerance arm diverges from `e2e-seeded`'s by one
    # event: its `if:` requires `github.event_name == 'push'` OR a same-repo PR,
    # so it legitimately skips on fork PRs AND on `workflow_dispatch` (the
    # golden-bake route) — a strict arm would redden every manual bake run. A
    # skip on push/same-repo-PR still fails: that means E2E_TEST_DB_CONFIGURED
    # was LOST, the same silent-disable the e2e-seeded arm detects.
    # Wall-clock cost is ACCEPTED: this aggregator now waits on `sql-tests`,
    # which itself needs `python` (~7m) plus its mutex wait. The alternative is
    # the present-but-ungating state this requirement exists to kill.
    # ⚠️ Phase 164.4.2 (2026-09-23) — THE PARAGRAPH ABOVE IS NOW LINEAGE FOR ITS
    # TOLERANCE AND ITS COST, not for the blocking decision, which stands.
    # `sql-tests` runs its corpus on a database private to its own runner: no
    # secret, no repo variable, no `needs: python`, no mutex. It stays wired into
    # BOTH places below, but its row now takes the STRICT default arm (the
    # `sql-mutation` argument, cited in `sql-tests`'s own header) and it no longer
    # queues behind `python`. The tolerance arm and both of its skip causes MOVED to
    # `test-db-drift`, the job that now carries VAC-08, the secret, the `if:` and the
    # `needs: python` edge — and so the wait on `python` plus a mutex acquire moved
    # with it. `test-db-drift` is wired into BOTH places below for the same reason
    # as every row here: `needs:` alone only makes this aggregator WAIT for a job;
    # only the result row makes it JUDGE one.
    # Phase 164.3 / VAC-03 (2026-08-29): `sql-gate-lint` is BLOCKING here, wired
    # into BOTH places below — either one alone leaves it advisory, the same trap
    # SEAMCORE-09 recorded for `frontend-seam-redis`. It takes the loop's STRICT
    # default arm and must NEVER be given a tolerance arm: it is hermetic (no
    # database, no Docker, no secrets, no network), so it runs identically on a
    # fork PR, a same-repo PR, a push and a workflow_dispatch. It therefore has
    # no legitimate skip, and a `skipped` result there is always a real fault —
    # exactly the `frontend-seam-redis` reasoning, and the OPPOSITE of the
    # `test-db-drift` / `e2e-seeded` rows, whose tolerances exist only because those
    # jobs consume a repo variable a fork cannot see.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply to this
    # one: that ban exists because those jobs share the TEST advisory-lock mutex
    # and their `if:` conditions diverge, so a chain edge can silently skip a
    # dependent. `sql-gate-lint` touches no shared resource, has no `if:`, and
    # runs on every event — it cannot skip a dependent and cannot queue behind
    # the mutex.
    # (2026-09-26, Phase 164.9.4: ci.yml holds no shared-test-db key; the holders are supabase-migrate.yml apply-test and test-restore-from-baseline.yml restore, the probe is mutex-probe.yml, and analytics-deploy-verify.yml only names the key in issue text.)
    #
    # Phase 164.3 / VAC-01 (2026-08-29): `sql-mutation` is BLOCKING here, wired
    # into BOTH places below for the same reason as its siblings — either one
    # alone leaves it advisory. It takes the loop's STRICT default arm and must
    # NEVER be given a tolerance arm: it consumes no secret and no repo
    # variable, hosts its own throwaway PostgreSQL clusters, and carries no
    # `if:`, so it runs identically on a fork PR, a same-repo PR, a push and a
    # workflow_dispatch. It has no legitimate skip, so a `skipped` there is
    # always a real fault — the `frontend-seam-redis` / `sql-gate-lint`
    # reasoning, and the OPPOSITE of the `test-db-drift` / `e2e-seeded` rows.
    # ⭐ WHAT REDDENS IT: an annotated gate arm whose declared mutation no longer
    # makes that arm the FIRST failure. That is the "control that cannot fail"
    # class — every instance of which was GREEN in this workflow before this job
    # existed — so a strict row is the whole point of building it.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply to it:
    # that ban exists because those jobs share the TEST advisory-lock mutex and
    # their `if:` conditions diverge, so a chain edge can silently skip a
    # dependent. `sql-mutation` shares no resource, waits on no mutex, and
    # deliberately never touches the shared TEST database (D-07).
    # (2026-09-26, Phase 164.9.4: ci.yml holds no shared-test-db key; the holders are supabase-migrate.yml apply-test and test-restore-from-baseline.yml restore, the probe is mutex-probe.yml, and analytics-deploy-verify.yml only names the key in issue text.)
    #
    # Phase 164.3 / VAC-05 (2026-08-29): `plan-anchor-verify` is BLOCKING here,
    # wired into BOTH places below — either one alone leaves it advisory, the
    # trap SEAMCORE-09 recorded for `frontend-seam-redis`.
    # ⚠️ ITS ROW IS THE ONE EXCEPTION TO "hermetic ⇒ no tolerance arm", and the
    # reason is a TRIGGER, not a credential. The job carries
    # `if: github.event_name == 'pull_request'` because `.planning/` is TRACKED
    # and plans merge to main BEFORE they execute, so a pending plan whose
    # anchor drifts on main would redden main CI — and Railway waits on main CI
    # and SKIPS the analytics-service deploy when it is red (D-13's reasoning,
    # applied rather than re-decided). It therefore SKIPS BY DESIGN on push and
    # on workflow_dispatch, and that skip is tolerated FOR THIS ROW ONLY.
    # On a `pull_request` — the event its `if:` admits and the event where a
    # stale anchor actually matters, because execution happens on a branch —
    # the row is STRICT: the job consumes no secret and no repo variable, so it
    # runs identically on a fork PR and any non-success there is a real fault.
    #
    # NOTE: this `needs:` entry is NOT one of the ⛔-banned chain edges among the
    # DB-touching jobs (see the notes on `test-db-drift` / `e2e-seeded`). Those are
    # banned because a skipped `needs:` job SKIPS its dependents; this job
    # carries `if: always()`, so an upstream skip reaches the loop below as a
    # RESULT to judge rather than skipping the gate.
    #
    # Phase 164.5 / VAC-07 (2026-09-07): `frontend-local-stack` is BLOCKING here,
    # wired into BOTH places below — either one alone leaves it advisory, the trap
    # SEAMCORE-09 recorded for `frontend-seam-redis`.
    # ⭐ AND HERE IT IS MORE THAN THE USUAL TRAP. The spec that job runs is EXCLUDED
    # from the sharded `frontend-test` run on purpose (`vitest.local-stack-files.ts`),
    # so this row is not "one more gate" — it is the ONLY place that spec executes.
    # An advisory row would leave the concurrent csv-finalize race asserted nowhere
    # while reading as covered, which is `csv-finalize-rpc.test.ts`'s tombstone with a
    # new name.
    # It takes the loop's STRICT DEFAULT ARM and must NEVER be given a tolerance arm:
    # it consumes no secret and no repository variable, carries no `if:` and no
    # `needs:`, and hosts its own Supabase stack in Docker containers private to its
    # runner (`scripts/local-stack/run.sh` REFUSES a non-local DSN, so it reaches
    # neither shared TEST nor PROD). It therefore runs identically on a fork PR, a
    # same-repo PR, a push and a workflow_dispatch, has no legitimate skip, and a
    # `skipped` there is always a real fault — the `frontend-seam-redis` /
    # `sql-gate-lint` / `sql-mutation` reasoning, and the OPPOSITE of the `test-db-drift` /
    # `e2e-seeded` rows.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply to it, for the
    # same reason as `sql-mutation`: that ban exists because those jobs share the TEST
    # advisory-lock mutex and their `if:` conditions diverge, so a chain edge can
    # silently skip a dependent. This job shares no resource and waits on no mutex.
    # The full argument, including the timeout derivation, is in the job's own header.
    # (2026-09-26, Phase 164.9.4: ci.yml holds no shared-test-db key; the holders are supabase-migrate.yml apply-test and test-restore-from-baseline.yml restore, the probe is mutex-probe.yml, and analytics-deploy-verify.yml only names the key in issue text.)
    #
    # Phase 164.9 plan 08 / criterion 13 (2026-09-21): `frontend-live-db-lane` is
    # BLOCKING here, wired into BOTH places below — either one alone leaves it
    # advisory, the trap SEAMCORE-09 recorded for `frontend-seam-redis` and VAC-07
    # recorded again for `frontend-local-stack`.
    # ⭐ AND LIKE THAT ROW IT IS MORE THAN ONE MORE GATE. The ~49 specs it runs are
    # gated on `HAS_LIVE_DB` and SKIP in every vitest shard, and the `frontend-test`
    # job forbids fixing that with credentials because doing so would invalidate the
    # ratchet baseline a blocking gate rests on. So this job is the ONLY place that
    # class executes. An advisory row would leave it reading as covered while
    # asserting nothing — `csv-finalize-rpc.test.ts`'s tombstone with a new name.
    # It takes the loop's STRICT DEFAULT ARM and must NEVER be given a tolerance arm:
    # it consumes no secret and no repository variable (its credentials are minted by
    # the stack it boots), and it hosts that stack in containers private to its own
    # runner, so it runs identically on a fork PR, a same-repo PR, a push and a
    # workflow_dispatch. It has no legitimate skip, and a `skipped` there is always a
    # real fault — the `frontend-seam-redis` / `sql-gate-lint` / `sql-mutation` /
    # `frontend-local-stack` reasoning, and the OPPOSITE of the `test-db-drift` /
    # `e2e-seeded` rows.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply to it, for the
    # same reason as `frontend-local-stack`: that ban exists because those jobs share
    # the TEST advisory-lock mutex and their `if:` conditions diverge, so a chain edge
    # can silently skip a dependent. This job shares no resource and waits on no
    # mutex. Its only `needs:` edge is the docs-only detector, and this aggregator
    # carries `if: always()`, so an upstream skip arrives as a RESULT to judge.
    # (2026-09-26, Phase 164.9.4: ci.yml holds no shared-test-db key; the holders are supabase-migrate.yml apply-test and test-restore-from-baseline.yml restore, the probe is mutex-probe.yml, and analytics-deploy-verify.yml only names the key in issue text.)
    # Wall clock is ACCEPTED: this aggregator now waits on a SECOND container-booting
    # job. The two are independent and run in parallel, so the cost is the slower of
    # the two rather than their sum, and it buys a previously ungated class a place
    # where it can go RED. The full argument is in the job's own header.
    #
    # Phase 164.6.3 / CI-DOCSPATH-01 (2026-09-12): `changed-paths` joins `needs:`
    # below — read for its `outputs.docs_only`, NOT for its result. It gets no row
    # in the result loop; what it contributes is the one boolean the loop's uniform
    # docs-only arm is driven by.
    # NOTE: this `needs:` entry is NOT one of the ⛔-banned chain edges among the
    # DB-touching jobs, for the same two reasons already recorded for
    # `plan-anchor-verify` and `sql-gate-lint`: this aggregator carries
    # `if: always()`, so an upstream skip reaches the loop as a RESULT to judge
    # rather than skipping the gate, and `changed-paths` itself shares no resource,
    # waits on no mutex and carries no `if:` at all.
    # ⚠️ Keep the `needs:` list below a CONTIGUOUS run of `      - <name>` lines
    # with no interleaved comments: `critical-regressions.test.ts` parses it with
    # `/^ {4}needs:\n(?: {6}- [\w-]+\n)+/m` and a comment between entries makes that
    # gate report "no needs: list found" — measured here 2026-09-12, which is why
    # this paragraph lives in the header instead of beside the entry it describes.
    runs-on: ubuntu-latest
    needs:
      - changed-paths
      - frontend-typecheck
      - frontend-lint
      - frontend-test
      - frontend-coverage
      - frontend-seam-redis
      - frontend-local-stack
      - frontend-live-db-lane
      - frontend-policy
      - frontend-build
      - e2e-seeded
      - sql-tests
      - test-db-drift
      - sql-gate-lint
      - sql-mutation
      - plan-anchor-verify
    if: always()
    steps:
      - name: Verify all frontend-* jobs succeeded
        run: |
          fail=0
          # ── Phase 164.6.3 / CI-DOCSPATH-01 — the ONE uniform docs-only arm ──
          # ⛔ THIS IS NOT A PER-ROW TOLERANCE ARM. It is ONE predicate, driven by
          # ONE detector output, applied to every row EXCEPT the rows named in the
          # declared ALWAYS_ON list below. The four job headers above that forbid a
          # per-row tolerance arm BY NAME — frontend-seam-redis, sql-gate-lint,
          # sql-mutation, frontend-local-stack — are therefore not breached: not one
          # of them is given an arm of its own, and none of their no-legitimate-skip
          # reasoning is weakened. What changed is WHEN those jobs are invoked, which
          # is a different claim from what a `skipped` result means when they are.
          #
          # On a CODE PR this whole block is INERT: `docs_only` is not 'true', the
          # first conjunct is false for every row, and every row takes BYTE-
          # IDENTICALLY the path it took before this phase existed. That is the
          # phase's criterion 2 as a structural property rather than a hope.
          #
          # ⭐ WHY THIS ARM IS FIRST IN THE CHAIN AND NOT APPENDED TO THE END.
          # Appended after the existing arms it would be UNREACHABLE on exactly the
          # PRs this phase exists to speed up: `e2e-seeded`'s arm and `test-db-drift`'s
          # arm (`sql-tests`' until Phase 164.4.2) both compute `is_fork_pr=false`
          # on a same-repo PR, so a `skipped` there falls into their `else` and sets fail=1 before control could ever
          # reach a later branch. The board would be RED on every docs-only PR.
          # Placing it first is required for correctness, and it is also what makes
          # the "one arm, not a per-row tolerance" claim true on inspection.
          docs_only='${{ needs.changed-paths.outputs.docs_only }}'
          # The declared list of aggregator rows the docs-only filter may NEVER skip.
          # DERIVED, not guessed: it is the five always-on job keys (plan-anchor-verify,
          # secret-scan, version-gate, docs-link-check, frontend-lint) INTERSECTED with
          # this aggregator's own `needs:` list. Exactly two survive — the other three
          # are not rows in this loop at all, so naming them here would be decoration.
          #   - plan-anchor-verify: its whole subject IS `.planning/**`, so a docs-only
          #     PR is the PR where it matters most. A skip of this row is never excused
          #     here; it falls through to its own strict arm below.
          #   - frontend-lint: `npm run lint` also runs `scripts/check-planning-hygiene.ts`,
          #     the leak gate on a PUBLIC repo with `.planning/` TRACKED, whose subject is
          #     precisely a `.planning/`-only agent-written diff.
          # ⚠️ frontend-lint CANNOT reach a `skipped` result today — it carries no `if:`
          # and no `needs:` edge, so this arm can never see it. Its membership is DEFENCE
          # IN DEPTH: it costs one word, and it is the only shell-level barrier if a
          # future edit ever gives that job a skip route. ⛔ Do not delete it as dead
          # weight; unreachable-today is why it is cheap, not why it is useless.
          ALWAYS_ON="plan-anchor-verify frontend-lint"
          echo "docs-only filter: docs_only='${docs_only}' always_on='${ALWAYS_ON}'"
          for r in \
            "frontend-typecheck=${{ needs.frontend-typecheck.result }}" \
            "frontend-lint=${{ needs.frontend-lint.result }}" \
            "frontend-test=${{ needs.frontend-test.result }}" \
            "frontend-coverage=${{ needs.frontend-coverage.result }}" \
            "frontend-seam-redis=${{ needs.frontend-seam-redis.result }}" \
            "frontend-local-stack=${{ needs.frontend-local-stack.result }}" \
            "frontend-live-db-lane=${{ needs.frontend-live-db-lane.result }}" \
            "frontend-policy=${{ needs.frontend-policy.result }}" \
            "frontend-build=${{ needs.frontend-build.result }}" \
            "e2e-seeded=${{ needs.e2e-seeded.result }}" \
            "sql-tests=${{ needs.sql-tests.result }}" \
            "test-db-drift=${{ needs.test-db-drift.result }}" \
            "sql-gate-lint=${{ needs.sql-gate-lint.result }}" \
            "sql-mutation=${{ needs.sql-mutation.result }}" \
            "plan-anchor-verify=${{ needs.plan-anchor-verify.result }}"; do
            name="${r%=*}"; result="${r#*=}"
            echo "$name: $result"
            case " $ALWAYS_ON " in *" $name "*) filterable=false;; *) filterable=true;; esac
            # Three independent conjuncts must ALL hold, which is why this cannot
            # green a code PR: the detector must have said exactly 'true' (it is the
            # empty string when `changed-paths` failed or was cancelled, so a broken
            # detector reddens rather than excuses), the row must not be ALWAYS_ON,
            # and the result must be exactly `skipped` — a `failure` or `cancelled`
            # falls through to the pre-existing arms untouched.
            if [ "$docs_only" = "true" ] && [ "$filterable" = "true" ] && [ "$result" = "skipped" ]; then
              echo "$name: skipped by the docs-only path filter (changed-paths said docs_only=true); tolerated UNIFORMLY, not per-row."
            elif [ "$name" = "e2e-seeded" ]; then
              # Phase 126 / FACTSHEET-02 + RT-01 canary: e2e-seeded is BLOCKING
              # (the sfox-badge legs are the go-live gate). It legitimately
              # self-skips ONLY on a FORK PR — a different head repo has no
              # access to the test-DB variable. (2026-10-02, review 164.9.4
              # round 2 LOW-02: since Phase 164.9.4 the job reads no secret and
              # touches no shared database, so the fork exclusion in its `if:` is
              # an inherited gate, not an access requirement; the echo below says
              # so. Dropping the exclusion is a separate decision, not taken here.)
              # On a push to main OR a same-repo
              # PR, a `skipped` result means E2E_TEST_DB_CONFIGURED was LOST
              # (which ALSO silently disables test-db-drift, and with it VAC-08), so a skip there is NOT
              # tolerated: the gate must redden rather than green-wash an
              # untested go-live badge (RT-01 red-team H4 — the #1 silent-green).
              is_fork_pr='${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$is_fork_pr" = "true" ]; then
                echo "e2e-seeded skipped (fork PR — the job's if: excludes fork PRs; it reads no test-DB secret since Phase 164.9.4); tolerated for this row only."
              else
                echo "::error::e2e-seeded result=$result on a TRUSTED event (push/same-repo). The go-live badge gate MUST run here — E2E_TEST_DB_CONFIGURED may be unset (this also disables test-db-drift, and with it VAC-08). A skip is not tolerated."
                fail=1
              fi
            elif [ "$name" = "test-db-drift" ]; then
              # ⭐ `sql-tests` has NO arm of its own since Phase 164.4.2: it runs on a
              # private database, cannot legitimately skip, and falls to the STRICT
              # default arm at the bottom — the argument is `sql-mutation`'s, cited
              # in `sql-tests`'s own header.
              #
              # Phase 164.4.2: this is the tolerance arm `sql-tests` carried from
              # Phase 158 / OPS-02 until its corpus moved off shared TEST. It moved
              # WITH its reason: `test-db-drift` now holds the secret, the
              # configured-variable gate and the `needs: python` edge, so it is the
              # job that can legitimately be skipped. It stays BLOCKING — VAC-08 is
              # the only repo-vs-TEST ledger and function-body drift check.
              # Its `if:` requires `github.event_name == 'push'` OR a same-repo PR,
              # so unlike e2e-seeded it ALSO skips by design on `workflow_dispatch`
              # (the golden-bake route); a strict arm would redden every bake run.
              # Both skip-by-design routes are tolerated FOR THIS ROW ONLY. A skip
              # on push/same-repo-PR is NOT tolerated — but it has TWO possible
              # causes, and this loop cannot tell them apart.
              #
              # 158-REVIEW WR-04 (written for `sql-tests`, true here for the same
              # reason): the message used to assert only one of them
              # ("E2E_TEST_DB_CONFIGURED was LOST"), which is FALSE in the more
              # common case. This job carries `needs: [python]`, and a skipped or
              # failed `needs:` job SKIPS its dependents — so an ordinary `python`
              # failure lands here as `test-db-drift=skipped`, and a message naming
              # only the variable would send the operator to check it when the real
              # signal is a red `python` check on the very same run. The gate
              # reddening is right; a confidently wrong stated cause is a real cost
              # under this repo's fail-loud-and-ACCURATE doctrine.
              #
              # `python` is deliberately NOT added to this aggregator's `needs:`
              # just to read its result: the mutex design forbids new `needs:`
              # edges among the DB-touching jobs (their `if:` conditions diverge
              # on `workflow_dispatch`). Naming both causes, cheapest-to-check
              # first, costs nothing and misleads no one.
              is_fork_pr='${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}'
              is_dispatch='${{ github.event_name == 'workflow_dispatch' }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && { [ "$is_fork_pr" = "true" ] || [ "$is_dispatch" = "true" ]; }; then
                echo "test-db-drift skipped (fork PR: $is_fork_pr / workflow_dispatch: $is_dispatch — its if: excludes both); tolerated for this row only."
              else
                if [ "$result" = "skipped" ]; then
                  echo "::error::test-db-drift result=skipped on a TRUSTED event (fork_pr=$is_fork_pr, dispatch=$is_dispatch — only a skip on one of those is tolerated). TWO causes produce this, check in order: (1) its \`needs: python\` dependency did not succeed — look at the \`python\` check on THIS run first, and if it is red that is your answer and E2E_TEST_DB_CONFIGURED is NOT implicated; (2) otherwise E2E_TEST_DB_CONFIGURED was LOST, the same silent-disable the e2e-seeded arm above detects — the one that would leave VAC-08's repo-vs-TEST drift check quietly absent from every merge."
                else
                  echo "::error::test-db-drift result=$result (fork_pr=$is_fork_pr, dispatch=$is_dispatch). VAC-08 — the repo-vs-TEST ledger and function-body drift check — did not pass. This job has held no shared-TEST key since Phase 164.4.2.1, so it is NEVER a mutex acquire timeout. Three causes, check in order: (1) its ordering wait printed \`wait-outcome: wait-exhausted\` (a TEST apply or a dispatched restore was still running; runbook docs/runbooks/shared-test-db-mutex.md section 7.3); (2) on a pull_request run, which has no ordering wait, VAC-08 overlapped a TEST writer (apply-test or a restore) — re-run once supabase-migrate.yml and test-restore-from-baseline.yml are idle (runbook section 0); (3) otherwise VAC-08 itself found real drift, named in its own step log."
                fi
                fail=1
              fi
            elif [ "$name" = "plan-anchor-verify" ]; then
              # Phase 164.3 / VAC-05: BLOCKING, and STRICT on the only event it
              # runs on. Its `if:` scopes it to `pull_request` so that a pending
              # plan's anchor drifting on main cannot redden main CI and stall
              # the Railway analytics deploy (D-13's reasoning; the full
              # argument is in the job's own header and in the note above).
              # A skip on push / workflow_dispatch is therefore skip-by-design
              # and tolerated FOR THIS ROW ONLY. On a pull_request the job is
              # hermetic — no secret, no repo variable, no network — so it runs
              # identically on a fork PR and ANY non-success, skip included, is
              # a real fault.
              is_pr='${{ github.event_name == 'pull_request' }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$is_pr" != "true" ]; then
                echo "plan-anchor-verify skipped (event is not pull_request — its if: scopes it there on purpose); tolerated for this row only."
              else
                echo "::error::plan-anchor-verify result=$result on a pull_request (is_pr=$is_pr). The pending plans' anchors were NOT re-resolved against the tree. A skip here means the job's if: was changed or the job was removed — it consumes no secret and cannot legitimately skip on a PR, fork or not."
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more frontend-* jobs did not succeed."
            exit 1
          fi
          echo "All frontend-* jobs succeeded."

  sql-tests:
    # Rationale: docs/ci-yml-notes.md#sql-tests-1
    needs: [changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `packages: read` is for the ghcr.io login step (164.4.2-08). A job-level
    # block REPLACES the workflow-level one, so the workflow's scopes are
    # restated here unchanged - nothing but `packages: read` is added.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. This job does no git op beyond
          # the currency guard's read-only `git log`; the persisted cred is pure
          # attack surface.
          # ⛔ CORRECTED 2026-09-23 (Phase 164.4.2 plan 08, D-F): this job does NO
          # git op at all now — the currency guard's `--replay-set` mode reads the
          # committed marker, the dump's sha256 and the migrations directory on
          # disk, not `git log`. The persisted cred stays dropped for the same reason.
          persist-credentials: false
          # 📜 LINEAGE: this checkout used to fetch FULL HISTORY (`fetch-depth: 0`),
          # the reason `frontend-local-stack` checked out the same way: the lane's
          # currency guard then compared `git log -1 --format=%ct` for the dump and
          # the migrations directory, and on a shallow clone both report the one
          # clone commit, compare equal, and the guard measures nothing.
          # ⛔ CORRECTED 2026-09-23 (Phase 164.4.2 plan 08, D-F): MEASURED per job, no
          # step here runs `git`, and neither `run.sh` (with the currency gate and the
          # reference-data extractor it calls) nor the capability probe spawns one.
          # The default shallow clone is enough; full history was dropped.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          # ⚠️ NO `cache: npm`, and NO node_modules restore / `npm ci`, unlike the
          # `frontend-local-stack` preamble this job otherwise copies. That job runs
          # vitest; this one runs only node scripts whose imports are `node:`
          # built-ins (the currency gate, the reference-data extractor `run.sh up`
          # calls, and the capability probe) — measured by reading their imports.
          # Installing node_modules here would be work nothing consumes, on the job
          # whose own wall clock Area E clause (b) measures.
      - name: Baseline currency - name the migrations the lane replays on top of the dump
        # The same `--check-currency` seam `frontend-local-stack` runs, for the same
        # two reasons: the replay set gets its own named `baseline-replay:` line in
        # this job's log before any container starts, and an edit that drops the
        # call out of `load_baseline()` fails HERE instead of booting quietly. It
        # determines that set from the committed marker (D-F, Phase 164.4.2 plan 06)
        # and FAILS LOUD when it cannot. Needs node built-ins only — no
        # node_modules, no git history.
        run: bash scripts/local-stack/run.sh --check-currency
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        with:
          # The SAME pin `frontend-local-stack` uses — the repo keeps ONE answer to
          # "which CLI". The skew note on that job's setup-cli step applies here
          # unchanged.
          version: 2.98.2
      - name: Log in to ghcr.io before the CLI pulls its images
        # 164.4.2-08 checkpoint RED -> fix (2026-09-23). `run.sh up` below runs
        # `supabase start`, which pulls the stack images.
        # Same step and same reasons as ci.yml's `frontend-local-stack` login: the CLI
        # pulls from ghcr.io (setup-cli sets SUPABASE_INTERNAL_IMAGE_REGISTRY), anonymous
        # GHCR pulls from shared runners are throttled, and the CLI reads credentials
        # from the docker config this writes. A failed login FAILS THE JOB - it never
        # degrades into the anonymous pull. Pinned by
        # `src/__tests__/contracts/ghcr-login-before-image-pull.contract.test.ts`.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Install psql client
        timeout-minutes: 8
        # Two consumers now: `run.sh up` loads the baseline through psql, and the
        # capability probe and the corpus loop below connect with it.
        # Phase 164.9.8 APTHANG: apt goes through the wall-clock-bounded wrapper,
        # which skips apt entirely when the runner image already ships psql.
        run: |
          set -euo pipefail
          bash scripts/ci-apt.sh install --provides psql postgresql-client
          psql --version
      - name: Preflight - reject psql meta-commands in test files (Finding 6)
        # Reject any test file containing psql meta-commands that could
        # exfiltrate secrets from the runner. Specifically:
        #   \!       — shell escape (executes any shell command, can
        #              read env vars / curl them out)
        #   \copy    — client-side file IO (can read /etc/passwd,
        #              the workflow's environment dumps, etc.)
        #   \o ...   — redirect query output to a file (can persist
        #              secrets into an artifact)
        #   \COPY    — upper-case form of \copy
        # All four are PSQL CLIENT-side; the server's check_function
        # cannot help. We refuse them at the file level.
        #
        # We deliberately use plain grep (no -P) so the patterns are
        # ERE-portable, and \\! requires single-quoting to keep the
        # backslash literal through the shell.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/tests/test_*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No supabase/tests/test_*.sql files to scan."
            exit 0
          fi
          bad=0
          for f in "${files[@]}"; do
            # Each pattern is its own grep so the error message can name
            # the exact meta-command that triggered the reject.
            if grep -nE '^\\\!|^\\!| \\\!| \\!' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\!' (shell escape) — refused by Finding 6 preflight"
              bad=1
            fi
            if grep -nE '\\copy\b' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\copy' (client file IO) — refused by Finding 6 preflight"
              bad=1
            fi
            if grep -nE '\\COPY\b' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\COPY' (client file IO) — refused by Finding 6 preflight"
              bad=1
            fi
            if grep -nE '^\\o |^\\o$| \\o ' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\o' (output redirect) — refused by Finding 6 preflight"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "::error::One or more SQL test files contain a refused psql meta-command."
            exit 1
          fi
          echo "Preflight clean: ${#files[@]} test file(s) free of refused meta-commands."
      - name: Boot the local-stack lane (Supabase CLI stack + committed baseline)
        # The same boot `frontend-local-stack` runs, pasted verbatim (a wrapped run is
        # a different run). `up` starts the stack in a lane-owned workdir, refuses a
        # non-local API URL, determines and prints the replay set (refusing when it
        # cannot be determined), loads the committed baseline and the allowlisted
        # reference data, replays the named migrations on top (FATAL on the first
        # one that errors, then a `replay complete:` line), and writes
        # the mode-600 `scripts/local-stack/.stack-env` handoff the next two steps
        # read. On a failed `up`, run.sh's own trap stops the stack.
        run: bash scripts/local-stack/run.sh up
      - name: Capability probe - does the lane supply what the SQL self-test corpus demands
        # Phase 164.4.2 plan 04's probe, run on THIS job's own lane and FATAL here
        # on every verdict but SUFFICIENT. The run body is `frontend-local-stack`'s
        # step with exactly ONE change: `verdict INSUFFICIENT` is an ::error:: and
        # exit 1 instead of a ::warning::. That is the hand-off plan 04 wrote into
        # that step's comment, taken in the job whose corpus actually depends on the
        # capabilities (pg_net, supabase_vault, auth.uid()/auth.jwt(), the platform
        # roles, pg_cron). Every MEASURE_FAIL arm is kept exactly as it was: an
        # absent line, an unreadable count or state, an unrecognised token, no class
        # tokens, or an exit status that contradicts the printed verdict each fail by
        # name. An absent verdict is never a zero.
        # MEASURED before this step existed: run 35816624285 (head 381501e1),
        # `frontend-local-stack` printed `verdict SUFFICIENT` on the same boot.
        # ⛔ It sits AFTER `run.sh up` and BEFORE the corpus step, on purpose: after,
        # because supply is read from the booted lane's catalogue; before, because a
        # corpus run on an INSUFFICIENT lane would fail on the missing capability
        # and name the wrong cause.
        # Captured to a file and `cat` back rather than piped through `tee`, for the
        # `sql-mutation` reason: a pipe makes `$?` the last command's status.
        env:
          PROBE_LOG: ${{ runner.temp }}/capability-probe.log
        run: |
          set -euo pipefail
          set +e
          node scripts/local-stack/capability-probe.mjs > "$PROBE_LOG" 2>&1
          status=$?
          set -e
          cat "$PROBE_LOG"
          # `|| true` is LOAD-BEARING under `set -euo pipefail`, not tidiness. grep
          # exits 1 on an absent line, which would abort the step with no ::error::
          # and leave the named MEASURE_FAIL below unreachable.
          probe_line=$(grep -a -m1 -E '^stack-probe: ' "$PROBE_LOG" || true)
          if [ -z "$probe_line" ]; then
            echo "::error::MEASURE_FAIL: the capability probe printed NO 'stack-probe:' line (exit ${status}), so what this lane supplies against what the SQL self-test corpus demands is unknown. An absent line is never a zero and never a pass."
            exit 1
          fi
          verdict=$(echo "$probe_line" | sed -n -E 's/^stack-probe: .* verdict ([A-Z_]+)$/\1/p')
          case "$verdict" in
            SUFFICIENT) expected_status=0 ;;
            INSUFFICIENT) expected_status=2 ;;
            MEASURE_FAIL)
              echo "::error::MEASURE_FAIL: the capability probe could not measure the lane or the corpus (exit ${status}). Its ::error:: lines above name the cause. Unknown is not absent and it is not present."
              exit 1 ;;
            *)
              echo "::error::MEASURE_FAIL: could not read a verdict out of '${probe_line}'."
              exit 1 ;;
          esac
          if [ "$status" -ne "$expected_status" ]; then
            echo "::error::MEASURE_FAIL: the probe printed 'verdict ${verdict}' but exited ${status} (expected ${expected_status}). The line and the status come from one run and cannot disagree; a claim its own exit status contradicts is not a measurement."
            exit 1
          fi
          # Every token must read, or the line is not a measurement. The class list
          # is NOT restated here: the probe owns it, so a class added there needs
          # no edit here.
          read -r -a probe_tokens <<< "${probe_line#stack-probe: }"
          classes=0
          for tok in "${probe_tokens[@]}"; do
            case "$tok" in
              verdict|SUFFICIENT|INSUFFICIENT) ;;
              corpus=*|lane-only-excluded=*)
                case "${tok#*=}" in ''|*[!0-9]*)
                  echo "::error::MEASURE_FAIL: unreadable count '${tok}' on '${probe_line}'."; exit 1 ;; esac ;;
              *=*/*)
                classes=$((classes + 1))
                demand="${tok#*=}"; demand="${demand%%/*}"; state="${tok##*/}"
                case "$demand" in ''|*[!0-9]*)
                  echo "::error::MEASURE_FAIL: unreadable demand in '${tok}' on '${probe_line}'."; exit 1 ;; esac
                case "$state" in present|absent) ;; *)
                  echo "::error::MEASURE_FAIL: unreadable supply state in '${tok}' on '${probe_line}'."; exit 1 ;; esac ;;
              *)
                echo "::error::MEASURE_FAIL: unrecognised token '${tok}' on '${probe_line}'."; exit 1 ;;
            esac
          done
          if [ "$classes" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the 'stack-probe:' line names NO capability class, so nothing was compared."
            exit 1
          fi
          echo "stack-probe measured: ${classes} class(es), verdict ${verdict}"
          if [ "$verdict" = "INSUFFICIENT" ]; then
            echo "::error::stack-probe verdict INSUFFICIENT: this lane lacks a capability the SQL self-test corpus demands (named on the 'unsatisfied:' lines above), and this job runs that corpus on it next. A file that needs an absent capability would fail for a reason that is not about its own subject, so the run stops here and names the cause. Fatal in THIS job since Phase 164.4.2 plan 05; see the step comment."
            exit 1
          fi
      - name: Run SQL self-tests against the local-stack lane
        env:
          # Phase 164.4.2: the database is the LANE's, not a secret's. This names
          # WHERE the boot step's mode-600 handoff lives; the DSN itself is read
          # out of it below and never echoed. A path, not a value, so a contract
          # test can point it at a stub handoff without touching the real one.
          LANE_ENV_FILE: ${{ github.workspace }}/scripts/local-stack/.stack-env
        run: |
          set -euo pipefail
          # THE DSN IS STILL REQUIRED, AND STILL FAIL-LOUD (Issue 6 is specifically
          # about the silent-no-op surface). It is read with the SAME sed
          # `scripts/local-stack/run.sh`'s own `load_baseline()` uses on this
          # handoff, and refused by the SAME parse-based rule (a parsed host, a
          # port, no query string) — review 164.4.2 WR-08 replaced the
          # `*@127.0.0.1:*` glob here and in run.sh, which accepted a ?host= or
          # hostaddr= override. The capability probe step above already applied
          # that rule and is fatal, so this is the second check, not the only one.
          # An absent handoff means the boot step did not finish — never "nothing
          # to test".
          lane_env_file="${LANE_ENV_FILE:-scripts/local-stack/.stack-env}"
          LANE_DB_URL="$(sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${lane_env_file}" 2>/dev/null | head -1 || true)"
          if [ -z "${LANE_DB_URL}" ]; then
            echo "::error::the local-stack lane's DB_URL is required to run SQL self-tests, and ${lane_env_file} carries none (absent, unreadable, or no DB_URL line)."
            echo "::error::It is written by 'bash scripts/local-stack/run.sh up' in the boot step above. If that step failed or was skipped, this corpus has no database, and a run with no database proves NOTHING."
            exit 1
          fi
          if ! LOOPBACK_DSN="${LANE_DB_URL}" node "${GITHUB_WORKSPACE}/scripts/local-stack/capability-probe.mjs" --refuse-nonlocal-dsn; then
            echo "::error::refusing to run SQL self-tests: the lane handoff's DB_URL is not a loopback DSN (127.0.0.1/localhost, one host, a port, no query string). This job is local-only — TEST is shared and PROD is PROD."
            exit 1
          fi
          # LANE-ONLY exclusion — a file whose assertion body queries an
          # object that exists ONLY on the throwaway pg-lane
          # (scripts/pg-lane/run.sh's cluster), never on shared TEST — and, since
          # Phase 164.4.2, never on the local-stack lane this step now runs on
          # either (see the job header for why the exclusion still holds), declares
          # that fact in a single `-- LANE-ONLY: {json}` header line (the same
          # JSON-in-comment idiom `RED-UNDER-SETUP` already uses). This
          # predicate reads that line straight out of the file's TEXT — never
          # psql's runtime output — so the decision is made BEFORE `psql -f`
          # is ever invoked. Defined ONCE, used in both the pre-loop census
          # and the per-file loop below, so the printed set and the skipped
          # set cannot drift apart.
          #
          # THE DISTINCTION FROM WR-03, ARGUED. A whole-file printed SKIP (the
          # shape NET 1/NET 2 below exist to fail) is a file that CONNECTED,
          # RAN, and then withheld its assertions while exiting 0 — it makes a
          # claim about THIS lane that is false, and nothing distinguishes it
          # from a genuine pass in the only channel the loop used to read,
          # which is why WR-03 fails it. A LANE-ONLY exclusion is a decision
          # the JOB takes BEFORE `psql -f` is ever invoked, written down here
          # in the workflow, PRINTED on every run with its reason, over a file
          # that makes NO claim about this lane because it was never handed to
          # it — and whose coverage claim is made by a DIFFERENT job
          # (sql-mutation, on the pg-lane) that can actually satisfy its
          # preconditions. The difference is WHO DECIDES and WHETHER A CLAIM
          # IS MADE, not the fact that execution is withheld either way. What
          # stays armed regardless: both nets for every OTHER file, and for a
          # lane-only file itself the WHOLE static-analysis half below —
          # sentinel declaration, roster-vs-count coherence, and the n_arms <=
          # RAISE-EXCEPTION-sites bound all keep reading straight from the
          # file's own text whether or not it ran, so the cheapest neutering —
          # delete an arm, edit the count down — is still caught here even for
          # an excluded file.
          lane_only_marker() {
            grep -a -m1 '^-- LANE-ONLY:' "$1" || true
          }
          echo "Discovering supabase/tests/test_*.sql files..."
          shopt -s nullglob
          files=(supabase/tests/test_*.sql)
          # F11 — AN EMPTY GLOB IS AN ERROR, NEVER A QUIET PASS. This used to
          # print a ::warning:: and `exit 0`, i.e. report SUCCESS from BEFORE the
          # loop and before every pin below, having executed zero assertions. A
          # directory rename or a path typo was enough: green job, nothing run.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No supabase/tests/test_*.sql files found. The SQL self-test corpus is EMPTY, so this run executed ZERO assertions and proves NOTHING about the database — it is not a pass. Most likely the tests moved or this glob's path drifted; restore the path, or retire this job deliberately."
            exit 1
          fi
          echo "Found ${#files[@]} test file(s):"
          printf '  - %s\n' "${files[@]}"
          # Census the LANE-ONLY set BEFORE the loop, from the SAME predicate
          # the loop uses below, so the printed set and the skipped set cannot
          # drift apart. ⛔ Nothing is removed from `files` here — the array
          # stays whole and ${#files[@]} keeps reporting the real corpus size.
          # ⚠️ A string counter, not a bash array: an empty-array expansion
          # under `set -u` is not portable to the bash this step's own
          # contract test spawns.
          echo ""
          echo "Checking for LANE-ONLY exclusions..."
          lane_only_count=0
          for f in "${files[@]}"; do
            lm="$(lane_only_marker "$f")"
            if [ -n "$lm" ]; then
              lane_only_count=$((lane_only_count + 1))
              lm_text="${lm#-- LANE-ONLY:}"; lm_text="${lm_text# }"
              echo "::notice file=$f::LANE-ONLY — not executed on this job's local-stack lane. ${lm_text}"
            fi
          done
          if [ "$lane_only_count" -eq 0 ]; then
            echo "  ↳ none excluded."
          else
            echo "  ↳ ${lane_only_count} file(s) excluded from execution (still counted in the static accounting below)."
          fi
          # ON_ERROR_STOP=1 + the test files' RAISE EXCEPTION lines mean
          # a failed assertion exits non-zero and fails this step.
          #
          # 161.1-REVIEW WR-03 (systemic half) — A PRINTED SKIP IS NOT A PASS.
          # ------------------------------------------------------------------
          # MEASURED 2026-08-25 on a scratch Postgres 16: a file that opens with
          # `RAISE NOTICE 'SKIP: <object> not applied here'; RETURN;` prints
          #     psql:<file>:<line>: NOTICE:  SKIP: migration ... not yet applied
          # and exits EXITCODE=0 having executed ZERO assertions. Three ledger
          # files ran 0-of-7, 0-of-8 and 0-of-8 arms that way while CI stayed
          # green, because the loop below used to read ONLY that exit code — so a
          # skip was byte-identical to a pass in the only channel anything
          # mechanical looks at.
          #
          # Why such a skip can never re-arm itself: this job has NO
          # migration-apply step (checkout -> psql -> preflight -> mutex ->
          # `psql -f`), and nothing else applies migrations to the TEST project
          # either — .github/workflows/supabase-migrate.yml targets the
          # PRODUCTION project only, and TEST is migrated BY HAND. The old
          # promise "assertions enforce once the test DB catches up" named a
          # mechanism that does not exist.
          #
          # ⚠️ CURRENCY 2026-09-09: the paragraph above is kept for the lineage
          # rather than deleted, because its CONCLUSION still holds and its
          # STATED REASON no longer does. Phase 164.8 plan 05 landed an
          # `apply-test` job in .github/workflows/supabase-migrate.yml, so TEST
          # now receives every merged migration AUTOMATICALLY — it is no longer
          # "migrated BY HAND", and supabase-migrate.yml no longer "targets the
          # PRODUCTION project only". The consequence is exact: a whole-file
          # `NOTICE:  SKIP:` bail-out CAN now re-arm itself, because the object
          # it bails on will genuinely arrive on the next merge. What stops it
          # is no longer the absence of a mechanism; it is ONLY the marker check
          # below, which fails the step on the bail-out line itself. ⛔ Do not
          # read the paragraph above as a second, independent reason to trust
          # this step — it has been reduced to one, and removing the marker
          # check would now leave nothing.
          #
          # ⚠️ CURRENCY 2026-09-23 (Phase 164.4.2): BOTH paragraphs above describe
          # shared TEST, which this step no longer touches. It now runs against the
          # local-stack lane, loaded from the committed `supabase/schema/baseline.sql`
          # behind the lane's currency guard; `apply-test` never reaches that
          # database. The consequence moves again and the conclusion does not: a
          # whole-file bail-out now re-arms whenever the committed baseline next gains
          # the object it bails on, silently. ONLY the marker check below stops it.
          # (Since D-F, 2026-09-23, the lane also replays migrations newer than the
          # dump, so "gains the object" includes a PR's own new migration — sooner,
          # and the conclusion is unchanged.)
          #
          # Three files were fixed individually (they now RAISE EXCEPTION on an
          # absent object). This block is the mechanical closure for the rest and
          # the stop for new ones: capture each file's output and fail the step
          # when the whole-file bail-out marker appears in it.
          #
          # WHY THE MARKER IS `NOTICE:  SKIP:` AND NOT THE WORD "SKIP" — it is
          # derived from what this corpus actually prints, which is two distinct
          # shapes (all five forms below were reproduced through psql before this
          # regex was chosen):
          #   (1) whole-file bail-out — `NOTICE:  SKIP: <reason>` then RETURN.
          #       The file asserts NOTHING. This is the WR-03 defect; it FAILS.
          #   (2) narrow partial skips — `SKIP (5d/5f/5g): ...`, `SKIP Part 2:
          #       ...`, `PASS WITH 1 SKIP: ...`, and prose such as `Part 1 OK:
          #       ... SKIP LOCKED present`. These name assertions withheld on a
          #       real migration-A/B divergence. They are ANNOTATED below, never
          #       failed: reddening them would redden CI for a state this repo
          #       deliberately tolerates.
          #
          #       ⚠️ F13 — the justification that used to sit here is DELETED, not
          #       softened, because it was false. It claimed these skips are
          #       "already policed in-file by both-or-neither coherence
          #       assertions that RAISE EXCEPTION when the skip is dishonest".
          #       MEASURED 2026-08-25 across all 67 files: not uniformly true.
          #       supabase/tests/test_profiles_privileged_columns_locked.sql
          #       prints `SKIP (2): ...` and then RETURNs — every later assertion
          #       in that DO block is withheld, and nothing checks the skip was
          #       honest. The pg_cron `SKIP Part 2/3/4` notices in the
          #       cron-registration files have the same shape. A COSMETIC label
          #       (`SKIP (2)` vs `SKIP:`) was doing all the discriminating, and
          #       it does not correlate with how much coverage is withheld.
          #       A stated reason that is falsifiable-and-false is worse than
          #       none: the next reader discards the real constraint along with
          #       it. So this step no longer VOUCHES for them. It derives, from
          #       each file's own source, which printed partial skips are
          #       block-terminating (a `RETURN;` within 4 lines of the notice)
          #       and reports those as UNPOLICED in the log. Making them fatal is
          #       the real fix and it belongs in the .sql files — each needs a
          #       both-or-neither assertion, the way
          #       test_ledger_refresh_{staleness,fanout,composite_arm}.sql got
          #       one. Until then this step names them instead of vouching.
          # ⚠️ A bare `grep -F 'SKIP:'` does NOT discriminate — `PASS WITH 1 SKIP:`
          # (test_wizard_session_idempotency.sql, test_wizard_composite_fence.sql)
          # contains that substring and prints on a PASSING run.
          #
          # F14 — the old answer was to anchor on psql's `NOTICE:` label, which is
          # C-locale server text. Two ways that goes SILENT rather than noisy, both
          # yielding a FALSE PASS; the second was conceded nowhere:
          #   (a) a non-C `lc_messages` renders the label in another language, so
          #       the regex matches nothing;
          #   (b) `client_min_messages='warning'` (settable per-role/per-database,
          #       and it outlives any one connection) suppresses NOTICE OUTPUT
          #       ENTIRELY — every check in this step reads NOTICEs, so all of
          #       them would match nothing at once, with an empty log to show
          #       for it.
          # Both are closed here rather than conceded:
          #   NET 1 (locale-proof, primary) — whole-file markers are read out of
          #     the .sql FILE (`RAISE NOTICE 'SKIP: ...`), which is C-locale by
          #     construction because it is repo text, and matched with grep -aF.
          #     No server-rendered label is involved. `PASS WITH 1 SKIP:` is
          #     never a marker: that literal does not START with `SKIP:`.
          #   NET 2 (kept, second net) — the label-anchored regex, which still
          #     catches a skip message composed at RUNTIME via format()/variables
          #     and therefore invisible to NET 1's static extraction.
          #   CHANNEL — client_min_messages is forced to `notice` via PGOPTIONS
          #     and PROVEN live by a probe below that fails the step when a known
          #     NOTICE does not come back. (lc_messages is deliberately NOT set:
          #     it is superuser-only, so setting it would turn a working
          #     connection into a connection error on a managed database.)
          # WHAT REMAINS OPEN is printed in the log too, not just here: a skip
          # message that is BOTH composed at runtime (invisible to NET 1) AND
          # rendered by a non-C server (invisible to NET 2) would still pass. No
          # such message exists in this corpus today.
          #
          # ⛔ This does NOT touch a JOB-level skip. ⚠️ CORRECTED 2026-09-23 (Phase
          # 164.4.2): this paragraph said fork PRs and workflow_dispatch never reach
          # this step and that a trusted-vs-untrusted aggregator arm judged the
          # job's skip. Both stopped being true when the job stopped consuming a
          # secret: every event reaches this step now, and the `frontend` aggregator
          # judges this row on its STRICT default arm. What is refused here is
          # unchanged and narrower than either: a file that RAN and printed a
          # whole-file skip.
          #
          # Branch protection is OFF on this repo, so this is ADVISORY at merge —
          # it makes the log state what did not happen; it does not block a merge.
          #
          # NOTICEs go to psql's STDERR, hence the 2>&1 capture. `-a` on every
          # grep: a NUL byte anywhere in the captured output would otherwise make
          # GNU grep treat it as binary and report "no match" on bytes it never
          # really read — the same false green this block exists to remove.
          # F14(b) — force the NOTICE channel ON. client_min_messages is settable
          # by an ordinary role, so this is not the privilege gamble lc_messages
          # would be. Forcing is not enough on its own (a database- or role-level
          # setting can still win), hence the probe.
          export PGOPTIONS='-c client_min_messages=notice'
          bad=0
          sentinels_declared=0
          sentinels_verified=0
          arms_declared=0
          executed=0
          out="${RUNNER_TEMP}/sql-test-output.log"
          echo ""
          echo "Probing that server NOTICEs actually reach this log..."
          probe_status=0
          psql "$LANE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN RAISE NOTICE 'ANTISKIP-NOTICE-CHANNEL-OK'; END \$\$;" \
            > "$out" 2>&1 || probe_status=$?
          # [164.8.4-02] Third leak shape (CONTEXT.md Area 1): this captured
          # output is echoed to a PUBLIC log below via `cat`, and until now
          # that echo ran with no redaction between the capture and the
          # `cat` — psql's connect/auth stderr went straight through.
          # Redact in place, via the shared scripts/redact-psql-stderr.sed,
          # immediately after the exit-status capture and before the echo.
          # On a failed substitution the content is WITHHELD (a line COUNT
          # only, never the content) — same capture-count-WITHHOLD idiom as
          # the VAC-08 drift script's ledger_rows arm (now run by the
          # `test-db-drift` job; its path is not spelled in this job, see the
          # job header) — and the step fails closed rather than echo a file it
          # cannot prove safe.
          if ! { sed -E -f "${GITHUB_WORKSPACE}/scripts/redact-psql-stderr.sed" "$out" > "$out.redacted" \
                 && mv "$out.redacted" "$out"; }; then
            probe_out_lines="$( { wc -l < "$out" 2>/dev/null || echo '?'; } | tr -d '[:space:]' )"
            echo "::error::redaction FAILED on $(basename "$out"). ${probe_out_lines} line(s) of captured output are WITHHELD — it can carry a database host, its IP or the DB user, and this log is public."
            exit 1
          fi
          cat "$out"
          if [ "$probe_status" -ne 0 ]; then
            echo "::error::the NOTICE-channel probe could not run against the test database (psql exited ${probe_status}). Every skip check below reads server NOTICEs, so this step cannot report a meaningful pass without it."
            exit 1
          fi
          if ! grep -aF 'ANTISKIP-NOTICE-CHANNEL-OK' "$out" >/dev/null 2>&1; then
            echo "::error::the test database accepted a RAISE NOTICE but the message never reached this log, so NOTICE output is being suppressed (a role- or database-level client_min_messages overriding PGOPTIONS). EVERY skip check in this step reads NOTICEs: with the channel dark they would all match nothing at once and this job would report a clean run having verified NOTHING about skips. Clear the override (ALTER ROLE ... RESET client_min_messages) and re-run."
            exit 1
          fi
          echo "  ↳ NOTICE channel live."
          for f in "${files[@]}"; do
            lane_marker="$(lane_only_marker "$f")"
            if [ -n "$lane_marker" ]; then
              echo ""
              echo "=== Skipping (LANE-ONLY): $f ==="
              lane_text="${lane_marker#-- LANE-ONLY:}"; lane_text="${lane_text# }"
              echo "  ↳ ${lane_text}"
            else
              executed=$((executed + 1))
              echo ""
              echo "=== Running: $f ==="
              status=0
              # -X for parity with the NOTICE-channel probe above (and with the
              # mutex/census psql calls this job carried until Phase 164.4.2): a
              # ~/.psqlrc on a self-hosted runner could otherwise set
              # client_min_messages or ECHO and change what this loop reads.
              psql "$LANE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$f" > "$out" 2>&1 || status=$?
              # [164.8.4-02] Same third-leak-shape fix as the NOTICE-channel
              # probe above: redact "$out" via the shared
              # scripts/redact-psql-stderr.sed, in place, before it is
              # echoed — and fail closed, WITHHOLDING a line count only, if
              # the substitution itself fails.
              if ! { sed -E -f "${GITHUB_WORKSPACE}/scripts/redact-psql-stderr.sed" "$out" > "$out.redacted" \
                 && mv "$out.redacted" "$out"; }; then
                loop_out_lines="$( { wc -l < "$out" 2>/dev/null || echo '?'; } | tr -d '[:space:]' )"
                echo "::error file=$f::redaction FAILED on $(basename "$out"). ${loop_out_lines} line(s) of captured output are WITHHELD — it can carry a database host, its IP or the DB user, and this log is public."
                exit 1
              fi
              cat "$out"
              if [ "$status" -ne 0 ]; then
                echo "::error file=$f::psql exited $status — a RAISE EXCEPTION assertion failed, or the connection did. The captured output above is the whole story for this file."
                exit "$status"
              fi
              # NET 1 (locale-proof): the whole-file markers this FILE defines.
              skip_hits=""
              markers="$(grep -aoE "RAISE NOTICE 'SKIP: [^'%]{0,60}" "$f" | sed "s/^.*RAISE NOTICE '//" | sort -u || true)"
              if [ -n "$markers" ]; then
                # F15 — `$markers` is unquoted ON PURPOSE: IFS=$'\n' is what splits
                # it one marker per line. But an unquoted expansion also undergoes
                # PATHNAME expansion, and this step runs under the `shopt -s
                # nullglob` set above for the file glob. MEASURED in bash 5.3: a
                # marker containing `*`, `?`, or a CLOSED `[...]` class matches no
                # file and is then DELETED from the word list outright — the loop
                # body never executes for it and nothing is printed to say a marker
                # was dropped. NET 1 would be off for that file, leaving only NET
                # 2, which F14(a) already records as locale-fragile; a skip on a
                # localized server would then sail through both nets as a pass.
                # (An UNTERMINATED `[` survives, because bash treats it literally —
                # so today's behaviour depends on where a bracket happens to fall.
                # That is a coin toss, not a policy.) `set -f` turns pathname
                # expansion off for the split and back on straight after; it does
                # NOT affect `case` pattern matching, which the sibling loop below
                # relies on.
                _oifs="$IFS"
                IFS=$'\n'
                set -f
                for m in $markers; do
                  if grep -aF "$m" "$out" >/dev/null 2>&1; then
                    skip_hits="${skip_hits}      ${m}"$'\n'
                  fi
                done
                set +f
                IFS="$_oifs"
              fi
              # NET 2: label-anchored, for a skip message composed at runtime.
              net2="$(grep -aE 'NOTICE: +SKIP:' "$out" || true)"
              if [ -n "$skip_hits" ] || [ -n "$net2" ]; then
                echo "::error file=$f::printed a whole-file SKIP notice and exited 0. THAT IS NOT A PASS: the file RETURNed before its assertions, so this run proves nothing about the object it guards — it is indistinguishable from a green run only because exit code was the sole thing read. This job's database is loaded from the committed baseline, so the skip ends only when that baseline next gains the object — silently, on no schedule anyone chose. Fix the file the way supabase/tests/test_ledger_refresh_{staleness,fanout,composite_arm}.sql were fixed: RAISE EXCEPTION on the absent object instead of skipping."
                echo "  ↳ $f printed:"
                if [ -n "$skip_hits" ]; then
                  printf '%s' "$skip_hits"
                fi
                if [ -n "$net2" ]; then
