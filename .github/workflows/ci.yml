name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual one-shot triggers for re-baking e2e screenshot baselines. Inert for
  # normal CI (push/PR) — both inputs default false and only change the e2e
  # job's behaviour when explicitly checked on a dispatch. Must live on the
  # default branch for `gh workflow run` / the UI to see them.
  workflow_dispatch:
    inputs:
      bake_svg_goldens:
        description: >-
          Bake e2e/svg-chart-parity.spec.ts goldens: the seeded e2e job runs
          ONLY that spec with --update-snapshots and uploads the generated PNGs
          as an artifact for per-chart human review. Never auto-commits them.
        type: boolean
        default: false
        required: false
      bake_demo_screenshots:
        description: >-
          Bake e2e/demo-screenshot.spec.ts baselines: the placeholder-env e2e
          step runs ONLY that spec with --update-snapshots and uploads the
          regenerated PNGs as an artifact for per-shot human review. Never
          auto-commits them.
        type: boolean
        default: false
        required: false

# Cancel in-flight CI on PR force-pushes only. On `push` to `main`, every
# commit must produce its own recorded green CI run (deploy automation +
# branch protection key on per-SHA status); cancelling intermediate runs
# would leave `main` commits without a green check. `head_ref` is set on
# pull_request events and empty on push events — falling back to `run_id`
# (unique per run) ensures push events never share a group key, so they
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# C-0293(a) fix: minimal default GITHUB_TOKEN scope. Without this block,
# GITHUB_TOKEN inherits the repo default (which is `contents: write` plus
# write on issues/packages/PRs/statuses), so a compromised third-party
# action would have a write-all credential to pivot from. We default to
# `contents: read` (enough for actions/checkout to fetch the tree) and
# uplift specific jobs that genuinely need more (secret-scan grants
# pull-requests: write so gitleaks can post finding comments). The
# release/migration paths live in other workflows that gate on the
# `production` GitHub environment + manual approval.
permissions:
  contents: read

jobs:
  # CI speed audit F1: populate the shared node_modules cache ONCE per lockfile
  # so the frontend jobs (which restore it read-only) skip their installs on
  # subsequent runs. The cache/save is an explicit step AFTER npm ci, so a
  # failed install never saves a partial (poisoned) tree. No downstream job
  # `needs:` this — they restore opportunistically and fall back to their own
  # npm ci on a miss, so this never serializes the graph (and is not a gate).
  deps-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Save ONLY on a miss + AFTER a successful npm ci — this step does not run
      # if the install above failed (steps halt on first failure), so the cached
      # tree is always complete.
      - name: Save node_modules
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

  # CI speedup PR-B (v0.22.1.2+): the prior monolithic `frontend` job ran
  # typecheck → lint → test → policy-checks → audit → build serially
  # (~5min wall clock). Split into 5 parallel jobs so wall-clock collapses
  # to max-of-jobs (~build, ~3min). Each parallel job pays the cold
  # `npm ci` cost (~30-60s), but `actions/setup-node@v4 cache: npm`
  # restores `~/.npm` so subsequent `npm ci`s are tarball-extract-only.
  # Branch protection still gates on a single check (the aggregator
  # `frontend` job below `needs:` all parallel jobs).
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # PR-C: cache TypeScript's incremental build info (tsconfig.json has
      # `incremental: true`, so tsc emits tsconfig.tsbuildinfo in the project
      # root). On unchanged code, tsc skips fully re-checking files whose
      # imports haven't changed since the last successful run — typecheck
      # drops 30-60% on small diffs.
      - name: Cache tsconfig.tsbuildinfo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - run: npm run typecheck

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # PR-C: cache ESLint's per-file result cache. The `lint` script in
      # package.json now passes `--cache --cache-location
      # node_modules/.cache/.eslintcache`. ESLint skips re-linting files
      # whose mtime + content hash haven't changed since the last run —
      # repeat lint on unchanged files drops to milliseconds.
      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules/.cache/.eslintcache
          key: ${{ runner.os }}-eslintcache-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-eslintcache-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*') }}-
      - run: npm run lint

  frontend-test:
    # PR-C extension: shard vitest. Wall clock collapses to the slowest shard.
    # CI speed audit F6: reduced 3→2 shards — with F1's shared node_modules
    # cache the per-shard install overhead is gone, and the measured per-shard
    # execution (minus install) is well under the critical path, so 2 balanced
    # shards halve the runner fan-out without lengthening wall-clock. Also
    # cache vitest's transform graph at node_modules/.vite — on a warm
    # cache the TS/JSX transform step is largely a no-op.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # fetch-depth: 0 — the phase-29/30 frozen-spine guards
          # (src/__tests__/phase-{29,30}-frozen-spine-guards.test.ts) resolve
          # their diff baseline via `git merge-base origin/main HEAD` or a
          # fallback branch-point sha. A shallow (depth-1) clone has neither, so
          # the fail-loud guard (CLAUDE.md Rule 12) throws at module load and
          # crashes the whole shard. Full history makes the baseline resolvable
          # (same pattern as the analytics-deploy-verify checkout below).
          fetch-depth: 0
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Cache vitest's transform graph. Vite persists per-file TS/JSX
      # transforms here; on a warm cache the transform step is largely a
      # no-op. Key on lockfile + vitest config + the src/tests trees.
      # vitest.node-env.ts is part of the key because it decides which files
      # run under `environment: "node"` — moving a file between projects
      # changes how it is transformed, so a stale entry would be wrong.
      - name: Cache vitest transform (node_modules/.vite)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'vitest.node-env.ts') }}-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-vitest-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'vitest.node-env.ts') }}-
      # CI speed (2026-07-02): the shards now ALSO emit v8 coverage + a blob
      # report, and the frontend-coverage job merges the blobs and enforces
      # the vitest.config.ts thresholds — deleting the duplicate full-suite
      # coverage run (~8m). Threshold flags are ZEROED here because a lone
      # shard sees only half the files and would spuriously fail the ratchet;
      # the merge job is where the real gate fires (locally proven: shard
      # alone FAILS thresholds, merged run passes at the full-suite numbers).
      # --test-timeout=20000 adopts the old coverage job's contention
      # rationale: v8 coverage adds per-worker load, and the documented
      # worker-contention flake (vitest.config.ts:6-16) turns that into
      # spurious 5s timeouts on a busy runner.
      #
      # DO NOT add NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY env to
      # this job: that would un-skip ~284 live-DB tests (src/lib/test-helpers/
      # live-db.ts), shifting the coverage denominator and invalidating the
      # ratchet baseline (which was measured with those tests skipped).
      - name: Run vitest shard ${{ matrix.shard }}/2 (blob + coverage, thresholds deferred to merge)
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/2
          --reporter=dot --reporter=blob
          --coverage --test-timeout=20000
          --coverage.thresholds.lines=0
          --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
      - name: Upload blob report for coverage merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          # .vitest-reports is a dot-directory; upload-artifact excludes
          # hidden paths by default (a v4.4+ security change), so without
          # this the step uploads nothing and if-no-files-found fails it.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    # tech-debt #11: coverage is a CI GATE (the vitest.config.ts thresholds,
    # ratcheted a few points under measured actual, fail this job on a real
    # regression).
    #
    # CI speed (2026-07-02): this job no longer RE-RUNS the full suite — the
    # frontend-test shards above emit v8 coverage into blob reports, and this
    # job downloads both blobs and replays them with `--merge-reports
    # --coverage`, which merges coverage across shards and enforces the
    # config thresholds on the FULL-suite numbers. Locally proven equivalent:
    # merged coverage matches the old single-run numbers, a lone shard fails
    # the ratchet (so the gate genuinely fires), and the merged run passes.
    # Same job NAME kept so the `frontend` aggregator's needs/result-check
    # wiring is untouched. No tests execute here → shallow checkout is fine
    # (the frozen-spine guards run in the shards, not in a report replay).
    runs-on: ubuntu-latest
    needs:
      - frontend-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge shard reports + enforce coverage thresholds
        run: npx vitest run --merge-reports --coverage

  frontend-seam-redis:
    # Phase 140.2 / SEAMCORE-09 — the seam breaker against a REAL Redis.
    #
    # WHY THIS JOB EXISTS. `src/test/helpers/upstash-breaker.ts` is a
    # FIXED-window double anchored at its first call, with no previous bucket,
    # no weighted carry-over, and it INCREMENTS ON DENIAL. The deployed
    # `@upstash/ratelimit` sliding window is epoch-aligned, carries a weighted
    # count over from the previous bucket, and does NOT increment on denial.
    # `recordSeamFailure()` reads BOTH `success` and `remaining`, so four of the
    # seven properties this phase depends on are unobservable through the
    # double. SRH (serverless-redis-http) speaks Upstash's REST protocol in
    # front of a real Redis, so the UNMODIFIED client executes the REAL Lua.
    #
    # WHY IT IS A SEPARATE JOB AND NOT `services:` BOLTED ONTO frontend-test.
    # See the inverted warning below — this is the same hazard frontend-test
    # documents for the Supabase vars, in the opposite direction.
    #
    # NO SECRETS AND NO REPO VARIABLE are referenced anywhere in this job, on
    # purpose. That is what lets it run identically on a fork PR, which in turn
    # is what lets the aggregator treat ANY non-success (including `skipped`) as
    # a failure with no tolerance arm — see the `frontend:` result loop.
    runs-on: ubuntu-latest
    services:
      # BOTH images pinned by sha256 DIGEST, never by tag (threats
      # T-140.2-01-01 / -02): a mutable tag on a third-party image is an
      # unreviewed input to a required gate. These are the multi-arch INDEX
      # digests and MUST stay identical to docker-compose.redis-test.yml.
      redis:
        # redis:7-alpine (Docker Official Image)
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      srh:
        # hiett/serverless-redis-http:latest — a SINGLE-MAINTAINER community
        # image, so the digest pin is the control that matters here.
        image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-seam-breaker-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
        ports:
          - 8079:80
    env:
      # Deliberately set JOB-WIDE, which is the exact INVERSE of the
      # frontend-test warning ("DO NOT add NEXT_PUBLIC_SUPABASE_URL /
      # SUPABASE_SERVICE_ROLE_KEY env to this job"). It is safe HERE and only
      # here because this job runs `tests/redis/**` and nothing else:
      # `resilient-fetch.ts` builds its Upstash client at MODULE SCOPE from
      # these two vars, and ~20 files in the MAIN suite DELETE them to exercise
      # the core's unconfigured path. Setting them on the shards would silently
      # rewrite those tests' meaning. Never widen this job's test selection.
      #
      # SRH_TOKEN/UPSTASH_REDIS_REST_TOKEN is a FIXED NON-SECRET literal for an
      # ephemeral job-local container holding only test keys (threat
      # T-140.2-01-03, accepted). Making it a repository secret would make the
      # job skip on fork PRs — the precise silent-green this lane exists to end.
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-seam-breaker-token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # No fetch-depth: 0 — the phase-29/30 frozen-spine guards resolve a
          # merge-base and run in the SHARDS, not here.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Preflight - the lane must have a non-empty test corpus
        # A green job that ran nothing is the exact silent-green this whole
        # phase exists to eliminate, so an empty glob is an ERROR, never a quiet
        # pass. (F11: this comment used to say it was "copied in shape from
        # sql-tests" — that was FALSE at the time it was written. sql-tests' own
        # empty-corpus check printed a ::warning:: and `exit 0`, i.e. the
        # opposite shape, so this comment described a check that did not exist
        # in the file it named. F11 made that one fatal too; the two agree now.)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/redis/*.test.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No tests/redis/*.test.ts files found — the seam real-Redis lane has no corpus. This job must never pass vacuously."
            exit 1
          fi
          echo "Lane corpus: ${#files[@]} file(s)"
          printf '  - %s\n' "${files[@]}"
      - name: Preflight - the Upstash-compatible store must be reachable
        # SRH boots alongside redis with no dependency ordering available to
        # `services:`, so poll it. Fail LOUD rather than letting vitest report
        # a confusing module-load error.
        run: |
          set -euo pipefail
          n=0
          until curl -fsS -X POST "$UPSTASH_REDIS_REST_URL" \
              -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
              -H "Content-Type: application/json" \
              -d '["PING"]' | grep -q PONG; do
            n=$((n+1))
            if [ "$n" -ge 30 ]; then
              echo "::error::SRH did not become reachable at $UPSTASH_REDIS_REST_URL after $n attempts."
              exit 1
            fi
            sleep 2
          done
          echo "Store reachable after $n retry/retries."
      - name: Run the seam breaker real-Redis lane
        # NO --coverage, deliberately. `frontend-coverage` merges the two
        # frontend-test shards' blob reports and enforces the ratchet on the
        # merged numbers; a third blob from this lane would shift the
        # denominator and invalidate the baseline.
        run: npx vitest run --config vitest.redis.config.ts --reporter=dot

  frontend-policy:
    # Banned-package check + GDPR export coverage. PR-C moved npm audit
    # to the nightly workflow because (a) it's a security signal, not a
    # per-PR functional gate, (b) Dependabot/Snyk already cover the
    # critical-severity surface continuously, and (c) keeping it on the
    # per-PR critical path adds 15-30s with no behavior signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: Check for banned packages (supply-chain)
        run: node scripts/check-banned-packages.mjs
      # Phase 20 / T16 — the recording MT5 EA is READ-ONLY by CI invariant.
      # An EA with account access is a Tampering/Elevation risk, so we FAIL the
      # build on ANY trade-mutation token in tools/mt5 source. This is the M4
      # red-team HARDENING of the original denylist, which scanned only top-level
      # *.mq5 and missed the two most common ways an MQL5 EA actually places a
      # trade. The check now covers, scanning BOTH *.mq5 AND included *.mqh
      # headers RECURSIVELY (grep -r descends subdirs):
      #   - the low-level / declaration surface:
      #       OrderSend, OrderSendAsync, OrderModify, OrderDelete,
      #       PositionClose, PositionModify, the CTrade class, and `trade.`
      #   - the CTrade METHOD-CALL surface (a CTrade instance named ANYTHING,
      #     not just `trade`, calling): .Buy( .Sell( .BuyStop( .SellStop(
      #       .BuyLimit( .SellLimit( .PositionOpen( .PositionClose(
      #       .PositionClosePartial( .PositionReverse( .OrderOpen(
      # Pure grep, like the banned-packages step — NO new dependency.
      #
      # KNOWN RESIDUAL LIMIT (documented, not defeated): grep is line-literal, so
      # a token inside a COMMENT (e.g. `// OrderSend disabled`) trips a SAFE-SIDE
      # false positive, and deliberate in-comment whitespace/identifier evasion is
      # not caught by a static grep. That residual is accepted: the manual T14
      # demo-reconcile is the runtime backstop, and a false positive merely forces
      # a human to confirm the EA is read-only (fail-safe direction).
      - name: MT5 EA read-only static check
        run: |
          # Low-level / declaration surface + CTrade method-call surface.
          DENY_LOWLEVEL='OrderSend|OrderSendAsync|OrderModify|OrderDelete|CTrade|PositionClose|PositionModify|trade\.'
          DENY_METHODS='\.(Buy|Sell|BuyStop|SellStop|BuyLimit|SellLimit|PositionOpen|PositionClose|PositionClosePartial|PositionReverse|OrderOpen)[[:space:]]*\('

          if [ ! -d tools/mt5 ]; then
            echo "MT5 EA static check: tools/mt5 absent — nothing to scan."
            exit 0
          fi

          # grep -r exits 1 on no-match; under the runner's `set -e` that would
          # abort the step at the assignment, so we neutralize it with `|| true`
          # and derive the verdict from whether any line was captured — NOT from
          # grep's own exit code (a no-match must be a PASS, only a positive
          # denylist match is a FAIL). `grep -rnE` reports file:line for the log.
          MATCHES=$(grep -rnE --include='*.mq5' --include='*.mqh' \
            -e "$DENY_LOWLEVEL" -e "$DENY_METHODS" tools/mt5 || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::MT5 EA must be read-only (no order/trade mutation API). Forbidden token(s) found in tools/mt5:"
            echo "$MATCHES"
            exit 1
          fi
          echo "MT5 EA static check: clean (0 trade-mutation tokens in tools/mt5/**/*.{mq5,mqh})."
      - name: Check GDPR export coverage (Task 7.3)
        run: npx tsx scripts/check-gdpr-export-coverage.ts

  knip:
    # tech-debt #13: non-blocking dead-code report. knip.json declares the
    # real entry points (supabase edge functions, manually-run scripts) so
    # the signal is genuine, not framework false-positives. Scoped to
    # files+dependencies — the actionable, low-false-positive issue types
    # (unused exports/types are noisier and deferred). NON-BLOCKING by design:
    # this job is intentionally NOT in the `frontend` aggregator's `needs:`, so
    # it never gates a merge; it surfaces NEW unused files/deps in the run
    # summary so the dead-code drift this finding cleaned up cannot silently
    # re-accumulate. Promote to a gate once the exports/types baseline is zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      - name: knip dead-code report (non-blocking)
        run: |
          # `|| true` keeps this step (and the job) green regardless of
          # findings — this is a REPORT, not a gate (tech-debt #13, the
          # user-chosen non-blocking posture). knip exits non-zero when it
          # finds issues and the runner shell has pipefail on, so we capture
          # to a file and derive the summary from its contents, not the code.
          npx knip --include files,dependencies --reporter compact > knip.out 2>&1 || true
          if [ -s knip.out ]; then
            {
              echo "## knip — unused files / dependencies (non-blocking)"
              echo ""
              echo '```'
              cat knip.out
              echo '```'
              echo ""
              echo "tech-debt #13: declare the real entry point in knip.json, or delete the dead code."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::knip found unused files/dependencies — see the job summary (non-blocking)."
          else
            echo "## knip ✅ no unused files or dependencies" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend-build:
    # The build is the longest single step. It runs in parallel with the
    # other frontend-* jobs (above) and uploads the .next + public output
    # as an artifact so the e2e job can download instead of rebuilding —
    # eliminating the duplicate ~60-120s build that used to live in e2e.
    #
    # C-0293(c) artifact-leak fix: this job builds with PLACEHOLDER
    # NEXT_PUBLIC_SUPABASE_* env values UNCONDITIONALLY (no longer the
    # seed-aware ternary). The previous behavior baked the real
    # TEST_SUPABASE_URL + TEST_SUPABASE_ANON_KEY into the client bundles
    # in `.next/**` whenever vars.E2E_TEST_DB_CONFIGURED was true, then
    # uploaded that artifact (where any third-party action in the same
    # workflow run has `actions: read` and could grep for inlined creds).
    # The seed-gated e2e specs now rebuild locally inside the e2e job
    # with the real env, and that rebuilt `.next/` stays on the runner
    # FS — it is never uploaded as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Cache .next/cache (Next.js incremental webpack/Turbopack output) keyed
      # on every input that changes how the bundle compiles: lockfile,
      # next.config, tailwind/postcss config, tsconfig, and the full src
      # tree (any extension). The wide src glob catches CSS, MDX, JSON,
      # locale files etc. that a `.ts/.tsx` glob would silently miss —
      # missing them means a config change ships against a stale cache.
      # restore-keys ladder is intentionally short: only fall back to a
      # lockfile-matched cache, never to a "different lockfile" prefix
      # (cross-Next-version cache restore is a known hazard).
      - name: Cache .next/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}-
      # C-0293(c): build with PLACEHOLDERS unconditionally. The previous
      # seed-aware ternary leaked test-DB credentials into the uploaded
      # artifact (see the security comment on this job header above).
      # The seed-gated e2e specs rebuild locally with the real env in
      # the e2e job, and that rebuilt `.next/` is never uploaded.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role
          ADMIN_EMAIL: test@example.com
          PLATFORM_NAME: Quantalyze
          PLATFORM_EMAIL: test@quantalyze.com
          # Phase 164 / D-02: `src/lib/strategy-share-token.ts` validates this
          # at MODULE SCOPE and throws when absent — deliberately, so a
          # misconfigured deploy fails loudly instead of at the founder's first
          # Copy Link. Any build-time evaluation of a share surface therefore
          # needs a value here. Obviously fake and >= the 32-char floor.
          SHARE_TOKEN_SECRET: placeholder_share_token_secret_not_a_real_secret
      # Upload the build output for the e2e job to download. Exclude
      # .next/cache (the actions/cache above already persists it across
      # runs; including it here would inflate every per-run artifact by
      # 100MB+ for no e2e benefit). upload-artifact@v4 negative globs
      # only exclude entries that actually match the negative pattern,
      # so the directory match must use `/**` to recurse — `!.next/cache`
      # alone only excludes the directory entry, not its contents.
      - name: Upload .next + public artifact for e2e
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nextjs-build
          path: |
            .next/**
            !.next/cache/**
            public/**
          retention-days: 1
          if-no-files-found: error
          # Critical: upload-artifact@v4 defaults `include-hidden-files: false`,
          # which excludes any path starting with `.` — `.next` is dotfile-
          # prefixed so the action silently uploaded only `public/**` (6 files,
          # 60KB total) when this was missing. The e2e job's `next start` then
          # crashed with "Could not find a production build in the '.next'
          # directory" because the artifact carried no .next at all.
          include-hidden-files: true

  sql-gate-lint:
    # Phase 164.3 / VAC-03 — the static vacuity linter over supabase/tests/*.sql.
    #
    # WHY IT EXISTS. Phase 164's review found five distinct mechanisms by which
    # an arm of a SQL gate file was GREEN in CI while proving nothing. All five
    # shipped, passed review, and passed this very workflow. Three of them, plus
    # one narrow case of a fourth, are detectable in the file TEXT — so a sixth
    # instance written into a NEW gate file becomes a lint failure on the
    # pushing developer's machine instead of a red-team finding two phases on.
    # There is deliberately no rule for the fifth mechanism (arm reachability is
    # not statically decidable, phase decision D-16); the mutation runner's
    # first-failure identity assertion is its detector.
    #
    # HERMETIC BY DESIGN: NO database, NO Docker, NO secrets, NO network — so
    # this gate can never flake, and it runs identically on a fork PR, a
    # same-repo PR, a push and a workflow_dispatch. That property is what earns
    # it the NO-TOLERANCE row in the `frontend` aggregator below: unlike
    # `sql-tests` and `e2e-seeded`, it has no legitimate reason to be skipped,
    # so any non-success is a real fault. Same reasoning as `frontend-seam-redis`.
    #
    # `permissions:` and `concurrency:` are inherited from the workflow level
    # (lines ~40 and ~53) exactly as every other job here does; restating them
    # per-job would fork two sources of truth for no gain, and a second
    # concurrency group inside a workflow that already has one changes
    # cancellation semantics rather than tightening them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Rule self-test - every rule fires on its red fixture
        # Runs BEFORE the corpus scan on purpose. A corpus scan that reports
        # "0 findings" tells you nothing unless the rules can still fire; this
        # step is what distinguishes a clean corpus from a defanged linter.
        # No node_modules needed — the script has zero dependencies.
        run: node scripts/lint-sql-gates.mjs --self-test
      - name: Lint SQL gate files for the measured vacuity shapes
        # Mode identity (164.3-RESEARCH Pitfall 2): this is the EXACT command a
        # developer runs locally, pasted verbatim from the script's header. No
        # wrapper, no flags, no npm alias — wrapping a run changes its result,
        # and a CI-only invocation mode is a different program.
        run: node scripts/lint-sql-gates.mjs

  sql-mutation:
    # Phase 164.3 / VAC-01 + VAC-02 — the RED-UNDER mutation runner over the
    # annotated SQL gate corpus. THE ON-EVERY-PUSH DETECTOR THIS PHASE EXISTS
    # TO CREATE.
    #
    # WHY IT EXISTS. A gate arm that CANNOT FAIL is indistinguishable from a
    # passing one by every signal a reviewer reads — green check, green log,
    # three specialist reviews. All five vacuity mechanisms Phase 164's review
    # catalogued were GREEN in this very workflow. The only way to know an arm
    # can fail is to BREAK the thing it guards and watch it fail, so that is
    # what this job does: for each of the 30 annotated arms it applies the
    # arm's declared mutation to COPIES, runs the gate, and requires that the
    # FIRST `TEST FAILED (…)` names THAT arm — red-anywhere is not success —
    # then restores and requires green. `sql-gate-lint` above catches the
    # statically-decidable shapes; this catches the one that is not (D-16).
    #
    # ⛔ IT MUST NOT TOUCH THE SHARED TEST DATABASE, and that is a hard
    # constraint rather than a preference (D-07). The run deliberately BREAKS
    # arms and restores them, and TEST sits behind an advisory-lock mutex shared
    # with everyone else's CI. Every arm therefore gets its OWN throwaway
    # PostgreSQL cluster, created by `scripts/pg-lane/run.sh` under a scratch
    # dir and torn down on success, on failure and on interrupt.
    #
    # CONSEQUENCE FOR THE AGGREGATOR ROW: no secret, no repo variable, no shared
    # resource, no `if:` — so this job runs identically on a fork PR, a same-repo
    # PR, a push and a workflow_dispatch, and a `skipped` result is ALWAYS a real
    # fault. It therefore takes the aggregator's STRICT default arm with NO
    # tolerance, exactly like `frontend-seam-redis` and `sql-gate-lint`, and the
    # OPPOSITE of `sql-tests` / `e2e-seeded`.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply here: that
    # ban exists because those jobs share the TEST advisory-lock mutex and their
    # `if:` conditions diverge, so a chain edge can silently skip a dependent.
    # This job has NO mutex, NO `if:`, and its clusters are private to its own
    # runner — it can neither queue behind the mutex nor skip a dependent.
    #
    # `permissions:` and `concurrency:` are inherited from the workflow level
    # (lines ~40 and ~53), matching `sql-gate-lint` and every other job here.
    # Restating them per-job would fork two sources of truth, and a second
    # concurrency group inside a workflow that already has one changes
    # cancellation semantics rather than tightening them.
    #
    # No `npm ci` and no node_modules: `run.mjs` and `parse.mjs` import only
    # node builtins. An install this job does not need is an install that can
    # fail and flake the gate.
    #
    # TIMEOUT (threat T-164.3-20): 30 arms x ~2.0s of lane time plus cluster
    # boots measured at 64s wall clock locally (2026-08-29). 15 minutes is an
    # order of magnitude of headroom for a slower runner while still bounding a
    # wedged cluster rather than burning the job's default 360.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Probe - the runner image's PostgreSQL server binaries resolve
        # 164.3-RESEARCH assumption A1 ("ubuntu-latest ships PostgreSQL server
        # binaries under /usr/lib/postgresql/<major>/bin") has NEVER been
        # executed — the lane and the runner were built and measured on macOS
        # only. This step converts the assumption into a MEASUREMENT printed in
        # the job log, on the first CI run, before anything depends on it.
        #
        # It is deliberately NON-FATAL on its own: `scripts/pg-lane/run.sh`
        # carries a four-step resolution chain (`pg_ctl` on PATH -> `pg_config
        # --bindir` -> /usr/lib/postgresql/*/bin -> homebrew) and fails loud by
        # itself if every step misses. Duplicating that judgement here would
        # create a second, divergent opinion about which layout is acceptable.
        # What this step buys is a NAMED diagnosis in the log when the lane does
        # fail, instead of an opaque initdb error.
        run: |
          set -uo pipefail
          echo "PATH pg_ctl:      $(command -v pg_ctl || echo '(not on PATH)')"
          echo "pg_config bindir: $(pg_config --bindir 2>/dev/null || echo '(pg_config absent)')"
          echo "--- /usr/lib/postgresql glob ---"
          ls -d /usr/lib/postgresql/*/bin 2>/dev/null || echo "(no /usr/lib/postgresql/*/bin)"
          echo "--- initdb/pg_ctl under that glob ---"
          ls -l /usr/lib/postgresql/*/bin/initdb /usr/lib/postgresql/*/bin/pg_ctl 2>/dev/null \
            || echo "(no initdb/pg_ctl under the glob)"

      - name: Preflight - reject psql meta-commands in every file the runner executes
        # SAME REFUSAL AS `sql-tests`' Finding 6 preflight, WIDENED TO THE FILE
        # SET THIS JOB ACTUALLY EXECUTES. That job scans only
        # `supabase/tests/test_*.sql`; this one applies fixtures and MIGRATIONS
        # to a live cluster too, and psql meta-commands are CLIENT-side — the
        # server cannot refuse them, so they must be refused at the file level
        # before psql ever opens the file (T-164.3-19).
        #
        # The scanned set is a deliberate SUPERSET of the RED-UNDER-SETUP apply
        # lists (all tests + all lane fixtures + all migrations) rather than a
        # list derived from the annotations. A derived list is a second place
        # for the corpus to drift; a superset can only ever over-refuse, and an
        # over-refusal here would itself be a finding worth stopping for.
        # MEASURED 2026-08-29: 335 files scanned, 0 hits.
        #
        # ⚠️ `grep -a`, NOT bare `grep`. This repo has a MEASURED NUL-blind file
        # (`src/lib/wizardErrors.test.ts` carries a deliberate NUL): ugrep skips
        # such a file entirely and its exit 1 reads as "clean". A scanner that
        # silently declines to read a file is the vacuity shape this phase is
        # about, so the binary-safe flag is not optional here.
        #
        # Patterns, one grep each so the error names the exact meta-command:
        #   \!       shell escape (reads env vars, curls them out)
        #   \copy    client-side file IO
        #   \COPY    upper-case form
        #   \o ...   redirect query output into a file an artifact could carry
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/tests/test_*.sql scripts/pg-lane/fixtures/*.sql supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::MEASURE_FAIL: the preflight matched ZERO files. The runner executes SQL, so an empty scan set means the glob is wrong, not that the corpus is clean."
            exit 1
          fi
          bad=0
          # ⛔ SP-L02. Each of these greps used to end `>/dev/null 2>&1`, and
          # that second redirect discards the ERROR channel: grep exits 0 on a
          # hit, 1 on none, and >= 2 when it could not read the file at all —
          # so an unreadable or unstattable file read as CLEAN. The step's own
          # MEASURE_FAIL covered only a zero-length glob. "Silently declines to
          # read a file" is the exact shape the NUL note above names, one line
          # up from where it was happening.
          #
          # stdout still goes to /dev/null (the match itself is not wanted);
          # stderr is NOT suppressed, and any exit >= 2 is a hard failure.
          scan() {
            local f="$1" pattern="$2" label="$3" rc
            set +e
            grep -anE "$pattern" "$f" >/dev/null
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error file=$f::contains '$label' — refused by the mutation-lane preflight"
              bad=1
            elif [ "$rc" -gt 1 ]; then
              echo "::error file=$f::MEASURE_FAIL: grep exited $rc scanning for '$label'. The file could not be read, so this preflight has NOT cleared it — that is not the same as clean."
              bad=1
            fi
          }
          for f in "${files[@]}"; do
            # IN-06: this read '^\\\!|^\\!| \\\!| \\!'. In ERE both `\\\!` and
            # `\\!` denote a literal backslash followed by a literal `!`, so
            # alternatives 1/2 and 3/4 were duplicates — redundancy that reads
            # as a deliberate distinction which does not exist. Verified
            # behaviour-identical against a `\!`-at-line-start file, a
            # `\!`-after-a-space file and a clean file (exit 0/0/1 both ways).
            #
            #   \!       shell escape (reads env vars, curls them out)
            #   \copy    client-side file IO
            #   \COPY    upper-case form
            #   \o ...   redirect query output into a file
            scan "$f" '(^| )\\!'            '\!'
            scan "$f" '\\copy\b'             '\copy'
            scan "$f" '\\COPY\b'             '\COPY'
            scan "$f" '^\\o |^\\o$| \\o '     '\o'
          done
          if [ "$bad" = 1 ]; then
            echo "::error::One or more files the mutation runner executes contain a refused psql meta-command."
            exit 1
          fi
          echo "Preflight clean: ${#files[@]} file(s) free of refused meta-commands."

      - name: Runner self-test - every defect kind still fires
        # ⛔ SP-C02. This step was MISSING, and its absence was the largest hole
        # in this job. Verified by repo-wide grep at the time: `run.mjs
        # --self-test` was invoked by NOTHING, while the two sibling jobs both
        # run theirs (`lint-sql-gates.mjs --self-test` at ~:796,
        # `verify-plan-anchors.mjs --self-test` at ~:1139).
        #
        # It is the SOLE proof that the runner's six defect kinds — `no-red`,
        # `wrong-first-failure`, `occurrence-mismatch`, `identity-rewrite`,
        # `synthesised-identity`, `floor` — can still fire. The corpus run below
        # is GREEN BY CONSTRUCTION at 30/30: a runner whose defect reporting was
        # disabled would still print `arms: 30/30/0`, clear both floors and exit
        # 0. Vitest covers `neuterArm`, the floors and the identity helpers; it
        # never covers `runCorpus`'s defect REPORTING, because that needs a
        # cluster. So without this step, "0 defects" was a number nothing could
        # contradict — this phase's own thesis, inside this phase's own gate.
        #
        # BEFORE the corpus run, for the same reason `sql-gate-lint` orders its
        # two steps that way: a clean scan means nothing unless the detector can
        # still fire. It needs no extra provisioning — it drives the same
        # throwaway `initdb` cluster `scripts/pg-lane/run.sh` creates for the
        # corpus run. Measured 2026-08-29: 8/8, in seconds; 12/12 after
        # 164.3.1-11 added the Primitive-A and -B regression corpus (2026-09-01);
        # 15/15 after the 164.3.1 review added the F1 message-embedded forgery,
        # the injected-lane absurdity FIRE scenario and the `lane-unrunnable`
        # MEASURE_FAIL (2026-09-02).
        #
        # ⛔ MODE IDENTITY: the bare command from the script's own header, no
        # wrapper. Pinned from vitest by src/__tests__/mutation-runner-floors.test.ts.
        run: node scripts/mutation-runner/run.mjs --self-test

      - name: Mutate every annotated RED-UNDER arm and require it to bite
        # ⛔ MODE IDENTITY (164.3-RESEARCH Pitfall 2,
        # `reference_gstack_evidence_wrapper_reddens_suite`). The command below
        # is byte-identical to the one in the script's own header and to what a
        # developer runs locally. No wrapper, no flags, no npm alias.
        #
        # Its stdout goes to a FILE and is `cat` back into the log, rather than
        # through `| tee`. Two measured reasons, both from this repo:
        #   * a PIPE makes `$?` the LAST command's status. That hazard bit this
        #     plan's own execution (`--self-test` reported FAIL while the shell
        #     reported exit 0, because `$?` was `tail`'s). `status=$?` on the
        #     very next line cannot be fooled;
        #   * the log has to survive into the assertion step below, and the file
        #     must live in RUNNER_TEMP, NOT the workspace: the runner asserts
        #     `git status --porcelain` is unchanged across its own run and would
        #     report `dirty-checkout` on a log file written beside the corpus.
        # argv is unchanged either way — only the stdout fd differs, which in CI
        # is a file regardless.
        env:
          RUNNER_LOG: ${{ runner.temp }}/mutation-runner.log
        run: |
          set -uo pipefail
          node scripts/mutation-runner/run.mjs > "$RUNNER_LOG" 2>&1
          status=$?
          cat "$RUNNER_LOG"
          exit $status

      - name: Assert the run PRINTED its coverage and cleared both floors
        # D-01's print, made LOAD-BEARING. The runner prints coverage and arm
        # counts on every run; without this step a build of the runner that
        # silently stopped printing them would pass unnoticed, and the coverage
        # ratchet would become a number nobody compares to anything — which is
        # this phase's entire subject, committed inside this phase's own gate.
        #
        # It also closes the invocation-swap hole: `--parse-only` is a legitimate
        # mode that checks the whole corpus statically and exits 0, but it runs
        # ZERO arms. If anyone ever swaps it into the step above to make a red
        # board green, the executed-arm assertion below fails. That mechanism —
        # not the comment in run.mjs — is what keeps the static mode out of here.
        #
        # ⛔ EVERY ASSERTION DISTINGUISHES "could not measure" FROM "measured, no
        # problem". An absent line is a MEASURE_FAIL with its own message, never
        # a silent pass: an empty shell variable satisfies a numeric `-eq 0`
        # test, so the extraction is checked BEFORE any comparison.
        #
        # The floors are read FROM run.mjs, never restated here — a second copy
        # in ci.yml is a second thing to drift. `node -e` leaves
        # `process.argv[1]` undefined, so importing the module does not trip its
        # CLI entry point.
        env:
          RUNNER_LOG: ${{ runner.temp }}/mutation-runner.log
        run: |
          set -euo pipefail

          if [ ! -s "$RUNNER_LOG" ]; then
            echo "::error::MEASURE_FAIL: $RUNNER_LOG is missing or empty. The runner produced no output to check, which is not the same as a clean run."
            exit 1
          fi

          floors=$(node -e 'import("./scripts/mutation-runner/run.mjs").then(m => console.log(m.FILES_FLOOR, m.ARMS_FLOOR, m.WAIVED_CEILING))')
          files_floor=$(echo "$floors" | cut -d" " -f1)
          arms_floor=$(echo "$floors" | cut -d" " -f2)
          waived_ceiling=$(echo "$floors" | cut -d" " -f3)
          case "$files_floor" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read FILES_FLOOR from scripts/mutation-runner/run.mjs (got '$files_floor')."; exit 1;; esac
          case "$arms_floor" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read ARMS_FLOOR from scripts/mutation-runner/run.mjs (got '$arms_floor')."; exit 1;; esac
          case "$waived_ceiling" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read WAIVED_CEILING from scripts/mutation-runner/run.mjs (got '$waived_ceiling')."; exit 1;; esac
          echo "floors from run.mjs: FILES_FLOOR=$files_floor ARMS_FLOOR=$arms_floor WAIVED_CEILING=$waived_ceiling"

          coverage_line=$(grep -a -m1 -E '^coverage: files [0-9]+/[0-9]+$' "$RUNNER_LOG" || true)
          if [ -z "$coverage_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'coverage: files N/M' line. D-01 requires coverage on every run; a runner that stopped printing it has silently retired its own ratchet."
            exit 1
          fi
          echo "$coverage_line"
          files_annotated=$(echo "$coverage_line" | sed -E 's|^coverage: files ([0-9]+)/[0-9]+$|\1|')
          if [ "$files_annotated" -lt "$files_floor" ]; then
            echo "::error::FILES_FLOOR regression: $files_annotated annotated file(s) < floor $files_floor."
            exit 1
          fi

          # 164.4-01 — THE EXCLUSION MUST BE NAMED (criterion 1 as amended by the
          # founder, 2026-09-02). `coverage: files N/71` is a ratio over every
          # `.sql` in the scope dir, and this phase's end state deliberately
          # leaves a subset uncovered: files that raise outside the runner's
          # identity idiom, which it can never attribute an arm in. A reader of
          # the ratio alone cannot tell that subset from work nobody has done
          # yet. So the runner derives and PRINTS the excluded set by name, and
          # a silent exclusion fails HERE exactly as a missing annotation does.
          #
          # Two arms, in the discipline every assertion above uses:
          #   (1) the line is ABSENT -> MEASURE_FAIL with its own message. A
          #       runner that stopped classifying its corpus has retired the
          #       amendment, and an absent line is never a zero.
          #   (2) the count it CLAIMS must equal the number of `*.sql` names it
          #       PRINTS. Evidence before verdict (SC-7): a count with no names
          #       is a number nobody can check, and names with a wrong count is
          #       the shape a hand-maintained list decays into.
          # No literal count is restated here — the successor phase shrinks this
          # set and the runner derives it. Both sides come from the run output.
          unreachable_line=$(grep -a -m1 -E '^unreachable: [0-9]+ file\(s\) ' "$RUNNER_LOG" || true)
          if [ -z "$unreachable_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'unreachable: N file(s) …' line, so which gate files this run deliberately did NOT cover is unknown. Criterion 1 (as amended 2026-09-02) requires the exclusion to be named on every run: a silent exclusion fails this gate exactly as a missing annotation does."
            exit 1
          fi
          echo "$unreachable_line"
          unreachable_claimed=$(echo "$unreachable_line" | sed -E 's|^unreachable: ([0-9]+) file\(s\) .*|\1|')
          case "$unreachable_claimed" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the excluded-file count out of '$unreachable_line'."; exit 1;; esac
          unreachable_named=$(echo "$unreachable_line" | grep -a -o -E '[A-Za-z0-9_]+\.sql' | wc -l | tr -d '[:space:]')
          case "$unreachable_named" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not count the file names on '$unreachable_line'."; exit 1;; esac
          if [ "$unreachable_claimed" -ne "$unreachable_named" ]; then
            echo "::error::MEASURE_FAIL: the run CLAIMS $unreachable_claimed excluded file(s) but NAMES $unreachable_named. The count and the names come from the same derivation in one run and cannot disagree; a claim the log's own evidence contradicts is not a measurement."
            exit 1
          fi

          arms_line=$(grep -a -m1 -E '^arms: [0-9]+/[0-9]+/[0-9]+ ' "$RUNNER_LOG" || true)
          if [ -z "$arms_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'arms: E/A/W' line, so the number of arms actually EXECUTED is unknown. Unknown is not zero and it is not fine."
            exit 1
          fi
          echo "$arms_line"
          arms_executed=$(echo "$arms_line" | sed -E 's|^arms: ([0-9]+)/[0-9]+/[0-9]+ .*|\1|')
          if [ "$arms_executed" -eq 0 ]; then
            echo "::error::MEASURE_FAIL: ZERO arms executed. The gate cannot observe a non-biting annotation without running one. If the step above was changed to --parse-only, that is a static check, not this gate."
            exit 1
          fi
          # WAIVED_CEILING (2026-09-02 red team): a waiver is a counted twin that
          # never runs a lane, so NEW prose markers with waiver twins raise the
          # annotated counts and lower nothing — every floor stays green while
          # coverage is inflated with zero new arms. The W field is bounded from
          # ABOVE, against the constant read out of run.mjs beside the floors.
          arms_waived=$(echo "$arms_line" | sed -E 's|^arms: [0-9]+/[0-9]+/([0-9]+) .*|\1|')
          case "$arms_waived" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the waived count out of '$arms_line'."; exit 1;; esac
          if [ "$arms_waived" -gt "$waived_ceiling" ]; then
            echo "::error::WAIVED_CEILING exceeded: $arms_waived waived arm(s) > ceiling $waived_ceiling. A waiver is an arm this gate will never prove can fail; adding one is a reviewed edit to WAIVED_CEILING in scripts/mutation-runner/run.mjs, never a side effect of annotating."
            exit 1
          fi
          # IN-05: ARMS_FLOOR bounds BITING arms — executed minus those that did
          # not redden or reddened on the wrong arm — not raw executed. This
          # step used to compare `arms_executed` to the same constant and print
          # "ARMS_FLOOR regression: N arm(s) executed < floor", naming a
          # quantity the constant was never measured against. The runner now
          # prints the real one under its own name and this reads THAT.
          #
          # A missing `biting:` line is a MEASURE_FAIL and not a zero: it is
          # also what a `--parse-only` swap produces, since that mode executes
          # nothing and deliberately does not print it.
          biting_line=$(grep -a -m1 -E '^biting: [0-9]+ ' "$RUNNER_LOG" || true)
          if [ -z "$biting_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'biting: N' line, so the quantity ARMS_FLOOR actually bounds is unknown. Either the runner stopped reporting it, or the step above was not the gate (--parse-only executes zero arms and does not print it)."
            exit 1
          fi
          echo "$biting_line"
          biting=$(echo "$biting_line" | sed -E 's|^biting: ([0-9]+) .*|\1|')
          case "$biting" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the biting count out of '$biting_line'."; exit 1;; esac
          # ⚠️ R2-I01, STATED SO IT IS NOT MISREAD AS A LIVE CHECK: this arm is
          # UNREACHABLE for any log the runner produces. `bitingArms` is
          # `armsExecuted` minus a subset of the defects, so `biting <=
          # executed` holds by construction (run.mjs, the ARMS_FLOOR block).
          # It is kept deliberately, and only for what it DOES cover: a log
          # that was hand-edited, spliced from two runs, or assembled by a
          # wrapper. This step's whole job is to read numbers out of a text
          # file it did not produce, so "these two cannot disagree" is worth
          # asserting about the FILE even though it is trivially true of the
          # program. It is not evidence that the runner is consistent. (Since
          # 164.3.1-10 the runner asserts this same relation IN-PROCESS as
          # part of its absurdity floor — `absurdityViolations` in run.mjs —
          # so a violation here means the file, not the arithmetic.)
          if [ "$biting" -gt "$arms_executed" ]; then
            echo "::error::MEASURE_FAIL: biting ($biting) exceeds executed ($arms_executed). Those two numbers come from the same run and cannot disagree this way, so this log was not produced by one run of the gate."
            exit 1
          fi
          # 164.3.1-10 — THE RUNNER'S ABSURDITY FLOOR, RE-ASSERTED OUT OF PROCESS.
          # The runner now counts its arm lanes TWICE, independently: once in
          # its verdict loop (the `arms: E/…` line above) and once INSIDE the
          # lane runner at the spawn (`lane-invocations: N`). It fails itself
          # when they disagree. This step re-reads both numbers out of the log
          # and asserts the same relation, for the same reason every other arm
          # here exists: a build of the runner that silently stopped printing
          # the second tally — or a log assembled from something other than one
          # honest run — must fail HERE rather than pass quietly. A missing line
          # is a MEASURE_FAIL and never a zero (an empty variable satisfies a
          # numeric test), checked BEFORE any comparison, like every line above.
          # The relation is EXACT: the printed count IS the arm-leg count; the
          # baseline and restore legs are printed in the same line's parenthesis
          # as evidence and are not compared. No literal is restated here — both
          # sides come from the run output, and the measured values behind the
          # rule (30/30/30 at plan 164.3.1-09's re-derivation) live beside the
          # rule in run.mjs, once.
          lane_line=$(grep -a -m1 -E '^lane-invocations: [0-9]+ ' "$RUNNER_LOG" || true)
          if [ -z "$lane_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'lane-invocations: N' line, so the runner's second, independent count of arm lanes is unknown and its own cross-check cannot be re-asserted. Either the runner stopped reporting it (164.3.1-10), or the step above was not the gate (--parse-only executes zero arms and prints no lane tally)."
            exit 1
          fi
          echo "$lane_line"
          lane_invocations=$(echo "$lane_line" | sed -E 's|^lane-invocations: ([0-9]+) .*|\1|')
          case "$lane_invocations" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the lane-invocation count out of '$lane_line'."; exit 1;; esac
          if [ "$lane_invocations" -ne "$arms_executed" ]; then
            echo "::error::MEASURE_FAIL — this is the GATE failing, not the corpus: the verdict loop reported $arms_executed executed arm(s) but the lane runner counted $lane_invocations arm lane(s) (executed=$arms_executed lane-invocations=$lane_invocations biting=$biting). Arms were claimed that no lane ran, or lanes ran that no verdict describes. The runner's own in-process floor exits 1 on this; a log reaching this step with these numbers was not produced by one honest run of the gate."
            exit 1
          fi
          if [ "$biting" -lt "$arms_floor" ]; then
            echo "::error::ARMS_FLOOR regression: $biting biting arm(s) < floor $arms_floor. An annotation stopped biting, was deleted, or was converted to a waiver without lowering the floor in scripts/mutation-runner/run.mjs."
            exit 1
          fi

          echo "Coverage print is present, both floors and the waiver ceiling hold and the runner's two tallies agree: files $files_annotated >= $files_floor, biting arms $biting >= $arms_floor (of $arms_executed executed, $lane_invocations arm lane(s) spawned), waived $arms_waived <= $waived_ceiling."

  plan-anchor-verify:
    # Phase 164.3 / VAC-05 — re-resolve every anchor and quote a PENDING plan
    # makes about the tree.
    #
    # WHY IT EXISTS. A plan is a set of claims about the tree, and nothing ever
    # compared them to it. Both of Phase 164's wave-3 plans were STALE ON
    # ARRIVAL, measured: `164-04` anchored edits at `v2/page.tsx:563-573` in a
    # file an earlier plan had shrunk to 423 lines, and `164-03` specified a
    # two-argument `deriveShareToken` against a source whose signature had grown
    # a third parameter — followed literally it would have minted share links
    # that fail verification. A human caught both by reading carefully. This job
    # is that reading, mechanized.
    #
    # ⛔ SCOPED TO `pull_request`, DELIBERATELY NOT main-push. This is D-13's
    # ruling applied to the analogous case rather than re-decided:
    # `.planning/` is TRACKED here and plans routinely merge to main BEFORE they
    # execute (this phase's own plans do). A pending plan sitting on main whose
    # anchor drifts because unrelated code merged would redden main CI — and
    # **Railway waits on main CI and SKIPS the analytics-service deploy when it
    # is red**. D-13 removed exactly that coupling for VAC-04; a push trigger
    # here would re-introduce it through a different door. The founder accepted
    # a red board, not halted deploys.
    # Nothing is lost by the narrower trigger: a stale anchor matters at EXECUTE
    # time, and execution happens on a branch, so the PR is where the check has
    # to bite. See the aggregator row below — it is STRICT on `pull_request` and
    # tolerates `skipped` ONLY on the events this `if:` excludes.
    #
    # HERMETIC BY DESIGN: NO database, NO Docker, NO secrets, NO network, NO
    # node_modules (the script imports only node builtins). It reads tracked
    # files and exits. It cannot flake, and it runs identically on a fork PR.
    #
    # `permissions:` and `concurrency:` are inherited from the workflow level
    # (lines ~40 and ~53), matching `sql-gate-lint` and `sql-mutation`.
    # Restating them per-job would fork two sources of truth, and a second
    # concurrency group inside a workflow that already has one changes
    # cancellation semantics rather than tightening them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Self-test - both measured failure shapes still fire
        # Runs BEFORE the corpus scan, for a reason MEASURED on this repo on
        # 2026-08-29: the pending-plan corpus contained ZERO `path:line` anchors
        # that day. A corpus scan reporting "no stale claims" over a corpus with
        # no range claims in it says nothing at all about whether the range and
        # quote rules still work — so this step proves they do, against the two
        # historical failures as fixtures, before the scan's verdict is allowed
        # to mean anything. Same reasoning as `sql-gate-lint`'s rule self-test.
        run: node scripts/verify-plan-anchors.mjs --self-test

      - name: Re-resolve every pending plan's claims against the tree
        # ⛔ MODE IDENTITY (164.3-RESEARCH Pitfall 2,
        # `reference_gstack_evidence_wrapper_reddens_suite`). The command below
        # is byte-identical to the one in the script's own header and to what a
        # developer runs locally. No wrapper, no flags, no npm alias.
        #
        # stdout goes to a FILE and is `cat` back, not through `| tee`: a PIPE
        # makes `$?` the LAST command's status, a hazard this phase already hit
        # once (a `--self-test` reported FAIL while the shell reported 0). The
        # log also has to survive into the assertion step below, and it lives in
        # RUNNER_TEMP rather than the workspace so it cannot dirty the checkout.
        env:
          ANCHOR_LOG: ${{ runner.temp }}/plan-anchor-verify.log
        run: |
          set -uo pipefail
          node scripts/verify-plan-anchors.mjs --pending > "$ANCHOR_LOG" 2>&1
          status=$?
          cat "$ANCHOR_LOG"
          exit $status

      - name: Assert the scan PRINTED its counts and ran in the mode it claims
        # The counts, made LOAD-BEARING. Without this step, a build of the
        # verifier that silently stopped printing them would pass unnoticed, and
        # a reviewer would have no way to tell a scan of five plans from a scan
        # of none.
        #
        # It also closes the invocation-swap hole: `--self-test` exits 0 having
        # scanned NO plan at all. Its output carries no `scanned: … pending plan
        # file(s) of …` line, so swapping it into the step above to green a red
        # board fails here. That mechanism — not a comment asking nicely — is
        # what keeps the two modes distinct.
        #
        # ⛔ EVERY ASSERTION DISTINGUISHES "could not measure" FROM "measured, no
        # problem": an absent line is a MEASURE_FAIL with its own message, never
        # a silent pass, because an empty shell variable satisfies a numeric
        # `-eq 0` test.
        #
        # ⚠️ WHAT IS DELIBERATELY *NOT* ASSERTED: a floor on the claim count.
        # Zero claims is a LEGITIMATE measurement — it is what a tree whose
        # plans have all been executed reports, and MEASURED on 2026-08-29 the
        # five pending plans carried 16 claims, none of them range anchors. A
        # floor would redden CI for an honest state. The burden of "the rules
        # can still fire" is carried by the self-test step above, which is the
        # only place it can be carried without inventing a number.
        env:
          ANCHOR_LOG: ${{ runner.temp }}/plan-anchor-verify.log
        run: |
          set -euo pipefail

          if [ ! -s "$ANCHOR_LOG" ]; then
            echo "::error::MEASURE_FAIL: $ANCHOR_LOG is missing or empty. The verifier produced no output to check, which is not the same as a clean scan."
            exit 1
          fi

          scanned_line=$(grep -a -m1 -E '^scanned: [0-9]+ pending plan file\(s\) of [0-9]+$' "$ANCHOR_LOG" || true)
          if [ -z "$scanned_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'scanned: N pending plan file(s) of M' line. Either the verifier stopped reporting what it looked at, or the step above was not run in --pending mode (--self-test scans no plan at all)."
            exit 1
          fi
          echo "$scanned_line"

          total_plans=$(echo "$scanned_line" | sed -E 's|^scanned: [0-9]+ pending plan file\(s\) of ([0-9]+)$|\1|')
          case "$total_plans" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the total plan count out of '$scanned_line'."; exit 1;; esac
          # CR-02: zero plan files is TWO different states and they must not
          # share this exit. `/gsd-complete-milestone` moves every phase dir
          # into .planning/milestones/v{X.Y}-phases/, leaving .planning/phases
          # legitimately empty — this repo has already produced that state once
          # (e9a57671). Failing on it reddens the required `frontend` check on
          # EVERY PR until someone creates a phase directory, and the only
          # remedy available is to switch this job off.
          #
          # The verifier now distinguishes them itself: a corpus it cannot
          # locate or READ is a MEASURE_FAIL and never reaches here, and a
          # corpus it opened and enumerated and found empty prints an explicit
          # `measured-zero:` line. So this step demands that line rather than
          # trusting the count — a zero with no measurement behind it is still
          # a MEASURE_FAIL.
          if [ "$total_plans" -eq 0 ]; then
            if grep -a -q -m1 '^measured-zero: ' "$ANCHOR_LOG"; then
              grep -a -m1 '^measured-zero: ' "$ANCHOR_LOG"
              echo "Zero plan files, and the verifier proved it READ the corpus to establish that. Archived corpus accepted."
            else
              echo "::error::MEASURE_FAIL: ZERO plan files found under .planning/phases AND no 'measured-zero:' line was printed. An unmeasured zero is a broken glob, not a clean corpus."
              exit 1
            fi
          fi

          # The deferral exemptions (WR-06) must be REPORTED on every run. A
          # plan can leave the pending set by carrying an explicit deferral
          # marker; if that count ever stopped being printed, plans could be
          # exempted without anyone seeing it.
          deferred_line=$(grep -a -m1 -E '^deferred: [0-9]+ plan file\(s\) exempted by an explicit deferral marker$' "$ANCHOR_LOG" || true)
          if [ -z "$deferred_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'deferred: N plan file(s) …' line. Plans can leave the pending set by carrying a deferral marker, so a run that does not report how many did is hiding its own exemptions."
            exit 1
          fi
          echo "$deferred_line"

          # ⛔ R2-W05: "the line is printed" IS NOT A CONTROL, because nothing
          # compared the print to anything. Both deferral routes — a sibling
          # `<n>-DEFERRED.md`, and `status: deferred` in the plan's own
          # frontmatter — are writable by the SAME PR that adds the plan, so a
          # PR could empty the pending set entirely and this step would still
          # pass, having asserted only that a number appeared.
          #
          # So the VALUE is asserted, against a ratchet pinned by measurement —
          # the same discipline the mutation runner's ARMS_FLOOR uses, and for
          # the same reason: waiver creep is how the thing being waived hides.
          #
          # DEFERRED_CEILING MEASURED 2026-08-29:
          #   node scripts/verify-plan-anchors.mjs --pending
          #   -> scanned: 2 pending plan file(s) of 70
          #      deferred: 1 plan file(s) exempted …   (164.3-07, VAC-07)
          # A SECOND deferral therefore reddens this job until someone raises
          # this number in a reviewed edit to this file — which is exactly the
          # cost an exemption should carry. It never demands fewer.
          DEFERRED_CEILING=1
          deferred_n=$(echo "$deferred_line" | sed -E 's|^deferred: ([0-9]+) plan file\(s\) exempted by an explicit deferral marker$|\1|')
          case "$deferred_n" in ''|*[!0-9]*)
            echo "::error::MEASURE_FAIL: could not read the deferral count out of '$deferred_line'."; exit 1;; esac
          if [ "$deferred_n" -gt "$DEFERRED_CEILING" ]; then
            echo "::error::DEFERRAL_CEILING regression: ${deferred_n} plan file(s) are exempted from anchor verification, ceiling is ${DEFERRED_CEILING}. A deferral marker switches this gate off for a plan and is writable by the PR that adds the plan, so growing the exempt set is a deliberate, reviewed edit to DEFERRED_CEILING in ci.yml — not something a PR does to itself."
            exit 1
          fi

          # And the count must not be able to LIE about itself: the verifier
          # prints one `  deferred: <path>  [<marker>]` line per exemption, so
          # the two numbers are produced independently and must agree. A count
          # printed without its detail lines would otherwise satisfy the ceiling
          # above while hiding what it exempted.
          deferred_detail=$(grep -a -c -E '^  deferred: .+  \[.+\]$' "$ANCHOR_LOG" || true)
          deferred_detail=${deferred_detail:-0}
          if [ "$deferred_detail" -ne "$deferred_n" ]; then
            echo "::error::MEASURE_FAIL: the run reports ${deferred_n} exempted plan file(s) but printed ${deferred_detail} exemption detail line(s). The count and the list disagree, so what was exempted is unknown."
            exit 1
          fi
          if [ "$deferred_n" -gt 0 ]; then
            grep -a -E '^  deferred: .+  \[.+\]$' "$ANCHOR_LOG"
          fi

          claims_line=$(grep -a -m1 -E '^claims: [0-9]+ checked$' "$ANCHOR_LOG" || true)
          if [ -z "$claims_line" ]; then
            echo "::error::MEASURE_FAIL: the run printed NO 'claims: N checked' line, so the number of claims actually re-resolved is unknown. Unknown is not zero and it is not fine."
            exit 1
          fi
          echo "$claims_line"

          echo "Scan counts are present and the mode is the one this gate requires: $total_plans plan file(s) discovered."

  frontend:
    # Aggregator. Branch protection gates on this single required check;
    # `needs:` enforces that every parallel frontend-* job above passed.
    # `if: always()` + the explicit result-check below is critical: a bare
    # `needs:` chain marks the aggregator as `skipped` (not `failed`) when
    # any upstream fails, and `skipped` checks can satisfy classic GitHub
    # branch protection rules — silently letting broken code merge. The
    # explicit `exit 1` on any non-success forces a definite `failure`
    # status that all branch-protection configurations honor.
    #
    # CI speed (2026-07-02, user decision): `lighthouse-mobile` was REMOVED
    # from this gate (Phase 48-05 / A11Y-03 had wired it into BOTH `needs`
    # and the result-check loop). After coverage folded into the test shards,
    # the perf-budget job was the aggregator's slowest dependency (~+2m on
    # every merge) and its noisiest signal. It is now ADVISORY like e2e: it
    # still runs on every PR and reports its own check — it just no longer
    # blocks this aggregator.
    #
    # Phase 126 / FACTSHEET-02 (2026-07-19): the seed-gated `e2e-seeded` job
    # is now BLOCKING here -- the sfox-badge legs are the go-live gate and
    # were advisory before. It self-skips when `E2E_TEST_DB_CONFIGURED` is
    # unset (fork PRs / repos without test-DB setup), so `skipped` is
    # tolerated FOR THE e2e-seeded ROW ONLY in the loop below; on the main
    # repo the variable is set, the job runs, and a real `failure` reddens
    # this required check. All other rows stay strict (any non-success fails).
    #
    # Phase 140.2 / SEAMCORE-09 (2026-07-26): `frontend-seam-redis` is wired in
    # BOTH places below — `needs:` AND the result loop — because either one
    # alone leaves it advisory. It takes the loop's STRICT default arm and must
    # NEVER be given an `e2e-seeded`-style fork-only-skip tolerance: it consumes
    # no secret and no repo variable, so it runs identically on a fork PR and a
    # `skipped` result there is always a real fault, never a legitimate gate.
    #
    # Phase 158 / OPS-02 (2026-08-20): `sql-tests` is now BLOCKING here, wired
    # into BOTH places below. It was present-and-failing with NOTHING gating on
    # it — and it is the only gate that EXECUTEs the real deployed cron bodies
    # (it caught D-19). Its tolerance arm diverges from `e2e-seeded`'s by one
    # event: its `if:` requires `github.event_name == 'push'` OR a same-repo PR,
    # so it legitimately skips on fork PRs AND on `workflow_dispatch` (the
    # golden-bake route) — a strict arm would redden every manual bake run. A
    # skip on push/same-repo-PR still fails: that means E2E_TEST_DB_CONFIGURED
    # was LOST, the same silent-disable the e2e-seeded arm detects.
    # Wall-clock cost is ACCEPTED: this aggregator now waits on `sql-tests`,
    # which itself needs `python` (~7m) plus its mutex wait. The alternative is
    # the present-but-ungating state this requirement exists to kill.
    # Phase 164.3 / VAC-03 (2026-08-29): `sql-gate-lint` is BLOCKING here, wired
    # into BOTH places below — either one alone leaves it advisory, the same trap
    # SEAMCORE-09 recorded for `frontend-seam-redis`. It takes the loop's STRICT
    # default arm and must NEVER be given a tolerance arm: it is hermetic (no
    # database, no Docker, no secrets, no network), so it runs identically on a
    # fork PR, a same-repo PR, a push and a workflow_dispatch. It therefore has
    # no legitimate skip, and a `skipped` result there is always a real fault —
    # exactly the `frontend-seam-redis` reasoning, and the OPPOSITE of the
    # `sql-tests` / `e2e-seeded` rows, whose tolerances exist only because those
    # jobs consume a repo variable a fork cannot see.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply to this
    # one: that ban exists because those jobs share the TEST advisory-lock mutex
    # and their `if:` conditions diverge, so a chain edge can silently skip a
    # dependent. `sql-gate-lint` touches no shared resource, has no `if:`, and
    # runs on every event — it cannot skip a dependent and cannot queue behind
    # the mutex.
    #
    # Phase 164.3 / VAC-01 (2026-08-29): `sql-mutation` is BLOCKING here, wired
    # into BOTH places below for the same reason as its siblings — either one
    # alone leaves it advisory. It takes the loop's STRICT default arm and must
    # NEVER be given a tolerance arm: it consumes no secret and no repo
    # variable, hosts its own throwaway PostgreSQL clusters, and carries no
    # `if:`, so it runs identically on a fork PR, a same-repo PR, a push and a
    # workflow_dispatch. It has no legitimate skip, so a `skipped` there is
    # always a real fault — the `frontend-seam-redis` / `sql-gate-lint`
    # reasoning, and the OPPOSITE of the `sql-tests` / `e2e-seeded` rows.
    # ⭐ WHAT REDDENS IT: an annotated gate arm whose declared mutation no longer
    # makes that arm the FIRST failure. That is the "control that cannot fail"
    # class — every instance of which was GREEN in this workflow before this job
    # existed — so a strict row is the whole point of building it.
    # ⛔ The DB-touching jobs' ban on new `needs:` edges does NOT apply to it:
    # that ban exists because those jobs share the TEST advisory-lock mutex and
    # their `if:` conditions diverge, so a chain edge can silently skip a
    # dependent. `sql-mutation` shares no resource, waits on no mutex, and
    # deliberately never touches the shared TEST database (D-07).
    #
    # Phase 164.3 / VAC-05 (2026-08-29): `plan-anchor-verify` is BLOCKING here,
    # wired into BOTH places below — either one alone leaves it advisory, the
    # trap SEAMCORE-09 recorded for `frontend-seam-redis`.
    # ⚠️ ITS ROW IS THE ONE EXCEPTION TO "hermetic ⇒ no tolerance arm", and the
    # reason is a TRIGGER, not a credential. The job carries
    # `if: github.event_name == 'pull_request'` because `.planning/` is TRACKED
    # and plans merge to main BEFORE they execute, so a pending plan whose
    # anchor drifts on main would redden main CI — and Railway waits on main CI
    # and SKIPS the analytics-service deploy when it is red (D-13's reasoning,
    # applied rather than re-decided). It therefore SKIPS BY DESIGN on push and
    # on workflow_dispatch, and that skip is tolerated FOR THIS ROW ONLY.
    # On a `pull_request` — the event its `if:` admits and the event where a
    # stale anchor actually matters, because execution happens on a branch —
    # the row is STRICT: the job consumes no secret and no repo variable, so it
    # runs identically on a fork PR and any non-success there is a real fault.
    #
    # NOTE: this `needs:` entry is NOT one of the ⛔-banned chain edges among the
    # DB-touching jobs (see the notes on `sql-tests` / `e2e-seeded`). Those are
    # banned because a skipped `needs:` job SKIPS its dependents; this job
    # carries `if: always()`, so an upstream skip reaches the loop below as a
    # RESULT to judge rather than skipping the gate.
    runs-on: ubuntu-latest
    needs:
      - frontend-typecheck
      - frontend-lint
      - frontend-test
      - frontend-coverage
      - frontend-seam-redis
      - frontend-policy
      - frontend-build
      - e2e-seeded
      - sql-tests
      - sql-gate-lint
      - sql-mutation
      - plan-anchor-verify
    if: always()
    steps:
      - name: Verify all frontend-* jobs succeeded
        run: |
          fail=0
          for r in \
            "frontend-typecheck=${{ needs.frontend-typecheck.result }}" \
            "frontend-lint=${{ needs.frontend-lint.result }}" \
            "frontend-test=${{ needs.frontend-test.result }}" \
            "frontend-coverage=${{ needs.frontend-coverage.result }}" \
            "frontend-seam-redis=${{ needs.frontend-seam-redis.result }}" \
            "frontend-policy=${{ needs.frontend-policy.result }}" \
            "frontend-build=${{ needs.frontend-build.result }}" \
            "e2e-seeded=${{ needs.e2e-seeded.result }}" \
            "sql-tests=${{ needs.sql-tests.result }}" \
            "sql-gate-lint=${{ needs.sql-gate-lint.result }}" \
            "sql-mutation=${{ needs.sql-mutation.result }}" \
            "plan-anchor-verify=${{ needs.plan-anchor-verify.result }}"; do
            name="${r%=*}"; result="${r#*=}"
            echo "$name: $result"
            if [ "$name" = "e2e-seeded" ]; then
              # Phase 126 / FACTSHEET-02 + RT-01 canary: e2e-seeded is BLOCKING
              # (the sfox-badge legs are the go-live gate). It legitimately
              # self-skips ONLY on a FORK PR — a different head repo has no
              # access to the test-DB variable. On a push to main OR a same-repo
              # PR, a `skipped` result means E2E_TEST_DB_CONFIGURED was LOST
              # (which ALSO silently disables sql-tests), so a skip there is NOT
              # tolerated: the gate must redden rather than green-wash an
              # untested go-live badge (RT-01 red-team H4 — the #1 silent-green).
              is_fork_pr='${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$is_fork_pr" = "true" ]; then
                echo "e2e-seeded skipped (fork PR — no test-DB access); tolerated for this row only."
              else
                echo "::error::e2e-seeded result=$result on a TRUSTED event (push/same-repo). The go-live badge gate MUST run here — E2E_TEST_DB_CONFIGURED may be unset (this also disables sql-tests). A skip is not tolerated."
                fail=1
              fi
            elif [ "$name" = "sql-tests" ]; then
              # Phase 158 / OPS-02: sql-tests is BLOCKING — it is the only gate
              # that EXECUTEs the real deployed cron bodies. Its `if:` requires
              # `github.event_name == 'push'` OR a same-repo PR, so unlike
              # e2e-seeded it ALSO skips by design on `workflow_dispatch` (the
              # golden-bake route); a strict arm would redden every bake run.
              # Both skip-by-design routes are tolerated FOR THIS ROW ONLY. A
              # skip on push/same-repo-PR is NOT tolerated — but it has TWO
              # possible causes, and this loop cannot tell them apart.
              #
              # 158-REVIEW WR-04: the message used to assert only one of them
              # ("E2E_TEST_DB_CONFIGURED was LOST"), which is FALSE in the more
              # common case. `sql-tests` carries `needs: [python]`, and a skipped
              # or failed `needs:` job SKIPS its dependents — so an ordinary
              # `python` failure lands here as `sql-tests=skipped` and sent the
              # operator to check a repository variable when the real signal was
              # a red `python` check on the very same run. The gate reddening was
              # right; the stated cause was confidently wrong, which this repo's
              # fail-loud-and-ACCURATE doctrine treats as a real cost.
              #
              # `python` is deliberately NOT added to this aggregator's `needs:`
              # just to read its result: the phase's mutex design forbids new
              # `needs:` edges among the DB-touching jobs (their `if:`
              # conditions diverge on `workflow_dispatch`). Naming both causes,
              # cheapest-to-check first, costs nothing and misleads no one.
              is_fork_pr='${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}'
              is_dispatch='${{ github.event_name == 'workflow_dispatch' }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && { [ "$is_fork_pr" = "true" ] || [ "$is_dispatch" = "true" ]; }; then
                echo "sql-tests skipped (fork PR: $is_fork_pr / workflow_dispatch: $is_dispatch — its if: excludes both); tolerated for this row only."
              else
                if [ "$result" = "skipped" ]; then
                  echo "::error::sql-tests result=skipped on a TRUSTED event (fork_pr=$is_fork_pr, dispatch=$is_dispatch — only a skip on one of those is tolerated). TWO causes produce this, check in order: (1) its \`needs: python\` dependency did not succeed — look at the \`python\` check on THIS run first, and if it is red that is your answer and E2E_TEST_DB_CONFIGURED is NOT implicated; (2) otherwise E2E_TEST_DB_CONFIGURED was LOST, the same silent-disable the e2e-seeded arm above detects — the one that would let a migrations merge reach PROD with this gate quietly absent."
                else
                  echo "::error::sql-tests result=$result (fork_pr=$is_fork_pr, dispatch=$is_dispatch). The SQL self-tests — the only gate that EXECUTEs the deployed cron bodies (it caught D-19) — did not pass. If this is a mutex acquire timeout, see docs/runbooks/shared-test-db-mutex.md sections 2-3: queue depth and a wedged holder are different faults."
                fi
                fail=1
              fi
            elif [ "$name" = "plan-anchor-verify" ]; then
              # Phase 164.3 / VAC-05: BLOCKING, and STRICT on the only event it
              # runs on. Its `if:` scopes it to `pull_request` so that a pending
              # plan's anchor drifting on main cannot redden main CI and stall
              # the Railway analytics deploy (D-13's reasoning; the full
              # argument is in the job's own header and in the note above).
              # A skip on push / workflow_dispatch is therefore skip-by-design
              # and tolerated FOR THIS ROW ONLY. On a pull_request the job is
              # hermetic — no secret, no repo variable, no network — so it runs
              # identically on a fork PR and ANY non-success, skip included, is
              # a real fault.
              is_pr='${{ github.event_name == 'pull_request' }}'
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$is_pr" != "true" ]; then
                echo "plan-anchor-verify skipped (event is not pull_request — its if: scopes it there on purpose); tolerated for this row only."
              else
                echo "::error::plan-anchor-verify result=$result on a pull_request (is_pr=$is_pr). The pending plans' anchors were NOT re-resolved against the tree. A skip here means the job's if: was changed or the job was removed — it consumes no secret and cannot legitimately skip on a PR, fork or not."
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more frontend-* jobs did not succeed."
            exit 1
          fi
          echo "All frontend-* jobs succeeded."

  sql-tests:
    # audit-2026-05-07 follow-up Issue 6 — wire the supabase/tests/test_*.sql
    # files into CI. Pre-fix, the 5 plain PL/pgSQL test files were
    # committed but never invoked by any workflow or `package.json`
    # script — covering P911-P920, P917, P918, P919, P920, P455, P475
    # with no CI signal. A future migration could silently break the
    # sanitize_user sentinel trigger, the retention guard, the data
    # deletion FK action, the log_audit_event_service ceiling, or the
    # wizard draft guard with no test failure to catch it.
    #
    # Security (audit-2026-05-07 red-team Finding 6): TWO defenses:
    #
    #   1. Fork-author gate. Forked-PR runs MUST NOT receive
    #      TEST_SUPABASE_DB_URL — GitHub's default secret policy blocks
    #      it for fork PRs, but we also explicitly check
    #      github.event.pull_request.head.repo.full_name. Defense in
    #      depth means an internal-branch PR with a typo'd vars setting
    #      can't accidentally let a fork PR through.
    #
    #   2. Meta-command filter. Even with the gate, a malicious internal
    #      PR could commit a test file containing psql meta-commands
    #      (\!, \copy, \o, \COPY) that exfiltrate secrets from the
    #      runner. We grep each test file before psql -f and bail with
    #      an explicit error if any of those tokens appear. This is a
    #      file-content check; the env: injection still keeps the secret
    #      out of any run: shell-substitution surface.
    #
    # The if: gate composes both: fork PRs are blocked AND the
    # E2E_TEST_DB_CONFIGURED variable must be set. No untrusted
    # github.event.* content flows into any run: step — every reference
    # to a github.event.* value sits in YAML expressions evaluated at
    # workflow-parse time, never in shell substitution.
    #
    # Gating: same `vars.E2E_TEST_DB_CONFIGURED` pattern as the e2e job.
    # When the variable is unset (forks, repos without test-DB setup),
    # the job no-ops. Postgres connection string comes from
    # `secrets.TEST_SUPABASE_DB_URL` — a separate secret from the
    # PostgREST/HTTP-shaped TEST_SUPABASE_URL because psql speaks the
    # raw Postgres wire protocol (port 5432/6543 via pooler) rather than
    # the HTTPS REST API. If TEST_SUPABASE_DB_URL is not yet wired, the
    # step fails explicitly so the gate flips from "silent" to "loud
    # follow-up to provision the secret".
    #
    # The test files use plain `RAISE EXCEPTION` (no pgTAP) — under
    # `psql -v ON_ERROR_STOP=1` a failed assertion exits non-zero and
    # fails the job.
    runs-on: ubuntu-latest
    # TTL for the mutex below (Phase 158 / OPS-01): GitHub kills the job at 90m,
    # the psql session drops, and Postgres releases the advisory lock. That IS
    # the steal path — no reaper cron needed. Manual unlock:
    # docs/runbooks/shared-test-db-mutex.md.
    # 158-REVIEW CR-04: 90m, not 60m — sized so THREE simultaneous runs can all
    # succeed (setup + the 3600s acquire cap + this job's own work). See the
    # fuller derivation on the `python` job's identical TTL comment.
    # ⛔ The holder's `pg_sleep` must stay ABOVE this number (WR-01) — it is 6000s.
    timeout-minutes: 90
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.E2E_TEST_DB_CONFIGURED == 'true'
    # Phase 142.1 (D-05): this job must SERIALIZE against the `python` and
    # `e2e-seeded` jobs. These SQL files run against the ONE
    # shared Supabase test project (`secrets.TEST_SUPABASE_DB_URL`), and
    # test_strategy_analytics_stuck_computing_reaper.sql `EXECUTE`s the REAL
    # deployed cron body — a GLOBAL `ORDER BY computing_started_at ASC LIMIT 25`
    # over strategy_analytics that cannot be scoped to a caller. Each tick
    # briefly holds `FOR UPDATE SKIP LOCKED` locks on up to 25 FOREIGN candidate
    # rows inside a rolled-back transaction under a 5 s `lock_timeout`. Two
    # concurrent gate runs — or a gate run overlapping the `python` /
    # `e2e-seeded` jobs writing the same project — must SERIALIZE, not race:
    # unserialized, one run's rows land in the other's 25-row budget and the
    # LIMIT assertions redden on interleaving rather than on a defect, and the
    # 5 s lock_timeout turns lock contention into a 55P03 failure on an innocent
    # PR.
    #
    # HOW it serializes (Phase 158 / OPS-01): the "Acquire shared-test-db mutex"
    # step below takes a Postgres SESSION advisory lock (key 61616158) on the
    # TEST project through the session-mode DSN and holds it across this job's
    # DB-touching span. `python` and `e2e-seeded` take the SAME key. Contenders
    # BLOCK inside the lock instead of queueing in GitHub's concurrency layer.
    # Proven from real runners before adoption by .github/workflows/mutex-probe.yml
    # (three simultaneous contenders, pairwise non-overlapping hold windows).
    #
    # ⛔ Do NOT give this job its own private lock key — 142-REVIEW.md:286-291
    # proposed the equivalent (a private concurrency-group name), and it is the
    # wrong fix: a distinct key serializes this job only against itself and does
    # nothing about the `python`/`e2e-seeded` jobs writing the SAME project. All
    # three must take key 61616158.
    #
    # Costs wall-clock: this job queues behind `python` (~7m) and then waits on
    # the mutex rather than overlapping it — the same price `e2e-seeded` pays
    # below, and for the same reason. With the mutex the wait burns runner time;
    # under the old concurrency group it burned an entire gate (see below).
    #
    # ⛔ Do NOT reintroduce a job-level GitHub concurrency group for the shared
    # test DB (all three jobs carried one until Phase 158). That layer is what
    # BROKE, and no reshaping of it is a fix. GitHub Actions holds exactly ONE
    # pending entry per concurrency group: "Any previously pending job or
    # workflow in the concurrency group will be canceled." With two members that
    # was stable (one runs, one pends). Adding this job made THREE, and `python`
    # + `sql-tests` both dispatch at t=0 while `e2e-seeded` arrives minutes later
    # behind frontend-typecheck — so `e2e-seeded` EVICTED whichever of the first
    # two was still pending. The victim is CANCELLED, which renders as a GREY
    # check, not a red one, and branch protection is deferred on this repo, so
    # nothing blocked on it — and Railway's "wait for CI" then SKIPPED the
    # analytics deploy, leaving prod on stale code with no signal (issue #616).
    # On a push to main touching supabase/migrations/** that is the merge which
    # auto-applies migrations to PROD while losing either the Python drift gates
    # or this job — the only gate that EXECUTEs the real deployed cron body, and
    # the one that caught D-19.
    # ⛔ SHRINKING the shared-test-db concurrency group was never the fix either:
    # the eviction is CROSS-run, so fewer members only changes which run gets
    # evicted, not whether one does. The eviction layer had to GO, not shrink.
    #
    # `needs: [python]` below is KEPT. Under the group it was load-bearing (it
    # kept `python` and `sql-tests` from being queued at the same instant, so the
    # group never held two pending entries). With the group gone it no longer
    # carries correctness weight, but it costs nothing and keeps one fewer
    # simultaneous waiter on the mutex — so removing it buys nothing.
    #
    # ⛔ Do NOT "finish the chain" by adding `sql-tests` to `e2e-seeded`'s
    # `needs:`. A skipped `needs:` job skips its dependents, and the two `if:`
    # conditions diverge on `workflow_dispatch`: this job requires
    # `github.event_name == 'push'` (false on dispatch) while `e2e-seeded` only
    # requires `!= 'pull_request'` (true) — so the chain would disable
    # `e2e-seeded` on every manual run and trip the aggregator's skip check.
    # `python` carries no `if:`, so this job's own dependency is always safe.
    # Found by the /ship pre-landing review, 2026-08-03. The mutex does NOT
    # change this: it serializes without any `needs:` edge, which is precisely
    # why no new edge among these three jobs is warranted.
    # (Phase 158 / OPS-02: this job IS listed in the `frontend` aggregator's
    # `needs:`. That is not such an edge — `frontend` carries `if: always()`, so
    # a skip here cannot skip the aggregator; it is read as a RESULT, not
    # depended on for ordering.)
    needs:
      - python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. The sql-tests job
          # consumes TEST_SUPABASE_DB_URL but does no git ops; the
          # persisted cred is pure attack surface.
          persist-credentials: false
      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Preflight - reject psql meta-commands in test files (Finding 6)
        # Reject any test file containing psql meta-commands that could
        # exfiltrate secrets from the runner. Specifically:
        #   \!       — shell escape (executes any shell command, can
        #              read env vars / curl them out)
        #   \copy    — client-side file IO (can read /etc/passwd,
        #              the workflow's environment dumps, etc.)
        #   \o ...   — redirect query output to a file (can persist
        #              secrets into an artifact)
        #   \COPY    — upper-case form of \copy
        # All four are PSQL CLIENT-side; the server's check_function
        # cannot help. We refuse them at the file level.
        #
        # We deliberately use plain grep (no -P) so the patterns are
        # ERE-portable, and \\! requires single-quoting to keep the
        # backslash literal through the shell.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/tests/test_*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No supabase/tests/test_*.sql files to scan."
            exit 0
          fi
          bad=0
          for f in "${files[@]}"; do
            # Each pattern is its own grep so the error message can name
            # the exact meta-command that triggered the reject.
            if grep -nE '^\\\!|^\\!| \\\!| \\!' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\!' (shell escape) — refused by Finding 6 preflight"
              bad=1
            fi
            if grep -nE '\\copy\b' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\copy' (client file IO) — refused by Finding 6 preflight"
              bad=1
            fi
            if grep -nE '\\COPY\b' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\COPY' (client file IO) — refused by Finding 6 preflight"
              bad=1
            fi
            if grep -nE '^\\o |^\\o$| \\o ' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains '\\o' (output redirect) — refused by Finding 6 preflight"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "::error::One or more SQL test files contain a refused psql meta-command."
            exit 1
          fi
          echo "Preflight clean: ${#files[@]} test file(s) free of refused meta-commands."
      # Phase 158 / OPS-01 — the shared-test-db mutex, IDENTICAL in `sql-tests`,
      # `python` and `e2e-seeded`. It replaces the GitHub concurrency group those
      # three jobs used to carry (see the ⛔ note on this job for why that layer
      # had to go). A BACKGROUND psql session takes a Postgres SESSION advisory
      # lock on key 61616158 and holds it for the rest of the job: background
      # processes persist across steps on the same runner, and job teardown drops
      # the TCP session, at which point Postgres releases the lock — that IS the
      # steal path, bounded by this job's `timeout-minutes`. Placed immediately
      # before the first DB-MUTATING step. Proven end-to-end before adoption by
      # .github/workflows/mutex-probe.yml (three simultaneous contenders,
      # pairwise non-overlapping hold windows; the distinct-key neuter of that
      # same assertion was observed RED).
      - name: Acquire shared-test-db mutex
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_SUPABASE_DB_URL:-}" ]; then
            echo "fork PR / secret withheld — mutex skipped (DB work self-skips on forks)"
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          # Session-mode DSN. The documented secret points at the Supavisor
          # pooler on port 6543 = TRANSACTION mode, where a SESSION advisory lock
          # does not survive between statements; session mode is served on 5432
          # of the same host. Derived by parameter expansion and NEVER echoed —
          # this repository is public and the derived string is not a value
          # GitHub can mask for us.
          dsn="${TEST_SUPABASE_DB_URL}"
          case "${dsn}" in
            *":6543/"*) dsn="${dsn%%:6543/*}:5432/${dsn#*:6543/}" ;;
          esac
          # [158-MUTEX-01 F2] libpq keepalives on the holder path. During the
          # contended pg_advisory_lock wait and the pg_sleep hold this
          # connection carries ZERO traffic, and Linux's default first TCP
          # keepalive fires at 7200s — never, on these timescales — so a
          # runner-side NAT idle expiry would zombify the holder invisibly:
          # the backend keeps the lock long after the job is gone. 60s
          # keepalives keep the NAT mapping fresh AND let the client detect a
          # dead path in ~2min (15s x 4), so psql dies and the release step's
          # dead-holder witness fires instead of a silent wedge. The secret's
          # shape is NOT assumed: append with '&' if the DSN already carries a
          # query string, '?' otherwise.
          keepalive_params="keepalives=1&keepalives_idle=60&keepalives_interval=15&keepalives_count=4"
          case "${dsn}" in
            *\?*) dsn="${dsn}&${keepalive_params}" ;;
            *)    dsn="${dsn}?${keepalive_params}" ;;
          esac
          log="${RUNNER_TEMP}/shared-test-db-mutex.log"
          pidfile="${RUNNER_TEMP}/shared-test-db-mutex.pid"
          # 158-REVIEW WR-01: the idle sleep MUST outlive this job's
          # `timeout-minutes`, or the holder session ends — releasing the lock —
          # while the job is still doing DB work, and another run walks straight
          # in. The old value (3300s = 55min) was SHORTER than the then-60min
          # TTL, so any job that acquired early and ran long silently lost mutual
          # exclusion for its last ~5 minutes. 6000s = 100min sits above this
          # job's `timeout-minutes` with headroom, so the JOB always dies first
          # and teardown is the only thing that ever releases this lock.
          # ⛔ If you lower `timeout-minutes`, this stays valid. If you RAISE it,
          # raise this too — the invariant is sleep > TTL, and nothing else
          # enforces it.
          # [158-MUTEX-01] (holder death at 120s; 2026-08-20/21 runs, e.g.
          # 32424762495): sleep > TTL is NECESSARY but not SUFFICIENT — the
          # holder session must ALSO disable the server statement_timeout. The
          # TEST project sets a server-wide statement_timeout=120000, and both
          # the contended pg_advisory_lock wait and the pg_sleep are single
          # statements, so the server killed the holder ~120s after acquiring:
          # psql exited, the session dropped, the lock silently released, and
          # the job's remaining DB work ran UNSERIALIZED (the release step's
          # dead-holder ::error:: fired on every long-job run). That is why the
          # holder's FIRST -c statement below zeroes statement_timeout, before
          # pg_advisory_lock — session-level SET is permitted for any role and
          # overrides the configuration-file default, exempting both the lock
          # wait and the idle sleep. Third invariant leg, pinned in
          # critical-regressions.test.ts.
          # [158-MUTEX-02] (orphaned holder backend; run 32457330139): killing
          # the psql CLIENT does not kill its SERVER backend — neither pg_sleep
          # nor a pg_advisory_lock wait ever reads the client socket, so the
          # release step's client-side kill left a backend holding the lock for
          # its full 6000s sleep and starved e2e-seeded past the 3600s cap.
          # Before 158-MUTEX-01 the server statement_timeout was the ACCIDENTAL
          # janitor for such orphans; client_connection_check_interval is the
          # real one — the backend polls its client socket during query
          # execution AND lock waits, aborting within ~30s of the client dying.
          # Covers both the sleeping holder and a lock-waiting contender whose
          # client died (a job-timeout kill mid-wait leaves the same zombie).
          # HOLDER-BACKEND-PID feeds the release step's guarded server-side
          # pg_terminate_backend, which frees the lock immediately rather than
          # after the ~30s check interval. Both GUCs and the marker MUST stay
          # before pg_advisory_lock, so the lock wait itself is covered.
          start_holder() {
            : > "${log}"
            PGAPPNAME=ci-shared-test-db-mutex PGCONNECT_TIMEOUT=15 \
              nohup psql "${dsn}" -X -q -A -t -v ON_ERROR_STOP=1 \
                -c "SET statement_timeout = 0;" \
                -c "SET client_connection_check_interval = '30s';" \
                -c "SELECT 'HOLDER-BACKEND-PID ' || pg_backend_pid();" \
                -c "SELECT pg_advisory_lock(61616158);" \
                -c "SELECT 'MUTEX-ACQUIRED';" \
                -c "SELECT pg_sleep(6000);" \
                >> "${log}" 2>&1 &
            holder=$!
            echo "${holder}" > "${pidfile}"
          }
          # 158-REVIEW CR-04: the cap absorbs legitimate cross-run QUEUE DEPTH,
          # not just a wedge. Three simultaneous runs put ~8 other holds ahead of
          # the last waiter (~60m at the measured ~20m of lock-time per run), and
          # the phase's success criterion is that all three still pass. 2700s was
          # comparable to the work it had to absorb, so ordinary contention —
          # which this repo's history records as NORMAL — surfaced as a red
          # sql-tests → red `frontend` → skipped Railway deploy.
          #
          # 158-REVIEW WR-13: retry a DEAD SESSION, never a full wait. Every
          # other network op in this file retries by explicit flakiness-audit
          # decision (`npm ci`, `pip install`, the lychee download, the SRH
          # readiness poll); this one did not, so a single transient connect
          # blip inside PGCONNECT_TIMEOUT killed the backgrounded psql and
          # exited 1 — now a red REQUIRED check, and on main a skipped Railway
          # deploy. The two failure modes are deliberately kept distinct:
          # "session died" is retryable (below), "waited past the cap" is NOT
          # (that is contention, and retrying would just re-queue at the back).
          # `waited` is CUMULATIVE across attempts, so retries can never extend
          # the total wait beyond the cap the TTL was sized against.
          waited=0
          for attempt in 1 2 3; do
            start_holder
            while [ "${waited}" -lt 3600 ]; do
              if grep -q 'MUTEX-ACQUIRED' "${log}" 2>/dev/null; then
                # [158-MUTEX-02] best effort: an absent/empty pid file only
                # forfeits the release step's immediate server-side reap — the
                # ccci GUC above still bounds an orphaned backend at ~30s.
                sed -n 's/^HOLDER-BACKEND-PID \([0-9]\{1,\}\)$/\1/p' "${log}" | head -n 1 \
                  > "${RUNNER_TEMP}/shared-test-db-mutex-backend-pid" || true
                echo "Acquired the shared-test-db advisory lock (key 61616158) after ${waited}s (attempt ${attempt}/3)."
                exit 0
              fi
              if ! kill -0 "${holder}" 2>/dev/null; then
                echo "::warning::mutex acquire attempt ${attempt}/3 lost its psql session after ${waited}s (redacted output follows)."
                # 158-REVIEW WR-08: psql NEVER echoes the DSN on failure, so the
                # userinfo pattern alone matched nothing and the raw text — the
                # TEST pooler host, its resolved IP, and the DB username /
                # project-ref — went straight into a PUBLIC Actions log, against
                # this mutex's own stated invariant ("never a DSN, host,
                # username, or password, in any CI log line"). Redact the shapes
                # psql actually emits:
                #   connection to server at "<host>" (<ip>), port <n> failed
                #   FATAL:  password authentication failed for user "<user>"
                sed -E -e 's#(postgres(ql)?://)[^@]*@#\1***@#g' \
                       -e 's#(server at )"[^"]*"( \([^)]*\))?#\1"***"#g' \
                       -e 's#(for user )"[^"]*"#\1"***"#g' "${log}" >&2 || true
                break
              fi
              sleep 5
              waited=$(( waited + 5 ))
              if [ $(( waited % 60 )) -eq 0 ]; then
                echo "still waiting on the shared-test-db mutex (${waited}s) — another run holds it."
              fi
            done
            # Cap exhausted => contention, not a transient. Stop retrying and
            # fall through to the census + timeout diagnostic below.
            if [ "${waited}" -ge 3600 ]; then
              break
            fi
            # The session is dead; drop its pid so the release step cannot kill
            # an unrelated process that inherits the number.
            rm -f "${pidfile}"
            # 158-REVIEW WR-02 (iter 3): back off ONLY when a retry actually
            # follows. Unguarded, the last iteration printed "retrying the mutex
            # acquire in 15s" and then slept 15s before falling out of the loop
            # to the "after 3 attempts" error — telling the operator a fourth
            # attempt was coming when none was, which this repo's
            # fail-loud-and-ACCURATE doctrine counts as a real cost. Worse, that
            # phantom 15s was added to `waited`, and `waited` is the variable the
            # cap-vs-session-fault branch below is chosen by: a run that
            # legitimately queued to 3585s and then lost its session could be
            # pushed over 3600 by backoff bookkeeping alone and misreported as
            # contention rather than as the session fault it actually was.
            if [ "${attempt}" -lt 3 ]; then
              backoff=$(( attempt * 5 ))
              echo "retrying the mutex acquire in ${backoff}s"
              sleep "${backoff}"
              waited=$(( waited + backoff ))
            fi
          done
          if [ "${waited}" -lt 3600 ]; then
            echo "::error::could not establish the shared-test-db mutex session after 3 attempts — psql died before acquiring each time (last output redacted above). Two causes fit: (1) a CONNECT/session fault — check the TEST project's session-mode pooler (port 5432); or (2) something killed the session MID-WAIT while it contended for the lock — before 158-MUTEX-01 the server-wide statement_timeout did exactly that at 120s per attempt (the holder now zeroes statement_timeout as its first statement, so that specific kill should no longer occur). If the redacted output shows 'canceling statement due to statement timeout', that is NOT lock contention: the holder zeroes statement_timeout as its very first statement, so post-158-MUTEX-01 that signature can only mean the SET never stuck to this session's backend — the session-mode DSN rewrite regressed, the secret's shape changed, or a pooler is intercepting SET. Triage it as a pooler/session fault."
            exit 1
          fi
          # 158-REVIEW CR-04: do NOT assert "a holder is wedged" — measure, then
          # name both causes. From inside this loop a deep waiter queue and a
          # wedged holder are indistinguishable, and the old message confidently
          # named the rarer one, sending the operator hunting for a wedge that
          # may not exist. Counts ONLY: no pids, no host, no DSN, and stderr is
          # discarded outright — this log is public.
          #
          # 158-REVIEW WR-01 (iter 3): the census MUST be bounded. PGCONNECT_TIMEOUT
          # bounds only the CONNECT; once connected, an unbounded query against a sick
          # TEST Postgres/pooler blocks until this job's `timeout-minutes` kills the
          # runner — so the operator gets LESS information than before the census
          # existed (a bare "exceeded the maximum execution time"), and the job squats
          # a runner for ~30 more minutes while holding no lock. A sick backend is
          # precisely the condition under which this timeout fires, and this repo's
          # history records a wedged TEST backend as a MEASURED event, not a
          # hypothetical. Both bounds are needed because they cover different faults:
          # `statement_timeout` is server-side (a slow or lock-blocked query) and
          # `timeout` is client-side (a black-holed connection the server never hears
          # about, where a server-side timeout can never fire). A diagnostic must
          # never outlive the thing it diagnoses. `${census:-unavailable}` below
          # already handles the empty result, so the message stays honest either way.
          census="$(PGCONNECT_TIMEOUT=15 timeout 20 psql "${dsn}" -X -q -A -t \
            -c "SET statement_timeout = '10s';" \
            -c "SELECT count(*) FILTER (WHERE granted) || ' granted, ' || count(*) FILTER (WHERE NOT granted) || ' waiting' FROM pg_locks WHERE locktype = 'advisory' AND objid = 61616158;" \
            2>/dev/null | tr -d '\r' | tail -1)" || true
          echo "::error::timed out after ${waited}s waiting for the shared-test-db advisory lock (key 61616158). Lock census: ${census:-unavailable}. TWO causes are possible and this step cannot distinguish them: (1) QUEUE DEPTH — concurrent runs each hold the lock ~20m, which is a NORMAL condition in this repo; re-run once the queue drains. (2) A WEDGED holder whose runner is gone. Triage (count the waiters first) and manual unlock: docs/runbooks/shared-test-db-mutex.md sections 2-3."
          exit 1
      # ── Phase 164.3 / VAC-08 — repo-vs-TEST ledger and body drift ──────────
      #
      # Placed AFTER the mutex acquisition so it runs inside this job's held
      # advisory lock, like every other DB-touching step here. Its queries are
      # plain read-only SELECTs, so the 6543→5432 SESSION-mode DSN rewrite the
      # mutex needs is NOT required — a transaction-mode pooler serves these
      # fine. The DSN is passed through `env:` and never echoed (WR-08).
      #
      # SKIP SURFACE: none new. This step INHERITS the `sql-tests` job's
      # already-documented one — the job's `if:` excludes fork PRs and requires
      # vars.E2E_TEST_DB_CONFIGURED, and the `frontend` aggregator is the sole
      # judge of whether a skipped JOB is tolerable. Within the job the step
      # follows "Run SQL self-tests"'s contract, not the mutex step's: an absent
      # TEST_SUPABASE_DB_URL is an `::error::` and exit 1, never a quiet pass.
      #
      # ⛔ The ledger query joins schema_migrations on `name`, NEVER `version`.
      # Measured 2026-08-28: the ledger re-stamps `version` at apply time, so a
      # version-join reported 12 of 12 recent migrations missing when all 12
      # were present. That check would itself have been a vacuous control.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: VAC-08 - repo-vs-TEST ledger and function body drift
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Mode identity (Pitfall 2): the exact command a developer runs.
          bash scripts/test-ledger-drift-check.sh
      - name: Run SQL self-tests against test Supabase project
        env:
          # PG connection string for the test project (qmnijlgmdhviwzwfyzlc).
          # Must be the raw Postgres DSN (postgresql://...), NOT the
          # HTTPS REST URL (TEST_SUPABASE_URL). If the secret is not
          # configured, the step exits with an explicit message rather
          # than silently passing — Issue 6 is specifically about the
          # silent-no-op surface.
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_SUPABASE_DB_URL}" ]; then
            echo "::error::TEST_SUPABASE_DB_URL secret is required to run SQL self-tests."
            echo "::error::Set this secret to the raw Postgres DSN for the test Supabase project."
            echo "::error::Format: postgresql://postgres.<project-ref>:<password>@<pooler-host>:6543/postgres"
            exit 1
          fi
          echo "Discovering supabase/tests/test_*.sql files..."
          shopt -s nullglob
          files=(supabase/tests/test_*.sql)
          # F11 — AN EMPTY GLOB IS AN ERROR, NEVER A QUIET PASS. This used to
          # print a ::warning:: and `exit 0`, i.e. report SUCCESS from BEFORE the
          # loop and before every pin below, having executed zero assertions. A
          # directory rename or a path typo was enough: green job, nothing run.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No supabase/tests/test_*.sql files found. The SQL self-test corpus is EMPTY, so this run executed ZERO assertions and proves NOTHING about the database — it is not a pass. Most likely the tests moved or this glob's path drifted; restore the path, or retire this job deliberately."
            exit 1
          fi
          echo "Found ${#files[@]} test file(s):"
          printf '  - %s\n' "${files[@]}"
          # ON_ERROR_STOP=1 + the test files' RAISE EXCEPTION lines mean
          # a failed assertion exits non-zero and fails this step.
          #
          # 161.1-REVIEW WR-03 (systemic half) — A PRINTED SKIP IS NOT A PASS.
          # ------------------------------------------------------------------
          # MEASURED 2026-08-25 on a scratch Postgres 16: a file that opens with
          # `RAISE NOTICE 'SKIP: <object> not applied here'; RETURN;` prints
          #     psql:<file>:<line>: NOTICE:  SKIP: migration ... not yet applied
          # and exits EXITCODE=0 having executed ZERO assertions. Three ledger
          # files ran 0-of-7, 0-of-8 and 0-of-8 arms that way while CI stayed
          # green, because the loop below used to read ONLY that exit code — so a
          # skip was byte-identical to a pass in the only channel anything
          # mechanical looks at.
          #
          # Why such a skip can never re-arm itself: this job has NO
          # migration-apply step (checkout -> psql -> preflight -> mutex ->
          # `psql -f`), and nothing else applies migrations to the TEST project
          # either — .github/workflows/supabase-migrate.yml targets the
          # PRODUCTION project only, and TEST is migrated BY HAND. The old
          # promise "assertions enforce once the test DB catches up" named a
          # mechanism that does not exist.
          #
          # Three files were fixed individually (they now RAISE EXCEPTION on an
          # absent object). This block is the mechanical closure for the rest and
          # the stop for new ones: capture each file's output and fail the step
          # when the whole-file bail-out marker appears in it.
          #
          # WHY THE MARKER IS `NOTICE:  SKIP:` AND NOT THE WORD "SKIP" — it is
          # derived from what this corpus actually prints, which is two distinct
          # shapes (all five forms below were reproduced through psql before this
          # regex was chosen):
          #   (1) whole-file bail-out — `NOTICE:  SKIP: <reason>` then RETURN.
          #       The file asserts NOTHING. This is the WR-03 defect; it FAILS.
          #   (2) narrow partial skips — `SKIP (5d/5f/5g): ...`, `SKIP Part 2:
          #       ...`, `PASS WITH 1 SKIP: ...`, and prose such as `Part 1 OK:
          #       ... SKIP LOCKED present`. These name assertions withheld on a
          #       real migration-A/B divergence. They are ANNOTATED below, never
          #       failed: reddening them would redden CI for a state this repo
          #       deliberately tolerates.
          #
          #       ⚠️ F13 — the justification that used to sit here is DELETED, not
          #       softened, because it was false. It claimed these skips are
          #       "already policed in-file by both-or-neither coherence
          #       assertions that RAISE EXCEPTION when the skip is dishonest".
          #       MEASURED 2026-08-25 across all 67 files: not uniformly true.
          #       supabase/tests/test_profiles_privileged_columns_locked.sql
          #       prints `SKIP (2): ...` and then RETURNs — every later assertion
          #       in that DO block is withheld, and nothing checks the skip was
          #       honest. The pg_cron `SKIP Part 2/3/4` notices in the
          #       cron-registration files have the same shape. A COSMETIC label
          #       (`SKIP (2)` vs `SKIP:`) was doing all the discriminating, and
          #       it does not correlate with how much coverage is withheld.
          #       A stated reason that is falsifiable-and-false is worse than
          #       none: the next reader discards the real constraint along with
          #       it. So this step no longer VOUCHES for them. It derives, from
          #       each file's own source, which printed partial skips are
          #       block-terminating (a `RETURN;` within 4 lines of the notice)
          #       and reports those as UNPOLICED in the log. Making them fatal is
          #       the real fix and it belongs in the .sql files — each needs a
          #       both-or-neither assertion, the way
          #       test_ledger_refresh_{staleness,fanout,composite_arm}.sql got
          #       one. Until then this step names them instead of vouching.
          # ⚠️ A bare `grep -F 'SKIP:'` does NOT discriminate — `PASS WITH 1 SKIP:`
          # (test_wizard_session_idempotency.sql, test_wizard_composite_fence.sql)
          # contains that substring and prints on a PASSING run.
          #
          # F14 — the old answer was to anchor on psql's `NOTICE:` label, which is
          # C-locale server text. Two ways that goes SILENT rather than noisy, both
          # yielding a FALSE PASS; the second was conceded nowhere:
          #   (a) a non-C `lc_messages` renders the label in another language, so
          #       the regex matches nothing;
          #   (b) `client_min_messages='warning'` (settable per-role/per-database,
          #       and it outlives any one connection) suppresses NOTICE OUTPUT
          #       ENTIRELY — every check in this step reads NOTICEs, so all of
          #       them would match nothing at once, with an empty log to show
          #       for it.
          # Both are closed here rather than conceded:
          #   NET 1 (locale-proof, primary) — whole-file markers are read out of
          #     the .sql FILE (`RAISE NOTICE 'SKIP: ...`), which is C-locale by
          #     construction because it is repo text, and matched with grep -aF.
          #     No server-rendered label is involved. `PASS WITH 1 SKIP:` is
          #     never a marker: that literal does not START with `SKIP:`.
          #   NET 2 (kept, second net) — the label-anchored regex, which still
          #     catches a skip message composed at RUNTIME via format()/variables
          #     and therefore invisible to NET 1's static extraction.
          #   CHANNEL — client_min_messages is forced to `notice` via PGOPTIONS
          #     and PROVEN live by a probe below that fails the step when a known
          #     NOTICE does not come back. (lc_messages is deliberately NOT set:
          #     it is superuser-only, so setting it would turn a working
          #     connection into a connection error on a managed database.)
          # WHAT REMAINS OPEN is printed in the log too, not just here: a skip
          # message that is BOTH composed at runtime (invisible to NET 1) AND
          # rendered by a non-C server (invisible to NET 2) would still pass. No
          # such message exists in this corpus today.
          #
          # ⛔ This does NOT touch the legitimate JOB-level skip. Fork PRs and
          # workflow_dispatch never reach this step (the job `if:` excludes them),
          # so nothing here can fire on them; the `frontend` aggregator's
          # trusted-vs-untrusted `::error::` block remains the sole judge of
          # whether a skipped JOB is tolerable. What is refused here is narrower:
          # a file that RAN and printed a whole-file skip.
          #
          # Branch protection is OFF on this repo, so this is ADVISORY at merge —
          # it makes the log state what did not happen; it does not block a merge.
          #
          # NOTICEs go to psql's STDERR, hence the 2>&1 capture. `-a` on every
          # grep: a NUL byte anywhere in the captured output would otherwise make
          # GNU grep treat it as binary and report "no match" on bytes it never
          # really read — the same false green this block exists to remove.
          # F14(b) — force the NOTICE channel ON. client_min_messages is settable
          # by an ordinary role, so this is not the privilege gamble lc_messages
          # would be. Forcing is not enough on its own (a database- or role-level
          # setting can still win), hence the probe.
          export PGOPTIONS='-c client_min_messages=notice'
          bad=0
          sentinels_declared=0
          arms_declared=0
          out="${RUNNER_TEMP}/sql-test-output.log"
          echo ""
          echo "Probing that server NOTICEs actually reach this log..."
          probe_status=0
          psql "$TEST_SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN RAISE NOTICE 'ANTISKIP-NOTICE-CHANNEL-OK'; END \$\$;" \
            > "$out" 2>&1 || probe_status=$?
          cat "$out"
          if [ "$probe_status" -ne 0 ]; then
            echo "::error::the NOTICE-channel probe could not run against the test database (psql exited ${probe_status}). Every skip check below reads server NOTICEs, so this step cannot report a meaningful pass without it."
            exit 1
          fi
          if ! grep -aF 'ANTISKIP-NOTICE-CHANNEL-OK' "$out" >/dev/null 2>&1; then
            echo "::error::the test database accepted a RAISE NOTICE but the message never reached this log, so NOTICE output is being suppressed (a role- or database-level client_min_messages overriding PGOPTIONS). EVERY skip check in this step reads NOTICEs: with the channel dark they would all match nothing at once and this job would report a clean run having verified NOTHING about skips. Clear the override (ALTER ROLE ... RESET client_min_messages) and re-run."
            exit 1
          fi
          echo "  ↳ NOTICE channel live."
          for f in "${files[@]}"; do
            echo ""
            echo "=== Running: $f ==="
            status=0
            # -X for parity with the mutex/census psql calls in this job: a
            # ~/.psqlrc on a self-hosted runner could otherwise set
            # client_min_messages or ECHO and change what this loop reads.
            psql "$TEST_SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$f" > "$out" 2>&1 || status=$?
            cat "$out"
            if [ "$status" -ne 0 ]; then
              echo "::error file=$f::psql exited $status — a RAISE EXCEPTION assertion failed, or the connection did. The captured output above is the whole story for this file."
              exit "$status"
            fi
            # NET 1 (locale-proof): the whole-file markers this FILE defines.
            skip_hits=""
            markers="$(grep -aoE "RAISE NOTICE 'SKIP: [^'%]{0,60}" "$f" | sed "s/^.*RAISE NOTICE '//" | sort -u || true)"
            if [ -n "$markers" ]; then
              # F15 — `$markers` is unquoted ON PURPOSE: IFS=$'\n' is what splits
              # it one marker per line. But an unquoted expansion also undergoes
              # PATHNAME expansion, and this step runs under the `shopt -s
              # nullglob` set above for the file glob. MEASURED in bash 5.3: a
              # marker containing `*`, `?`, or a CLOSED `[...]` class matches no
              # file and is then DELETED from the word list outright — the loop
              # body never executes for it and nothing is printed to say a marker
              # was dropped. NET 1 would be off for that file, leaving only NET
              # 2, which F14(a) already records as locale-fragile; a skip on a
              # localized server would then sail through both nets as a pass.
              # (An UNTERMINATED `[` survives, because bash treats it literally —
              # so today's behaviour depends on where a bracket happens to fall.
              # That is a coin toss, not a policy.) `set -f` turns pathname
              # expansion off for the split and back on straight after; it does
              # NOT affect `case` pattern matching, which the sibling loop below
              # relies on.
              _oifs="$IFS"
              IFS=$'\n'
              set -f
              for m in $markers; do
                if grep -aF "$m" "$out" >/dev/null 2>&1; then
                  skip_hits="${skip_hits}      ${m}"$'\n'
                fi
              done
              set +f
              IFS="$_oifs"
            fi
            # NET 2: label-anchored, for a skip message composed at runtime.
            net2="$(grep -aE 'NOTICE: +SKIP:' "$out" || true)"
            if [ -n "$skip_hits" ] || [ -n "$net2" ]; then
              echo "::error file=$f::printed a whole-file SKIP notice and exited 0. THAT IS NOT A PASS: the file RETURNed before its assertions, so this run proves nothing about the object it guards — it is indistinguishable from a green run only because exit code was the sole thing read. Nothing applies migrations to the TEST project (this job has no apply step; supabase-migrate.yml targets PRODUCTION only), so the skip cannot re-arm itself on a later run. Fix the file the way supabase/tests/test_ledger_refresh_{staleness,fanout,composite_arm}.sql were fixed: RAISE EXCEPTION on the absent object instead of skipping."
              echo "  ↳ $f printed:"
              if [ -n "$skip_hits" ]; then
                printf '%s' "$skip_hits"
              fi
              if [ -n "$net2" ]; then
                printf '%s\n' "$net2" | sed 's/^/      /'
              fi
              bad=1
            fi
            # Narrow, self-policed partial skips — surfaced, never fatal (above).
            partials="$(grep -aoE 'SKIP \([^)]*\)|SKIP Part [0-9]+|PASS WITH [0-9]+ SKIPS?' "$out" | sort -u | tr '\n' ' ' || true)"
            if [ -n "$partials" ]; then
              echo "::notice file=$f::ran with narrow partial skips — NOT a failure. Each names assertions it withheld: ${partials}"
            fi
            # F13 — of the partial skips this run PRINTED, which ones end their
            # DO block? Derived from the source (a RETURN within 4 lines of the
            # notice), so the claim is computed, not asserted.
            blockterm="$(awk -v q="'" '/RAISE NOTICE/ && /SKIP/ { msg = substr($0, index($0, "SKIP")); n = index(msg, q); if (n > 0) msg = substr(msg, 1, n - 1); n = index(msg, "%"); if (n > 0) msg = substr(msg, 1, n - 1); msg = substr(msg, 1, 40); buf = ""; for (i = 0; i < 4; i++) { if ((getline nxt) > 0) buf = buf "\n" nxt } if (buf ~ /RETURN[ \t]*;/) print msg }' "$f" | sort -u || true)"
            bt_hits=""
            if [ -n "$blockterm" ]; then
              # F15, same class as NET 1 above — without `set -f`, nullglob
              # silently drops any label carrying a glob metacharacter and the
              # UNPOLICED warning for it is never printed. Here that costs a
              # warning rather than a failure, but a partial skip that goes
              # unnamed is exactly the coverage this block exists to surface,
              # and the awk truncation to 40 chars means WHICH labels vanish
              # depends on where the cut lands. Fixed in both loops so the two
              # cannot drift apart.
              _oifs="$IFS"
              IFS=$'\n'
              set -f
              for m in $blockterm; do
                case "$m" in
                  "SKIP:"*) continue ;;
                esac
                if grep -aF "$m" "$out" >/dev/null 2>&1; then
                  bt_hits="${bt_hits} [${m}]"
                fi
              done
              set +f
              IFS="$_oifs"
            fi
            if [ -n "$bt_hits" ]; then
              echo "::warning file=$f::UNPOLICED partial skip(s):${bt_hits} — each of those notices is followed by RETURN in the source, so it ENDS ITS DO BLOCK: every later assertion in that block was withheld, not only the ones the label names, and nothing in the file or here verifies the skip was honest. Reported rather than failed because how much was withheld is not mechanically knowable from outside; the fix is a both-or-neither coherence assertion in the .sql file."
            fi
            # 'ALL N ARMS EXECUTED' sentinel. Where a file DECLARES one in a
            # RAISE NOTICE, the run must PRINT it. Without this, an edit that
            # neuters an arm in place — deleting the assertion, renumbering, or
            # short-circuiting before the end — leaves the file exiting 0 and is
            # invisible to CI. Read from the RAISE NOTICE line specifically, not
            # from anywhere in the file: these files discuss the sentinel in
            # their header comments too, and a comment cannot be printed.
            sentinel="$(grep -aE "RAISE NOTICE '[^']*ALL [0-9]+ ARMS EXECUTED" "$f" | grep -aoE 'ALL [0-9]+ ARMS EXECUTED' | head -1 || true)"
            if [ -n "$sentinel" ]; then
              sentinels_declared=$((sentinels_declared + 1))
              n_arms="$(printf '%s' "$sentinel" | grep -aoE '[0-9]+' | head -1)"
              arms_declared=$((arms_declared + n_arms))
              # F12 — the notice must ALSO name the arms, and the count and the
              # roster must agree. This is what kills the cheapest neutering:
              # delete arm I, edit `ALL 9` to `ALL 8`, leave `(A-I)` untouched.
              #
              # 161.1-RT E2 — MEASURED 2026-08-25, this check covered 3 of the 6
              # sentinel-bearing files. It recognised exactly ONE annotation shape,
              # the letter range `(A-J)`, which only the three ledger files use.
              # The other three label their arms `1, 2a, 2b, …`, `Test 1…4` and
              # `A…K plus the sub-arms H2/I2/I3/I4/J2` — so 26 of the 54 arms, every
              # arm pinning this phase's headline fix among them, carried no
              # expectation at all beyond their own file's editable integer. Two
              # changes, both here rather than in the .sql files:
              #   (a) a comma-separated ROSTER `(A, B, H2, I2, …)` is accepted
              #       alongside the range, and its token count must equal N. The
              #       range form is tried FIRST, so `(A-J)` still means ten rather
              #       than being read as a roster of one. Relabelling those three
              #       files to A…P so the range form would fit was REJECTED: `H2`,
              #       `I2`… are deliberate sub-arms naming WHICH mechanism they
              #       discriminate, and rewriting 700 lines of assertion text to
              #       satisfy a regex is the tail wagging the dog.
              #   (b) the annotation is now MANDATORY, not opt-in. Opt-in is the
              #       exact defect F12 named one level down: a check that exempts
              #       any file declining it protects only the files that
              #       volunteer, and a NEW sentinel-bearing file inherits no
              #       coverage whatsoever. A file that declares N arms must say
              #       which N.
              annot="$(grep -aE "RAISE NOTICE '[^']*ALL [0-9]+ ARMS EXECUTED" "$f" | grep -aoE "ALL [0-9]+ ARMS EXECUTED \([^)]*\)" | head -1 || true)"
              annot="${annot#*(}"
              annot="${annot%)}"
              expect=0
              case "$annot" in
                "") ;;
                A-[A-Z]) expect=$(( $(printf '%d' "'${annot#A-}") - 64 )) ;;
                *) expect="$(printf '%s' "$annot" | tr ',' '\n' | grep -ac '[^[:space:]]' || true)" ;;
              esac
              if [ -z "$annot" ]; then
                echo "::error file=$f::the completion sentinel declares ${n_arms} arms but NAMES NONE OF THEM. A bare count is self-consistent with whatever it is edited to, so on its own it pins nothing inside this file — delete an arm, decrement the number, and the file still agrees with itself. Append the roster to the notice, either as a letter range — 'ALL 8 ARMS EXECUTED (A-H)' — or as an explicit list — 'ALL 6 ARMS EXECUTED (1, 2a, 2b, 3, 4a, 4b)' — so that removing an arm has to be written down twice."
                bad=1
              elif [ "$n_arms" -ne "$expect" ]; then
                echo "::error file=$f::the completion sentinel contradicts itself — it declares ${n_arms} arms but names (${annot}), which is ${expect}. One of the two was edited and the other was not, so an arm was almost certainly removed or renumbered. Make the count and the roster agree with the arms the file actually executes."
                bad=1
              fi
              # 161.1-RT E3 (partial) — an arm that cannot RAISE cannot fail, and a
              # test that cannot fail is worse than none. So a file may not declare
              # more arms than it has assertion sites. This is a LOWER BOUND and
              # nothing more: it does not check that arm k is the one that raises,
              # and N dead `IF false THEN RAISE EXCEPTION` lines would satisfy it.
              # What it does close is the cheapest way to retire both floors below
              # — a padding file whose entire content is one
              # `RAISE NOTICE 'ALL 99 ARMS EXECUTED (…)'`, which lifts
              # arms_declared past any floor while asserting nothing. Comment lines
              # are excluded because these files DISCUSS RAISE EXCEPTION at length
              # in their headers and prose must never count as coverage. Slack on
              # the real corpus is NO LONGER uniform: test_strategy_shares_rls.sql
              # runs 106 arms across 106 non-comment sites — zero slack — so on that
              # file an honest edit that adds an assertion without updating the
              # roster WILL fire here. That is intended; the roster is the pin.
              raises="$(grep -aF 'RAISE EXCEPTION' "$f" | grep -acvE '^[[:space:]]*--' || true)"
              if [ "$n_arms" -gt "$raises" ]; then
                echo "::error file=$f::declares ${n_arms} arms but contains only ${raises} non-comment RAISE EXCEPTION line(s). An arm with no way to raise cannot fail, so it is not an arm — and a file declaring more arms than it can fail inflates the corpus-wide floors below while proving nothing. Either these arms assert through something this check cannot see, in which case say so IN THIS WORKFLOW where it is visible, or the count is fiction."
                bad=1
              fi
              if grep -aF "$sentinel" "$out" >/dev/null 2>&1; then
                echo "  ↳ completion sentinel OK: ${sentinel}"
              else
                echo "::error file=$f::declares the completion sentinel '${sentinel}' but this run never printed it, yet psql exited 0. The file stopped short of its own end-of-arms notice, so an arm was neutered, renumbered or short-circuited and the missing coverage is silent. Restore the arm, or change the sentinel to the number of arms the file actually executes — do not delete the notice."
                bad=1
              fi
            fi
          done
          # Anti-vacuity pin for the sentinel check itself. If NO file declares a
          # sentinel, the block above verified nothing and would keep reporting
          # green forever — deleting every notice must not look the same as
          # having none. Six files carry one today; they are enumerated in the
          # ARMS_FLOOR derivation below rather than here, so there is exactly ONE
          # place to update when the set changes.
          # F12 — the sentinel check is OPT-IN by construction: `[ -n "$sentinel" ]`
          # exempts any file that declares none, and the old `-eq 0` pin only fired
          # once the LAST one was gone. The count was unpinned too: delete an arm,
          # edit `9` to `8`, and the run printed `↳ completion sentinel OK`.
          #
          # THE TRADE, recorded rather than hidden. That hole cannot be closed from
          # inside the file being checked — a file is always self-consistent with
          # its own edited number, so catching a DELETED arm needs an expectation
          # held OUTSIDE the file. The cheapest honest form of that is not a
          # per-file manifest but two integers, ratcheted right here:
          # Re-measured 2026-08-25 at the close of phase 161.1. The previous
          # pair (4 / 35) shipped SLACK: actual was 6 files / 49 arms, so the
          # floor tolerated deleting `test_retention_crons_safe.sql` AND
          # `test_get_verified_cohort_rank_gate.sql` outright and still went
          # green. Worse, the recorded derivation `(9 + 9 + 8 + 9)` matched no
          # real set of files — it omitted both of those and used a stale count
          # for the bridge gate. A floor whose arithmetic cannot be re-derived
          # is the same self-consistent-and-invisible failure this block exists
          # to catch, one level up. Per-file counts are spelled out so the next
          # reader can re-derive the total instead of trusting it:
          # Re-measured 2026-08-26 (162-05 / D-162-3): a SEVENTH file joins,
          # test_create_wizard_strategy_for_key.sql, the recurring gate for the
          # new use-existing-key SECURITY DEFINER writer. Its nine arms are
          # counted here in the same diff that adds them, which is the point of
          # holding the totals outside the .sql files.
          #   test_create_wizard_strategy_for_key.sql         9
          #   test_get_verified_cohort_rank_gate.sql          6
          #   test_ledger_refresh_composite_arm.sql          10
          #   test_ledger_refresh_fanout.sql                 10
          #   test_ledger_refresh_staleness.sql               8
          #   test_retention_crons_safe.sql                   4
          # Re-measured 2026-08-27 (164-06): test_strategy_shares_rls.sql goes
          # 101 -> 106 for the five N1 arms (the bounded-increment rule, its
          # off-by-one neighbour, the lawful +1, the forced-1-on-INSERT pin, and
          # the Art. 17 erasure-completes arm). The file set is unchanged, so
          # SENTINEL_FLOOR does not move. Derived from the PRE-EDIT count of 101
          # plus the five arms actually added, not read off the finished file —
          # a floor taken from the file it is supposed to constrain always
          # passes and pins nothing.
          # Re-measured 2026-08-28 (164 three-reviewer gate, F-1):
          # test_strategy_shares_rls.sql goes 106 -> 102. The TENANT 5 block's
          # four end-state arms (5d generation, 5e tombstone, 5f provenance,
          # 5g row count) were reading their OWN SUBTRANSACTION ROLLBACK and
          # could not fail: MEASURED on a throwaway PostgreSQL 16 cluster, a
          # genuine cross-tenant write placed inside the arm's nested
          # `BEGIN … EXCEPTION` moved tenant B's counter 1 -> 2 and stamped B's
          # tombstone, and the whole file still exited 0 with all 106 arms
          # "executed". One replacement arm was rebuilt on TRIGGER 3's
          # precedent — the victim row is revoked first, and the end state is
          # read from OUTSIDE the handler — and it reuses the name TENANT 5b.
          # The old 5b and 5c collapse into it as extra disjuncts: measured,
          # neither can ever be a FIRST failure once the end-state read precedes
          # them, and every mutation that would redden the message pin instead
          # aborts the file on an UNWRAPPED owner-lane call (OWNER 1a / OWNER 2a
          # / OWNER 2d) rather than on an arm. Net -5, derived from the PRE-EDIT
          # count of 106 minus the five deletions (5b, 5c, 5d, 5f, 5g) plus the
          # one rebuilt arm — not read off the finished file.
          # Re-measured 2026-08-28 (164 gate, F-3): +1 for N1 2b, the
          # forced-nonce-on-INSERT pin. The trigger's INSERT branch forced only
          # `generation`, leaving `nonce` caller-suppliable, and MEASURED that
          # combination was worse than neither: mint -> revoke -> service_role
          # DELETE -> service_role INSERT naming the recorded nonce came back at
          # generation 1 with that nonce and revoked_at NULL, byte-identical to
          # the pre-revoke triple. N1 2b is the behavioural twin of N1 2a, run
          # as the one role no column grant binds. 101 + 1 = 102.
          # Re-measured 2026-08-28 (164 gate, F-4): +1 for SERVICE-ROLE 2f, the
          # spoofed-claims arm. SERVICE-ROLE 2a/2c call with claims = NULL only,
          # so they certified "the body refuses a caller with no identity" while
          # the file read it as "the body is a second wall against
          # service_role". It is not: auth.uid() reads the caller-settable
          # request.jwt.claims GUC, and MEASURED, a service_role call that sets
          # it first revoked another tenant's live share and was told it
          # succeeded. 2f pins what actually bounds that caller — the
          # `created_by = auth.uid()` predicate in revoke's UPDATE, which no
          # other arm isolates because for an `authenticated` caller RLS also
          # scopes the statement. 102 + 1 = 103.
          #   test_strategy_shares_rls.sql                  103
          #   test_sync_status_marked_refresh_protected.sql  16
          SENTINEL_FLOOR=8   # files declaring a sentinel
          ARMS_FLOOR=166     # 9 + 6 + 10 + 10 + 8 + 4 + 103 + 16
          # RAISING these as arms are added is expected and cheap — and it is not
          # optional: src/__tests__/contracts/ci-anti-skip-gate.contract.test.ts
          # re-derives the table above from the corpus and goes red when a count,
          # the file list, or either floor drifts from what the files declare.
          #
          # WHAT THESE TWO INTEGERS GUARANTEE — stated narrowly, because the
          # sentence that stood here did not. It said lowering a floor "can no
          # longer be done inside a .sql file where nobody sees it". That was
          # FALSE and a red team showed it (2026-08-25): these sums read what each
          # file DECLARES, never what it EXECUTES, and nothing stopped a new file
          # from declaring arms it does not have. The true claim is smaller and it
          # is this — THE DECLARED TOTAL CANNOT BE REDUCED FROM INSIDE A .sql
          # FILE. Delete an arm, edit that file's own count down to match, and the
          # sum falls below a number held outside every file it sums, so the
          # correction has to land in THIS diff. That is the whole of it.
          #
          # STILL NOT CAUGHT, deliberately — every item below leaves the totals
          # intact or RAISES them, so no floor can see any of it:
          #   (1) SWAPPING an arm out of one file and into another. A per-file
          #       expected-count manifest in this workflow would catch it; it is
          #       still rejected HERE as too stale-prone to stay honest in a
          #       comment. It is instead held as a TEST (the contract file named
          #       above), where a stale expectation fails loudly on the next run
          #       instead of rotting silently.
          #   (2) DECLARED IS NOT EXECUTED — and this gate cannot close it. Gut an
          #       arm's RAISE EXCEPTION, or invert its condition, and leave the
          #       count and roster alone: the file still runs to its end, still
          #       prints its sentinel, and every number here is unchanged. Nothing
          #       readable from a workflow separates an arm that PASSED from an arm
          #       that COULD NOT HAVE FAILED; that needs mutation testing against a
          #       live schema (break the guarded object, require the arm to go
          #       red), which is a per-arm database round trip this job cannot
          #       afford and does not attempt. The n_arms <= RAISE-EXCEPTION-sites
          #       check above is a lower bound on it, not a substitute. This is the
          #       largest open hole in this block and it is recorded, not closed.
          #   (3) PADDING, in the residue. A file can still declare arms it does
          #       not meaningfully run — it now needs a roster with N entries AND N
          #       non-comment RAISE EXCEPTION lines, so the one-line pad the red
          #       team used is dead, but N lines of `IF false THEN RAISE EXCEPTION`
          #       would pass here. Note the DIRECTION, which is what makes this the
          #       least of the three: padding INFLATES the totals, so it can never
          #       lower a floor or conceal a deleted arm — it retires the floors'
          #       FUTURE ratchet value by making them unreachably low. In this repo
          #       the contract test closes even that, because a padding file
          #       changes the sentinel-bearing file set and fails the derivation
          #       check.
          if [ "$sentinels_declared" -lt "$SENTINEL_FLOOR" ]; then
            echo "::error::only ${sentinels_declared} test file(s) declare an 'ALL N ARMS EXECUTED' sentinel, under the recorded floor of ${SENTINEL_FLOOR}. Sentinels are what make a neutered arm visible, so the ones that vanished took their coverage silently with them. Either a file was renamed and its notice lost, or the notices were removed; restore them, or lower SENTINEL_FLOOR in this workflow deliberately."
            bad=1
          fi
          if [ "$arms_declared" -lt "$ARMS_FLOOR" ]; then
            echo "::error::the sentinel-bearing files declare ${arms_declared} arms in total, under the recorded floor of ${ARMS_FLOOR}. That is the signature of an arm being deleted and its own file's count edited down to match — self-consistent, and therefore invisible to every check that reads only the file. Restore the arm, or lower ARMS_FLOOR in this workflow deliberately, in a diff a reviewer can see."
            bad=1
          fi
          if [ "$bad" = 1 ]; then
            echo "::error::SQL self-tests did not really run clean — see the per-file errors above. A file that prints a skip, or stops short of its completion sentinel, exits 0 and would otherwise be reported as a pass."
            exit 1
          fi
          echo ""
          echo "All ${#files[@]} SQL self-tests passed — no whole-file skips; ${sentinels_declared} completion sentinel(s) verified, covering ${arms_declared} declared arms."
          echo "Standing limits of this gate, printed so this log does not overclaim: (1) a skip message composed at RUNTIME on a server whose lc_messages is not C would evade both skip nets — none exists in this corpus today; (2) partial skips reported UNPOLICED above are named, not failed, and the coverage they withhold is NOT verified by anything; (3) the arm counts summed above are DECLARED, not executed — an arm gutted in place still runs to the end and still prints its file's sentinel, so every number in this line is blind to it; (4) branch protection is OFF on this repo, so a failure here does not block a merge — it records what did not happen."
      # Best-effort EARLY release of the shared-test-db mutex (Phase 158 /
      # OPS-01), identical in all three DB-touching jobs. Job teardown drops the
      # psql session anyway; killing it here hands the lock to the next waiter a
      # little sooner. `if: always()` + never exits non-zero: a failed release
      # must not redden a job whose real work passed, and the teardown path is
      # the guarantee.
      - name: Release shared-test-db mutex (best effort)
        if: always()
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          pidfile="${RUNNER_TEMP}/shared-test-db-mutex.pid"
          if [ ! -f "${pidfile}" ]; then
            echo "No mutex pid recorded (fork PR / acquire skipped) — nothing to release."
            exit 0
          fi
          holder="$(cat "${pidfile}")"
          if kill "${holder}" 2>/dev/null; then
            echo "Released the shared-test-db mutex (terminated psql pid ${holder})."
          else
            # 158-REVIEW WR-01: reaching here is a FAULT, not housekeeping. A
            # pidfile exists, so the acquire step really did start a holder — and
            # that holder is now dead while this job was still running. Every DB
            # step between its death and now ran with the mutex RELEASED, i.e.
            # potentially concurrently with another run against the shared TEST
            # project. The previous message ("was already gone — the session drop
            # released the lock") described this as normal and printed on exactly
            # the failure path it was supposed to surface.
            # [158-MUTEX-01]: the once-common cause (the server-wide
            # statement_timeout killing pg_sleep at ~120s) is fixed — the holder
            # zeroes statement_timeout — so a dead holder here is now UNEXPECTED
            # and always worth investigating.
            # Annotation only: this step is `if: always()` and must never redden a
            # job whose real work passed, and `echo ::error::` does not change the
            # exit status. Job teardown remains the guaranteed release path.
            echo "::error::mutex holder pid ${holder} died BEFORE this release step — the DB work after its death ran UNSERIALIZED. Do not trust this run's DB assertions; investigate (holder outlives the job by design, see the pg_sleep note in the acquire step)."
          fi
          # [158-MUTEX-02] (run 32457330139): the kill above reaches only the
          # psql CLIENT. A backend mid-pg_sleep never reads its client socket,
          # so it kept the lock and starved the other jobs' acquires for its
          # full 6000s sleep. Terminate the recorded backend server-side too;
          # the pg_locks guard (same key, same pid) makes it a no-op if that
          # backend already exited or the pid was recycled — never a blind
          # terminate. Best effort like the rest of this step: ccci bounds any
          # survivor at ~30s, and nothing here may redden the job.
          backendpidfile="${RUNNER_TEMP}/shared-test-db-mutex-backend-pid"
          backend="$(cat "${backendpidfile}" 2>/dev/null || true)"
          case "${backend}" in
            ''|*[!0-9]*)
              echo "No server backend pid recorded — leaving any orphan to client_connection_check_interval."
              ;;
            *)
              if [ -z "${TEST_SUPABASE_DB_URL:-}" ]; then
                echo "TEST_SUPABASE_DB_URL withheld — skipping the server-side backend reap."
              else
                # Session-mode DSN, derived exactly as in the acquire step and
                # never echoed; bounded like the acquire step's census query.
                dsn="${TEST_SUPABASE_DB_URL}"
                case "${dsn}" in
                  *":6543/"*) dsn="${dsn%%:6543/*}:5432/${dsn#*:6543/}" ;;
                esac
                reaped="$(PGCONNECT_TIMEOUT=15 timeout 20 psql "${dsn}" -X -q -A -t \
                  -c "SET statement_timeout = '10s';" \
                  -c "SELECT pg_terminate_backend(${backend}) FROM pg_locks WHERE locktype = 'advisory' AND objid = 61616158 AND pid = ${backend};" \
                  2>/dev/null | tr -d '\r' | tail -1)" || true
                if [ "${reaped}" = "t" ]; then
                  echo "Server-side reap: backend ${backend} was STILL on key 61616158 — pg_terminate_backend sent (the client kill alone had not freed the lock)."
                else
                  echo "Server-side reap: backend ${backend} no longer on key 61616158 (already exited, or the census was unavailable) — nothing to terminate."
                fi
              fi
              ;;
          esac

  secret-scan:
    # Task 7.6: gitleaks runs against the full commit history for PRs
    # (fetch-depth: 0) and against the pushed commits on main. Config
    # lives in .gitleaks.toml (extends the default ruleset with a
    # narrow allowlist for known test fixtures).
    runs-on: ubuntu-latest
    env:
      # gitleaks-action@v2.3.9 is a Node-20 JS action; GitHub forces JS actions
      # to Node 24 on 2026-06-02 and removes Node 20 on 2026-09-16. The action
      # is a thin wrapper that downloads + runs the gitleaks Go binary, so it
      # runs cleanly on Node 24 — opt in now so the secret-scan job verifies it
      # ahead of the forced switch (and the deprecation warning clears).
      # ⚠️ STALE AS OF 2026-08-23: this said "the latest gitleaks-action release
      # is still v2.3.9/node20, so there is no version bump that fixes this."
      # That bump exists and has been taken — the step below is pinned to
      # v3.0.0, whose action.yml declares `using: "node24"`. So this env var is
      # now a NO-OP. Left in place rather than removed in the same PR that
      # changed the scanner pin, to keep one variable moving at a time; booked
      # in TODOS.md for removal. If a future Node bump ever breaks the
      # action's JS bundle, replace it with the gitleaks binary (the pattern
      # #308 used for lychee: a cached+retried release download + a
      # `gitleaks git . --config .gitleaks.toml --log-opts=<base..head>` range
      # scan — validated locally on this branch's investigation).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    # C-0293(a) per-job uplift: gitleaks-action posts finding summaries
    # as PR comments when a leak is detected (so the author sees the
    # diagnostic without digging into the workflow log). That requires
    # `pull-requests: write`. `contents: read` is inherited from the
    # workflow-level default for checkout. No other scope needed.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          # retro-PR179-M-persist-chain: actions/checkout defaults
          # persist-credentials: true, which writes GITHUB_TOKEN as
          # http.https://github.com/.extraheader in .git/config. With
          # this job's pull-requests: write uplift, a compromised
          # gitleaks-action SHA could read the token from .git/config
          # AND comment on arbitrary PRs. Explicitly drop the cred so
          # the SHA-pin defense isn't undercut by the persisted token.
          # The gitleaks step gets GITHUB_TOKEN via env: below
          # (intentional, scoped read).
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # PIN REQUIRED — do not drop. gitleaks-action defaults to gitleaks
          # 8.24.3 (`process.env.GITLEAKS_VERSION || "8.24.3"` in its bundle),
          # and 8.24.3 SILENTLY IGNORES the top-level `[[allowlists]]` array
          # form that .gitleaks.toml uses (converted to array form by
          # 158-REVIEW CR-03). No parse error — it drops the allowlist and
          # scans with default rules, so every allowlisted fixture in this repo
          # was unshielded and the gate failed on files it had exempted since
          # the v1.12 CI-green commit.
          #
          # Measured on PR #705, same repo config + same commit range:
          #   8.24.3 + [[allowlists]]  -> leaks found: 2   (== what CI reported)
          #   8.24.3 + [allowlist]     -> no leaks found
          #   8.30.1 + [[allowlists]]  -> no leaks found
          #   8.30.1 + [allowlist]     -> no leaks found
          #
          # Pinning the scanner (rather than downgrading the config to the
          # singular form) also makes the gate reproducible locally, since
          # Homebrew ships 8.30.x. Guarded by gitleaks-allowlist.test.ts.
          GITLEAKS_VERSION: 8.30.1

  docs-link-check:
    # Task 7.4: link-check hook on docs/runbooks/soc2-readiness.md (and
    # the rest of docs/**) to keep evidence links honest. Internal links
    # only — external URL breakage should not fail CI because the
    # runbooks reference third-party provider docs whose URLs we do not
    # own. `--offline` resolves file:// and relative paths against the
    # checked-out tree; the no-progress flag keeps CI logs quiet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. lychee-action only
          # reads the checked-out tree; the persisted cred is pure
          # attack surface for any third-party action that lands later.
          persist-credentials: false
      # CI flakiness audit F4: previously used lycheeverse/lychee-action, which
      # downloads the lychee release binary at job start with a bare `curl`
      # (no retry) — a transient release-CDN error surfaced as `curl exit 22`
      # and failed the whole check, even though the link scan is `--offline`
      # and cannot itself fail on network. We now (a) cache the pinned binary
      # so the download is a one-time cost, and (b) retry the download on a
      # cold cache. Pin keyed on LYCHEE_VERSION so a bump re-downloads.
      - name: Cache lychee binary
        id: lychee-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.lychee-bin
          key: lychee-${{ runner.os }}-v0.23.0
      - name: Install lychee (retry transient download failures)
        if: steps.lychee-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.lychee-bin"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz"
          n=0
          until curl -sSfL "$url" -o /tmp/lychee.tar.gz; do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then echo "lychee download failed after $n attempts"; exit 1; fi
            echo "lychee download attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
          tar -xzf /tmp/lychee.tar.gz -C "$HOME/.lychee-bin" lychee
          chmod +x "$HOME/.lychee-bin/lychee"
      - name: Link-check docs (internal links only)
        run: |
          "$HOME/.lychee-bin/lychee" --offline --no-progress --verbose \
            docs/runbooks/soc2-readiness.md \
            'docs/runbooks/**/*.md'

  python:
    runs-on: ubuntu-latest
    # TTL for the shared-test-db mutex (Phase 158 / OPS-01): GitHub kills the job
    # at 90m, the psql session drops, and Postgres releases the advisory lock.
    # That IS the steal path. Manual unlock:
    # docs/runbooks/shared-test-db-mutex.md.
    #
    # 158-REVIEW CR-04 — why 90 and not 60. Each CI run takes this lock THREE
    # times (python ~7m, e2e-seeded ~8-9m across build + the Playwright batch,
    # sql-tests the balance) ≈ 20m of lock-time per run. The phase's own success
    # criterion is that THREE simultaneous runs serialize and ALL SUCCEED, so the
    # last job to acquire can legitimately queue behind ~8 other holds ≈ 60m. The
    # acquire cap is sized to 3600s to absorb exactly that, and this TTL must
    # then cover setup + that full cap + this job's own work (~2m + 60m + ~12m ≈
    # 74m) with headroom. At 60m the waiter died of its OWN TTL mid-queue — and
    # with sql-tests now BLOCKING the `frontend` aggregator that reddens main
    # HEAD and makes Railway skip the analytics deploy, i.e. #616's damage
    # through a new door. The trade is a wider worst-case WEDGED hold (90m);
    # runbook section 3 is the manual override for that.
    # ⛔ The holder's `pg_sleep` must stay ABOVE this number (WR-01) — it is 6000s.
    timeout-minutes: 90
    # Serialize the python job across ALL runs (every PR + every push) against
    # the SHARED remote Supabase test project. The workflow-level concurrency
    # group (top of file) only isolates per-PR, so two different PRs' python
    # jobs could hit the shared test DB simultaneously and race the
    # compute_jobs fencing/claim tests (CI flakiness audit F2).
    #
    # Phase 158 / OPS-01: this used to be a repo-wide GitHub concurrency group
    # shared with `sql-tests` and `e2e-seeded`. It is now the "Acquire
    # shared-test-db mutex" step below — a Postgres SESSION advisory lock on key
    # 61616158, taken immediately before the first DB-touching step. Same
    # queue-don't-race guarantee, but contenders BLOCK on the lock instead of
    # occupying GitHub's single pending slot: with three members that slot made a
    # third arrival EVICT the queued one, which concluded `cancelled` (a GREY
    # check) and let Railway silently skip the analytics deploy (issue #616).
    # ⛔ Do NOT reintroduce that group, in any shape — including a shrunken one.
    # The eviction is CROSS-run, so fewer members only changes which run gets
    # evicted. See the ⛔ block on `sql-tests` for the full mechanism.
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. The python/pytest job
          # consumes TEST_SUPABASE_* secrets but does no git ops; the
          # persisted cred is pure attack surface.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          # Include requirements-dev.txt so the test/type deps (pytest, mypy,
          # …) — relocated there — are part of the pip cache key (CI speed
          # audit F4).
          cache-dependency-path: |
            analytics-service/requirements.txt
            analytics-service/requirements-dev.txt
      # Retry pip install on transient index/CDN failures (CI flakiness audit
      # F6). Fixed command; no untrusted input interpolated.
      - name: pip install (retry transient network failures)
        run: |
          n=0
          until pip install -r requirements.txt -r requirements-dev.txt; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "pip install failed after $n attempts"; exit 1; fi
            echo "pip install attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # @runtime_checkable Protocol only verifies method *presence* at runtime,
      # not signature shape; mypy --strict catches signature drift (e.g.
      # `validate(req)` vs `validate(request)`) at type-check time before the
      # test pipeline. --follow-imports=silent keeps strictness local to the
      # gated packages.
      #
      # B-mypy program: the strict floor started at services/ingestion/ (Phase
      # 19 / BACKBONE-02 / MC-3) and now covers ALL running-service code —
      # services/ (B-mypy part g, v0.24.15.60), routers/ (part h, v0.24.15.61),
      # and models/ (part i) — all verified 0 against the CI-pinned deps
      # (supabase 2.15.1 / postgrest 1.0.2). scripts/ stays ungated: they are
      # one-off operational tooling (backfills, cassette recording), not the
      # running service, and gating them would add a types-PyYAML dev-dep plus
      # friction for throwaway scripts. tests/ stays untyped by design.
      - run: mypy --strict --follow-imports=silent services/ routers/ models/
      # PR #149 v0.22.25.3 follow-up: wire the test Supabase project into
      # the python job so the P97 fence regression tests in
      # tests/test_compute_jobs_fencing.py execute against a real DB. The
      # test project (`qmnijlgmdhviwzwfyzlc`) was caught up to main's
      # migration head (109-119 applied 2026-05-12), so live-DB fixtures
      # no longer hit pre-existing schema drift.
      #
      # Gated on the repository VARIABLE `E2E_TEST_DB_CONFIGURED` (NOT
      # `secrets.X != ''`) — vars are introspectable in workflow logs so
      # a missing/typo'd var fails loudly. When the var is unset (forks,
      # repos without a configured test DB), the secrets fall back to
      # empty strings AND `CI` is demoted to '' so `_need_supabase()` in
      # `tests/test_compute_jobs_fencing.py` falls into the `pytest.skip`
      # branch instead of the CI=true hard-fail branch.
      # tech-debt #16: gate covers services/ + routers/ + main_worker.py
      # (was services/ only — the 7.8k-LOC route layer and the worker
      # entrypoint contributed zero to the only Python coverage gate).
      # Combined measured ~87% clears the 80 floor; exchange/internal/csv
      # routers (32/36/42%) are now inside the denominator so they can no
      # longer regress unseen. Keep byte-identical with Makefile `test:`.
      #
      # SERIAL (v1.9.1 Phase 97): the `-n auto --dist loadgroup` parallelization
      # (absorbed from #610) is DEFERRED. Even with every live-DB module pinned
      # to one `shared_test_db` xdist_group worker, the GLOBAL-claim fence tests
      # (`test_compute_jobs_fencing.py`) flake under `-n auto`: the group's own
      # tests run in a loadgroup-variable order and any imperfect per-test
      # compute_jobs cleanup pollutes a later global-`claim_compute_jobs_with_priority`
      # assertion (tie-break picks a foreign row / `single()` finds 0 rows /
      # the seeded row is claimed out of the batch → None). Main's stable serial
      # order avoids this. The `want_job_id` claim scoping + decoy regression +
      # xdist_group infra all LAND (they are correct and the offline decoy pins
      # the scoping); re-enabling `-n auto` needs per-test claim-space isolation
      # first (TODOS: v1.9.1 Phase-97 parallelization deferral). The cross-run
      # shared-test-db mutex acquired in the step below still prevents two runs
      # from contending. Keep byte-identical with Makefile `test:`.
      #
      # Phase 158 / OPS-01 — the shared-test-db mutex, byte-identical to the step
      # in `sql-tests` and `e2e-seeded` (see the long note on `sql-tests` for the
      # mechanism and the ⛔ constraints). Placed immediately before `pytest`, the
      # first DB-touching step of this job. This job's `defaults.run.
      # working-directory: analytics-service` applies here and is harmless — the
      # step reads no repo file.
      - name: Acquire shared-test-db mutex
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_SUPABASE_DB_URL:-}" ]; then
            echo "fork PR / secret withheld — mutex skipped (DB work self-skips on forks)"
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          # Session-mode DSN. The documented secret points at the Supavisor
          # pooler on port 6543 = TRANSACTION mode, where a SESSION advisory lock
          # does not survive between statements; session mode is served on 5432
          # of the same host. Derived by parameter expansion and NEVER echoed —
          # this repository is public and the derived string is not a value
          # GitHub can mask for us.
          dsn="${TEST_SUPABASE_DB_URL}"
          case "${dsn}" in
            *":6543/"*) dsn="${dsn%%:6543/*}:5432/${dsn#*:6543/}" ;;
          esac
          # [158-MUTEX-01 F2] libpq keepalives on the holder path. During the
          # contended pg_advisory_lock wait and the pg_sleep hold this
          # connection carries ZERO traffic, and Linux's default first TCP
          # keepalive fires at 7200s — never, on these timescales — so a
          # runner-side NAT idle expiry would zombify the holder invisibly:
          # the backend keeps the lock long after the job is gone. 60s
          # keepalives keep the NAT mapping fresh AND let the client detect a
          # dead path in ~2min (15s x 4), so psql dies and the release step's
          # dead-holder witness fires instead of a silent wedge. The secret's
          # shape is NOT assumed: append with '&' if the DSN already carries a
          # query string, '?' otherwise.
          keepalive_params="keepalives=1&keepalives_idle=60&keepalives_interval=15&keepalives_count=4"
          case "${dsn}" in
            *\?*) dsn="${dsn}&${keepalive_params}" ;;
            *)    dsn="${dsn}?${keepalive_params}" ;;
          esac
          log="${RUNNER_TEMP}/shared-test-db-mutex.log"
          pidfile="${RUNNER_TEMP}/shared-test-db-mutex.pid"
          # 158-REVIEW WR-01: the idle sleep MUST outlive this job's
          # `timeout-minutes`, or the holder session ends — releasing the lock —
          # while the job is still doing DB work, and another run walks straight
          # in. The old value (3300s = 55min) was SHORTER than the then-60min
          # TTL, so any job that acquired early and ran long silently lost mutual
          # exclusion for its last ~5 minutes. 6000s = 100min sits above this
          # job's `timeout-minutes` with headroom, so the JOB always dies first
          # and teardown is the only thing that ever releases this lock.
          # ⛔ If you lower `timeout-minutes`, this stays valid. If you RAISE it,
          # raise this too — the invariant is sleep > TTL, and nothing else
          # enforces it.
          # [158-MUTEX-01] (holder death at 120s; 2026-08-20/21 runs, e.g.
          # 32424762495): sleep > TTL is NECESSARY but not SUFFICIENT — the
          # holder session must ALSO disable the server statement_timeout. The
          # TEST project sets a server-wide statement_timeout=120000, and both
          # the contended pg_advisory_lock wait and the pg_sleep are single
          # statements, so the server killed the holder ~120s after acquiring:
          # psql exited, the session dropped, the lock silently released, and
          # the job's remaining DB work ran UNSERIALIZED (the release step's
          # dead-holder ::error:: fired on every long-job run). That is why the
          # holder's FIRST -c statement below zeroes statement_timeout, before
          # pg_advisory_lock — session-level SET is permitted for any role and
          # overrides the configuration-file default, exempting both the lock
          # wait and the idle sleep. Third invariant leg, pinned in
          # critical-regressions.test.ts.
          # [158-MUTEX-02] (orphaned holder backend; run 32457330139): killing
          # the psql CLIENT does not kill its SERVER backend — neither pg_sleep
          # nor a pg_advisory_lock wait ever reads the client socket, so the
          # release step's client-side kill left a backend holding the lock for
          # its full 6000s sleep and starved e2e-seeded past the 3600s cap.
          # Before 158-MUTEX-01 the server statement_timeout was the ACCIDENTAL
          # janitor for such orphans; client_connection_check_interval is the
          # real one — the backend polls its client socket during query
          # execution AND lock waits, aborting within ~30s of the client dying.
          # Covers both the sleeping holder and a lock-waiting contender whose
          # client died (a job-timeout kill mid-wait leaves the same zombie).
          # HOLDER-BACKEND-PID feeds the release step's guarded server-side
          # pg_terminate_backend, which frees the lock immediately rather than
          # after the ~30s check interval. Both GUCs and the marker MUST stay
          # before pg_advisory_lock, so the lock wait itself is covered.
          start_holder() {
            : > "${log}"
            PGAPPNAME=ci-shared-test-db-mutex PGCONNECT_TIMEOUT=15 \
              nohup psql "${dsn}" -X -q -A -t -v ON_ERROR_STOP=1 \
                -c "SET statement_timeout = 0;" \
                -c "SET client_connection_check_interval = '30s';" \
                -c "SELECT 'HOLDER-BACKEND-PID ' || pg_backend_pid();" \
                -c "SELECT pg_advisory_lock(61616158);" \
                -c "SELECT 'MUTEX-ACQUIRED';" \
                -c "SELECT pg_sleep(6000);" \
                >> "${log}" 2>&1 &
            holder=$!
            echo "${holder}" > "${pidfile}"
          }
          # 158-REVIEW CR-04: the cap absorbs legitimate cross-run QUEUE DEPTH,
          # not just a wedge. Three simultaneous runs put ~8 other holds ahead of
          # the last waiter (~60m at the measured ~20m of lock-time per run), and
          # the phase's success criterion is that all three still pass. 2700s was
          # comparable to the work it had to absorb, so ordinary contention —
          # which this repo's history records as NORMAL — surfaced as a red
          # sql-tests → red `frontend` → skipped Railway deploy.
          #
          # 158-REVIEW WR-13: retry a DEAD SESSION, never a full wait. Every
          # other network op in this file retries by explicit flakiness-audit
          # decision (`npm ci`, `pip install`, the lychee download, the SRH
          # readiness poll); this one did not, so a single transient connect
          # blip inside PGCONNECT_TIMEOUT killed the backgrounded psql and
          # exited 1 — now a red REQUIRED check, and on main a skipped Railway
          # deploy. The two failure modes are deliberately kept distinct:
          # "session died" is retryable (below), "waited past the cap" is NOT
          # (that is contention, and retrying would just re-queue at the back).
          # `waited` is CUMULATIVE across attempts, so retries can never extend
          # the total wait beyond the cap the TTL was sized against.
          waited=0
          for attempt in 1 2 3; do
            start_holder
            while [ "${waited}" -lt 3600 ]; do
              if grep -q 'MUTEX-ACQUIRED' "${log}" 2>/dev/null; then
                # [158-MUTEX-02] best effort: an absent/empty pid file only
                # forfeits the release step's immediate server-side reap — the
                # ccci GUC above still bounds an orphaned backend at ~30s.
                sed -n 's/^HOLDER-BACKEND-PID \([0-9]\{1,\}\)$/\1/p' "${log}" | head -n 1 \
                  > "${RUNNER_TEMP}/shared-test-db-mutex-backend-pid" || true
                echo "Acquired the shared-test-db advisory lock (key 61616158) after ${waited}s (attempt ${attempt}/3)."
                exit 0
              fi
              if ! kill -0 "${holder}" 2>/dev/null; then
                echo "::warning::mutex acquire attempt ${attempt}/3 lost its psql session after ${waited}s (redacted output follows)."
                # 158-REVIEW WR-08: psql NEVER echoes the DSN on failure, so the
                # userinfo pattern alone matched nothing and the raw text — the
                # TEST pooler host, its resolved IP, and the DB username /
                # project-ref — went straight into a PUBLIC Actions log, against
                # this mutex's own stated invariant ("never a DSN, host,
                # username, or password, in any CI log line"). Redact the shapes
                # psql actually emits:
                #   connection to server at "<host>" (<ip>), port <n> failed
                #   FATAL:  password authentication failed for user "<user>"
                sed -E -e 's#(postgres(ql)?://)[^@]*@#\1***@#g' \
                       -e 's#(server at )"[^"]*"( \([^)]*\))?#\1"***"#g' \
                       -e 's#(for user )"[^"]*"#\1"***"#g' "${log}" >&2 || true
                break
              fi
              sleep 5
              waited=$(( waited + 5 ))
              if [ $(( waited % 60 )) -eq 0 ]; then
                echo "still waiting on the shared-test-db mutex (${waited}s) — another run holds it."
              fi
            done
            # Cap exhausted => contention, not a transient. Stop retrying and
            # fall through to the census + timeout diagnostic below.
            if [ "${waited}" -ge 3600 ]; then
              break
            fi
            # The session is dead; drop its pid so the release step cannot kill
            # an unrelated process that inherits the number.
            rm -f "${pidfile}"
            # 158-REVIEW WR-02 (iter 3): back off ONLY when a retry actually
            # follows. Unguarded, the last iteration printed "retrying the mutex
            # acquire in 15s" and then slept 15s before falling out of the loop
            # to the "after 3 attempts" error — telling the operator a fourth
            # attempt was coming when none was, which this repo's
            # fail-loud-and-ACCURATE doctrine counts as a real cost. Worse, that
            # phantom 15s was added to `waited`, and `waited` is the variable the
            # cap-vs-session-fault branch below is chosen by: a run that
            # legitimately queued to 3585s and then lost its session could be
            # pushed over 3600 by backoff bookkeeping alone and misreported as
            # contention rather than as the session fault it actually was.
            if [ "${attempt}" -lt 3 ]; then
              backoff=$(( attempt * 5 ))
              echo "retrying the mutex acquire in ${backoff}s"
              sleep "${backoff}"
              waited=$(( waited + backoff ))
            fi
          done
          if [ "${waited}" -lt 3600 ]; then
            echo "::error::could not establish the shared-test-db mutex session after 3 attempts — psql died before acquiring each time (last output redacted above). Two causes fit: (1) a CONNECT/session fault — check the TEST project's session-mode pooler (port 5432); or (2) something killed the session MID-WAIT while it contended for the lock — before 158-MUTEX-01 the server-wide statement_timeout did exactly that at 120s per attempt (the holder now zeroes statement_timeout as its first statement, so that specific kill should no longer occur). If the redacted output shows 'canceling statement due to statement timeout', that is NOT lock contention: the holder zeroes statement_timeout as its very first statement, so post-158-MUTEX-01 that signature can only mean the SET never stuck to this session's backend — the session-mode DSN rewrite regressed, the secret's shape changed, or a pooler is intercepting SET. Triage it as a pooler/session fault."
            exit 1
          fi
          # 158-REVIEW CR-04: do NOT assert "a holder is wedged" — measure, then
          # name both causes. From inside this loop a deep waiter queue and a
          # wedged holder are indistinguishable, and the old message confidently
          # named the rarer one, sending the operator hunting for a wedge that
          # may not exist. Counts ONLY: no pids, no host, no DSN, and stderr is
          # discarded outright — this log is public.
          #
          # 158-REVIEW WR-01 (iter 3): the census MUST be bounded. PGCONNECT_TIMEOUT
          # bounds only the CONNECT; once connected, an unbounded query against a sick
          # TEST Postgres/pooler blocks until this job's `timeout-minutes` kills the
          # runner — so the operator gets LESS information than before the census
          # existed (a bare "exceeded the maximum execution time"), and the job squats
          # a runner for ~30 more minutes while holding no lock. A sick backend is
          # precisely the condition under which this timeout fires, and this repo's
          # history records a wedged TEST backend as a MEASURED event, not a
          # hypothetical. Both bounds are needed because they cover different faults:
          # `statement_timeout` is server-side (a slow or lock-blocked query) and
          # `timeout` is client-side (a black-holed connection the server never hears
          # about, where a server-side timeout can never fire). A diagnostic must
          # never outlive the thing it diagnoses. `${census:-unavailable}` below
          # already handles the empty result, so the message stays honest either way.
          census="$(PGCONNECT_TIMEOUT=15 timeout 20 psql "${dsn}" -X -q -A -t \
            -c "SET statement_timeout = '10s';" \
            -c "SELECT count(*) FILTER (WHERE granted) || ' granted, ' || count(*) FILTER (WHERE NOT granted) || ' waiting' FROM pg_locks WHERE locktype = 'advisory' AND objid = 61616158;" \
            2>/dev/null | tr -d '\r' | tail -1)" || true
          echo "::error::timed out after ${waited}s waiting for the shared-test-db advisory lock (key 61616158). Lock census: ${census:-unavailable}. TWO causes are possible and this step cannot distinguish them: (1) QUEUE DEPTH — concurrent runs each hold the lock ~20m, which is a NORMAL condition in this repo; re-run once the queue drains. (2) A WEDGED holder whose runner is gone. Triage (count the waiters first) and manual unlock: docs/runbooks/shared-test-db-mutex.md sections 2-3."
          exit 1
      - run: pytest --cov=services --cov=routers --cov=main_worker --cov-report=term-missing --cov-fail-under=80
        env:
          SUPABASE_TEST_URL: ${{ vars.E2E_TEST_DB_CONFIGURED == 'true' && secrets.TEST_SUPABASE_URL || '' }}
          SUPABASE_TEST_SERVICE_KEY: ${{ vars.E2E_TEST_DB_CONFIGURED == 'true' && secrets.TEST_SUPABASE_SERVICE_ROLE_KEY || '' }}
          CI: ${{ vars.E2E_TEST_DB_CONFIGURED == 'true' && 'true' || '' }}
      # Best-effort EARLY release of the shared-test-db mutex (Phase 158 /
      # OPS-01), identical in all three DB-touching jobs. See the note on
      # `sql-tests`: teardown releases the lock anyway, this just hands it over
      # sooner and never reddens the job.
      - name: Release shared-test-db mutex (best effort)
        if: always()
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          pidfile="${RUNNER_TEMP}/shared-test-db-mutex.pid"
          if [ ! -f "${pidfile}" ]; then
            echo "No mutex pid recorded (fork PR / acquire skipped) — nothing to release."
            exit 0
          fi
          holder="$(cat "${pidfile}")"
          if kill "${holder}" 2>/dev/null; then
            echo "Released the shared-test-db mutex (terminated psql pid ${holder})."
          else
            # 158-REVIEW WR-01: reaching here is a FAULT, not housekeeping. A
            # pidfile exists, so the acquire step really did start a holder — and
            # that holder is now dead while this job was still running. Every DB
            # step between its death and now ran with the mutex RELEASED, i.e.
            # potentially concurrently with another run against the shared TEST
            # project. The previous message ("was already gone — the session drop
            # released the lock") described this as normal and printed on exactly
            # the failure path it was supposed to surface.
            # [158-MUTEX-01]: the once-common cause (the server-wide
            # statement_timeout killing pg_sleep at ~120s) is fixed — the holder
            # zeroes statement_timeout — so a dead holder here is now UNEXPECTED
            # and always worth investigating.
            # Annotation only: this step is `if: always()` and must never redden a
            # job whose real work passed, and `echo ::error::` does not change the
            # exit status. Job teardown remains the guaranteed release path.
            echo "::error::mutex holder pid ${holder} died BEFORE this release step — the DB work after its death ran UNSERIALIZED. Do not trust this run's DB assertions; investigate (holder outlives the job by design, see the pg_sleep note in the acquire step)."
          fi
          # [158-MUTEX-02] (run 32457330139): the kill above reaches only the
          # psql CLIENT. A backend mid-pg_sleep never reads its client socket,
          # so it kept the lock and starved the other jobs' acquires for its
          # full 6000s sleep. Terminate the recorded backend server-side too;
          # the pg_locks guard (same key, same pid) makes it a no-op if that
          # backend already exited or the pid was recycled — never a blind
          # terminate. Best effort like the rest of this step: ccci bounds any
          # survivor at ~30s, and nothing here may redden the job.
          backendpidfile="${RUNNER_TEMP}/shared-test-db-mutex-backend-pid"
          backend="$(cat "${backendpidfile}" 2>/dev/null || true)"
          case "${backend}" in
            ''|*[!0-9]*)
              echo "No server backend pid recorded — leaving any orphan to client_connection_check_interval."
              ;;
            *)
              if [ -z "${TEST_SUPABASE_DB_URL:-}" ]; then
                echo "TEST_SUPABASE_DB_URL withheld — skipping the server-side backend reap."
              else
                # Session-mode DSN, derived exactly as in the acquire step and
                # never echoed; bounded like the acquire step's census query.
                dsn="${TEST_SUPABASE_DB_URL}"
                case "${dsn}" in
                  *":6543/"*) dsn="${dsn%%:6543/*}:5432/${dsn#*:6543/}" ;;
                esac
                reaped="$(PGCONNECT_TIMEOUT=15 timeout 20 psql "${dsn}" -X -q -A -t \
                  -c "SET statement_timeout = '10s';" \
                  -c "SELECT pg_terminate_backend(${backend}) FROM pg_locks WHERE locktype = 'advisory' AND objid = 61616158 AND pid = ${backend};" \
                  2>/dev/null | tr -d '\r' | tail -1)" || true
                if [ "${reaped}" = "t" ]; then
                  echo "Server-side reap: backend ${backend} was STILL on key 61616158 — pg_terminate_backend sent (the client kill alone had not freed the lock)."
                else
                  echo "Server-side reap: backend ${backend} no longer on key 61616158 (already exited, or the census was unavailable) — nothing to terminate."
                fi
              fi
              ;;
          esac

  e2e:
    # Runs the PUBLIC/smoke Playwright suite against a placeholder-env
    # Next.js build. Scope: auth, smoke, and the public /demo specs
    # (demo-public + demo-founder-view) plus the public sweep specs.
    #
    # CI speed (2026-07-02): the seed-gated batch that used to run
    # SEQUENTIALLY after this one (4.8m after a 6.1m smoke pass) moved to
    # the parallel `e2e-seeded` job below — e2e wall clock drops from ~13m
    # to the slower of the two (~8-9m). This job never sees the real
    # test-Supabase env, so its artifacts are C-0293(c)-safe by
    # construction.
    #
    # demo-screenshot.spec.ts: its chromium-linux baseline PNGs are now
    # committed (generated in the Playwright Linux Docker image), so its 3
    # viewport toHaveScreenshot comparisons run unconditionally in the
    # spec list below (tech-debt #25 — executing the codebase's own
    # documented "once baselines land, drop the --grep gate" next step).
    # The former C-0300 --grep sentinel gate (whose only job was to fail
    # until baselines landed) has been dropped; the sentinel test itself
    # is harmless and still runs as part of the full spec.
    runs-on: ubuntu-latest
    # PR-B: depend on frontend-build (for the artifact) PLUS frontend-typecheck
    # so e2e doesn't burn ~3-5min when a typecheck failure is already known.
    # CI speed audit F2: dropped `frontend-test` from `needs` — e2e validity
    # depends on the build + types, not on unit tests passing, and gating on
    # the slowest test shard (~133s) needlessly delayed the critical-path tail.
    # Don't depend on the aggregator (would also wait on lint/policy). Branch
    # protection still gates merges on the `frontend` aggregator above; this
    # only trades a little wasted runner time on an already-doomed PR for a
    # faster e2e signal on healthy ones.
    needs:
      - frontend-build
      - frontend-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. No subsequent step in
          # this job pushes back to the repo; the cred is pure attack
          # surface for any third-party action that lands later.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # CI speed audit F1: restore the shared node_modules cache (keyed on the
      # lockfile) so most runs skip the ~40-60s install. The `deps-cache` job
      # populates it from a clean, SUCCESSFUL npm ci; this is restore-ONLY so a
      # failed install here can never poison the shared cache. On a miss (new
      # lockfile, or deps-cache not finished yet) fall back to a retried npm ci
      # (flakiness audit F3 — transient ECONNRESET; no untrusted input).
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Cache the Playwright browser bundle (~120MB chromium) keyed on the
      # `@playwright/test` package version specifically — not the whole
      # lockfile. Keying on lockfile would bust the cache for every
      # unrelated dep update; keying on Playwright's package.json (which
      # `npm ci` materialized in node_modules) means the cache only rolls
      # when Playwright itself changes, which is what determines the
      # browser bundle compatibility.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/@playwright/test/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # On cache hit, skip the install entirely. The chromium browser is
      # restored from the cache; GitHub ubuntu-latest runners have all
      # the system libs chromium needs (libnss3, libgtk-3-0, libgbm1,
      # etc.) baked in. The previous version ran `playwright install-deps
      # chromium` (apt-get update + 30 lib install) on cache hit, which
      # observed 5+ minutes on a slow apt mirror — defeating the cache
      # win. If a future runner image update drops a chromium-required
      # lib, the playwright run will fail with a clear missing-lib error
      # and we add it back. On cache miss, do the full install (download
      # + apt deps).
      - name: Install Playwright (browser bundle from cache when available)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit — chromium bundle restored. Runner image has system libs; skipping apt install."
          else
            npx playwright install --with-deps chromium
          fi
      # PR-B: Download the build artifact from frontend-build instead of
      # rebuilding. Saves 60-120s on every e2e run (the prior single-build
      # consolidation in PR-A still rebuilt; this eliminates the rebuild
      # entirely). The artifact carries the seed-aware NEXT_PUBLIC_* vars
      # baked into client bundles at build time.
      - name: Download .next + public artifact from frontend-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextjs-build
          # download-artifact restores at the cwd by default; .next and
          # public extract to project root, matching `npm run start`'s
          # expected layout.
      - name: Start server and run Playwright
        # Skip the unconditional placeholder-env smoke specs during a golden-bake
        # dispatch. They are irrelevant to baking, and this step is flaky
        # (placeholder.supabase.co public-route specs). Its failure would SKIP the
        # seeded bake step below: that step's `if: vars.E2E_TEST_DB_CONFIGURED`
        # carries no status function, so GitHub implicitly ANDs it with success(),
        # and a FAILED prior step makes success() false → the bake never runs and
        # the artifact upload then fails on if-no-files-found. A SKIPPED step (not
        # a failed one) keeps success() true, so seed/rebuild/bake still run.
        # Normal push/PR (and non-bake dispatches) are unaffected — the step runs.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bake_svg_goldens) }}
        # continue-on-error KEPT after the 2026-07-02 e2e split (reviewer
        # CR-3): its original success()-gating rationale (protecting the
        # downstream seeded step) is gone — the seeded batch is its own
        # parallel job now — but the placeholder-env flake itself
        # (getaddrinfo ENOTFOUND placeholder.supabase.co) was never fixed,
        # only masked, and a red job on a MAIN merge commit makes Railway
        # silently skip the analytics deploy (deploy-on-green-CI, no
        # auto-recover on rerun-green). Signal is preserved by the red-step
        # annotation + the failure-report upload below. Flip this off only
        # after fixing the placeholder flake at the root.
        id: smoke
        continue-on-error: true
        run: |
          npm run start &
          SERVER_PID=$!
          # Wait for server to respond (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Phase 48-04 / A11Y-01 / FLOW-01 (place 1, UNSEEDED): the new
          # e2e/axe-app-wide.spec.ts runs its PUBLIC route × viewport rows here
          # (those describe blocks carry NO seed gate); its authed + embedded
          # describes self-skip without seed env (place 2 = the spec's
          # HAS_SEED_ENV const) and run in the seeded MA-8 list below. Adding a
          # spec? Update BOTH lists or the gate silently never runs (burned >=3x).
          # Phase 158 / OPS-03: api-key-flow and sync-analytics-flow — two of the
          # four specs that existed for ~2 years wired into NO batch at all, so
          # they never ran anywhere — are now in this unseeded list. Plan 158-05
          # ran and repaired them FIRST (both reds classified as CSRF-origin spec
          # rot, not product defects) and measured them green under this job's
          # placeholder-Supabase env. They depend on the
          # NEXT_PUBLIC_ALLOWED_ORIGINS line in this step's env block below —
          # without it their repaired contract POSTs 403 before reaching auth and
          # measure the wrong arm. The other three (full-flow, csv-upload-flow,
          # and the new my-strategies spec) went to the seeded MA-8 list, which
          # carries the batch verdicts' reasoning.
          #
          # ⚠️ 158-REVIEW WR-06 — what this wiring DOES and DOES NOT buy. Stated
          # in the repo's required form: after this change these two specs WOULD
          # SURFACE a regression in a run log; they WOULD NOT have stopped it
          # merging or deploying. Two independent reasons, both still true:
          #   1. this step carries `continue-on-error: true` (kept deliberately
          #      for the unfixed placeholder-Supabase DNS flake — see the note on
          #      the step above), so a failing spec leaves an annotation and the
          #      step still concludes green; and
          #   2. the `e2e` job is in NO aggregator's `needs:` — `frontend` gates
          #      on `e2e-seeded`, not on this job — so even a red job conclusion
          #      moves no merge gate.
          # So these two are ADVISORY. The other three went to `e2e-seeded`,
          # which IS in the `frontend` aggregator's `needs:`; that half is
          # genuinely blocking. Do not describe the OPS-03 wiring as "now gated".
          # Promoting these two to a blocking lane is tracked in TODOS.md
          # (Phase 158 OPS-03 section) and needs a MEASURED run in the target
          # env first — they are green under THIS job's placeholder env, which
          # is not evidence about the seeded job's env.
          # Capture the test exit code WITHOUT aborting the script (default
          # shell is `bash -e`). The port-3000 cleanup below is a FINALLY so a
          # failing spec never leaves an orphaned next-server bound to :3000
          # (runner hygiene for the upload steps that follow; the seeded batch
          # now runs on its own runner in the parallel e2e-seeded job, so this
          # is no longer protecting a downstream WR-04 guard in THIS job).
          set +e
          if [ "${BAKE_DEMO_SCREENSHOTS}" = "true" ]; then
            # One-shot baseline bake (workflow_dispatch input bake_demo_screenshots).
            # Run ONLY demo-screenshot with --update-snapshots so no other spec's
            # baselines are touched; the regenerated PNGs (taken in THIS
            # placeholder env — the same env they're diffed against — so no
            # jammy-vs-ubuntu divergence) upload as an artifact for per-shot human
            # review. NEVER auto-committed here (the locked "no blind
            # --update-snapshots" rule) — a follow-up PR lands the reviewed PNGs.
            npx playwright test e2e/demo-screenshot.spec.ts \
              --update-snapshots \
              --timeout 60000
          else
            npx playwright test e2e/auth.spec.ts e2e/smoke.spec.ts e2e/demo-public.spec.ts e2e/demo-founder-view.spec.ts e2e/onboarding-banner-smoke.spec.ts e2e/demo-screenshot.spec.ts e2e/reflow.spec.ts e2e/target-size.spec.ts e2e/reflow-sweep.spec.ts e2e/no-clip-sweep.spec.ts e2e/axe-app-wide.spec.ts e2e/marketing-shell.spec.ts e2e/route-redirects.spec.ts e2e/api-key-flow.spec.ts e2e/sync-analytics-flow.spec.ts
          fi
          PW_EXIT=$?
          set -e
          # v0.17.1.18: belt + suspenders + nuclear port-3000 cleanup.
          # The v0.17.1.15 attempt (lsof + 5s poll) was insufficient — CI
          # confirmed (PR #98 run #320) that the next-server grandchild
          # was still binding port 3000 when the seed-gated step's WR-04
          # guard ran. Layer multiple methods so any one of them catches
          # the listener regardless of process model.
          echo "[port-cleanup] before: $(lsof -ti:3000 2>/dev/null | tr '\n' ' ')"
          kill -TERM $SERVER_PID 2>/dev/null || true
          # Kill the children of the npm parent (catches the next start
          # intermediary that npm spawns).
          pkill -TERM -P $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          # Kill anything matching next-server (catches the grandchild
          # whose parent is now init, not visible from $SERVER_PID tree).
          # Scope to current user — `pkill -f` is otherwise host-wide and
          # would target sibling jobs on shared/self-hosted runners. The
          # `id -u` resolves at runtime in the runner shell; no external
          # input flows in here.
          _RUNNER_UID=$(id -u)
          pkill -KILL -u "$_RUNNER_UID" -f "next-server" 2>/dev/null || true
          pkill -KILL -u "$_RUNNER_UID" -f "next start" 2>/dev/null || true
          # Final fallback: kill anything bound to port 3000.
          lsof -ti:3000 2>/dev/null | xargs -r kill -9 2>/dev/null || true
          # Kernel-level port nuke (works even when no PID is visible).
          fuser -k 3000/tcp 2>/dev/null || true
          # Poll up to 10s for both ss and lsof to agree port is free.
          # The WR-04 guard checks BOTH so the cleanup must satisfy both.
          for i in $(seq 1 10); do
            ss_bound=$(ss -ltn 2>/dev/null | grep -q ':3000\b' && echo y || echo n)
            lsof_bound=$(lsof -nP -iTCP:3000 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN && echo y || echo n)
            if [ "$ss_bound" = n ] && [ "$lsof_bound" = n ]; then
              echo "[port-cleanup] released after ${i}s"
              break
            fi
            # Re-nuke each iteration in case a respawn loop is active.
            lsof -ti:3000 2>/dev/null | xargs -r kill -9 2>/dev/null || true
            sleep 1
          done
          echo "[port-cleanup] after: $(lsof -ti:3000 2>/dev/null | tr '\n' ' '),ss:$(ss -ltn 2>/dev/null | grep ':3000\b' || echo none)"
          # Re-surface the test result as the step's exit code now that the
          # port is freed. continue-on-error tolerates it (conclusion=success,
          # outcome=failure) so the job stays green on the known placeholder
          # flake (Railway deploy-on-green-CI); the red step annotation + the
          # outcome-gated report upload below keep the failure visible.
          exit $PW_EXIT
        env:
          # workflow_dispatch one-shot baseline-bake toggle (drives the if/else
          # in the run block above). Renders "true" only on a manual dispatch
          # with bake_demo_screenshots checked; "false" on every push/PR run.
          BAKE_DEMO_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.bake_demo_screenshots }}
          # C-0293(c): runtime env mirrors the placeholder build above.
          # The unconditional spec set (auth, smoke, demo-public,
          # demo-founder-view, onboarding-banner-smoke) does NOT
          # authenticate against a real Supabase — placeholder is
          # correct here. The seed-gated step below uses real env
          # against a separately-rebuilt `.next/` (never uploaded).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role
          ADMIN_EMAIL: test@example.com
          PLATFORM_NAME: Quantalyze
          PLATFORM_EMAIL: test@quantalyze.com
          # Phase 158 / OPS-03 — same mechanism as the seeded step's copy of this
          # line (see the e2e-seeded job's "Run seed-gated specs" env). This job
          # serves the app with `npm run start`, i.e. production mode, so the
          # localhost:3000 auto-allowlist in src/lib/csrf.ts (its NODE_ENV !==
          # "production" branch) never fires and the runtime allowlist is EMPTY.
          # The api-key-flow and sync-analytics-flow contract tests POST to
          # mutating /api routes with an explicit Origin header (plan 158-05
          # added it — the CSRF gate postdates those specs); without an entry
          # here assertSameOrigin 403s them BEFORE auth runs, so they would
          # assert the CSRF arm instead of the auth contract they exist to pin.
          # Read at request time by server code, NOT inlined at build time —
          # this job consumes a prebuilt artifact it cannot rebuild, and the
          # seeded job proves the runtime read works (its own build step does
          # not set this var either). No production exposure: the value is a
          # literal localhost origin scoped to this step, and prod sets
          # NEXT_PUBLIC_SITE_URL to the canonical host.
          NEXT_PUBLIC_ALLOWED_ORIGINS: http://localhost:3000
      # Baseline bake (workflow_dispatch input bake_demo_screenshots): upload
      # ONLY the demo-screenshot snapshot PNGs — page images, no .next bundle /
      # trace.zip / page HTML — so the C-0293(c) secret-in-artifact concern that
      # gates the playwright-report upload below does NOT apply here. These PNGs
      # are the per-shot review material; a human eyeballs each, then a follow-up
      # PR commits them. if-no-files-found: error fails loud if nothing was baked.
      - name: Upload baked demo screenshots for review (workflow_dispatch bake only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.bake_demo_screenshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: demo-screenshots-baked
          path: e2e/demo-screenshot.spec.ts-snapshots/**/*.png
          if-no-files-found: error
          retention-days: 7
      # This job never carries real test-Supabase env (the seeded batch is
      # its own job below), so a failure report here can only embed
      # placeholder values — the C-0293(c) artifact-leak concern does not
      # apply. Gate on the smoke step's OUTCOME (pre-continue-on-error
      # result): with continue-on-error the job-level failure() never
      # becomes true, so a plain `if: failure()` would never fire.
      - name: Upload Playwright report on failure
        if: ${{ steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  e2e-seeded:
    # Plan 11-07 / BLOCK-3 + CI speed (2026-07-02): the seed-gated Playwright
    # batch in its OWN job, so it runs in PARALLEL with the placeholder smoke
    # batch above instead of sequentially after it (~13m job → two ~8-9m
    # jobs). Gate uses the repo VARIABLE `E2E_TEST_DB_CONFIGURED` (NOT
    # `secrets.X != ''`) — vars are exposed in PR contexts so a typo in the
    # variable name surfaces in the workflow log; a `secrets.X != ''` gate
    # would mask typos behind redaction and silently disable the spec. When
    # the variable is unset (fork PRs, repos without test-DB setup) the whole
    # job skips silently.
    #
    # C-0293(c): this job BUILDS Next.js itself with the real test env
    # (NEXT_PUBLIC_* inline at build time) instead of downloading the
    # placeholder nextjs-build artifact and rebuilding over it — the rebuilt
    # `.next/` stays on this ephemeral runner and is NEVER uploaded. That
    # also means needs: only typecheck (F2 rationale: don't burn minutes on
    # an already-doomed PR; e2e validity depends on types, not unit tests).
    runs-on: ubuntu-latest
    # TTL for the shared-test-db mutex (Phase 158 / OPS-01): GitHub kills the job
    # at 90m, the psql session drops, and Postgres releases the advisory lock.
    # That IS the steal path. Manual unlock:
    # docs/runbooks/shared-test-db-mutex.md.
    #
    # 158-REVIEW CR-04 — why 90 and not 60. Each CI run takes this lock THREE
    # times (python ~7m, e2e-seeded ~8-9m across build + the Playwright batch,
    # sql-tests the balance) ≈ 20m of lock-time per run. The phase's own success
    # criterion is that THREE simultaneous runs serialize and ALL SUCCEED, so the
    # last job to acquire can legitimately queue behind ~8 other holds ≈ 60m. The
    # acquire cap is sized to 3600s to absorb exactly that, and this TTL must
    # then cover setup + that full cap + this job's own work (~2m + 60m + ~12m ≈
    # 74m) with headroom. At 60m the waiter died of its OWN TTL mid-queue — and
    # with sql-tests now BLOCKING the `frontend` aggregator that reddens main
    # HEAD and makes Railway skip the analytics deploy, i.e. #616's damage
    # through a new door. The trade is a wider worst-case WEDGED hold (90m);
    # runbook section 3 is the manual override for that.
    # ⛔ The holder's `pg_sleep` must stay ABOVE this number (WR-01) — it is 6000s.
    timeout-minutes: 90
    # Fork-PR composition (same as sql-tests): repo VARIABLES are readable in
    # fork-PR runs while secrets are withheld, so the vars gate alone would
    # start the job on a fork and die at the seed step with empty secrets.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.E2E_TEST_DB_CONFIGURED == 'true' }}
    # v1.16 close-out (2026-08-01): serialize against the `python` job (and
    # `sql-tests`). All three drive the ONE shared Supabase
    # test project (`secrets.TEST_SUPABASE_URL`), and `claim_compute_jobs_with_priority`
    # claims a GLOBAL batch of 50 ready rows — it cannot be scoped to a caller.
    # So while this job drives the wizard and enqueues `compute_jobs`, a
    # concurrent `python` fencing test that seeds a pending row and then claims
    # it gets its row swept into THIS job's traffic (or vice versa), and
    # `_claim_one(..., want_job_id=...)` correctly returns None rather than a
    # foreign row — reddening 10 fencing/drain tests with `assert None is not None`
    # and `assert 'pending' == 'running'`.
    #
    # The serialization already on `python` (see its comment) was added for
    # CROSS-PR contention and explicitly reasons about "two different PRs' python
    # jobs"; it never covered two jobs INSIDE one run. `e2e` (the smoke batch)
    # does not need it — it builds against `https://placeholder.supabase.co` and
    # never reaches the shared project.
    #
    # Costs wall-clock: this job waits behind `python` (~7m) instead of
    # overlapping it. That is the price of the tests being trustworthy; the
    # alternative is a suite that reds on interleaving rather than on defects.
    #
    # Phase 158 / OPS-01: the mechanism used to be a repo-wide GitHub concurrency
    # group shared with `python` and `sql-tests`. It is now the "Acquire
    # shared-test-db mutex" step below — a Postgres SESSION advisory lock on key
    # 61616158. ⛔ Do NOT reintroduce that group in any shape (including a
    # shrunken one): with three members, a third arrival EVICTED the queued run,
    # which concluded `cancelled` — a GREY check that Railway read as a failed
    # check-suite, silently skipping the analytics deploy (issue #616). The
    # eviction is CROSS-run, so shrinking only changes which run dies. Full
    # mechanism in the ⛔ block on `sql-tests`.
    # ⛔ Do NOT add `sql-tests` to this `needs:` list to serialize the shared test
    # DB. It looks right and it silently disables THIS job on
    # every `workflow_dispatch` run: a skipped `needs:` job skips its dependents,
    # and the two `if:` conditions diverge on manual dispatch — `sql-tests`
    # requires `github.event_name == 'push'` (false) while this job only requires
    # `!= 'pull_request'` (true). The aggregator at the `e2e-seeded result=`
    # check then errors on the skip. Serialization needs no `needs:` edge at all
    # now — the mutex does it, which is exactly why adding one is still wrong.
    needs:
      - frontend-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config (same rationale as the e2e
          # smoke job above).
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # Same Playwright browser cache as the smoke job (keyed on the
      # Playwright package version). Restore-only here — the smoke job owns
      # the write so the two parallel jobs never race the save.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/@playwright/test/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright (browser bundle from cache when available)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit — chromium bundle restored. Runner image has system libs; skipping apt install."
          else
            npx playwright install --with-deps chromium
          fi
      # Phase 158 / OPS-01 — the shared-test-db mutex, byte-identical to the step
      # in `sql-tests` and `python` (see the long note on `sql-tests` for the
      # mechanism and the ⛔ constraints). Placed immediately before the seed
      # step, which is this job's first DB-MUTATING step.
      #
      # NOTE on hold length: the Next build below runs AFTER the seed, so the
      # lock is held across it (~1-2m). The build is deliberately NOT reordered
      # ahead of the seed to shorten the hold: `npm run build` prerenders public
      # routes against the real test-Supabase env, so building before the demo
      # rows exist would bake a different (empty) prerender into the bundle the
      # seeded specs then assert against.
      - name: Acquire shared-test-db mutex
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_SUPABASE_DB_URL:-}" ]; then
            echo "fork PR / secret withheld — mutex skipped (DB work self-skips on forks)"
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          # Session-mode DSN. The documented secret points at the Supavisor
          # pooler on port 6543 = TRANSACTION mode, where a SESSION advisory lock
          # does not survive between statements; session mode is served on 5432
          # of the same host. Derived by parameter expansion and NEVER echoed —
          # this repository is public and the derived string is not a value
          # GitHub can mask for us.
          dsn="${TEST_SUPABASE_DB_URL}"
          case "${dsn}" in
            *":6543/"*) dsn="${dsn%%:6543/*}:5432/${dsn#*:6543/}" ;;
          esac
          # [158-MUTEX-01 F2] libpq keepalives on the holder path. During the
          # contended pg_advisory_lock wait and the pg_sleep hold this
          # connection carries ZERO traffic, and Linux's default first TCP
          # keepalive fires at 7200s — never, on these timescales — so a
          # runner-side NAT idle expiry would zombify the holder invisibly:
          # the backend keeps the lock long after the job is gone. 60s
          # keepalives keep the NAT mapping fresh AND let the client detect a
          # dead path in ~2min (15s x 4), so psql dies and the release step's
          # dead-holder witness fires instead of a silent wedge. The secret's
          # shape is NOT assumed: append with '&' if the DSN already carries a
          # query string, '?' otherwise.
          keepalive_params="keepalives=1&keepalives_idle=60&keepalives_interval=15&keepalives_count=4"
          case "${dsn}" in
            *\?*) dsn="${dsn}&${keepalive_params}" ;;
            *)    dsn="${dsn}?${keepalive_params}" ;;
          esac
          log="${RUNNER_TEMP}/shared-test-db-mutex.log"
          pidfile="${RUNNER_TEMP}/shared-test-db-mutex.pid"
          # 158-REVIEW WR-01: the idle sleep MUST outlive this job's
          # `timeout-minutes`, or the holder session ends — releasing the lock —
          # while the job is still doing DB work, and another run walks straight
          # in. The old value (3300s = 55min) was SHORTER than the then-60min
          # TTL, so any job that acquired early and ran long silently lost mutual
          # exclusion for its last ~5 minutes. 6000s = 100min sits above this
          # job's `timeout-minutes` with headroom, so the JOB always dies first
          # and teardown is the only thing that ever releases this lock.
          # ⛔ If you lower `timeout-minutes`, this stays valid. If you RAISE it,
          # raise this too — the invariant is sleep > TTL, and nothing else
          # enforces it.
          # [158-MUTEX-01] (holder death at 120s; 2026-08-20/21 runs, e.g.
          # 32424762495): sleep > TTL is NECESSARY but not SUFFICIENT — the
          # holder session must ALSO disable the server statement_timeout. The
          # TEST project sets a server-wide statement_timeout=120000, and both
          # the contended pg_advisory_lock wait and the pg_sleep are single
          # statements, so the server killed the holder ~120s after acquiring:
          # psql exited, the session dropped, the lock silently released, and
          # the job's remaining DB work ran UNSERIALIZED (the release step's
          # dead-holder ::error:: fired on every long-job run). That is why the
          # holder's FIRST -c statement below zeroes statement_timeout, before
          # pg_advisory_lock — session-level SET is permitted for any role and
          # overrides the configuration-file default, exempting both the lock
          # wait and the idle sleep. Third invariant leg, pinned in
          # critical-regressions.test.ts.
          # [158-MUTEX-02] (orphaned holder backend; run 32457330139): killing
          # the psql CLIENT does not kill its SERVER backend — neither pg_sleep
          # nor a pg_advisory_lock wait ever reads the client socket, so the
          # release step's client-side kill left a backend holding the lock for
          # its full 6000s sleep and starved e2e-seeded past the 3600s cap.
          # Before 158-MUTEX-01 the server statement_timeout was the ACCIDENTAL
          # janitor for such orphans; client_connection_check_interval is the
          # real one — the backend polls its client socket during query
          # execution AND lock waits, aborting within ~30s of the client dying.
          # Covers both the sleeping holder and a lock-waiting contender whose
          # client died (a job-timeout kill mid-wait leaves the same zombie).
          # HOLDER-BACKEND-PID feeds the release step's guarded server-side
          # pg_terminate_backend, which frees the lock immediately rather than
          # after the ~30s check interval. Both GUCs and the marker MUST stay
          # before pg_advisory_lock, so the lock wait itself is covered.
          start_holder() {
            : > "${log}"
            PGAPPNAME=ci-shared-test-db-mutex PGCONNECT_TIMEOUT=15 \
              nohup psql "${dsn}" -X -q -A -t -v ON_ERROR_STOP=1 \
                -c "SET statement_timeout = 0;" \
                -c "SET client_connection_check_interval = '30s';" \
                -c "SELECT 'HOLDER-BACKEND-PID ' || pg_backend_pid();" \
                -c "SELECT pg_advisory_lock(61616158);" \
                -c "SELECT 'MUTEX-ACQUIRED';" \
                -c "SELECT pg_sleep(6000);" \
                >> "${log}" 2>&1 &
            holder=$!
            echo "${holder}" > "${pidfile}"
          }
          # 158-REVIEW CR-04: the cap absorbs legitimate cross-run QUEUE DEPTH,
          # not just a wedge. Three simultaneous runs put ~8 other holds ahead of
          # the last waiter (~60m at the measured ~20m of lock-time per run), and
          # the phase's success criterion is that all three still pass. 2700s was
          # comparable to the work it had to absorb, so ordinary contention —
          # which this repo's history records as NORMAL — surfaced as a red
          # sql-tests → red `frontend` → skipped Railway deploy.
          #
          # 158-REVIEW WR-13: retry a DEAD SESSION, never a full wait. Every
          # other network op in this file retries by explicit flakiness-audit
          # decision (`npm ci`, `pip install`, the lychee download, the SRH
          # readiness poll); this one did not, so a single transient connect
          # blip inside PGCONNECT_TIMEOUT killed the backgrounded psql and
          # exited 1 — now a red REQUIRED check, and on main a skipped Railway
          # deploy. The two failure modes are deliberately kept distinct:
          # "session died" is retryable (below), "waited past the cap" is NOT
          # (that is contention, and retrying would just re-queue at the back).
          # `waited` is CUMULATIVE across attempts, so retries can never extend
          # the total wait beyond the cap the TTL was sized against.
          waited=0
          for attempt in 1 2 3; do
            start_holder
            while [ "${waited}" -lt 3600 ]; do
              if grep -q 'MUTEX-ACQUIRED' "${log}" 2>/dev/null; then
                # [158-MUTEX-02] best effort: an absent/empty pid file only
                # forfeits the release step's immediate server-side reap — the
                # ccci GUC above still bounds an orphaned backend at ~30s.
                sed -n 's/^HOLDER-BACKEND-PID \([0-9]\{1,\}\)$/\1/p' "${log}" | head -n 1 \
                  > "${RUNNER_TEMP}/shared-test-db-mutex-backend-pid" || true
                echo "Acquired the shared-test-db advisory lock (key 61616158) after ${waited}s (attempt ${attempt}/3)."
                exit 0
              fi
              if ! kill -0 "${holder}" 2>/dev/null; then
                echo "::warning::mutex acquire attempt ${attempt}/3 lost its psql session after ${waited}s (redacted output follows)."
                # 158-REVIEW WR-08: psql NEVER echoes the DSN on failure, so the
                # userinfo pattern alone matched nothing and the raw text — the
                # TEST pooler host, its resolved IP, and the DB username /
                # project-ref — went straight into a PUBLIC Actions log, against
                # this mutex's own stated invariant ("never a DSN, host,
                # username, or password, in any CI log line"). Redact the shapes
                # psql actually emits:
                #   connection to server at "<host>" (<ip>), port <n> failed
                #   FATAL:  password authentication failed for user "<user>"
                sed -E -e 's#(postgres(ql)?://)[^@]*@#\1***@#g' \
                       -e 's#(server at )"[^"]*"( \([^)]*\))?#\1"***"#g' \
                       -e 's#(for user )"[^"]*"#\1"***"#g' "${log}" >&2 || true
                break
              fi
              sleep 5
              waited=$(( waited + 5 ))
              if [ $(( waited % 60 )) -eq 0 ]; then
                echo "still waiting on the shared-test-db mutex (${waited}s) — another run holds it."
              fi
            done
            # Cap exhausted => contention, not a transient. Stop retrying and
            # fall through to the census + timeout diagnostic below.
            if [ "${waited}" -ge 3600 ]; then
              break
            fi
            # The session is dead; drop its pid so the release step cannot kill
            # an unrelated process that inherits the number.
            rm -f "${pidfile}"
            # 158-REVIEW WR-02 (iter 3): back off ONLY when a retry actually
            # follows. Unguarded, the last iteration printed "retrying the mutex
            # acquire in 15s" and then slept 15s before falling out of the loop
            # to the "after 3 attempts" error — telling the operator a fourth
            # attempt was coming when none was, which this repo's
            # fail-loud-and-ACCURATE doctrine counts as a real cost. Worse, that
            # phantom 15s was added to `waited`, and `waited` is the variable the
            # cap-vs-session-fault branch below is chosen by: a run that
            # legitimately queued to 3585s and then lost its session could be
            # pushed over 3600 by backoff bookkeeping alone and misreported as
            # contention rather than as the session fault it actually was.
            if [ "${attempt}" -lt 3 ]; then
              backoff=$(( attempt * 5 ))
              echo "retrying the mutex acquire in ${backoff}s"
              sleep "${backoff}"
              waited=$(( waited + backoff ))
            fi
          done
          if [ "${waited}" -lt 3600 ]; then
            echo "::error::could not establish the shared-test-db mutex session after 3 attempts — psql died before acquiring each time (last output redacted above). Two causes fit: (1) a CONNECT/session fault — check the TEST project's session-mode pooler (port 5432); or (2) something killed the session MID-WAIT while it contended for the lock — before 158-MUTEX-01 the server-wide statement_timeout did exactly that at 120s per attempt (the holder now zeroes statement_timeout as its first statement, so that specific kill should no longer occur). If the redacted output shows 'canceling statement due to statement timeout', that is NOT lock contention: the holder zeroes statement_timeout as its very first statement, so post-158-MUTEX-01 that signature can only mean the SET never stuck to this session's backend — the session-mode DSN rewrite regressed, the secret's shape changed, or a pooler is intercepting SET. Triage it as a pooler/session fault."
            exit 1
          fi
          # 158-REVIEW CR-04: do NOT assert "a holder is wedged" — measure, then
          # name both causes. From inside this loop a deep waiter queue and a
          # wedged holder are indistinguishable, and the old message confidently
          # named the rarer one, sending the operator hunting for a wedge that
          # may not exist. Counts ONLY: no pids, no host, no DSN, and stderr is
          # discarded outright — this log is public.
          #
          # 158-REVIEW WR-01 (iter 3): the census MUST be bounded. PGCONNECT_TIMEOUT
          # bounds only the CONNECT; once connected, an unbounded query against a sick
          # TEST Postgres/pooler blocks until this job's `timeout-minutes` kills the
          # runner — so the operator gets LESS information than before the census
          # existed (a bare "exceeded the maximum execution time"), and the job squats
          # a runner for ~30 more minutes while holding no lock. A sick backend is
          # precisely the condition under which this timeout fires, and this repo's
          # history records a wedged TEST backend as a MEASURED event, not a
          # hypothetical. Both bounds are needed because they cover different faults:
          # `statement_timeout` is server-side (a slow or lock-blocked query) and
          # `timeout` is client-side (a black-holed connection the server never hears
          # about, where a server-side timeout can never fire). A diagnostic must
          # never outlive the thing it diagnoses. `${census:-unavailable}` below
          # already handles the empty result, so the message stays honest either way.
          census="$(PGCONNECT_TIMEOUT=15 timeout 20 psql "${dsn}" -X -q -A -t \
            -c "SET statement_timeout = '10s';" \
            -c "SELECT count(*) FILTER (WHERE granted) || ' granted, ' || count(*) FILTER (WHERE NOT granted) || ' waiting' FROM pg_locks WHERE locktype = 'advisory' AND objid = 61616158;" \
            2>/dev/null | tr -d '\r' | tail -1)" || true
          echo "::error::timed out after ${waited}s waiting for the shared-test-db advisory lock (key 61616158). Lock census: ${census:-unavailable}. TWO causes are possible and this step cannot distinguish them: (1) QUEUE DEPTH — concurrent runs each hold the lock ~20m, which is a NORMAL condition in this repo; re-run once the queue drains. (2) A WEDGED holder whose runner is gone. Triage (count the waiters first) and manual unlock: docs/runbooks/shared-test-db-mutex.md sections 2-3."
          exit 1
      - name: Seed demo data into test Supabase
        # Populates the 8-strategy demo set the seed-gated specs require.
        # Defense-in-depth against running this against prod by accident:
        # the SEED_CONFIRM_STAGING interlock + the script's prod-URL probe
        # both fail loudly if a secret is misrouted.
        run: SEED_CONFIRM_STAGING=true npx tsx scripts/seed-demo-data.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      # retro-PR179-M-cache: restore .next/cache (Next.js incremental
      # webpack/Turbopack store) for the seed-gated rebuild. The
      # downloaded nextjs-build artifact excludes .next/cache/** (see
      # frontend-build upload step), and the e2e job previously had no
      # actions/cache restore — so the rebuild's "incremental on top
      # of the placeholder run" promise (in the comment below) was
      # factually false. The rebuild was running cold (~47-50s observed
      # across 4 post-merge runs vs the 30-60s stated range, at the
      # upper bound).
      #
      # Restore from the SAME cache key as frontend-build:Cache .next/cache
      # (read-only restore from the e2e side; frontend-build is the
      # writer). Cache buckets keyed on hashFiles(...) are content-
      # addressed, so the prefix-only restore-keys fallback handles the
      # case where frontend-build's cache step hashed src/** to a
      # different bucket than this e2e job sees.
      - name: Restore .next/cache for the test-env build (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}-
      - name: Build Next.js with real test-Supabase env (C-0293(c))
        # The seed-gated specs (onboarding-funnel, discovery, strategy-v2,
        # composer-axe, …) need the real URL/anon key INLINED into the
        # browser bundle (Next.js evaluates NEXT_PUBLIC_* at build time,
        # not runtime). This job builds from a clean workspace — no
        # placeholder artifact to wipe/merge against (that dance lived in
        # the old single e2e job) — and the built `.next/` stays on the
        # runner FS: it is NEVER uploaded as an artifact, so the test-DB
        # credentials never leave the ephemeral runner. On a warm
        # .next/cache (frontend-build writes the same key) the build is
        # genuinely incremental.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: test@example.com
          PLATFORM_NAME: Quantalyze
          PLATFORM_EMAIL: test@quantalyze.com
          # Phase 164 / D-02 — same reason as the frontend-build step above:
          # the share-token module throws at MODULE SCOPE without this. A fake
          # >= 32-char placeholder; the e2e specs that exercise share links mint
          # their tokens under this same value.
          SHARE_TOKEN_SECRET: placeholder_share_token_secret_not_a_real_secret
      # retro-PR188-D4 (pr-test-analyzer #36, HIGH/8): assert the rebuild
      # actually produced a bundle inlined with the REAL test-Supabase
      # URL. If the build ever short-circuits silently (e.g. a restored
      # .next/cache satisfying a stale manifest, or an env plumbing drift),
      # the seed-gated specs would self-skip via HAS_SEED_ENV checks and CI
      # would still report green — but the seed-gated spec coverage would
      # be a no-op. The grep is read-only,
      # touches only the local FS (the rebuilt `.next/` is never
      # uploaded), and uses the secret only via the variable expansion
      # GitHub Actions already redacts in logs. The exit code IS the
      # signal: zero hits = build did not inline = fail.
      - name: Verify build inlined real test-Supabase URL
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "::error::TEST_SUPABASE_URL empty — seed-gated step ran without secret"
            exit 1
          fi
          # Strip the scheme so a partial match (host only) still works.
          host="${TEST_SUPABASE_URL#https://}"
          host="${host#http://}"
          if ! grep -r -l --include='*.js' --include='*.json' "$host" .next/static .next/server > /dev/null 2>&1; then
            echo "::error::Rebuild did not inline TEST_SUPABASE_URL into .next/static or .next/server — seed-gated specs would run against placeholder bundle"
            exit 1
          fi
          echo "Rebuild inlined real test-Supabase URL into .next/ — proceeding to seed-gated specs."
      - name: Guard -- sfox-badge anti-mask assertions present (FACTSHEET-02)
        # Phase 126 / FACTSHEET-02 anti-tamper: e2e-seeded is now BLOCKING
        # (frontend aggregator), so a green sfox-badge run is load-bearing.
        # DELETING the non-owner badge-visibility legs (admin + anon) or the
        # owner-leg axe zero-violations assertion would GUT the FACTSHEET-01
        # anti-mask net while still passing the spec -- false-greening the
        # gate. This grep fails the job if any of those load-bearing
        # assertions are gone, so the gate cannot be satisfied by weakening
        # the spec. Read-only; anchors are literal (`-F`), no untrusted input.
        run: |
          spec=e2e/sfox-badge.spec.ts
          fail=0
          need_anchor() {
            if ! grep -qF "$1" "$spec"; then
              echo "::error::sfox-badge anti-mask guard: missing assertion anchor -- $2"
              fail=1
            fi
          }
          need_anchor 'anon: a logged-out visitor sees the api_verified badge' 'anon non-owner badge-visible leg'
          need_anchor "admin: an elevated session reads the sfox strategy" 'admin non-owner badge-visible leg'
          need_anchor 'results.violations).toEqual([])' 'owner-leg axe zero-violations assertion'
          # RT-01: pin the apiVerifiedBadge() helper SELECTOR too. The badge
          # assertions above call the helper; redefining it to a vacuous locator
          # (e.g. page.locator("body")) would keep every assertion textually
          # present while making them pass trivially. Anchoring the real badge
          # selector defeats that.
          need_anchor 'data-trust-tier="api_verified"' 'apiVerifiedBadge helper selector (prevents redefining the helper to a vacuous locator)'
          # Title anchors alone are gameable: the test TITLES could survive while
          # the actual badge-visibility ASSERTIONS are gutted or downgraded (e.g.
          # swapping toBeVisible for a weaker matcher, or emptying a leg body) --
          # the grep would still pass and green-wash a weakened spec. So also
          # anchor on the badge-visibility ASSERTION EXPRESSION itself and require
          # its minimum count. Deleting or weakening ANY of the four badge-visible
          # legs (owner-factsheet + allocator + admin-non-owner + anon-non-owner)
          # drops the count below the floor and fails the gate.
          badge_assert='expect(apiVerifiedBadge(page).first()).toBeVisible'
          min_badge=4
          badge_count=$(grep -cF "$badge_assert" "$spec" || true)
          if [ "$badge_count" -lt "$min_badge" ]; then
            echo "::error::sfox-badge anti-mask guard: badge-visibility assertions dropped to ${badge_count} (need >= ${min_badge}) -- a non-owner api_verified badge assertion was deleted or weakened."
            fail=1
          fi
          # RT-01 skip-token guard: the anchors above pin assertion TEXT, but a
          # `test.skip(true …)` / `test.skip()` / `.fixme` / `test.only` /
          # `describe.only|skip` would leave that text present while Playwright
          # SKIPS the leg -> a green run that never asserted the badge. The ONLY
          # legitimate skip here is the conditional `test.skip(!HAS_SEED_ENV, …)`
          # (guards the seeded suite when the test DB isn't wired). Any
          # unconditional skip/fixme/only is a tamper.
          if grep -Eq 'test\.skip\(\s*true|test\.skip\(\s*\)|\.fixme\(|test\.only\(|describe\.only\(|describe\.skip\(' "$spec"; then
            echo "::error::sfox-badge anti-mask guard: an unconditional skip/fixme/only (test.skip(true|), .fixme, test.only, describe.only/skip) is present in ${spec} -- a badge leg may not execute. Only test.skip(!HAS_SEED_ENV, …) is permitted."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::e2e/sfox-badge.spec.ts anti-mask assertions were weakened -- refusing to green the FACTSHEET-02 gate."
            exit 1
          fi
          echo "sfox-badge anti-mask assertions present (anon + admin badge-visible titles + ${badge_count} badge-visibility assertions + axe zero-violations)."
      - name: Run seed-gated specs (MA-8 / BLOCK-3)
        run: |
          # Phase 11 review fix WR-04: defense-in-depth port-bind guard.
          # The previous unconditional smoke step kills+waits its own server,
          # but if a stale process from earlier in the runner had not yet
          # released port 3000, `npm run start &` would silently fail to
          # bind and the readiness loop below would time out. Surface that
          # explicitly so the step fails fast rather than appearing green
          # while the spec spins on a stale build.
          if ss -ltn 2>/dev/null | grep -q ':3000\b' \
            || lsof -nP -iTCP:3000 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN; then
            echo "Port 3000 still bound after the previous step — failing fast." >&2
            exit 1
          fi
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          # MA-8: every seed-gated spec runs together so wiring the
          # E2E_TEST_DB_CONFIGURED variable surfaces all of them at once.
          # Each spec self-skips when HAS_SEED_ENV is false; with the
          # variable set the gate above resolves to true → seeded run.
          # Adding/removing a seed-gated spec? Update both this list and
          # the e2e/<spec>.spec.ts HAS_SEED_ENV constant.
          # Phase 158 / OPS-03: the last three entries below are newly wired.
          # csv-upload-flow and my-strategies are seed-gated and satisfy the MA-8
          # both-halves rule (list entry here + HAS_SEED_ENV in the spec, both
          # landed by plan 158-05; csv-upload-flow was CONVERTED to the seeded
          # contract because its old hardcoded demo login does not authenticate
          # against the TEST project). full-flow is the deliberate exception to
          # the HAS_SEED_ENV half: it reads NO seed env and mints nothing, so it
          # is not seed-GATED — it is here for the seeded ENVIRONMENT, because
          # its anon cases were MEASURED red under the unseeded job's placeholder
          # Supabase (the landing -> /browse navigation never commits within
          # Playwright's 5s URL budget while SSR hangs on placeholder fetches).
          # Do NOT "fix" that asymmetry by bolting a HAS_SEED_ENV gate onto it;
          # that would self-skip the very cases it is wired here to run.
          # Known gap, deliberately not papered over: csv-upload-flow's two
          # server-side validation cases stay SKIPPED here — /api/strategies/
          # csv-validate forwards to the Python analytics service and NO job in
          # this workflow provides ANALYTICS_SERVICE_URL. Provision that (plus
          # INTERNAL_API_TOKEN) to un-skip them; un-gating them without it would
          # red this batch deterministically.
          if [ "${BAKE_SVG_GOLDENS}" = "true" ]; then
            # One-shot golden bake (workflow_dispatch input bake_svg_goldens).
            # Run ONLY the svg-parity spec with --update-snapshots so no other
            # spec's baselines are touched; the PNGs upload as an artifact for
            # per-chart human review. NEVER auto-committed here (the locked
            # "no blind --update-snapshots" rule) — a follow-up PR lands the
            # reviewed PNGs and the spec's WR-02 guard flips the gate live.
            npx playwright test e2e/svg-chart-parity.spec.ts \
              --update-snapshots \
              --timeout 60000
          else
            npx playwright test \
              e2e/onboarding-funnel.spec.ts \
              e2e/discovery-axe.spec.ts \
              e2e/discovery-hide-examples-default.spec.ts \
              e2e/discovery-prefs-isolation.spec.ts \
              e2e/strategy-v2-partial-data.spec.ts \
              e2e/strategy-v2-chart-parity.spec.ts \
              e2e/strategy-v2-keyboard.spec.ts \
              e2e/strategy-v2-axe.spec.ts \
              e2e/composer-axe.spec.ts \
              e2e/wizard-axe.spec.ts \
              e2e/wizard-resume.spec.ts \
              e2e/composite-onboarding.spec.ts \
              e2e/composite-factsheet-render.spec.ts \
              e2e/sfox-badge.spec.ts \
              e2e/mt5-badge.spec.ts \
              e2e/admin-compute-jobs-axe.spec.ts \
              e2e/mobile-drawer-keyboard.spec.ts \
              e2e/reflow-sweep-authed.spec.ts \
              e2e/svg-chart-parity.spec.ts \
              e2e/target-size.spec.ts \
              e2e/no-clip-sweep.spec.ts \
              e2e/axe-app-wide.spec.ts \
              e2e/full-flow.spec.ts \
              e2e/csv-upload-flow.spec.ts \
              e2e/my-strategies.spec.ts \
              --timeout 60000
          fi
          # Phase 47-05 / FLOW-01 (place 1 of 2): the fresh
          # e2e/svg-chart-parity.spec.ts (desktop goldens + 320px portrait)
          # is added here so it runs SEEDED. The dead
          # e2e/strategy-v2-chart-parity.spec.ts above is intentionally LEFT
          # in place (it self-skips via test.skip(true); Phase-48 concern) —
          # do NOT remove it. e2e/target-size.spec.ts is ALSO listed here (in
          # addition to its unseeded entry at the line ~1059 list) so its new
          # SEEDED chart-tap-rect cases (which self-skip in the unseeded run)
          # actually execute; its unseeded /security case keeps running in the
          # unseeded list. Both new gates are HAS_SEED_ENV-guarded (place 2).
          # Phase 54-08 / VERIFY-02 / FLOW-01 (place 1 of 2): e2e/axe-app-wide.spec.ts
          # is NOW in this seeded MA-8 list (above) so its authed + embedded +
          # mobile + 2560 ultra-wide describes run hermetically against the seeded
          # DB. It ALSO stays in the unseeded list (~line 1059) for its public
          # route × viewport rows; the spec's HAS_SEED_ENV const + the two
          # test.skip(!HAS_SEED_ENV, …) gates (place 2) self-skip the authed/
          # embedded describes when the seed env is absent, so unseeded/local
          # runs stay green-by-skip.
          # WHY this is safe now (it was PUBLIC-only in v1.3 / Phase 48-04): the
          # MA-8 invocation shares ONE test database across all specs, and the
          # v1.3 attempt to run axe-app-wide here regressed three behaviours —
          # (a) seedBridgeCandidate({crypto-sma}) published a non-example strategy
          # into the crypto-sma category that discovery-hide-examples-default.spec.ts
          # asserts is EMPTY on first paint; (b) its public rows re-ran against the
          # rebuilt test-Supabase and 500'd /demo; (c) the polluted DB produced
          # spurious wizard axe findings the focused wizard-axe.spec.ts does NOT
          # see. VERIFY-02 closes all three: the ONE cross-spec-dangerous seed —
          # the crypto-sma discovery row — is now torn down by id in a `finally`
          # (delete-by-id + bridge-owner cascade via the prod-safe cleanup helper),
          # so discovery-hide-examples-default sees the category empty again and
          # the /demo + wizard regressions (downstream of that pollution) no longer
          # occur. The per-unique-user allocator/strategy/wizard seeds are inert to
          # other specs (timestamped emails). The focused MA-8 axe specs
          # (discovery-axe / strategy-v2-axe / composer-axe / wizard-axe) still run
          # alongside as the per-route floor.
          # Same kill+wait+nuke pattern as the unconditional step above so any
          # follow-up runner work (artifact upload) doesn't race on resources.
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          lsof -ti:3000 2>/dev/null | xargs -r kill -9 2>/dev/null || true
        env:
          # workflow_dispatch one-shot golden-bake toggle (drives the if/else
          # in the run block above). Renders "true" only on a manual dispatch
          # with bake_svg_goldens checked; "false" on every push/PR run.
          BAKE_SVG_GOLDENS: ${{ github.event_name == 'workflow_dispatch' && inputs.bake_svg_goldens }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: test@example.com
          PLATFORM_NAME: Quantalyze
          PLATFORM_EMAIL: test@quantalyze.com
          # Seed-gated server runs in production mode (`npm run start`), so the
          # localhost:3000 auto-allowlist in src/lib/csrf.ts:67 (NODE_ENV !==
          # "production" branch) never fires. The discovery-prefs-isolation
          # spec PUTs /api/preferences via page.request.put with an explicit
          # Origin header; without an entry here, the CSRF guard 403s with
          # "Origin not allowed". Adding the localhost origin to the runtime
          # allowlist scopes the exception to this seed-gated step only.
          # No production exposure: prod sets NEXT_PUBLIC_SITE_URL to the
          # canonical Vercel host.
          NEXT_PUBLIC_ALLOWED_ORIGINS: http://localhost:3000
      # Golden bake (workflow_dispatch input bake_svg_goldens): upload ONLY the
      # svg-chart-parity snapshot PNGs — chart images, no .next bundle /
      # trace.zip / page HTML — so the C-0293(c) secret-in-artifact concern
      # that gates the playwright-report upload below does NOT apply here. These
      # PNGs are the per-chart review material; a human eyeballs each, then a
      # follow-up PR commits them (the locked "never blind --update-snapshots"
      # rule). if-no-files-found: error fails loud if the bake produced nothing.
      - name: Upload baked SVG goldens for review (workflow_dispatch bake only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.bake_svg_goldens }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: svg-chart-goldens-baked
          path: e2e/svg-chart-parity.spec.ts-snapshots/**/*.png
          if-no-files-found: error
          retention-days: 7
      # Best-effort EARLY release of the shared-test-db mutex (Phase 158 /
      # OPS-01), identical in all three DB-touching jobs. See the note on
      # `sql-tests`: teardown releases the lock anyway, this just hands it over
      # sooner and never reddens the job.
      - name: Release shared-test-db mutex (best effort)
        if: always()
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          pidfile="${RUNNER_TEMP}/shared-test-db-mutex.pid"
          if [ ! -f "${pidfile}" ]; then
            echo "No mutex pid recorded (fork PR / acquire skipped) — nothing to release."
            exit 0
          fi
          holder="$(cat "${pidfile}")"
          if kill "${holder}" 2>/dev/null; then
            echo "Released the shared-test-db mutex (terminated psql pid ${holder})."
          else
            # 158-REVIEW WR-01: reaching here is a FAULT, not housekeeping. A
            # pidfile exists, so the acquire step really did start a holder — and
            # that holder is now dead while this job was still running. Every DB
            # step between its death and now ran with the mutex RELEASED, i.e.
            # potentially concurrently with another run against the shared TEST
            # project. The previous message ("was already gone — the session drop
            # released the lock") described this as normal and printed on exactly
            # the failure path it was supposed to surface.
            # [158-MUTEX-01]: the once-common cause (the server-wide
            # statement_timeout killing pg_sleep at ~120s) is fixed — the holder
            # zeroes statement_timeout — so a dead holder here is now UNEXPECTED
            # and always worth investigating.
            # Annotation only: this step is `if: always()` and must never redden a
            # job whose real work passed, and `echo ::error::` does not change the
            # exit status. Job teardown remains the guaranteed release path.
            echo "::error::mutex holder pid ${holder} died BEFORE this release step — the DB work after its death ran UNSERIALIZED. Do not trust this run's DB assertions; investigate (holder outlives the job by design, see the pg_sleep note in the acquire step)."
          fi
          # [158-MUTEX-02] (run 32457330139): the kill above reaches only the
          # psql CLIENT. A backend mid-pg_sleep never reads its client socket,
          # so it kept the lock and starved the other jobs' acquires for its
          # full 6000s sleep. Terminate the recorded backend server-side too;
          # the pg_locks guard (same key, same pid) makes it a no-op if that
          # backend already exited or the pid was recycled — never a blind
          # terminate. Best effort like the rest of this step: ccci bounds any
          # survivor at ~30s, and nothing here may redden the job.
          backendpidfile="${RUNNER_TEMP}/shared-test-db-mutex-backend-pid"
          backend="$(cat "${backendpidfile}" 2>/dev/null || true)"
          case "${backend}" in
            ''|*[!0-9]*)
              echo "No server backend pid recorded — leaving any orphan to client_connection_check_interval."
              ;;
            *)
              if [ -z "${TEST_SUPABASE_DB_URL:-}" ]; then
                echo "TEST_SUPABASE_DB_URL withheld — skipping the server-side backend reap."
              else
                # Session-mode DSN, derived exactly as in the acquire step and
                # never echoed; bounded like the acquire step's census query.
                dsn="${TEST_SUPABASE_DB_URL}"
                case "${dsn}" in
                  *":6543/"*) dsn="${dsn%%:6543/*}:5432/${dsn#*:6543/}" ;;
                esac
                reaped="$(PGCONNECT_TIMEOUT=15 timeout 20 psql "${dsn}" -X -q -A -t \
                  -c "SET statement_timeout = '10s';" \
                  -c "SELECT pg_terminate_backend(${backend}) FROM pg_locks WHERE locktype = 'advisory' AND objid = 61616158 AND pid = ${backend};" \
                  2>/dev/null | tr -d '\r' | tail -1)" || true
                if [ "${reaped}" = "t" ]; then
                  echo "Server-side reap: backend ${backend} was STILL on key 61616158 — pg_terminate_backend sent (the client kill alone had not freed the lock)."
                else
                  echo "Server-side reap: backend ${backend} no longer on key 61616158 (already exited, or the census was unavailable) — nothing to terminate."
                fi
              fi
              ;;
          esac
      # retro-PR179-H1 / C-0293(c): NO playwright-report upload from this
      # job, ever. Every spec here runs against the REAL-env build, and
      # Playwright's trace.zip + on-failure screenshots embed
      # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY from the
      # bundle's .next/static/chunks/*.js — an uploaded artifact would sit
      # in actions storage for 7 days with actions:read scope, re-opening
      # the exfil pivot the C-0293(c) artifact-leak fix closed for
      # nextjs-build. (The old single e2e job expressed this as a
      # vars-allow-listed gate — retro-PR188-F6 — because it mixed
      # placeholder and real-env specs; this job is real-env only, so the
      # honest encoding is simply no upload step.) Recovery on failure:
      # re-run locally with PWDEBUG=1 + the test-DB env in the developer's
      # shell; the smoke job's placeholder-env report still uploads.

  lighthouse-mobile:
    # Phase 48-05 / A11Y-03: mobile Lighthouse performance budget over the
    # 5 PUBLIC routes (lighthouserc.json).
    #
    # ADVISORY since 2026-07-02 (CI speed, user decision): no longer in the
    # `frontend` aggregator's needs/result-check — it was the merge gate's
    # slowest dependency (~+2m) and its noisiest signal. A red check here is
    # still visible on every PR; treat a real perf regression seriously, it
    # just doesn't block the merge.
    #
    # Mirrors the e2e job's
    # build-artifact-restore + start-server shape: download the production
    # nextjs-build artifact (.next + public), `npm run start` against the
    # PRODUCTION build, then `npx lhci autorun` (Pitfall 6 — never next dev).
    #
    # SECURITY (T-48-05-INFO): this job receives NO TEST_SUPABASE_* secret.
    # lighthouserc.json collects PUBLIC routes ONLY (headless can't auth) and
    # uploads to temporary-public-storage, so nothing sensitive could leak to
    # that public target. Build/runtime env is PLACEHOLDER only, exactly like
    # the unconditional e2e spec set — public routes render on placeholders.
    # Authed-route perf is covered by the human real-device sign-off
    # (48-HUMAN-UAT.md / SC#5), not by lhci.
    runs-on: ubuntu-latest
    # Depend on the artifact producer (frontend-build) + typecheck so we don't
    # burn a runner when the build/types are already known-broken. Same `needs`
    # rationale as the e2e job above (don't gate on the slow unit-test shard).
    needs:
      - frontend-build
      - frontend-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      # Restore the shared node_modules cache (populated by deps-cache) — same
      # restore-only pattern as the other frontend-* jobs. @lhci/cli is a pinned
      # devDependency (0.15.1), so a cache hit already carries it.
      - name: Restore node_modules
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: npm ci (cache miss; retry transient network failures)
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until npm ci --prefer-offline --no-audit --no-fund; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci attempt $n failed (transient?); retrying in $((n*5))s"
            sleep $((n*5))
          done
      # lhci drives a real headless Chrome (chrome-launcher). Reuse the trusted
      # `playwright install chromium` path (already used by the e2e job) rather
      # than adding a third-party Chrome-setup action (supply-chain surface).
      # chrome-launcher honours $CHROME_PATH at top priority (verified:
      # node_modules/chrome-launcher/dist/chrome-finder.js:71-80), so we point
      # it at the installed Chromium binary explicitly.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/@playwright/test/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium (for lhci's headless Chrome)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit — chromium bundle restored. Runner image has system libs; skipping apt install."
          else
            npx playwright install --with-deps chromium
          fi
      # Download the SAME production .next + public artifact the e2e job uses.
      # It was built with PLACEHOLDER NEXT_PUBLIC_* (frontend-build) — public
      # routes render fine on placeholders, and lhci needs no real secret.
      - name: Download .next + public artifact from frontend-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextjs-build
      - name: Run Lighthouse mobile budget (lhci autorun against npm run start)
        run: |
          # Resolve the Playwright-installed Chromium so chrome-launcher uses it
          # (top-priority via $CHROME_PATH). The glob covers the linux headless
          # shell layout playwright install lays down.
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -name 'chrome' -path '*chrome-linux*' -type f 2>/dev/null | head -1)"
          if [ -z "$CHROME_BIN" ]; then
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -name 'headless_shell' -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Could not locate a Playwright-installed Chromium for lhci"; exit 1
          fi
          echo "Using CHROME_PATH=$CHROME_BIN"
          export CHROME_PATH="$CHROME_BIN"
          # lighthouserc.json owns startServerCommand (`npm run start`) + the
          # ready-pattern wait + the 5 public URLs + the mobile form-factor +
          # the error-level minScore. lhci starts/stops the server itself.
          npx lhci autorun --config=lighthouserc.json
        env:
          # PLACEHOLDER env ONLY — public routes render on placeholders and lhci
          # needs no real secret. Deliberately NO TEST_SUPABASE_* here
          # (T-48-05-INFO): the lhci report uploads to temporary-public-storage.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role
          ADMIN_EMAIL: test@example.com
          PLATFORM_NAME: Quantalyze
          PLATFORM_EMAIL: test@quantalyze.com
      # VERIFY-03 re-measure mechanism: upload UNCONDITIONALLY (if: always()),
      # not just on failure. The `.lighthouseci/` manifest.json + *.report.json
      # carry the per-URL 3-run-median `categories.performance.score`; the lhci
      # minScore ratchet is data-driven (= lowest measured median − 0.02), so the
      # measured floor must be READABLE from a GREEN run — not only when the
      # assertion fails. PUBLIC-only URLs + placeholder env keep this safe to
      # upload to temporary-public-storage (T-54-04-01 / T-48-05-INFO).
      - name: Upload Lighthouse reports (always — readable measured floor)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lighthouse-mobile-report
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore
