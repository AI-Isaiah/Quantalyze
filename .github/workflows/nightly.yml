name: Nightly probes

on:
  schedule:
    # Every day at 08:00 UTC (01:00 PT). Runs before West Coast business
    # hours so a broken staging shows up on the founder's first coffee.
    - cron: "0 8 * * *"
  workflow_dispatch:

# C-0293(a) fix: default to `contents: read`. Per-job uplifts below.
permissions:
  contents: read

jobs:
  npm-audit:
    # PR-C: npm audit moved here from the per-PR frontend job. Daily
    # at the nightly cadence is enough — Dependabot covers the
    # continuous surface, and putting it on every PR's critical path
    # added 15-30s with no per-PR behavior signal.
    runs-on: ubuntu-latest
    # Per-job uplift: failure path uses actions/github-script to file an
    # auto-issue when a critical advisory lands. Needs `issues: write`.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # retro-PR179-M-persist-chain: drop the default persisted
          # GITHUB_TOKEN cred from .git/config. The nightly probe
          # does no git push; the persisted cred is pure attack
          # surface for the playwright/lychee actions later in the
          # job.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production tree, high-severity gate)
        # Gate at HIGH on the PRODUCTION dependency tree (`--omit=dev`) — i.e.
        # what we actually ship and expose. Rationale (2026-07-25): the shipped
        # highs ARE fixed here — `next@16.2.11` clears the 9 App-Router
        # SSRF/proxy-bypass/cache-confusion advisories (a lockfile bump inside
        # the existing caret), and package.json `overrides` clear `sharp`
        # (prod libvips CVEs) + `fast-uri`/`postcss`. The residual full-tree
        # highs are ALL build-time dev tooling (eslint/glob/minimatch/@lhci) —
        # chiefly the `brace-expansion` OOM advisory (GHSA-mh99-v99m-4gvg) whose
        # ONLY fix is 5.0.8, which drops the CJS function export and breaks
        # `minimatch@3` (`TypeError: expand is not a function`) and thus eslint.
        # It is unfixable without replacing the lint toolchain, never ships, and
        # is not worth breaking the build for. `--omit=dev` keeps full HIGH teeth
        # on everything we deploy (a real prod RCE/SSRF still hard-fails here)
        # while not being chronically red on unfixable build-only tooling.
        # Dependabot tracks the dev surface and auto-PRs anything that gets a
        # non-breaking fix. See TODOS.md "npm advisories".
        run: npm audit --omit=dev --audit-level=high
      - name: Open or update GitHub issue on high/critical advisory
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}
        with:
          # C-0294 fix: dedup via stable label. Previously every failed
          # nightly opened a new issue; now we search open issues
          # carrying the label and comment on the existing one.
          script: |
            const { RUN_ID, REPO_NAME } = process.env;
            const today = new Date().toISOString().slice(0, 10);
            const dedupLabel = "nightly-canary-failure:npm-audit";
            const runUrl = `https://github.com/${REPO_NAME}/actions/runs/${RUN_ID}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: dedupLabel,
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Nightly npm audit failed again on ${today}. Workflow run: ${runUrl}`,
              });
              return;
            }
            const title = `Nightly npm audit found a high/critical PRODUCTION advisory (${today})`;
            const body = [
              "`npm audit --omit=dev --audit-level=high` failed in the nightly workflow — a high/critical advisory landed on a SHIPPED (production) dependency.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Run `npm audit --omit=dev` locally to see the production advisory list (dev-tooling advisories are intentionally out of scope for this gate — see the audit step comment).",
              "",
              "Auto-filed by .github/workflows/nightly.yml. This issue is deduplicated by the `" + dedupLabel + "` label; subsequent failures will comment here until this issue is closed.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["nightly-probe", "security", "p1", dedupLabel],
            });
