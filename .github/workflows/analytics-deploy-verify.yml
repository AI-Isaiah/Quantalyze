name: Analytics deploy verify (prod SHA vs main HEAD)

# tech-debt #9b — close the "Railway silently skipped the deploy" gap.
#
# Railway deploys the analytics service on a GREEN main CI check-suite and
# SKIPS silently when it is red/cancelled (skippedReason="CI check suite
# failed"), leaving the prod worker on stale code with no signal. Nothing in
# the repo detected this — so "merged and verified" could be a false belief.
#
# This probe compares the deployed commit (exposed in /health by #9a, the
# `git_sha` field from RAILWAY_GIT_COMMIT_SHA) against main HEAD. A fresh
# merge legitimately lags (CI ~5-8m + Railway build ~3m), so it retries over
# a convergence window and, on a PERSISTENT mismatch — which means the deploy
# was skipped (or the worker is stuck on old code) — files a dedup'd GitHub
# issue (mirrors nightly.yml / cassette-refresh.yml) AND emits a warning.
#
# CRITICAL: this job exits 0 even when prod is stale. It MUST NOT fail the
# check. A red check on a (HEAD) commit makes Railway's "wait for CI" treat the
# commit's check-suite as red and SKIP the very deploy this probe verifies — a
# self-defeating deadlock that left prod stale on 2026-06-21 when the 6h
# schedule fired while a deploy was still pending (the failed `verify` check on
# the merge SHA caused Railway to skip it, so prod never converged and the
# check stayed red). The dedup'd P1 issue is the loud signal; the green check
# keeps deploys flowing.
#
# The health URL is a PUBLIC Railway domain (no auth, no secret); defaulted
# here so the probe ALWAYS runs (never silently no-ops on an unset variable —
# the exact anti-pattern tech-debt #12 fixes). Override with the
# ANALYTICS_HEALTH_URL repo variable only if the domain changes.
#
# Schedule + manual only (NO push trigger): on `push`, github.sha is the pushed
# commit, but Railway deploys main HEAD on ANY push, so an interleaved
# non-analytics merge advances prod past the analytics commit this run checks →
# false alarm. On schedule/dispatch, github.sha IS current main HEAD, which is
# exactly what prod converges to. After an analytics merge, dispatch this
# manually for an immediate check; otherwise the 6h schedule bounds detection.

on:
  schedule:
    # Every 6h. A skipped deploy stays stale until the next merge, so a 6h
    # probe bounds "prod silently on stale code" to at most ~6h.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: analytics-deploy-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # 158-REVIEW WR-04 (iter 3): must EXCEED the convergence window below
    # (4800 s = 80 min) or the job would be killed mid-poll and never reach the
    # issue-filing step — the loud signal would be lost exactly when it matters.
    # It must also be EXPLICIT: this workflow shares the watcher's invariant
    # (every path exits 0 so a check on main HEAD is never red, or Railway skips
    # the deploy this probe verifies), and GitHub's 360-minute default left a
    # hung Issues API call able to redden main HEAD six hours later — the same
    # route WR-03 closed on main-ci-cancelled-watcher.yml.
    timeout-minutes: 90
    steps:
      # This job doesn't actually need the repo (it curls /health and compares
      # to github.sha), but the C-0293 critical-regressions invariant requires
      # every workflow to check out with persist-credentials:false — so we
      # conform rather than carve out a checkout-less exemption to that guard.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Compare prod /health git_sha to main HEAD
        id: probe
        env:
          HEALTH_URL: ${{ vars.ANALYTICS_HEALTH_URL || 'https://quantalyze-analytics-production.up.railway.app/health' }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Fail fast if MAIN_SHA is somehow empty: otherwise the prefix-match
          # `case "$deployed" in "$MAIN_SHA"*)` becomes `in *)` and matches ANY
          # deployed SHA → a false GREEN, the exact fail-silent hole this probe
          # exists to kill.
          if [ -z "$MAIN_SHA" ]; then
            # Degenerate (github.sha is always set on schedule/dispatch). Warn but
            # exit 0 — never red-check HEAD (it would block Railway, see header).
            echo "::warning::github.sha (MAIN_SHA) is empty — cannot verify the deploy this run."
            exit 0
          fi
          # Convergence window: tolerate a deploy-in-progress (CI + Railway
          # build) before declaring the deploy skipped.
          # 158-REVIEW WR-10: the serializer is the Postgres session advisory
          # lock (key 61616158), NOT the deleted `shared-test-db` concurrency
          # group. See docs/runbooks/shared-test-db-mutex.md.
          #
          # 158-REVIEW WR-04 (iter 3): ⛔ this number is DERIVED from the mutex
          # numbers in docs/runbooks/shared-test-db-mutex.md section 2 — re-derive it
          # whenever the acquire cap changes. The old 1800 s (~30 min) predated
          # CR-04, which re-sized the acquire cap 2700 -> 3600 s and the job TTL
          # 60 -> 90 min on the explicit grounds that concurrent runs each hold
          # the lock ~20 min and that this is a NORMAL condition in this repo.
          # Railway waits on the whole check-suite, so the worst-case LEGITIMATE
          # latency is the runbook's own TTL arithmetic — ~2 min setup + up to
          # the 3600 s (60 min) acquire cap + ~12 min of lock-held work ≈ 74 min
          # — plus Railway's ~3 min build ≈ 77 min. Against a 30-minute
          # tolerance, a 6-hourly cron firing shortly after a merge that queued
          # behind two other runs files a P1 `analytics-deploy-stale` issue for a
          # deploy that is simply still coming. 4800 s (80 min) covers that worst
          # case with headroom; detection latency is bounded by the 6 h schedule
          # regardless, so widening the window costs nothing but a false alarm.
          deadline=$(( $(date +%s) + 4800 ))
          deployed=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -s --max-time 15 "$HEALTH_URL" || true)"
            deployed="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read() or "{}").get("git_sha") or "")' 2>/dev/null || echo "")"
            # Match if either SHA is a prefix of the other (full vs short).
            match=0
            if [ -n "$deployed" ] && [ "$deployed" != "unknown" ]; then
              case "$MAIN_SHA" in "$deployed"*) match=1 ;; esac
              case "$deployed" in "$MAIN_SHA"*) match=1 ;; esac
            fi
            if [ "$match" = "1" ]; then
              echo "OK: prod analytics is on main HEAD ($deployed)"
              exit 0
            fi
            echo "prod git_sha='$deployed' vs main HEAD='$MAIN_SHA' — not converged; retrying in 60s"
            sleep 60
          done
          echo "deployed_sha=$deployed" >> "$GITHUB_OUTPUT"
          echo "stale=true" >> "$GITHUB_OUTPUT"
          # Do NOT exit non-zero (see the header): a failed check on this commit
          # makes Railway skip the deploy this probe verifies. Alert via the
          # dedup'd issue (next step) + this warning; keep the check green.
          echo "::warning::prod analytics git_sha ('$deployed') != main HEAD ('$MAIN_SHA') after the convergence window. Likely a skipped/stuck Railway deploy — see the auto-filed 'analytics-deploy-stale' issue. Recover: 'railway redeploy' / 'railway up' the analytics service."
          exit 0

      - name: Open or update GitHub issue on persistent staleness
        if: steps.probe.outputs.stale == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
          DEPLOYED_SHA: ${{ steps.probe.outputs.deployed_sha }}
        with:
          script: |
            const { RUN_ID, REPO_NAME, MAIN_SHA, DEPLOYED_SHA } = process.env;
            const today = new Date().toISOString().slice(0, 10);
            const dedupLabel = "analytics-deploy-stale";
            const runUrl = `https://github.com/${REPO_NAME}/actions/runs/${RUN_ID}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: dedupLabel,
              per_page: 1,
            });
            const detail = `prod /health git_sha = \`${DEPLOYED_SHA || "(absent)"}\`, main HEAD = \`${MAIN_SHA}\`.`;
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Still stale on ${today}. ${detail} Workflow run: ${runUrl}`,
              });
              return;
            }
            const body = [
              "The prod analytics service is running STALE code: its deployed commit does not match main HEAD after the convergence window.",
              "",
              detail,
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Most likely the Railway deploy was SKIPPED because the main CI check-suite for that SHA was not green. Triage the check-suite first — `docs/runbooks/shared-test-db-mutex.md` section 6 is the current guide.",
              "",
              "Known causes, current as of phase 158:",
              "- A **red** `python` / `sql-tests` / `e2e-seeded` job from the shared-test-db **advisory lock** (key 61616158): either the acquire step hit its wait cap (deep cross-run queue OR a wedged holder — the step prints a `pg_locks` census naming both), or the job blew its `timeout-minutes`. Runbook sections 2-3.",
              "- A **cancelled** main-branch run, which `main-ci-cancelled-watcher.yml` files as a separate `main-ci-cancelled` issue. Check for one.",
              "- ⚠️ The `shared-test-db` **concurrency group** was DELETED in phase 158 and no longer exists anywhere in the repo. If you were sent here looking for it, that text was stale — the eviction failure mode it caused (issue #616) is what the advisory lock replaced.",
              "",
              "Recover: rerun the main CI for the merge SHA until green, then `railway redeploy` (or `railway up`) the analytics service. Confirm by re-running this workflow.",
              "",
              "Auto-filed by .github/workflows/analytics-deploy-verify.yml (tech-debt #9). Deduplicated by the `" + dedupLabel + "` label; subsequent failures comment here until closed.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Analytics prod is running stale code (deploy skipped?) — ${today}`,
              body,
              labels: ["analytics-service", "p1", dedupLabel],
            });
